<script type="text/babel" data-presets="react">
/* ===================== 7.2 PRICING ENGINE + POS ===================== */
const UNITS=['Piece','Strip','Box'];
function unitPieces(med,unit){ return unit==='Box'? med.perStrip*med.stripsPerBox : unit==='Strip'? med.perStrip : 1 }
function unitPrice(med,unit,wholesale){ return round2((wholesale?med.wholesale:med.mrp)*unitPieces(med,unit)) }

/** Single source of truth for cart maths — offers, discounts, VAT, rounding, loyalty. */
function priceCart(db,cart,customer,opts={}){
  const st=db.settings;
  const wholesale = customer && customer.type==='wholesale';
  const branchId = opts.branchId;
  const activeOffers = db.offers.filter(o=>o.active&&o.branches.includes(branchId)&&TODAY>=o.from&&TODAY<=o.to);
  const lines = cart.map(l=>{
    const med=db.medicines.find(m=>m.id===l.medId);
    const pieces=unitPieces(med,l.unit)*l.qty;
    const price=unitPrice(med,l.unit,wholesale);
    const gross=round2(price*l.qty);
    let offerDisc=0; const applied=[];
    activeOffers.forEach(o=>{
      if(o.type==='company'&&o.target===med.company){offerDisc+=gross*o.value/100;applied.push(o.name)}
      if(o.type==='category'&&o.target===med.category){offerDisc+=gross*o.value/100;applied.push(o.name)}
      if(o.type==='item'&&o.target===med.brand){offerDisc+=gross*o.value/100;applied.push(o.name)}
      if(o.type==='bxgy'&&o.target===med.brand&&l.qty>=o.buyQty){
        const free=Math.floor(l.qty/o.buyQty)*o.getQty;
        offerDisc+=price*free; applied.push(`${o.name} (+${free} free)`);
      }
    });
    offerDisc=round2(Math.min(offerDisc,gross));
    const manual=round2((gross-offerDisc)*(l.discPct||0)/100);
    const net=round2(gross-offerDisc-manual);
    const vatAmt=round2(net*med.vat/100);
    const batch=db.batches.find(b=>b.id===l.batchId);
    return {...l,med,brand:med.brand,strength:med.strength,form:med.form,company:med.company,category:med.category,
      pieces,mrp:price,price,gross,offerDisc,manual,disc:round2(offerDisc+manual),net,
      vatPct:med.vat,vatAmt,amount:round2(net+vatAmt),
      cost:round2((batch?batch.purchasePrice:med.purchasePrice)*pieces),
      batchNo:batch?batch.batchNo:'—',expiry:batch?batch.expiry:null,
      offers:applied,rx:med.rx,controlled:med.controlled};
  });
  const sub=round2(sum(lines,l=>l.gross));
  const itemDisc=round2(sum(lines,l=>l.disc));
  const offerDisc=round2(sum(lines,l=>l.offerDisc));
  let billDiscPct=opts.billDiscPct||0;
  const autoBill=activeOffers.find(o=>o.type==='minbill'&&(sub-itemDisc)>=o.minBill);
  let billDisc=round2((sub-itemDisc)*billDiscPct/100);
  let autoBillLabel=null;
  if(autoBill && autoBill.value>billDiscPct){ billDisc=round2((sub-itemDisc)*autoBill.value/100); autoBillLabel=autoBill.name; billDiscPct=autoBill.value }
  else if(!billDiscPct && customer && customer.senior && st.loyalty.seniorDiscount){
    billDisc=round2((sub-itemDisc)*st.loyalty.seniorDiscount/100); autoBillLabel='Senior citizen discount'; billDiscPct=st.loyalty.seniorDiscount;
  } else if(!billDiscPct && customer && customer.member && st.loyalty.memberDiscount){
    billDisc=round2((sub-itemDisc)*st.loyalty.memberDiscount/100); autoBillLabel='Member discount'; billDiscPct=st.loyalty.memberDiscount;
  }
  const vat=round2(sum(lines,l=>l.vatAmt));
  const redeemPts=opts.redeemPts||0;
  const redeemValue=round2(redeemPts*st.loyalty.pointValue);
  const raw=round2(sub-itemDisc-billDisc+vat-redeemValue);
  const total=Math.round(raw);
  const rounding=round2(total-raw);
  const cost=round2(sum(lines,l=>l.cost));
  const pointsEarned = customer&&customer.type==='retail'&&st.loyalty.enabled? Math.floor(total/st.loyalty.pointsPer) : 0;
  return {lines,sub,itemDisc,offerDisc,billDisc,billDiscPct,autoBillLabel,vat,redeemPts,redeemValue,
    rounding,total,cost,profit:round2(total-vat-cost),pointsEarned,
    pieces:sum(lines,l=>l.pieces),count:lines.length};
}

/* ---- QR ---- */
function QR({text,size=62,dark='#000'}){
  const mat=useMemo(()=>{
    try{ const q=window.qrcode(0,'M'); q.addData(String(text)); q.make();
      const n=q.getModuleCount(); const rows=[];
      for(let r=0;r<n;r++){ const row=[]; for(let col=0;col<n;col++) row.push(q.isDark(r,col)?1:0); rows.push(row) }
      return rows;
    }catch(e){ return null }
  },[text]);
  if(!mat) return <div style={{width:size,height:size,border:'1px solid '+dark,display:'grid',placeItems:'center',
    fontSize:8,textAlign:'center'}}>QR</div>;
  const n=mat.length, cell=size/n;
  return <svg width={size} height={size} viewBox={`0 0 ${n} ${n}`} shapeRendering="crispEdges" role="img" aria-label="Invoice QR code">
    <rect width={n} height={n} fill="#fff"/>
    {mat.map((row,r)=>row.map((v,col)=>v?<rect key={r+'_'+col} x={col} y={r} width={1} height={1} fill={dark}/>:null))}
  </svg>;
}

/* ---- POS ---- */
function POS(){
  const {db,dispatch,user,branchId,setBranch,toast,go,nav}=useApp();
  const myBranch = user.branchId==='ALL' ? (branchId==='ALL'?'BR1':branchId) : user.branchId;
  const branch = db.branches.find(b=>b.id===myBranch);
  const limit = discountLimit(db.settings,user.role);

  const [cart,setCart]=useState([]);
  const [q,setQ]=useState('');
  const [act,setAct]=useState(0);
  const [openRes,setOpenRes]=useState(false);
  const [customer,setCustomer]=useState(null);
  const [doctor,setDoctor]=useState(null);
  const [rxPhoto,setRxPhoto]=useState(false);
  const [billDiscPct,setBillDiscPct]=useState(0);
  const [redeemPts,setRedeemPts]=useState(0);
  const [payOpen,setPayOpen]=useState(false);
  const [custOpen,setCustOpen]=useState(false);
  const [batchFor,setBatchFor]=useState(null);
  const [subFor,setSubFor]=useState(null);
  const [holdOpen,setHoldOpen]=useState(false);
  const [done,setDone]=useState(null);
  const [rxPrompt,setRxPrompt]=useState(null);
  const searchRef=useRef(null);

  const results=useMemo(()=>{
    const qq=q.trim().toLowerCase();
    if(!qq) return [];
    return db.medicines.filter(m=>m.active&&(m.brand.toLowerCase().includes(qq)||m.generic.toLowerCase().includes(qq)
      ||m.barcode.includes(qq)||m.company.toLowerCase().includes(qq)))
      .map(m=>({med:m,stock:SEL.stockOf(db,m.id,[myBranch]),batches:SEL.fefo(db,m.id,myBranch)}))
      .sort((a,b)=>{
        const ae=a.med.brand.toLowerCase().startsWith(qq)?0:1, be=b.med.brand.toLowerCase().startsWith(qq)?0:1;
        if(ae!==be) return ae-be;
        if((a.stock>0)!==(b.stock>0)) return a.stock>0?-1:1;
        return (FAST[b.med.brand]||0)-(FAST[a.med.brand]||0);
      }).slice(0,30);
  },[q,db,myBranch]);

  const P = useMemo(()=>priceCart(db,cart,customer,{branchId:myBranch,billDiscPct,redeemPts}),
    [db,cart,customer,myBranch,billDiscPct,redeemPts]);

  const addMed=(med,qty=1)=>{
    const bts=SEL.fefo(db,med.id,myBranch);
    if(!bts.length){ setSubFor(med); setOpenRes(false); return }
    if(med.rx && !doctor){ setRxPrompt(med) }
    const unit = med.perStrip>1?'Strip':'Piece';
    const key=med.id+'_'+bts[0].id+'_'+unit;
    setCart(c=>{
      const i=c.findIndex(x=>x.key===key);
      if(i>=0) return c.map((x,j)=>j===i?{...x,qty:x.qty+qty}:x);
      return [...c,{key,medId:med.id,batchId:bts[0].id,unit,qty,discPct:0}];
    });
    setQ(''); setOpenRes(false); setAct(0);
    if(searchRef.current) searchRef.current.focus();
  };
  const setQty=(key,v)=>setCart(c=>c.map(x=>x.key===key?{...x,qty:Math.max(1,Math.min(9999,v))}:x));
  const bump=(key,d)=>setCart(c=>c.map(x=>x.key===key?{...x,qty:Math.max(1,x.qty+d)}:x));
  const del=key=>setCart(c=>c.filter(x=>x.key!==key));
  const setUnit=(key,unit)=>setCart(c=>c.map(x=>x.key===key?{...x,unit,key:x.medId+'_'+x.batchId+'_'+unit}:x));
  const setDisc=(key,v)=>{
    const capped=clamp(Number(v)||0,0,limit);
    if((Number(v)||0)>limit) toast({tone:'warn',title:`Discount capped at ${limit}%`,
      body:`Your role (${user.role}) can give at most ${limit}% per line. Ask a Branch Manager to approve more.`});
    setCart(c=>c.map(x=>x.key===key?{...x,discPct:capped}:x));
  };
  const setBatch=(key,batchId)=>setCart(c=>c.map(x=>x.key===key?{...x,batchId,key:x.medId+'_'+batchId+'_'+x.unit}:x));
  const clearAll=()=>{ setCart([]);setCustomer(null);setDoctor(null);setBillDiscPct(0);setRedeemPts(0);setRxPhoto(false) };

  /* keyboard */
  useEffect(()=>{
    const h=e=>{
      if(e.key==='F2'){e.preventDefault();searchRef.current&&searchRef.current.focus();setOpenRes(true)}
      else if(e.key==='F4'){e.preventDefault();setCustOpen(true)}
      else if(e.key==='F8'){e.preventDefault();hold()}
      else if(e.key==='F9'){e.preventDefault();if(cart.length)setPayOpen(true)}
      else if(e.key==='F6'){e.preventDefault();if(cart.length)setBatchFor(cart[cart.length-1].key)}
      else if(e.key==='F10'){e.preventDefault();
        const last=sortBy(db.sales.filter(s=>s.branchId===myBranch),s=>s.date+s.time,'desc')[0];
        if(last) setDone({sale:last,reprint:true})}
      else if(e.key==='Escape'&&!payOpen&&!custOpen&&!batchFor&&!done){ if(cart.length){clearAll();toast({tone:'info',title:'Cart cleared'})} }
      else if((e.key==='+'||e.key==='=')&&document.activeElement===document.body&&cart.length){e.preventDefault();bump(cart[cart.length-1].key,1)}
      else if(e.key==='-'&&document.activeElement===document.body&&cart.length){e.preventDefault();bump(cart[cart.length-1].key,-1)}
    };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[cart,payOpen,custOpen,batchFor,done,db,myBranch]);
  useEffect(()=>{ if(searchRef.current) searchRef.current.focus() },[]);

  const hold=()=>{
    if(!cart.length){ toast({tone:'warn',title:'Nothing to hold'}); return }
    dispatch({type:'hold.add',bill:{id:uid('H'),branchId:myBranch,at:TODAY+' '+String(NOW_H).padStart(2,'0')+':'+String(ri(10,59)).padStart(2,'0'),
      cart,customerId:customer?customer.id:null,custName:customer?customer.name:'Walk-in Customer',
      total:P.total,count:cart.length,cashierId:user.empId}});
    clearAll();
    toast({tone:'ok',title:'Bill held',body:'Resume it any time from the Hold list — stock is not deducted until checkout.'});
  };
  const resume=b=>{
    setCart(b.cart); setCustomer(b.customerId? db.customers.find(c=>c.id===b.customerId) : null);
    dispatch({type:'hold.remove',id:b.id}); setHoldOpen(false);
    toast({tone:'ok',title:'Bill resumed'});
  };
  const held=db.heldBills.filter(b=>b.branchId===myBranch);

  const commit=(payments,cashGiven)=>{
    const no=`${branch.code}-2026-${String((db.counters[myBranch]||0)+1).padStart(6,'0')}`;
    const time=String(NOW_H).padStart(2,'0')+':'+String(ri(10,59)).padStart(2,'0');
    const paidNow=round2(sum(payments.filter(p=>p.method!=='Baki'),p=>p.amount));
    const bakiAdded=round2(sum(payments.filter(p=>p.method==='Baki'),p=>p.amount));
    const sale={
      id:'S'+branch.code+String((db.counters[myBranch]||0)+1).padStart(6,'0'),no,branchId:myBranch,
      date:TODAY,time,hour:NOW_H,cashierId:user.empId||'E06',counter:'C1',
      customerId:customer?customer.id:null,custName:customer?customer.name:'Walk-in Customer',
      custPhone:customer?customer.phone:'',custType:customer?customer.type:'retail',
      doctorId:doctor?doctor.id:null,
      items:P.lines.map(l=>({medId:l.medId,brand:l.brand,strength:l.strength,form:l.form,company:l.company,
        category:l.category,batchId:l.batchId,batchNo:l.batchNo,expiry:l.expiry,unit:l.unit,qty:l.qty,
        pieces:l.pieces,mrp:l.mrp,price:l.price,disc:l.disc,offerDisc:l.offerDisc,vatPct:l.vatPct,
        vatAmt:l.vatAmt,cost:l.cost,amount:l.amount,rx:l.rx,controlled:l.controlled,offers:l.offers})),
      sub:P.sub,itemDisc:P.itemDisc,billDisc:P.billDisc,vat:P.vat,rounding:P.rounding,total:P.total,
      cost:P.cost,profit:P.profit,payments,paid:paidNow,change:round2(Math.max(0,cashGiven-paidNow)),
      bakiAdded,prevBaki:customer?customer.baki:0,
      pointsEarned:P.pointsEarned,pointsRedeemed:redeemPts,
      pointsBalance:customer?customer.points+P.pointsEarned-redeemPts:0,
      status:'completed',rx:P.lines.some(l=>l.rx),rxPhoto,note:''};
    dispatch({type:'sale.commit',sale,userId:user.id,userName:user.name});
    setPayOpen(false); setDone({sale});
    clearAll();
    toast({tone:'ok',title:`${no} saved`,
      body:`${money(sale.total)} · ${payments.map(p=>p.method).join(' + ')} · credited to ${user.name.split(' ')[0]}`});
  };

  return <div className="grid gap-4">
    <div className="ph" style={{marginBottom:0}}>
      <div>
        <h1 className="t-page">{t('POS Billing')}</h1>
        <div className="t-meta mt-1 flex items-center gap-2 flex-wrap">
          <Badge tone="brand" icon="Store">{branch.name}</Badge>
          <span>{t('Cashier')}: {user.name}</span><span className="subtle">·</span>
          <span>{fDate(TODAY,LANG==='bn')} {f12(String(NOW_H)+':05',LANG==='bn')}</span>
          <span className="subtle">·</span>
          <span>{t('Discount')} {LANG==='bn'?toBn(limit):limit}% max</span>
        </div>
      </div>
      <div className="flex gap-2 flex-wrap">
        {held.length>0&&<Btn icon="PauseCircle" onClick={()=>setHoldOpen(true)}>{t('Hold')} ({num_(held.length)})</Btn>}
        <Btn icon="Keyboard" onClick={()=>toast({tone:'info',title:'Press ? for all shortcuts',
          body:'F2 search · Enter add · F4 customer · F8 hold · F9 checkout · Esc clear'})}>Shortcuts</Btn>
        {user.branchId==='ALL'&&<Select sm value={myBranch} onChange={e=>setBranch(e.target.value)} style={{width:150}}>
          {db.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select>}
      </div>
    </div>

    <div className="pos-grid">
      {/* left: search + cart */}
      <div className="grid gap-4 min-w-0">
        <Card className="relative" style={{zIndex:20}}>
          <div className="p-3">
            <div className="relative">
              <div className="srch">
                <Icon name="Search" size={17} className="ico"/>
                <input ref={searchRef} className="input" style={{height:48,fontSize:15,paddingLeft:40}}
                  value={q} placeholder={t('Scan or search medicine')+' — brand, generic or barcode  (F2)'}
                  onChange={e=>{setQ(e.target.value);setOpenRes(true);setAct(0)}}
                  onFocus={()=>setOpenRes(true)}
                  onKeyDown={e=>{
                    if(e.key==='ArrowDown'){e.preventDefault();setAct(a=>Math.min(results.length-1,a+1))}
                    else if(e.key==='ArrowUp'){e.preventDefault();setAct(a=>Math.max(0,a-1))}
                    else if(e.key==='Enter'){e.preventDefault();const r=results[act];if(r)addMed(r.med)}
                    else if(e.key==='Escape'){setOpenRes(false)}
                  }}/>
              </div>
              {openRes&&q&&<div className="pos-res scroll">
                {results.length===0&&<div className="p-5 text-center t-meta">
                  No medicine matches “{q}”.<div className="mt-2"><Btn size="sm" icon="Plus" onClick={()=>go('meds')}>{t('Add Medicine')}</Btn></div></div>}
                {results.map((r,i)=>{
                  const m=r.med; const b=r.batches[0];
                  const stat=r.stock<=0?'bad':r.stock<m.minStock?'warn':'ok';
                  return <div key={m.id} className="pos-r" data-a={i===act?1:0}
                    onMouseEnter={()=>setAct(i)} onClick={()=>addMed(m)}>
                    <div className="min-w-0">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-[13.5px] font-semibold">{m.brand}</span>
                        <span className="t-meta">{m.strength}</span>
                        {m.rx&&<Badge tone="info" sq icon="Stethoscope">Rx</Badge>}
                        {m.controlled&&<Badge tone="bad" sq icon="Lock">Controlled</Badge>}
                        {m.fridge&&<Badge tone="info" sq icon="Snowflake">2–8°C</Badge>}
                      </div>
                      <div className="t-micro clip mt-0.5">
                        {m.generic} · {m.company} · {t('Rack')} {m.rack}
                        {b&&<span> · {t('Batch')} {b.batchNo} · {t('Expiry')} {fDate(b.expiry)}</span>}
                      </div>
                    </div>
                    <div className="text-right shrink-0">
                      <div className="num text-[13.5px] font-semibold">{money(m.mrp,{dec:2,bn:LANG==='bn'})}
                        <span className="t-micro font-normal">/{t('Piece').toLowerCase()}</span></div>
                      <Badge tone={stat} sq className="mt-0.5">{r.stock<=0?t('Out of Stock'):num_(r.stock)+' pcs'}</Badge>
                    </div>
                  </div>;
                })}
              </div>}
            </div>
            <div className="flex items-center gap-2 mt-2.5 flex-wrap">
              <span className="t-micro">Quick add:</span>
              {['Napa','Seclo','Orsaline-N','Alatrol','Monas 10','Maxpro'].map(b=>{
                const m=db.medicines.find(x=>x.brand===b);
                if(!m) return null;
                return <button key={b} className="chip" onClick={()=>addMed(m)}>{b}</button>;
              })}
            </div>
          </div>
        </Card>

        <Card className="overflow-hidden min-w-0">
          <CardH title={`${t('Cart')==='Cart'?'Cart':'কার্ট'} · ${num_(P.count)} ${t('Items')}`}
            sub={P.count?`${num_(P.pieces)} pieces`:'Scan a barcode or press F2 to search'} icon="ShoppingCart"
            right={P.count>0&&<Btn size="sm" variant="ghost" icon="Trash2" onClick={clearAll}>{t('Clear')}</Btn>}/>
          {P.count===0
            ? <Empty icon="ShoppingCart" title={t('Cart is empty')}
                desc="Search by brand, generic or barcode. Batch is auto-picked by first-expiry-first-out."
                action={<Btn variant="soft" icon="Search" onClick={()=>searchRef.current&&searchRef.current.focus()}>{t('Search')} (F2)</Btn>}/>
            : <Fragment>
              <div className="cart-row t-lbl" style={{background:'var(--surface-2)',borderBottom:'1px solid var(--border)'}}>
                <span>{t('Item')}</span><span>{t('Qty')}</span><span className="text-right">{t('Rate')}</span>
                <span className="text-right">{t('Amount')}</span><span/>
              </div>
              <div className="scroll" style={{maxHeight:'44vh',overflowY:'auto'}}>
                {P.lines.map(l=>{
                  const exp=l.expiry?SEL.expiryTone(l.expiry):null;
                  const avail=SEL.stockOf(db,l.medId,[myBranch]);
                  const over=l.pieces>avail;
                  return <div key={l.key} className="cart-row">
                    <div className="min-w-0">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-[13px] font-semibold">{l.brand}</span>
                        <span className="t-micro">{l.strength}</span>
                        {l.rx&&<Badge tone="info" sq>Rx</Badge>}
                        {l.controlled&&<Badge tone="bad" sq icon="Lock">C</Badge>}
                        {over&&<Badge tone="bad" sq icon="TriangleAlert">Over stock</Badge>}
                      </div>
                      <div className="flex items-center gap-1.5 flex-wrap mt-1">
                        <button className="chip" style={{height:22,fontSize:11}} onClick={()=>setBatchFor(l.key)}
                          title="Change batch (F6)">
                          <Icon name="Layers" size={10}/>{l.batchNo}
                          {exp&&<span style={{color:`var(--${exp.tone==='bad'?'danger':exp.tone==='warn'?'warning':'fg-subtle'})`}}>
                            · {fDate(l.expiry)}</span>}
                        </button>
                        {l.med.perStrip>1&&<Seg className="scale-90 origin-left"
                          options={UNITS.filter(u=>u!=='Box'||l.med.stripsPerBox>1).map(u=>({v:u,l:t(u)}))}
                          value={l.unit} onChange={v=>setUnit(l.key,v)}/>}
                        <span className="t-micro">{num_(l.pieces)} pcs</span>
                        {l.offers.map(o=><Badge key={o} tone="ok" sq icon="BadgePercent">{o}</Badge>)}
                      </div>
                    </div>
                    <div className="qty">
                      <button onClick={()=>bump(l.key,-1)} aria-label="Decrease">−</button>
                      <input value={l.qty} onChange={e=>setQty(l.key,parseInt(e.target.value.replace(/\D/g,''))||1)}
                        aria-label={`Quantity of ${l.brand}`}/>
                      <button onClick={()=>bump(l.key,1)} aria-label="Increase">+</button>
                    </div>
                    <div className="text-right">
                      <div className="num text-[12.5px]">{money(l.price,{dec:2,bn:LANG==='bn'})}</div>
                      <div className="flex items-center gap-1 justify-end mt-1">
                        <input className="input input-sm ta-right" style={{width:46,height:24,padding:'0 5px'}}
                          value={l.discPct||''} placeholder="0" aria-label="Line discount %"
                          onChange={e=>setDisc(l.key,e.target.value.replace(/[^\d.]/g,''))}/>
                        <span className="t-micro">%</span>
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="num text-[13px] font-semibold">{money(l.amount,{dec:2,bn:LANG==='bn'})}</div>
                      {l.disc>0&&<div className="t-micro" style={{color:'var(--success)'}}>−{money(l.disc,{dec:2})}</div>}
                      {l.vatAmt>0&&<div className="t-micro">+{t('VAT')} {money(l.vatAmt,{dec:2})}</div>}
                    </div>
                    <button className="btn btn-ghost btn-xs btn-icon" onClick={()=>del(l.key)} aria-label={`Remove ${l.brand}`}>
                      <Icon name="X" size={13}/></button>
                  </div>;
                })}
              </div>
            </Fragment>}
        </Card>
      </div>

      {/* right: customer + totals + pay */}
      <div className="grid gap-4 min-w-0" style={{position:'sticky',top:72}}>
        <Card>
          <div className="p-3">
            {customer? <div className="flex items-start gap-2.5">
              <span className="avatar">{initials(customer.name)}</span>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-[13.5px] font-semibold clip">{customer.name}</span>
                  <Badge tone={customer.type==='wholesale'?'purple':'neutral'} sq>{t(customer.type==='wholesale'?'Wholesale':'Retail')}</Badge>
                  {customer.senior&&<Badge tone="info" sq>Senior</Badge>}
                  {customer.member&&<Badge tone="brand" sq>Member</Badge>}
                </div>
                <div className="t-micro mt-0.5">{fPhone(customer.phone)}</div>
                <div className="flex gap-3 mt-1.5 flex-wrap">
                  <span className="t-micro">{t('Baki')}: <b className="num" style={{color:customer.baki>0?'var(--warning)':'inherit'}}>
                    {money(customer.baki,{bn:LANG==='bn'})}</b></span>
                  <span className="t-micro">{t('Loyalty Points')}: <b className="num">{num_(customer.points)}</b></span>
                </div>
                {customer.chronic&&<div className="t-micro mt-1" style={{color:'var(--info)'}}>
                  <Icon name="HeartPulse" size={10} className="inline mr-1"/>{customer.chronic}</div>}
              </div>
              <Btn size="sm" variant="ghost" icon="X" onClick={()=>{setCustomer(null);setRedeemPts(0)}} aria-label="Remove customer"/>
            </div>
            : <Btn block icon="UserPlus" onClick={()=>setCustOpen(true)}>{t('Customer')} — {t('Walk-in Customer')} (F4)</Btn>}
            {P.lines.some(l=>l.rx)&&<div className="mt-2.5 pt-2.5" style={{borderTop:'1px dashed var(--border)'}}>
              <div className="flex items-center gap-2 flex-wrap">
                <Icon name="Stethoscope" size={13} style={{color:'var(--info)'}}/>
                <Select sm value={doctor?doctor.id:''} onChange={e=>setDoctor(db.doctors.find(d=>d.id===e.target.value)||null)}
                  style={{flex:1,minWidth:150}}>
                  <option value="">{t('Doctor')} — not recorded</option>
                  {db.doctors.map(d=><option key={d.id} value={d.id}>{d.name} · {d.spec}</option>)}
                </Select>
                <button className="chip" aria-pressed={rxPhoto} onClick={()=>{setRxPhoto(v=>!v);
                  toast({tone:'ok',title:rxPhoto?'Prescription photo removed':'Prescription photo attached',
                    body:rxPhoto?undefined:'Stored against this invoice for the DGDA register.'})}}>
                  <Icon name="Camera" size={11}/>{rxPhoto?'Photo attached':'Attach Rx photo'}</button>
              </div>
              {P.lines.some(l=>l.controlled)&&!doctor&&
                <div className="mt-2 p-2 rounded-lg flex items-start gap-2"
                  style={{background:'var(--danger-soft)',border:'1px solid var(--danger-line)'}}>
                  <Icon name="Lock" size={13} style={{color:'var(--danger)',marginTop:1,flex:'none'}}/>
                  <span className="t-micro" style={{color:'var(--danger)'}}>
                    This bill has a controlled drug. A prescribing doctor is required before checkout —
                    the sale also posts to the controlled drugs register.</span>
                </div>}
            </div>}
          </div>
        </Card>

        <Card>
          <div className="p-4">
            <div className="sum-r"><span className="muted">{t('Subtotal')}</span>
              <span className="num">{money(P.sub,{dec:2,bn:LANG==='bn'})}</span></div>
            {P.offerDisc>0&&<div className="sum-r"><span style={{color:'var(--success)'}}>
              <Icon name="BadgePercent" size={11} className="inline mr-1"/>Offers applied</span>
              <span className="num" style={{color:'var(--success)'}}>−{money(P.offerDisc,{dec:2,bn:LANG==='bn'})}</span></div>}
            {(P.itemDisc-P.offerDisc)>0&&<div className="sum-r"><span className="muted">{t('Item')} {t('Discount')}</span>
              <span className="num">−{money(P.itemDisc-P.offerDisc,{dec:2,bn:LANG==='bn'})}</span></div>}
            <div className="sum-r">
              <span className="muted flex items-center gap-1.5">{t('Discount')} (bill)
                <input className="input input-sm ta-right" style={{width:50,height:24,padding:'0 5px'}}
                  value={billDiscPct||''} placeholder="0" aria-label="Bill discount %"
                  onChange={e=>{const v=clamp(Number(e.target.value.replace(/[^\d.]/g,''))||0,0,limit);
                    if((Number(e.target.value)||0)>limit) toast({tone:'warn',title:`Bill discount capped at ${limit}%`});
                    setBillDiscPct(v)}}/>%
              </span>
              <span className="num">−{money(P.billDisc,{dec:2,bn:LANG==='bn'})}</span>
            </div>
            {P.autoBillLabel&&<div className="t-micro -mt-0.5 mb-1" style={{color:'var(--success)'}}>
              auto: {P.autoBillLabel}</div>}
            {customer&&customer.points>=db.settings.loyalty.minRedeem&&
              <div className="sum-r">
                <span className="muted flex items-center gap-1.5">
                  <Icon name="Gift" size={11}/>Redeem points
                  <input className="input input-sm ta-right" style={{width:54,height:24,padding:'0 5px'}}
                    value={redeemPts||''} placeholder="0" aria-label="Points to redeem"
                    onChange={e=>setRedeemPts(clamp(parseInt(e.target.value.replace(/\D/g,''))||0,0,customer.points))}/>
                  <span className="t-micro">/{num_(customer.points)}</span>
                </span>
                <span className="num" style={{color:'var(--primary)'}}>−{money(P.redeemValue,{dec:2,bn:LANG==='bn'})}</span>
              </div>}
            {P.vat>0&&<div className="sum-r"><span className="muted">{t('VAT')} (NBR)</span>
              <span className="num">+{money(P.vat,{dec:2,bn:LANG==='bn'})}</span></div>}
            {P.rounding!==0&&<div className="sum-r"><span className="muted">Rounding</span>
              <span className="num">{money(P.rounding,{dec:2,bn:LANG==='bn',sign:true})}</span></div>}
            <div className="sum-t">
              <span className="t-sec">{t('Grand Total')}</span>
              <span className="t-big num" style={{color:'var(--primary)'}}>{money(P.total,{bn:LANG==='bn'})}</span>
            </div>
            {P.pointsEarned>0&&<div className="t-micro mt-1.5 text-right" style={{color:'var(--primary)'}}>
              +{num_(P.pointsEarned)} {t('Loyalty Points')}</div>}
            <div className="grid gap-2 mt-4">
              <Btn variant="primary" size="lg" block icon="CreditCard" disabled={!P.count}
                onClick={()=>setPayOpen(true)}>{t('Checkout')} — {money(P.total,{bn:LANG==='bn'})} <span className="kbd ml-1">F9</span></Btn>
              <div className="grid grid-cols-2 gap-2">
                <Btn icon="PauseCircle" onClick={hold} disabled={!P.count}>{t('Hold')} (F8)</Btn>
                <Btn icon="Printer" disabled={!db.sales.some(s=>s.branchId===myBranch)}
                  onClick={()=>{const last=sortBy(db.sales.filter(s=>s.branchId===myBranch),s=>s.date+s.time,'desc')[0];
                    if(last)setDone({sale:last,reprint:true})}}>{t('Reprint')} (F10)</Btn>
              </div>
            </div>
          </div>
        </Card>

        <Card>
          <div className="p-3 grid gap-1.5">
            <div className="t-lbl mb-0.5">Counter notes</div>
            <div className="t-micro leading-relaxed">
              Batch is picked first-expiry-first-out. Expired batches never appear.
              Out-of-stock items offer same-generic substitutes and show other branches’ stock.
            </div>
            <div className="flex items-center gap-2 mt-1.5 flex-wrap">
              <Badge tone="ok" icon="Check">FEFO on</Badge>
              <Badge tone="info" icon="ShieldCheck">Expired blocked</Badge>
              <Badge tone="brand" icon="User">{user.name.split(' ')[0]}’s commission</Badge>
            </div>
          </div>
        </Card>
      </div>
    </div>

    <BatchPicker open={!!batchFor} onClose={()=>setBatchFor(null)} db={db} branchId={myBranch}
      line={cart.find(x=>x.key===batchFor)} onPick={b=>{setBatch(batchFor,b.id);setBatchFor(null);
        toast({tone:'ok',title:'Batch changed',body:`${b.batchNo} · expires ${fDate(b.expiry)}`})}}/>
    <SubstitutePicker open={!!subFor} onClose={()=>setSubFor(null)} med={subFor} db={db} branchId={myBranch}
      onPick={m=>{setSubFor(null);addMed(m)}}/>
    <CustomerPicker open={custOpen} onClose={()=>setCustOpen(false)} db={db} branchId={myBranch}
      onPick={c=>{setCustomer(c);setCustOpen(false)}} dispatch={dispatch} toast={toast} user={user}/>
    <HoldList open={holdOpen} onClose={()=>setHoldOpen(false)} bills={held} onResume={resume}
      onDrop={id=>{dispatch({type:'hold.remove',id});toast({tone:'info',title:'Held bill discarded'})}}/>
    <PayDrawer open={payOpen} onClose={()=>setPayOpen(false)} P={P} customer={customer} db={db}
      blocked={P.lines.some(l=>l.controlled)&&!doctor} onCommit={commit} toast={toast}/>
    <Modal open={!!rxPrompt} onClose={()=>setRxPrompt(null)} icon="Stethoscope" title="Prescription required"
      sub={rxPrompt?`${rxPrompt.brand} ${rxPrompt.strength} is a prescription-only medicine`:''}
      footer={<Fragment>
        <Btn onClick={()=>setRxPrompt(null)}>Record later</Btn>
        <Btn variant="primary" icon="Check" onClick={()=>{setRxPrompt(null);
          toast({tone:'info',title:'Select the prescribing doctor',body:'The doctor dropdown is in the customer panel.'})}}>
          Choose doctor</Btn></Fragment>}>
      <p className="t-meta leading-relaxed">Record the prescribing doctor and, where possible, attach a photo of the
        prescription. Controlled items cannot be checked out without a doctor on the bill.</p>
    </Modal>
    {done&&<ReceiptModal open onClose={()=>setDone(null)} sale={done.sale} db={db}
      duplicate={done.reprint} toast={toast} fresh={!done.reprint}/>}
  </div>;
}
</script>

<script type="text/babel" data-presets="react">
function BatchPicker({open,onClose,db,branchId,line,onPick}){
  if(!line) return null;
  const med=db.medicines.find(m=>m.id===line.medId);
  const all=SEL.batchesOf(db,line.medId,[branchId]);
  return <Drawer open={open} onClose={onClose} icon="Layers" title={`${t('Batch')} — ${med.brand} ${med.strength}`}
    sub={`First-expiry-first-out is pre-selected · ${t('Rack')} ${med.rack}`}>
    <div className="grid gap-2">
      {all.map(b=>{
        const tone=SEL.expiryTone(b.expiry);
        const expired=tone.key==='expired';
        const empty=b.qty<=0;
        const blocked=expired&&db.settings.stock.blockExpiredSale;
        return <button key={b.id} disabled={blocked||empty} onClick={()=>onPick(b)}
          className="text-left p-3 rounded-[10px] flex items-center gap-3 transition-all"
          style={{border:'1px solid '+(line.batchId===b.id?'var(--primary)':'var(--border)'),
            background:line.batchId===b.id?'var(--primary-soft)':'var(--surface)',
            opacity:(blocked||empty)?.5:1,cursor:(blocked||empty)?'not-allowed':'pointer'}}>
          <span className="grid place-items-center w-9 h-9 rounded-[9px] shrink-0"
            style={{background:`var(--${tone.tone==='bad'?'danger':tone.tone==='warn'?'warning':'success'}-soft)`,
              color:`var(--${tone.tone==='bad'?'danger':tone.tone==='warn'?'warning':'success'})`}}>
            <Icon name={expired?'CalendarX':'Layers'} size={16}/></span>
          <span className="min-w-0 flex-1">
            <span className="block text-[13px] font-semibold mono">{b.batchNo}</span>
            <span className="block t-micro mt-0.5">
              {t('Expiry')} {fDate(b.expiry)} · {expired?`expired ${Math.abs(tone.days)} days ago`:`${num_(tone.days)} days left`}
              · {t('MRP')} {money(b.mrp,{dec:2})}</span>
          </span>
          <span className="text-right shrink-0">
            <Badge tone={tone.tone}>{tone.label}</Badge>
            <span className="block t-micro mt-1">{num_(b.qty)} pcs</span>
          </span>
        </button>;
      })}
      {all.length===0&&<Empty icon="PackageX" title="No batches at this branch"/>}
      {all.some(b=>SEL.expiryTone(b.expiry).key==='expired')&&
        <div className="panel p-2.5 flex items-start gap-2 t-micro">
          <Icon name="ShieldCheck" size={13} style={{color:'var(--success)',flex:'none',marginTop:1}}/>
          Expired batches are locked for sale (Settings → Stock). Clear them from Expiry Management.
        </div>}
    </div>
  </Drawer>;
}

function SubstitutePicker({open,onClose,med,db,branchId,onPick}){
  if(!med) return null;
  const subs=db.medicines.filter(m=>m.id!==med.id&&m.generic===med.generic)
    .map(m=>({med:m,stock:SEL.stockOf(db,m.id,[branchId])}));
  const other=db.branches.filter(b=>b.id!==branchId)
    .map(b=>({branch:b,stock:SEL.stockOf(db,med.id,[b.id])})).filter(x=>x.stock>0);
  return <Drawer open={open} onClose={onClose} icon="PackageX" title={`${med.brand} ${t('Out of Stock')}`}
    sub={`${med.generic} · same-generic substitutes and other branches`}>
    <div className="grid gap-4">
      <div>
        <div className="t-lbl mb-2">Substitutes — same generic</div>
        <div className="grid gap-2">
          {subs.length===0&&<div className="panel p-3 t-meta">No other brand of {med.generic} is on the catalogue.</div>}
          {sortBy(subs,s=>s.stock,'desc').map(s=>
            <button key={s.med.id} disabled={s.stock<=0} onClick={()=>onPick(s.med)}
              className="text-left p-3 rounded-[10px] flex items-center gap-3"
              style={{border:'1px solid var(--border)',background:'var(--surface)',opacity:s.stock<=0?.5:1,
                cursor:s.stock<=0?'not-allowed':'pointer'}}>
              <span className="grid place-items-center w-9 h-9 rounded-[9px] shrink-0"
                style={{background:'var(--primary-soft)',color:'var(--primary)'}}><Icon name="Pill" size={16}/></span>
              <span className="min-w-0 flex-1">
                <span className="block text-[13px] font-semibold">{s.med.brand} {s.med.strength}</span>
                <span className="block t-micro mt-0.5">{s.med.company} · {t('MRP')} {money(s.med.mrp,{dec:2})} · {t('Rack')} {s.med.rack}</span>
              </span>
              <Badge tone={s.stock<=0?'bad':s.stock<s.med.minStock?'warn':'ok'}>
                {s.stock<=0?t('Out of Stock'):num_(s.stock)+' pcs'}</Badge>
            </button>)}
        </div>
      </div>
      <div>
        <div className="t-lbl mb-2">Available at other branches</div>
        <div className="grid gap-2">
          {other.length===0&&<div className="panel p-3 t-meta">No branch holds {med.brand} right now — raise a purchase order.</div>}
          {other.map(o=><div key={o.branch.id} className="panel p-3 flex items-center gap-3">
            <span className="grid place-items-center w-9 h-9 rounded-[9px] shrink-0"
              style={{background:'var(--info-soft)',color:'var(--info)'}}><Icon name="Building2" size={16}/></span>
            <span className="min-w-0 flex-1">
              <span className="block text-[13px] font-semibold">{o.branch.name}</span>
              <span className="block t-micro">{o.branch.city} · {fPhone(o.branch.phone)}</span>
            </span>
            <Badge tone="ok">{num_(o.stock)} pcs</Badge>
          </div>)}
        </div>
      </div>
    </div>
  </Drawer>;
}

function CustomerPicker({open,onClose,db,branchId,onPick,dispatch,toast,user}){
  const [q,setQ]=useState(''); const [add,setAdd]=useState(false);
  const [f,setF]=useState({name:'',phone:'',address:'',type:'retail',chronic:''});
  const [err,setErr]=useState({});
  const list=useMemo(()=>{
    const qq=q.trim().toLowerCase();
    let r=db.customers;
    if(qq) r=r.filter(c=>c.name.toLowerCase().includes(qq)||c.phone.includes(qq));
    else r=r.filter(c=>c.branchId===branchId);
    return sortBy(r,c=>c.name).slice(0,40);
  },[q,db,branchId]);
  const save=()=>{
    const e={};
    if(!f.name.trim()) e.name='Customer name is required';
    if(!/^01[3-9]\d{8}$/.test(f.phone.replace(/\D/g,''))) e.phone='Enter a valid Bangladeshi mobile (01XXXXXXXXX)';
    setErr(e); if(Object.keys(e).length) return;
    const c={id:uid('C'),name:f.name.trim(),phone:f.phone.replace(/\D/g,''),branchId,address:f.address,
      chronic:f.chronic||null,type:f.type,creditLimit:f.type==='wholesale'?100000:3000,baki:0,points:0,
      since:TODAY,senior:false,member:false};
    dispatch({type:'upsert',coll:'customers',item:c});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Customer created',
      entity:'Customer',detail:`${c.name} · ${fPhone(c.phone)}`,branchId}});
    toast({tone:'ok',title:'Customer added',body:`${c.name} — ${fPhone(c.phone)}`});
    onPick(c); setAdd(false); setF({name:'',phone:'',address:'',type:'retail',chronic:''});
  };
  return <Drawer open={open} onClose={onClose} icon="Users" title={t('Customer')}
    sub="Search by name or phone, or add a new customer in one step"
    footer={add? <Fragment><Btn onClick={()=>setAdd(false)}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={save}>{t('Save')} & select</Btn></Fragment>
      : <Fragment><Btn onClick={()=>onPick(null)}>{t('Walk-in Customer')}</Btn>
        <Btn variant="primary" icon="UserPlus" onClick={()=>setAdd(true)}>{t('Add Customer')}</Btn></Fragment>}>
    {add
      ? <div className="grid gap-3">
          <Field label={t('Name')} req error={err.name}>
            <Input value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="e.g. Abdur Rahim"/></Field>
          <Field label={t('Phone')} req error={err.phone} hint="Stored as +880 1XXX-XXXXXX">
            <Input value={f.phone} onChange={e=>setF({...f,phone:e.target.value})} placeholder="01711234567" inputMode="tel"/></Field>
          <Field label={t('Type')}>
            <Select value={f.type} onChange={e=>setF({...f,type:e.target.value})}>
              <option value="retail">{t('Retail')} — MRP pricing</option>
              <option value="wholesale">{t('Wholesale')} / institutional — 12% off MRP</option>
            </Select></Field>
          <Field label={t('Address')}><Input value={f.address} onChange={e=>setF({...f,address:e.target.value})}/></Field>
          <Field label="Chronic condition" hint="Drives refill reminders">
            <Input value={f.chronic} onChange={e=>setF({...f,chronic:e.target.value})} placeholder="e.g. Diabetes Type 2"/></Field>
        </div>
      : <div className="grid gap-3">
          <Searchbox value={q} onChange={setQ} placeholder="Name or mobile number…"/>
          <div className="grid gap-1.5">
            {list.map(c=><button key={c.id} onClick={()=>onPick(c)}
              className="text-left p-2.5 rounded-[10px] flex items-center gap-2.5 transition-colors hover:bg-[var(--surface-hover)]"
              style={{border:'1px solid var(--border)'}}>
              <span className="avatar avatar-sm">{initials(c.name)}</span>
              <span className="min-w-0 flex-1">
                <span className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-[13px] font-semibold clip">{c.name}</span>
                  {c.type==='wholesale'&&<Badge tone="purple" sq>{t('Wholesale')}</Badge>}
                  {c.senior&&<Badge tone="info" sq>Senior</Badge>}
                </span>
                <span className="block t-micro">{fPhone(c.phone)}{c.chronic?' · '+c.chronic:''}</span>
              </span>
              <span className="text-right shrink-0">
                {c.baki>0&&<Badge tone="warn">{t('Baki')} {money(c.baki)}</Badge>}
                <span className="block t-micro mt-0.5">{num_(c.points)} pts</span>
              </span>
            </button>)}
            {list.length===0&&<Empty icon="UserSearch" title="No customer found"
              desc={`Nothing matched “${q}”. Add them in one step.`}
              action={<Btn variant="soft" icon="UserPlus" onClick={()=>{setAdd(true);setF({...f,phone:/^\d+$/.test(q)?q:'',name:/^\d+$/.test(q)?'':q})}}>{t('Add Customer')}</Btn>}/>}
          </div>
        </div>}
  </Drawer>;
}

function HoldList({open,onClose,bills,onResume,onDrop}){
  return <Drawer open={open} onClose={onClose} icon="PauseCircle" title={`Held bills (${bills.length})`}
    sub="Stock is not deducted until a held bill is checked out">
    <div className="grid gap-2">
      {bills.length===0&&<Empty icon="PauseCircle" title="No held bills"/>}
      {bills.map(b=><div key={b.id} className="panel p-3 flex items-center gap-3">
        <span className="grid place-items-center w-9 h-9 rounded-[9px] shrink-0"
          style={{background:'var(--warning-soft)',color:'var(--warning)'}}><Icon name="PauseCircle" size={16}/></span>
        <div className="min-w-0 flex-1">
          <div className="text-[13px] font-semibold clip">{b.custName}</div>
          <div className="t-micro">{num_(b.count)} items · {money(b.total)} · held {b.at}</div>
        </div>
        <div className="flex gap-1.5 shrink-0">
          <Btn size="sm" variant="primary" icon="Play" onClick={()=>onResume(b)}>{t('Resume')}</Btn>
          <Btn size="sm" variant="ghost" icon="Trash2" onClick={()=>onDrop(b.id)} aria-label="Discard"/>
        </div>
      </div>)}
    </div>
  </Drawer>;
}

const PAY_UI=[
  {m:'Cash',icon:'Banknote',color:'#15803d'},
  {m:'bKash',icon:null,short:'bK',color:'#e2136e'},
  {m:'Nagad',icon:null,short:'N',color:'#f6921e'},
  {m:'Rocket',icon:null,short:'R',color:'#8c3494'},
  {m:'Card',icon:'CreditCard',color:'#1d4ed8'},
  {m:'Bank',icon:'Landmark',color:'#0e7490'},
  {m:'Cheque',icon:'ScrollText',color:'#6d28d9'},
  {m:'Baki',icon:'Clock',color:'#b45309'},
];
const needsTxn=m=>['bKash','Nagad','Rocket'].includes(m);
function PayDrawer({open,onClose,P,customer,db,onCommit,toast,blocked}){
  const [mode,setMode]=useState('single');
  const [method,setMethod]=useState('Cash');
  const [cash,setCash]=useState('');
  const [txn,setTxn]=useState('');
  const [chq,setChq]=useState({no:'',bank:'',due:addDays(TODAY,15)});
  const [lines,setLines]=useState([{method:'Cash',amount:'',txnId:''}]);
  const [err,setErr]=useState(null);
  useEffect(()=>{ if(open){setMode('single');setMethod('Cash');setCash('');setTxn('');setErr(null);
    setLines([{method:'Cash',amount:String(P.total),txnId:''}])} },[open]);
  const total=P.total;
  const cashNum=Number(cash)||0;
  const splitSum=round2(sum(lines,l=>Number(l.amount)||0));
  const bakiRoom = customer? round2(customer.creditLimit-customer.baki) : 0;

  const go=()=>{
    if(blocked){ setErr('A controlled drug is on this bill — record the prescribing doctor first.'); return }
    if(mode==='single'){
      if(method==='Baki'){
        if(!customer){ setErr('Baki is only available for a registered customer. Press F4 to select one.'); return }
        if(total>bakiRoom){ setErr(`Credit limit exceeded — ${money(bakiRoom)} of ${money(customer.creditLimit)} available.`); return }
      }
      if(needsTxn(method)&&txn.trim().length<4){ setErr(`${method} transaction ID is required (at least 4 characters).`); return }
      if(method==='Cheque'&&(!chq.no.trim()||!chq.bank.trim())){ setErr('Cheque number and bank are required.'); return }
      if(method==='Cash'&&cashNum>0&&cashNum<total){ setErr(`Cash received ${money(cashNum)} is less than ${money(total)}.`); return }
      const pay={method,amount:total};
      if(needsTxn(method)) pay.txnId=txn.trim();
      if(method==='Cheque') pay.txnId=`${chq.no} · ${chq.bank} · due ${fDate(chq.due)}`;
      onCommit([pay], method==='Cash'? (cashNum||total) : total);
    } else {
      if(Math.abs(splitSum-total)>0.5){ setErr(`Split payments total ${money(splitSum)} — must equal ${money(total)}.`); return }
      for(const l of lines){
        if(needsTxn(l.method)&&String(l.txnId||'').trim().length<4){ setErr(`${l.method} transaction ID is required.`); return }
        if(l.method==='Baki'){
          if(!customer){ setErr('Baki needs a registered customer.'); return }
          if(Number(l.amount)>bakiRoom){ setErr(`Baki portion exceeds available credit (${money(bakiRoom)}).`); return }
        }
      }
      onCommit(lines.filter(l=>Number(l.amount)>0).map(l=>({method:l.method,amount:round2(Number(l.amount)),
        ...(needsTxn(l.method)?{txnId:l.txnId.trim()}:{})})), round2(sum(lines.filter(l=>l.method==='Cash'),l=>Number(l.amount)||0)));
    }
  };
  return <Drawer open={open} onClose={onClose} icon="CreditCard" title={t('Checkout')}
    sub={`${num_(P.count)} items · ${num_(P.pieces)} pieces`}
    footer={<Fragment>
      <Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="CheckCircle2" onClick={go}>
        {t('Confirm')} {money(total,{bn:LANG==='bn'})}</Btn>
    </Fragment>}>
    <div className="grid gap-4">
      <div className="p-4 rounded-[12px] text-center"
        style={{background:'linear-gradient(145deg,var(--primary-soft),var(--surface-2))',border:'1px solid var(--primary-line)'}}>
        <div className="t-lbl">{t('Grand Total')}</div>
        <div className="t-big num mt-1" style={{color:'var(--primary)'}}>{money(total,{bn:LANG==='bn'})}</div>
        <div className="t-micro mt-1.5">{LANG==='bn'?wordsBN(total):wordsEN(total)}</div>
      </div>
      <Seg className="self-start" options={[{v:'single',l:'Single payment'},{v:'split',l:t('Split Payment')}]}
        value={mode} onChange={setMode}/>
      {mode==='single'? <Fragment>
        <div className="pay-g">
          {PAY_UI.map(p=>{
            const dis = p.m==='Baki'&&!customer;
            return <button key={p.m} className="pay-b" aria-pressed={method===p.m} disabled={dis}
              style={dis?{opacity:.42,cursor:'not-allowed'}:undefined}
              onClick={()=>{setMethod(p.m);setErr(null)}}>
              {p.icon? <Icon name={p.icon} size={17} style={{color:method===p.m?'var(--primary)':'var(--fg-muted)'}}/>
                : <span className="pay-ic" style={{background:p.color}}>{p.short}</span>}
              {t(p.m)}
            </button>;
          })}
        </div>
        {method==='Cash'&&<div className="grid gap-2">
          <Field label="Cash received" hint="Leave blank for exact amount">
            <Input value={cash} onChange={e=>{setCash(e.target.value.replace(/[^\d.]/g,''));setErr(null)}}
              placeholder={String(total)} inputMode="decimal" className="ta-right" style={{fontSize:17,height:44,fontWeight:600}}/>
          </Field>
          <div className="flex gap-1.5 flex-wrap">
            {[total,Math.ceil(total/50)*50,Math.ceil(total/100)*100,Math.ceil(total/500)*500,Math.ceil(total/1000)*1000]
              .filter((v,i,a)=>a.indexOf(v)===i).map(v=>
              <button key={v} className="chip" onClick={()=>setCash(String(v))}>{money(v)}</button>)}
          </div>
          {cashNum>=total&&<div className="panel p-3 flex items-center justify-between">
            <span className="t-sec" style={{fontSize:14}}>{t('Change')}</span>
            <span className="t-kpi num" style={{color:'var(--success)'}}>{money(cashNum-total,{bn:LANG==='bn'})}</span>
          </div>}
        </div>}
        {needsTxn(method)&&<Field label={`${method} transaction ID`} req
          hint="Printed on the receipt and matched during daily closing">
          <Input value={txn} onChange={e=>{setTxn(e.target.value.toUpperCase());setErr(null)}}
            placeholder="e.g. 9FG4KD21XZ" className="mono"/></Field>}
        {method==='Cheque'&&<div className="grid gap-3 sm:grid-cols-2">
          <Field label="Cheque no" req><Input value={chq.no} onChange={e=>setChq({...chq,no:e.target.value})}/></Field>
          <Field label="Bank" req><Input value={chq.bank} onChange={e=>setChq({...chq,bank:e.target.value})}/></Field>
          <Field label="Due date"><Input type="date" value={chq.due} onChange={e=>setChq({...chq,due:e.target.value})}/></Field>
        </div>}
        {method==='Baki'&&customer&&<div className="panel p-3 grid gap-1.5">
          <Row label="Previous Baki" value={money(customer.baki)}/>
          <Row label="This bill" value={money(total)}/>
          <Row label="New Baki total" value={money(customer.baki+total)} strong tone="warning"/>
          <Row label="Credit limit" value={money(customer.creditLimit)}/>
          <div className="mt-1"><Bar value={pct(customer.baki+total,customer.creditLimit)}
            tone={customer.baki+total>customer.creditLimit?'danger':'warning'}/></div>
        </div>}
        {method==='Baki'&&!customer&&<div className="panel p-3 t-meta">
          Baki needs a registered customer — press F4 to select or add one.</div>}
      </Fragment>
      : <div className="grid gap-2.5">
        {lines.map((l,i)=><div key={i} className="panel p-2.5 grid gap-2">
          <div className="flex gap-2">
            <Select sm value={l.method} style={{width:112}}
              onChange={e=>{const v=e.target.value;setLines(ls=>ls.map((x,j)=>j===i?{...x,method:v}:x));setErr(null)}}>
              {PAY_UI.map(p=><option key={p.m} value={p.m} disabled={p.m==='Baki'&&!customer}>{t(p.m)}</option>)}
            </Select>
            <Input sm className="ta-right" value={l.amount} inputMode="decimal" placeholder="0"
              onChange={e=>{const v=e.target.value.replace(/[^\d.]/g,'');setLines(ls=>ls.map((x,j)=>j===i?{...x,amount:v}:x));setErr(null)}}/>
            <Btn size="sm" variant="ghost" icon="X" disabled={lines.length===1}
              onClick={()=>setLines(ls=>ls.filter((_,j)=>j!==i))} aria-label="Remove row"/>
          </div>
          {needsTxn(l.method)&&<Input sm className="mono" placeholder={`${l.method} transaction ID`} value={l.txnId}
            onChange={e=>setLines(ls=>ls.map((x,j)=>j===i?{...x,txnId:e.target.value.toUpperCase()}:x))}/>}
        </div>)}
        <div className="flex items-center justify-between gap-2">
          <Btn size="sm" icon="Plus" onClick={()=>setLines(ls=>[...ls,{method:'bKash',amount:String(round2(total-splitSum)>0?round2(total-splitSum):''),txnId:''}])}>
            Add payment</Btn>
          <div className="text-right">
            <div className="t-micro">Entered / due</div>
            <div className="num text-[13px] font-semibold"
              style={{color:Math.abs(splitSum-total)<0.5?'var(--success)':'var(--warning)'}}>
              {money(splitSum)} / {money(total)}</div>
          </div>
        </div>
      </div>}
      {err&&<div className="p-3 rounded-[10px] flex items-start gap-2"
        style={{background:'var(--danger-soft)',border:'1px solid var(--danger-line)'}}>
        <Icon name="CircleAlert" size={14} style={{color:'var(--danger)',marginTop:1,flex:'none'}}/>
        <span className="text-[12.5px]" style={{color:'var(--danger)'}}>{err}</span>
      </div>}
      {P.pointsEarned>0&&<div className="t-micro flex items-center gap-1.5">
        <Icon name="Gift" size={12} style={{color:'var(--primary)'}}/>
        Customer earns {num_(P.pointsEarned)} loyalty points on this bill.</div>}
    </div>
  </Drawer>;
}
</script>

<script type="text/babel" data-presets="react">
/* ===================== 8. RECEIPT / INVOICE ===================== */
function Receipt({sale,db,paper='80mm',duplicate,isReturn,original}){
  const st=db.settings;
  const r=st.receipt;
  const br=db.branches.find(b=>b.id===sale.branchId)||db.branches[0];
  const cashier=db.employees.find(e=>e.id===sale.cashierId);
  const doc=sale.doctorId? db.doctors.find(d=>d.id===sale.doctorId):null;
  const cust=sale.customerId? db.customers.find(c=>c.id===sale.customerId):null;
  const a4 = paper==='A4';
  const w58 = paper==='58mm';
  const label = isReturn? 'CREDIT NOTE / RETURN RECEIPT' : (a4? 'TAX INVOICE' : 'CASH MEMO');
  return <div className={cls('rcpt',w58&&'w58',a4&&'a4')} style={{position:'relative'}}>
    {duplicate&&<div className="dup"><span>{r.duplicateLabel}</span></div>}
    {/* header */}
    <div className={a4?'flex items-start justify-between gap-6':'cen'}>
      <div className={a4?'':'cen'}>
        {r.showLogo&&<div className={a4?'flex items-center gap-2.5 mb-2':'cen'} style={a4?{}:{marginBottom:2}}>
          {a4&&<span style={{width:34,height:34,borderRadius:9,background:'#0f766e',color:'#fff',
            display:'grid',placeItems:'center',fontWeight:800,fontSize:17}}>{st.pharmacy.logoText}</span>}
          <span style={{fontSize:a4?19:15,fontWeight:800,letterSpacing:'-.01em'}}>{r.header||st.pharmacy.name}</span>
        </div>}
        <div style={{fontSize:a4?11.5:9.5,lineHeight:1.5}}>
          <div style={{fontWeight:700}}>{br.name} Branch{br.is24h?' · 24 Hours':''}</div>
          <div>{br.address}</div>
          <div>Mobile: {fPhone(br.phone)}</div>
          <div>Drug Licence: {br.drugLic} · DGDA Reg: {br.dgda}</div>
          {r.showVat&&st.vat.showBin&&<div>BIN: {st.pharmacy.bin} · Trade Lic: {br.trade}</div>}
        </div>
      </div>
      {a4&&<div style={{textAlign:'right',fontSize:11.5,lineHeight:1.6}}>
        <div style={{fontSize:15,fontWeight:800,letterSpacing:'.04em'}}>{label}</div>
        <div><b>{isReturn?'Return No:':'Invoice No:'}</b> {sale.no}</div>
        {isReturn&&original&&<div><b>Against:</b> {original}</div>}
        <div><b>Date:</b> {fDate(sale.date)} {f12(sale.time)}</div>
        <div><b>Counter:</b> {sale.counter||'C1'} · <b>Cashier:</b> {cashier?cashier.name:'—'}</div>
        <div><b>Fiscal Year:</b> {fyLabel(fyOf(sale.date))}</div>
      </div>}
    </div>
    {!a4&&<Fragment>
      <div className="hr3"/>
      <div className="cen" style={{fontWeight:700,letterSpacing:'.06em',fontSize:10.5}}>{label}</div>
      <div className="hr2"/>
      <table><tbody>
        <tr><td>{isReturn?'Return':'Invoice'}</td><td className="rt" style={{fontWeight:700}}>{sale.no}</td></tr>
        {isReturn&&original&&<tr><td>Against</td><td className="rt">{original}</td></tr>}
        <tr><td>Date</td><td className="rt">{fDate(sale.date)} {f12(sale.time)}</td></tr>
        <tr><td>Cashier</td><td className="rt">{cashier?cashier.name:'—'} · {sale.counter||'C1'}</td></tr>
        <tr><td>Customer</td><td className="rt">{sale.custName}</td></tr>
        {sale.custPhone&&<tr><td>Mobile</td><td className="rt">{fPhone(sale.custPhone)}</td></tr>}
        {r.showDoctor&&doc&&<tr><td>Doctor</td><td className="rt">{doc.name}</td></tr>}
      </tbody></table>
    </Fragment>}
    {a4&&<div style={{display:'flex',gap:24,marginTop:18,paddingTop:14,borderTop:'1.5px solid #000'}}>
      <div style={{flex:1}}>
        <div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'.08em',color:'#555',marginBottom:3}}>Billed to</div>
        <div style={{fontWeight:700,fontSize:13}}>{sale.custName}</div>
        {sale.custPhone&&<div style={{fontSize:11.5}}>{fPhone(sale.custPhone)}</div>}
        {cust&&cust.address&&<div style={{fontSize:11.5}}>{cust.address}</div>}
        {cust&&cust.type==='wholesale'&&<div style={{fontSize:11.5}}>Wholesale / institutional account</div>}
      </div>
      {r.showDoctor&&doc&&<div style={{flex:1}}>
        <div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'.08em',color:'#555',marginBottom:3}}>Prescribed by</div>
        <div style={{fontWeight:700,fontSize:13}}>{doc.name}</div>
        <div style={{fontSize:11.5}}>{doc.degree}</div>
        <div style={{fontSize:11.5}}>{doc.bmdc} · {doc.chamber}</div>
      </div>}
    </div>}

    {/* items */}
    {a4
      ? <table className="items" style={{marginTop:16}}>
          <thead><tr>
            <th style={{width:26}}>#</th><th>Medicine</th>
            {r.showBatch&&<th>Batch</th>}{r.showExpiry&&<th>Expiry</th>}
            <th style={{textAlign:'right'}}>Qty</th><th style={{textAlign:'right'}}>MRP</th>
            <th style={{textAlign:'right'}}>Disc</th>
            {sale.vat>0&&<th style={{textAlign:'right'}}>VAT</th>}
            <th style={{textAlign:'right'}}>Amount</th>
          </tr></thead>
          <tbody>
            {sale.items.map((i,n)=><tr key={n}>
              <td>{n+1}</td>
              <td><b>{i.brand}</b> {i.strength}
                {i.controlled&&<span style={{fontSize:9.5,border:'1px solid #000',padding:'0 3px',marginLeft:4}}>CTRL</span>}</td>
              {r.showBatch&&<td style={{fontSize:11}}>{i.batchNo}</td>}
              {r.showExpiry&&<td style={{fontSize:11}}>{i.expiry?fDate(i.expiry):'—'}</td>}
              <td style={{textAlign:'right'}}>{i.qty} {i.unit}</td>
              <td style={{textAlign:'right'}}>{money(i.mrp,{dec:2,sym:false})}</td>
              <td style={{textAlign:'right'}}>{i.disc?money(i.disc,{dec:2,sym:false}):'—'}</td>
              {sale.vat>0&&<td style={{textAlign:'right'}}>{i.vatAmt?money(i.vatAmt,{dec:2,sym:false}):'—'}</td>}
              <td style={{textAlign:'right',fontWeight:600}}>{money(i.amount,{dec:2,sym:false})}</td>
            </tr>)}
          </tbody>
        </table>
      : <Fragment>
          <div className="hr3"/>
          <table><tbody>
            {sale.items.map((i,n)=><Fragment key={n}>
              <tr><td colSpan={2} style={{fontWeight:700,paddingTop:3}}>
                {n+1}. {i.brand} {i.strength}{i.controlled?' [CTRL]':''}</td></tr>
              {(r.showBatch||r.showExpiry)&&<tr><td colSpan={2} style={{fontSize:w58?8.5:9}}>
                {r.showBatch&&`B: ${i.batchNo}`}{r.showBatch&&r.showExpiry&&' · '}
                {r.showExpiry&&i.expiry&&`Exp: ${fDate(i.expiry)}`}</td></tr>}
              <tr>
                <td>{i.qty} {i.unit} × {money(i.mrp,{dec:2,sym:false})}{i.disc>0?` − ${money(i.disc,{dec:2,sym:false})}`:''}</td>
                <td className="rt" style={{fontWeight:700}}>{money(i.amount,{dec:2,sym:false})}</td>
              </tr>
            </Fragment>)}
          </tbody></table>
        </Fragment>}

    {/* totals */}
    <div className={a4?'':'hr3'} style={a4?{marginTop:18,display:'flex',justifyContent:'flex-end'}:{}}>
      <table style={a4?{width:300}:{}}><tbody>
        <tr><td>Subtotal</td><td className="rt">{money(sale.sub,{dec:2,sym:false})}</td></tr>
        {sale.items.some(i=>i.offerDisc>0)&&
          <tr><td>Offers applied</td><td className="rt">−{money(sum(sale.items,i=>i.offerDisc),{dec:2,sym:false})}</td></tr>}
        {sale.itemDisc>0&&<tr><td>Item discount</td><td className="rt">−{money(sale.itemDisc,{dec:2,sym:false})}</td></tr>}
        {sale.billDisc>0&&<tr><td>Bill discount</td><td className="rt">−{money(sale.billDisc,{dec:2,sym:false})}</td></tr>}
        {sale.pointsRedeemed>0&&<tr><td>Points redeemed ({sale.pointsRedeemed})</td>
          <td className="rt">−{money(sale.pointsRedeemed*st.loyalty.pointValue,{dec:2,sym:false})}</td></tr>}
        {r.showVat&&sale.vat>0&&<tr><td>VAT</td><td className="rt">+{money(sale.vat,{dec:2,sym:false})}</td></tr>}
        {!!sale.rounding&&<tr><td>Rounding</td><td className="rt">{money(sale.rounding,{dec:2,sym:false,sign:true})}</td></tr>}
        <tr><td colSpan={2}><div className="hr3"/></td></tr>
        <tr><td className="gt">{isReturn?'REFUND TOTAL':'GRAND TOTAL'}</td>
          <td className="rt gt">৳{money(sale.total,{sym:false,dec:2})}</td></tr>
      </tbody></table>
    </div>

    {/* words */}
    <div className={a4?'':'hr2'} style={a4?{marginTop:14,fontSize:11.5,borderTop:'1px solid #ddd',paddingTop:10}:{fontSize:w58?8.5:9.5}}>
      <div><b>In words:</b> {wordsEN(sale.total)}</div>
      {r.bangla&&<div className="rcpt-bn" style={{marginTop:2}}>কথায়: {wordsBN(sale.total)}</div>}
    </div>

    {/* payment */}
    {!a4&&<div className="hr2"/>}
    <table style={a4?{marginTop:12,width:'100%'}:{}}><tbody>
      {sale.payments.map((p,i)=><tr key={i}>
        <td>{p.method}{p.txnId?` · ${p.txnId}`:''}</td>
        <td className="rt">{money(p.amount,{dec:2,sym:false})}</td></tr>)}
      {sale.change>0&&<tr><td>Change returned</td><td className="rt">{money(sale.change,{dec:2,sym:false})}</td></tr>}
      {r.showBaki&&(sale.bakiAdded>0||sale.prevBaki>0)&&<Fragment>
        <tr><td colSpan={2}><div className="hr2"/></td></tr>
        <tr><td>Previous Baki</td><td className="rt">{money(sale.prevBaki,{dec:2,sym:false})}</td></tr>
        <tr><td>This bill Baki</td><td className="rt">{money(sale.bakiAdded,{dec:2,sym:false})}</td></tr>
        <tr><td style={{fontWeight:700}}>Total Baki due</td>
          <td className="rt" style={{fontWeight:700}}>{money(sale.prevBaki+sale.bakiAdded,{dec:2,sym:false})}</td></tr>
      </Fragment>}
      {r.showPoints&&st.loyalty.enabled&&sale.customerId&&<Fragment>
        <tr><td colSpan={2}><div className="hr2"/></td></tr>
        <tr><td>Points earned</td><td className="rt">{sale.pointsEarned}</td></tr>
        {sale.pointsRedeemed>0&&<tr><td>Points redeemed</td><td className="rt">{sale.pointsRedeemed}</td></tr>}
        <tr><td>Points balance</td><td className="rt">{sale.pointsBalance}</td></tr>
      </Fragment>}
    </tbody></table>

    {/* footer */}
    <div className={a4?'':'hr3'} style={a4?{marginTop:20,display:'flex',gap:20,alignItems:'flex-start',
      borderTop:'1.5px solid #000',paddingTop:14}:{}}>
      {r.showQR&&<div className={a4?'':'cen'} style={a4?{}:{display:'flex',justifyContent:'center',padding:'5px 0'}}>
        <div className="qr"><QR text={`${sale.no}|${sale.total}|${br.code}|${sale.date}`} size={a4?78:62}/></div>
      </div>}
      <div style={{flex:1,fontSize:a4?10.5:w58?8:8.8,lineHeight:1.5}} className={a4?'':'cen'}>
        <div style={{fontWeight:700,marginBottom:2}}>Return policy</div>
        <div>{r.policy}</div>
        {sale.items.some(i=>i.controlled)&&<div style={{marginTop:3,fontWeight:700}}>
          Controlled item sold against prescription — recorded in the narcotics register.</div>}
      </div>

function ReceiptModal({open,onClose,sale,db,duplicate,toast,fresh,isReturn,original}){
  const [paper,setPaper]=useState(db.settings.receipt.paper==='A4'?'A4':db.settings.receipt.paper);
  const [dup,setDup]=useState(!!duplicate);
  const [showOk,setShowOk]=useState(!!fresh);
  useEffect(()=>{ if(fresh){ const t1=setTimeout(()=>setShowOk(false),1500); return ()=>clearTimeout(t1) } },[fresh]);
  if(!sale) return null;
  return <Modal open={open} onClose={onClose} lg icon="ReceiptText"
    title={isReturn?'Return receipt / credit note':(fresh?'Sale completed':t('Receipt'))}
    sub={`${sale.no} · ${money(sale.total)} · ${fDate(sale.date)} ${f12(sale.time)}`}
    footer={<Fragment>
      <Btn onClick={onClose}>{t('Close')}</Btn>
      <Btn icon="Share2" onClick={()=>toast({tone:'info',title:'Share link ready',
        body:`In the live build this sends ${sale.no} to ${sale.custPhone?fPhone(sale.custPhone):'the customer'} over WhatsApp or SMS.`})}>
        {t('Share')}</Btn>
      <Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'PDF generated',
        body:`${sale.no}.pdf would download at ${paper} width in the live build.`})}>PDF</Btn>
      <Btn variant="primary" icon="Printer" onClick={()=>printIt(toast)}>{t('Print')}</Btn>
    </Fragment>}>
    {showOk&&<div className="flex flex-col items-center gap-2 pb-4 no-print">
      <div className="okmark"><Icon name="Check" size={30} stroke={3}/></div>
      <div className="t-sec">{money(sale.total,{bn:LANG==='bn'})} {LANG==='bn'?'গৃহীত':'received'}</div>
      <div className="t-meta">{sale.payments.map(p=>t(p.method)).join(' + ')}{sale.change>0?` · ${t('Change')} ${money(sale.change)}`:''}</div>
    </div>}
    <div className="flex items-center gap-2 mb-3 flex-wrap no-print">
      <span className="t-lbl">Paper</span>
      <Seg options={[{v:'80mm',l:'80 mm'},{v:'58mm',l:'58 mm'},{v:'A4',l:'A4 invoice'}]} value={paper} onChange={setPaper}/>
      <button className="chip ml-auto" aria-pressed={dup} onClick={()=>setDup(v=>!v)}>
        <Icon name="Copy" size={11}/>{db.settings.receipt.duplicateLabel}</button>
    </div>
    <div className="rcpt-wrap">
      <Receipt sale={sale} db={db} paper={paper} duplicate={dup} isReturn={isReturn} original={original}/>
    </div>
    <div className="t-micro mt-3 no-print leading-relaxed">
      Printed at exact paper width with no app chrome — the same print stylesheet drives payslips,
      salary sheets, purchase orders and reports.
    </div>
  </Modal>;
}
</script>

function App(){
  const [db,dispatch]=useReducer(reducer,null,loadDB);
  const prefs=store.get('oushadh_prefs',{});
  const [lang,setLangS]=useState(prefs.lang||'en');
  const [theme,setThemeS]=useState(prefs.theme||'light');
  const [userId,setUserId]=useState(null);
  const [branchId,setBranchS]=useState('ALL');
  const [mini,setMini]=useState(false);
  const [navOpen,setNavOpen]=useState(false);
  const [page,setPage]=useState('dashboard');
  const [params,setParams]=useState({});
  const [cmd,setCmd]=useState(false);
  const [bell,setBell]=useState(false);
  const [sc,setSc]=useState(false);
  const [tour,setTour]=useState(-1);
  const [toasts,setToasts]=useState([]);
  const [booting,setBooting]=useState(true);
  const seq=useRef(0);

  LANG=lang;
  useEffect(()=>{ try{ document.documentElement.setAttribute('data-theme',theme);
    document.body.classList.toggle('lang-bn',lang==='bn') }catch(e){} },[theme,lang]);
  useEffect(()=>{ store.set('oushadh_prefs',{lang,theme,userId,branchId}) },[lang,theme,userId,branchId]);
  useEffect(()=>{ persist(db) },[db]);
  useEffect(()=>{ const el=document.getElementById('boot'); if(el) el.remove();
    const t1=setTimeout(()=>setBooting(false),380); return ()=>clearTimeout(t1) },[]);

  const toast=useCallback(o=>{
    const id=++seq.current;
    setToasts(ts=>[...ts.slice(-3),{id,...o}]);
    setTimeout(()=>setToasts(ts=>ts.filter(x=>x.id!==id)), o.tone==='err'?6500:4200);
  },[]);
  const removeToast=id=>setToasts(ts=>ts.filter(x=>x.id!==id));

  const user=db.users.find(u=>u.id===userId)||null;
  const effBranch = user? (user.branchId==='ALL'? branchId : user.branchId) : 'ALL';
  const branchIds=useMemo(()=>SEL.branchScope(db,effBranch),[db,effBranch]);
  const notifs=useMemo(()=>user?buildNotifs(db,branchIds):[],[db,branchIds,user]);
  const unread=notifs.filter(n=>!db.notifRead.includes(n.id)).length;

  const go=useCallback((p,pr={})=>{ setPage(p); setParams(pr);
    try{ window.scrollTo({top:0,behavior:'smooth'}) }catch(e){} setNavOpen(false) },[]);
  const setLang=v=>{ LANG=v; setLangS(v) };
  const setBranch=v=>setBranchS(v);
  const markRead=id=>dispatch({type:'notif.read',id});

  /* global keys */
  useEffect(()=>{
    if(!user) return;
    let gKey=false, gTimer=null;
    const h=e=>{
      const inField=/input|select|textarea/i.test((e.target&&e.target.tagName)||'');
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setCmd(true);return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();setMini(m=>!m);return}
      if((e.ctrlKey||e.metaKey)&&e.key==='/'){e.preventDefault();setLang(lang==='en'?'bn':'en');return}
      if(inField) return;
      if(e.key==='?'){e.preventDefault();setSc(true);return}
      if(e.key.toLowerCase()==='g'){gKey=true;clearTimeout(gTimer);gTimer=setTimeout(()=>{gKey=false},900);return}
      if(gKey){
        const map={d:'dashboard',p:'pos',i:'meds',r:'reports',s:'sales',h:'employees',c:'customers',f:'pl'};
        const to=map[e.key.toLowerCase()];
        if(to&&navAllowed(user.role,(NAV.flatMap(g=>g.items).find(i=>i.k===to)||{}).p)){ e.preventDefault();go(to) }
        gKey=false;
      }
    };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[user,lang,go]);

  if(!user) return <ToastCtx.Provider value={toast}>
    <Login db={db} lang={lang} setLang={setLang} theme={theme} setTheme={setThemeS}
      onLogin={id=>{ const u=db.users.find(x=>x.id===id);
        setUserId(id); setBranchS(u.branchId==='ALL'?'ALL':u.branchId);
        const home = can(u.role,'dashboard')?'dashboard':can(u.role,'pos')?'pos':'myspace';
        setPage(home);
        dispatch({type:'audit.add',row:{time:String(NOW_H)+':'+String(ri(10,59)),userId:u.id,userName:u.name,
          action:'Login',entity:'Session',detail:`Signed in as ${u.role}`,branchId:u.branchId}});
        toast({tone:'ok',title:`${LANG==='bn'?'স্বাগতম':'Welcome'}, ${u.name.split(' ')[0]}`,
          body:`${t(u.role)} · ${u.branchId==='ALL'?t('All Branches'):db.branches.find(b=>b.id===u.branchId).name}`});
        if(!store.get('oushadh_tour_done',false)) setTimeout(()=>setTour(0),900);
      }}/>
    <ToastHost items={toasts} remove={removeToast}/>
  </ToastCtx.Provider>;

  const counts={notifications:unread,leave:db.leaves.filter(l=>l.status==='Pending'&&branchIds.includes(l.branchId)).length,
    advance:db.advances.filter(a=>a.status==='Pending').length,
    transfer:db.transfers.filter(tr=>tr.status==='Requested'||tr.status==='In Transit').length,
    adjust:db.adjustments.filter(a=>a.status==='Pending'&&branchIds.includes(a.branchId)).length};

  const allowed=navAllowed(user.role,(NAV.flatMap(g=>g.items).find(i=>i.k===page)||{p:'*'}).p);
  const Screen = allowed ? (SCREENS[page]||(()=> <Placeholder name={PAGE_TITLES[page]||page}/>)) : null;
  const crumbs=[{label:'Oushadh',onClick:()=>go(can(user.role,'dashboard')?'dashboard':'myspace')},
    {label:t(PAGE_GROUP[page]||'')},{label:t(PAGE_TITLES[page]||'')}];

  const ctx={db,dispatch,user,branchId:effBranch,branchIds,setBranch,go,page,params,toast,lang,setLang,
    theme,setTheme:setThemeS,notifs,markRead,crumbs,unread,
    resetDemo:()=>{ store.del(SKEY); const fresh=assembleDB(); dispatch({type:'replace',db:fresh});
      toast({tone:'ok',title:'Demo data reset',body:'Every medicine, sale, payslip and setting is back to the seeded state.'}) }};

  return <Ctx.Provider value={ctx}><ToastCtx.Provider value={toast}>
    <div className="shell">
      <Sidebar mini={mini} setMini={setMini} page={page} go={go} role={user.role}
        open={navOpen} setOpen={setNavOpen} counts={counts}/>
      <div className={cls('main',mini&&'mini')}>
        <Topbar mini={mini} setMini={setMini} setNavOpen={setNavOpen} branchId={effBranch} setBranch={setBranch}
          branches={db.branches} user={user} lang={lang} setLang={setLang} theme={theme} setTheme={setThemeS}
          unread={unread} onBell={()=>setBell(true)} onSearch={()=>setCmd(true)} go={go}
          onTour={()=>setTour(0)} onShortcuts={()=>setSc(true)}
          onLogout={()=>{setUserId(null);setPage('dashboard');toast({tone:'info',title:'Signed out'})}}/>
        <main className="content">
          {booting? <BootSkeleton/>
            : !allowed
              ? <Card><Empty icon="ShieldX" title="No access to this page"
                  desc={`Your role (${t(user.role)}) cannot open ${t(PAGE_TITLES[page]||page)}. Sign in as Owner to see everything.`}
                  action={<Btn variant="primary" onClick={()=>go(can(user.role,'dashboard')?'dashboard':'myspace')}>Back to start</Btn>}/></Card>
              : <Screen/>}
        </main>
      </div>
    </div>
    <CommandPalette open={cmd} onClose={()=>setCmd(false)} db={db} go={go} branchIds={branchIds} toast={toast}/>
    <ShortcutsModal open={sc} onClose={()=>setSc(false)}/>
    <NotifPanel open={bell} onClose={()=>setBell(false)} notifs={notifs} read={db.notifRead}
      onRead={markRead} go={go}/>
    {tour>=0&&<Tour step={tour} setStep={setTour}
      onDone={()=>{setTour(-1);store.set('oushadh_tour_done',true);
        toast({tone:'ok',title:'Tour finished',body:'Reopen it any time from the user menu.'})}}/>}
    <ToastHost items={toasts} remove={removeToast}/>
  </ToastCtx.Provider></Ctx.Provider>;
}

function BootSkeleton(){
  return <div className="grid gap-5">
    <div className="flex items-center justify-between"><div><Skel w={220} h={26}/><div className="mt-2"><Skel w={300} h={13}/></div></div><Skel w={120} h={36}/></div>
    <div className="grid-kpi">{Array.from({length:8}).map((_,i)=><Card key={i}><div className="p-4 grid gap-2.5">
      <Skel w={90} h={11}/><Skel w={130} h={26}/><Skel w={110} h={11}/></div></Card>)}</div>
    <div className="cols2" style={{'--c2':'minmax(0,1.6fr) minmax(0,1fr)'}}>
      <Card><div className="p-4"><Skel w={160} h={15}/><div className="mt-4"><Skel h={240}/></div></div></Card>
      <Card><div className="p-4 grid gap-2.5">{Array.from({length:6}).map((_,i)=><Skel key={i} h={44}/>)}</div></Card>
    </div>
  </div>;
}
</script>

<script type="text/babel" data-presets="react">
/* ===================== 7.5 INVENTORY ===================== */
function Medicines(){
  const {db,dispatch,user,branchIds,branchId,toast,params,go,crumbs}=useApp();
  const [detail,setDetail]=useState(params.medId||null);
  const [form,setForm]=useState(null);
  const [co,setCo]=useState('');const [cat,setCat]=useState('');const [stat,setStat]=useState(params.filter||'');
  const [bulk,setBulk]=useState(null);
  const canEdit=can(user.role,'stock.edit');
  useEffect(()=>{ if(params.medId) setDetail(params.medId) },[params.medId]);

  const rows=useMemo(()=>db.medicines.map(m=>{
    const st=SEL.medStatus(db,m,branchIds);
    const bts=SEL.batchesOf(db,m.id,branchIds).filter(b=>b.qty>0);
    const nearest=bts.length?bts[0].expiry:null;
    return {...m,st,qty:st.qty,nearest,value:round2(sum(bts,b=>b.qty*b.purchasePrice)),batches:bts.length};
  }).filter(m=>(!co||m.company===co)&&(!cat||m.category===cat)&&
    (!stat||(stat==='low'?['low','critical','oos'].includes(m.st.key):stat==='rx'?m.rx:stat==='ctrl'?m.controlled:
      stat==='fridge'?m.fridge:m.st.key===stat))),[db,branchIds,co,cat,stat]);

  const companies=uniq(db.medicines.map(m=>m.company)).sort();
  const cols=[
    {k:'brand',h:t('Name'),sort:m=>m.brand,cell:m=><div className="min-w-0">
      <div className="flex items-center gap-1.5 flex-wrap">
        <span className="font-semibold">{m.brand}</span><span className="t-meta">{m.strength}</span>
        {m.rx&&<Badge tone="info" sq>Rx</Badge>}
        {m.controlled&&<Badge tone="bad" sq icon="Lock">C</Badge>}
        {m.fridge&&<Badge tone="info" sq icon="Snowflake">2–8°C</Badge>}
      </div>
      <div className="t-micro clip">{m.generic} · {m.form}</div></div>},
    {k:'company',h:t('Company'),sort:m=>m.company,cell:m=><span className="t-meta">{m.company}</span>},
    {k:'category',h:t('Category'),sort:m=>m.category,cell:m=><Badge tone="neutral">{m.category}</Badge>},
    {k:'rack',h:t('Rack'),sort:m=>m.rack,cell:m=><span className="mono t-meta">{m.rack}</span>},
    {k:'qty',h:t('Stock'),cls:'r',sort:m=>m.qty,cell:m=><div className="text-right">
      <div className="num font-semibold">{num_(m.qty)}</div>
      <div className="t-micro">min {num_(m.minStock)}</div></div>},
    {k:'st',h:t('Status'),sort:m=>m.st.key,cell:m=><Badge tone={m.st.tone}>{t(m.st.label)}</Badge>},
    {k:'nearest',h:t('Expiry'),sort:m=>m.nearest||'9999',cell:m=>{
      if(!m.nearest) return <span className="subtle">—</span>;
      const e=SEL.expiryTone(m.nearest);

          {e.days<0?`${Math.abs(e.days)}d ago`:`${num_(e.days)}d · ${num_(m.batches)} batches`}</div></div>}},
    {k:'mrp',h:t('MRP'),cls:'r',sort:m=>m.mrp,cell:m=><div className="text-right">

    {k:'value',h:'Stock value',cls:'r',sort:m=>m.value,cell:m=><span className="num">{money(m.value,{bn:LANG==='bn'})}</span>},
