      actions={<Fragment>
        {canEdit&&<Btn icon="Percent" onClick={()=>setBulk({ids:[],pct:5})}>Bulk price update</Btn>}
        <Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'Stock list exported',body:`${rows.length} rows queued as XLSX in the live build.`})}>{t('Export')}</Btn>
        {canEdit&&<Btn variant="primary" icon="Plus" onClick={()=>setForm({})}>{t('Add Medicine')}</Btn>}
      </Fragment>}/>
    <div className="grid-kpi">
      <KPI label="Catalogue" value={db.medicines.length} icon="Pill" sub={`${companies.length} companies`}/>
      <KPI label={t('Stock Value')} value={SEL.stockValue(db,branchIds)} fmt={v=>moneyK(v,LANG==='bn')} icon="Boxes" tone="purple" sub="At purchase cost"/>
      <KPI label={t('Low Stock')} value={rows.filter(r=>['low','critical'].includes(r.st.key)).length} icon="PackageX" tone="warning"
        onClick={()=>setStat('low')} sub="At or below minimum"/>
      <KPI label={t('Out of Stock')} value={rows.filter(r=>r.st.key==='oos').length} icon="CircleOff" tone="danger"
        onClick={()=>setStat('oos')} sub="Reorder now"/>
      <KPI label="Prescription-only" value={db.medicines.filter(m=>m.rx).length} icon="Stethoscope" tone="info" onClick={()=>setStat('rx')}/>
      <KPI label="Controlled" value={db.medicines.filter(m=>m.controlled).length} icon="Lock" tone="danger" onClick={()=>setStat('ctrl')}
        sub="Separate register"/>
    </div>
    <DataTable rows={rows} cols={cols} pageSize={12} initialSort={{k:'brand',dir:'asc'}}
      search={(m,q)=>m.brand.toLowerCase().includes(q)||m.generic.toLowerCase().includes(q)||m.company.toLowerCase().includes(q)||m.barcode.includes(q)}
      searchPlaceholder="Brand, generic, company or barcode…"
      onRowClick={m=>setDetail(m.id)}
      filters={<Fragment>
        <Select sm value={co} onChange={e=>setCo(e.target.value)} style={{width:135}}>
          <option value="">{t('Company')} — all</option>{companies.map(x=><option key={x}>{x}</option>)}</Select>
        <Select sm value={cat} onChange={e=>setCat(e.target.value)} style={{width:150}}>
          <option value="">{t('Category')} — all</option>{CATEGORIES.map(x=><option key={x}>{x}</option>)}</Select>
        <Select sm value={stat} onChange={e=>setStat(e.target.value)} style={{width:140}}>
          <option value="">{t('Status')} — all</option>
          <option value="low">Low / out of stock</option><option value="oos">{t('Out of Stock')}</option>
          <option value="ok">{t('In Stock')}</option><option value="rx">Prescription-only</option>
          <option value="ctrl">Controlled</option><option value="fridge">Cold chain</option></Select>
        {(co||cat||stat)&&<Btn size="sm" variant="ghost" icon="X" onClick={()=>{setCo('');setCat('');setStat('')}}>{t('Reset')}</Btn>}
      </Fragment>}
      bulkActions={canEdit?[
        {label:'Price update',icon:'Percent',onClick:ids=>setBulk({ids,pct:5})},
        {label:'Print labels',icon:'Barcode',onClick:ids=>{go('barcode');toast({tone:'ok',title:`${ids.length} items queued for label printing`})}},
      ]:undefined}
      empty={{icon:'Pill',title:'No medicine matches these filters',
        desc:'Clear the company, category or status filter to see the full catalogue.'}}/>
    <MedicineDetail id={detail} onClose={()=>setDetail(null)}/>
    <MedicineForm med={form} onClose={()=>setForm(null)}/>
    <BulkPrice state={bulk} onClose={()=>setBulk(null)}/>
  </div>;
}

function MedicineDetail({id,onClose}){

      const q=sum(db.sales.filter(s=>s.date===d&&branchIds.includes(s.branchId)&&s.status==='completed')

      return {x:fDateS(d),qty:q};
    });

  if(!m) return null;

  return <Drawer open wide onClose={onClose} icon="Pill" title={`${m.brand} ${m.strength}`}

      <Btn icon="Barcode" onClick={()=>{go('barcode');onClose()}}>Print label</Btn>

      <div className="grid gap-2 sm:grid-cols-4">

          <div className="t-kpi num mt-1">{num_(st.qty)}</div>
          <Badge tone={st.tone} className="mt-1">{t(st.label)}</Badge></div>
        <div className="panel p-3"><div className="t-lbl">{t('MRP')}</div>
          <div className="t-kpi num mt-1">{money(m.mrp,{dec:2,bn:LANG==='bn'})}</div>
          <div className="t-micro mt-1">cost {money(m.purchasePrice,{dec:2})} · {pct(m.mrp-m.purchasePrice,m.mrp)}% margin</div></div>
        <div className="panel p-3"><div className="t-lbl">{t('Wholesale')}</div>
          <div className="t-kpi num mt-1">{money(m.wholesale,{dec:2,bn:LANG==='bn'})}</div>
          <div className="t-micro mt-1">{t('VAT')} {m.vat}%</div></div>
        <div className="panel p-3"><div className="t-lbl">Pack</div>
          <div className="text-[14px] font-semibold mt-1">{m.perStrip>1?`${m.perStrip} × ${m.stripsPerBox}`:'Single'}</div>

      <Tabs value={tab} onChange={setTab} tabs={[

        {k:'price',label:'Price history',icon:'TrendingUp'}]}/>
      {tab==='stock'&&<div className="grid gap-3">
        {db.branches.map(b=>{
          const bts=SEL.batchesOf(db,m.id,[b.id]);

          return <Card key={b.id}>

            <div className="tw"><table className="dt compact">
              <thead><tr><th>{t('Batch')}</th><th>{t('Expiry')}</th><th className="r">{t('Qty')}</th>
                <th className="r">Cost</th><th>{t('Status')}</th><th>Received</th></tr></thead>
              <tbody>{bts.length===0&&<tr><td colSpan={6} className="t-meta">No batch at this branch</td></tr>}
                {bts.map(x=>{const e=SEL.expiryTone(x.expiry);

                    <td className="r num">{num_(x.qty)}</td><td className="r num">{money(x.purchasePrice,{dec:2})}</td>

            <RC.YAxis tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false}/>

            <RC.Bar dataKey="qty" name="Pieces" fill={c.primary} radius={[4,4,0,0]}/>
          </RC.BarChart></ChartBox></div></Card>}
      {tab==='price'&&<Card><CardH title="MRP history" icon="TrendingUp" sub="Company circulars and manual updates"/>

            return <tr key={i}><td className="num">{d_(h.date)}</td>
              <td className="r num font-semibold">{money(h.mrp,{dec:2,bn:LANG==='bn'})}</td>
              <td className="r num" style={{color:prev&&h.mrp>prev?'var(--success)':'var(--fg-subtle)'}}>
                {prev? `${h.mrp>prev?'+':''}${pct(h.mrp-prev,prev)}%` : '—'}</td>
              <td className="t-meta">{h.by}</td></tr>})}
          </tbody></table></div></Card>}
    </div>
  </Drawer>;
}

function MedicineForm({med,onClose}){
  const {db,dispatch,toast,user}=useApp();
  const edit=med&&med.id;
  const [f,setF]=useState({});
  const [err,setErr]=useState({});
  useEffect(()=>{ if(med) setF({brand:'',generic:'',strength:'',form:'Tablet',company:'Square',category:'Tablet',
    purchasePrice:'',mrp:'',vat:0,perStrip:10,stripsPerBox:10,rack:'',minStock:100,rx:false,controlled:false,fridge:false,...med}) },[med]);
  if(!med) return null;
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const save=()=>{
    const e={};
    if(!String(f.brand||'').trim()) e.brand='Brand name is required';
    if(!String(f.generic||'').trim()) e.generic='Generic name is required';
    if(!(Number(f.mrp)>0)) e.mrp='MRP must be greater than zero';
    if(!(Number(f.purchasePrice)>0)) e.purchasePrice='Purchase price is required';
    if(Number(f.purchasePrice)>=Number(f.mrp)) e.purchasePrice='Purchase price must be below MRP';
    setErr(e); if(Object.keys(e).length){ toast({tone:'err',title:'Check the highlighted fields'}); return }
    const item={id:edit?med.id:uid('M'),active:true,shelfLife:24,
      barcode:edit?med.barcode:'88'+String(Date.now()).slice(-8),
      priceHistory:edit?med.priceHistory:[{date:TODAY,mrp:Number(f.mrp),by:user.name}],
      ...f,purchasePrice:Number(f.purchasePrice),mrp:Number(f.mrp),
      wholesale:round2(Number(f.mrp)*0.88),vat:Number(f.vat),
      perStrip:Number(f.perStrip),stripsPerBox:Number(f.stripsPerBox),minStock:Number(f.minStock)};
    dispatch({type:'upsert',coll:'medicines',item});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,
      action:edit?'Medicine updated':'Medicine created',entity:'Medicine',
      detail:`${item.brand} ${item.strength} · MRP ${money(item.mrp,{dec:2})}`,branchId:'ALL'}});
    toast({tone:'ok',title:edit?'Medicine updated':'Medicine added',body:`${item.brand} ${item.strength}`});
    onClose();
  };
  return <Drawer open onClose={onClose} icon="Pill" title={edit?`${t('Edit')} ${med.brand}`:t('Add Medicine')}
    sub="Pack conversion drives box / strip / piece selling at the counter"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={save}>{t('Save')}</Btn></Fragment>}>
    <div className="grid gap-3">
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label="Brand name" req error={err.brand}><Input value={f.brand||''} onChange={e=>set('brand',e.target.value)} placeholder="e.g. Napa"/></Field>
        <Field label="Generic name" req error={err.generic}><Input value={f.generic||''} onChange={e=>set('generic',e.target.value)} placeholder="e.g. Paracetamol"/></Field>
        <Field label={t('Strength')}><Input value={f.strength||''} onChange={e=>set('strength',e.target.value)} placeholder="500 mg"/></Field>
        <Field label={t('Form')}><Select value={f.form} onChange={e=>set('form',e.target.value)}>{FORMS.map(x=><option key={x}>{x}</option>)}</Select></Field>
        <Field label={t('Company')}><Select value={f.company} onChange={e=>set('company',e.target.value)}>{COMPANIES.map(x=><option key={x}>{x}</option>)}</Select></Field>
        <Field label={t('Category')}><Select value={f.category} onChange={e=>set('category',e.target.value)}>{CATEGORIES.map(x=><option key={x}>{x}</option>)}</Select></Field>
      </div>
      <div className="hr"/>
      <div className="t-lbl">Pricing</div>
      <div className="grid gap-3 sm:grid-cols-3">
        <Field label="Purchase price (per piece)" req error={err.purchasePrice}>
          <Input className="ta-right" value={f.purchasePrice} onChange={e=>set('purchasePrice',e.target.value.replace(/[^\d.]/g,''))} inputMode="decimal"/></Field>
        <Field label="MRP (per piece)" req error={err.mrp}>
          <Input className="ta-right" value={f.mrp} onChange={e=>set('mrp',e.target.value.replace(/[^\d.]/g,''))} inputMode="decimal"/></Field>
        <Field label={`${t('VAT')} %`} hint="0 for most medicines">
          <Select value={f.vat} onChange={e=>set('vat',e.target.value)}>{[0,5,7.5,10,15].map(v=><option key={v} value={v}>{v}%</option>)}</Select></Field>
      </div>
      {Number(f.mrp)>0&&Number(f.purchasePrice)>0&&
        <div className="panel p-3 flex items-center justify-between">
          <span className="t-meta">Margin per piece</span>
          <span className="num font-semibold" style={{color:'var(--success)'}}>
            {money(Number(f.mrp)-Number(f.purchasePrice),{dec:2})} · {pct(Number(f.mrp)-Number(f.purchasePrice),Number(f.mrp))}%</span>
        </div>}
      <div className="hr"/>
      <div className="t-lbl">Pack & stock</div>
      <div className="grid gap-3 sm:grid-cols-4">
        <Field label="Pieces / strip"><Input className="ta-right" value={f.perStrip} onChange={e=>set('perStrip',e.target.value.replace(/\D/g,''))}/></Field>
        <Field label="Strips / box"><Input className="ta-right" value={f.stripsPerBox} onChange={e=>set('stripsPerBox',e.target.value.replace(/\D/g,''))}/></Field>
        <Field label={t('Rack')}><Input value={f.rack||''} onChange={e=>set('rack',e.target.value)} placeholder="A-01"/></Field>
        <Field label="Minimum stock"><Input className="ta-right" value={f.minStock} onChange={e=>set('minStock',e.target.value.replace(/\D/g,''))}/></Field>
      </div>
      <div className="hr"/>
      <div className="grid gap-2.5">
        <Switch checked={f.rx} onChange={v=>set('rx',v)} label="Prescription required (Rx)"/>
        <Switch checked={f.controlled} onChange={v=>set('controlled',v)} label="Controlled / narcotic — separate register, doctor mandatory"/>
        <Switch checked={f.fridge} onChange={v=>set('fridge',v)} label="Cold chain item (2–8°C) — non-returnable"/>
      </div>
    </div>
  </Drawer>;
}

function BulkPrice({state,onClose}){
  const {db,dispatch,toast,user}=useApp();
  const [co,setCo]=useState('Square');
  const [pct_,setPct]=useState(5);
  if(!state) return null;
  const ids = state.ids&&state.ids.length? state.ids : db.medicines.filter(m=>m.company===co).map(m=>m.id);
  const affected=db.medicines.filter(m=>ids.includes(m.id));
  const apply=()=>{
    dispatch({type:'bulkPrice',ids,pctValue:Number(pct_),by:`${user.name} · bulk update`});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Bulk price update',
      entity:'Medicine',detail:`${affected.length} items ${pct_>0?'raised':'reduced'} by ${Math.abs(pct_)}%`,branchId:'ALL'}});
    toast({tone:'ok',title:'Prices updated',body:`${affected.length} items changed by ${pct_>0?'+':''}${pct_}% — logged in the activity trail.`});
    onClose();
  };
  return <Modal open onClose={onClose} icon="Percent" title="Bulk price update" lg
    sub="Company circular raised MRP? Apply it across the catalogue in one step."
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={apply} disabled={!affected.length}>
        {t('Apply')} to {num_(affected.length)} items</Btn></Fragment>}>
    <div className="grid gap-3">
      {!(state.ids&&state.ids.length)&&<Field label={t('Company')}>
        <Select value={co} onChange={e=>setCo(e.target.value)}>
          {uniq(db.medicines.map(m=>m.company)).sort().map(x=><option key={x}>{x}</option>)}</Select></Field>}
      <Field label="Change %" hint="Negative values reduce the MRP">
        <Input className="ta-right" value={pct_} onChange={e=>setPct(e.target.value.replace(/[^\d.-]/g,''))} inputMode="decimal"/></Field>
      <div className="flex gap-1.5 flex-wrap">{[2,3,5,7,10,-5].map(v=>
        <button key={v} className="chip" onClick={()=>setPct(v)}>{v>0?'+':''}{v}%</button>)}</div>
      <div className="tw card" style={{maxHeight:300}}>
        <table className="dt compact"><thead><tr><th>{t('Name')}</th><th className="r">Current</th>
          <th className="r">New {t('MRP')}</th><th className="r">Change</th></tr></thead>
          <tbody>{affected.slice(0,60).map(m=><tr key={m.id}>
            <td>{m.brand} <span className="t-meta">{m.strength}</span></td>
            <td className="r num">{money(m.mrp,{dec:2})}</td>
            <td className="r num font-semibold">{money(m.mrp*(1+Number(pct_)/100),{dec:2})}</td>
            <td className="r num" style={{color:Number(pct_)>0?'var(--success)':'var(--danger)'}}>
              {Number(pct_)>0?'+':''}{money(m.mrp*Number(pct_)/100,{dec:2})}</td></tr>)}
          </tbody></table>
      </div>
      <div className="panel p-3 flex items-start gap-2 t-micro">
        <Icon name="Info" size={13} style={{color:'var(--info)',flex:'none',marginTop:1}}/>
        Existing batches keep their recorded MRP; new MRP applies to future sales and is written to each
        medicine’s price history with your name against it.
      </div>
    </div>
  </Modal>;
}
</script>

<script type="text/babel" data-presets="react">
/* ---- expiry management ---- */
function ExpiryMgmt(){
  const {db,dispatch,branchIds,branchId,toast,user,params,crumbs}=useApp();
  const [tier,setTier]=useState(params.tier||'30');
  const [act,setAct]=useState(null);
  const all=useMemo(()=>SEL.expiryList(db,branchIds,365),[db,branchIds]);
  const buckets={
    expired:all.filter(x=>x.tone.key==='expired'),
    '30':all.filter(x=>x.tone.key==='e30'),
    '60':all.filter(x=>x.tone.key==='e60'),
    '90':all.filter(x=>x.tone.key==='e90'),
  };
  const rows = tier==='all'? all.filter(x=>x.tone.key!=='ok') : (buckets[tier]||[]);
  const val=b=>sum(b,x=>x.qty*x.purchasePrice);
  const cols=[
    {k:'med',h:t('Medicines'),sort:x=>x.med.brand,cell:x=><div>
      <div className="font-semibold">{x.med.brand} <span className="t-meta">{x.med.strength}</span></div>
      <div className="t-micro">{x.med.company} · {t('Rack')} {x.med.rack}</div></div>},
    {k:'branch',h:t('Branch'),sort:x=>x.branchId,cell:x=><Badge tone="neutral">{db.branches.find(b=>b.id===x.branchId).name}</Badge>},
    {k:'batch',h:t('Batch'),sort:x=>x.batchNo,cell:x=><span className="mono">{x.batchNo}</span>},
    {k:'expiry',h:t('Expiry'),sort:x=>x.expiry,cell:x=><div>
      <div className="num">{d_(x.expiry)}</div>
      <div className="t-micro" style={{color:x.tone.tone==='bad'?'var(--danger)':'var(--warning)'}}>
        {x.tone.days<0?`${Math.abs(x.tone.days)} days ago`:`${num_(x.tone.days)} days left`}</div></div>},
    {k:'qty',h:t('Qty'),cls:'r',sort:x=>x.qty,cell:x=><span className="num">{num_(x.qty)}</span>},
    {k:'value',h:'Cost value',cls:'r',sort:x=>x.qty*x.purchasePrice,
      cell:x=><span className="num">{money(x.qty*x.purchasePrice,{bn:LANG==='bn'})}</span>},
    {k:'tone',h:t('Status'),cell:x=><Badge tone={x.tone.tone}>{x.tone.label}</Badge>},
    {k:'act',h:'',cls:'r',cell:x=><div className="row-act">
      <Btn size="xs" icon="Undo2" onClick={()=>setAct({b:x,mode:'return'})}>Return</Btn>
      <Btn size="xs" variant="ghost" icon="Trash2" onClick={()=>setAct({b:x,mode:'writeoff'})}>Write off</Btn></div>},
  ];
  return <div className="grid gap-4">
    <PageHeader title={t('Expiry Management')} icon="CalendarClock" crumbs={crumbs}
      sub={`${num_(all.filter(x=>x.tone.key!=='ok').length)} batches inside the 90-day window · ${money(val(all.filter(x=>x.tone.key!=='ok')))} at cost`}
      actions={<Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'Expiry report exported',
        body:'Supplier-wise return claim sheet queued as XLSX in the live build.'})}>{t('Export')}</Btn>}/>
    <div className="grid gap-3 sm:grid-cols-4">
      {[['expired','Expired','danger','CalendarX'],['30','Within 30 days','danger','AlarmClock'],
        ['60','31–60 days','warning','Clock'],['90','61–90 days','warning','CalendarClock']].map(([k,label,tone,icon])=>{
        const b=buckets[k]; const on=tier===k;
        return <button key={k} onClick={()=>setTier(k)} className="card lift p-4 text-left"
          style={{border:'1px solid '+(on?`var(--${tone})`:'var(--border)'),
            background:on?`var(--${tone}-soft)`:'var(--surface)'}}>
          <div className="flex items-start justify-between gap-2 mb-2">
            <span className="t-lbl">{label}</span>
            <span className="grid place-items-center w-7 h-7 rounded-lg"
              style={{background:`var(--${tone}-soft)`,color:`var(--${tone})`}}><Icon name={icon} size={15}/></span>
          </div>
          <div className="t-kpi num">{num_(b.length)}</div>
          <div className="t-micro mt-1">{money(val(b),{bn:LANG==='bn'})} at cost · {num_(sum(b,x=>x.qty))} pcs</div>
        </button>;
      })}
    </div>
    <div className="flex items-center gap-2 flex-wrap">
      <Seg options={[{v:'expired',l:'Expired'},{v:'30',l:'≤30d'},{v:'60',l:'≤60d'},{v:'90',l:'≤90d'},{v:'all',l:'All ≤90d'}]}
        value={tier} onChange={setTier}/>
      <span className="t-meta ml-auto">{branchId==='ALL'?t('All Branches'):db.branches.find(b=>b.id===branchId).name}</span>
    </div>
    <DataTable rows={rows} cols={cols} pageSize={12} initialSort={{k:'expiry',dir:'asc'}}
      search={(x,q)=>x.med.brand.toLowerCase().includes(q)||x.batchNo.toLowerCase().includes(q)}
      searchPlaceholder="Medicine or batch number…"
      bulkActions={[
        {label:'Return to supplier',icon:'Undo2',onClick:ids=>toast({tone:'ok',title:`${ids.length} batches added to a supplier return claim`,
          body:'Claim sheet generated against each supplier with batch, expiry and cost value.'})},
        {label:'Write off',icon:'Trash2',variant:'danger',onClick:ids=>toast({tone:'warn',title:`${ids.length} batches queued for write-off`,
          body:'Each write-off needs manager approval in Stock Adjustments.'})}]}
      empty={{icon:'ShieldCheck',title:'Nothing in this window',desc:'No batch falls in the selected expiry range for this branch.'}}/>
    <ExpiryAction state={act} onClose={()=>setAct(null)}/>
  </div>;
}
function ExpiryAction({state,onClose}){
  const {db,dispatch,toast,user}=useApp();
  const [qty,setQty]=useState(0);
  const [note,setNote]=useState('');
  useEffect(()=>{ if(state) {setQty(state.b.qty); setNote('')} },[state]);
  if(!state) return null;
  const {b,mode}=state;
  const sup=db.suppliers.find(s=>s.id===b.supplierId);
  const go=()=>{
    const adj={id:uid('ADJ'),no:`ADJ-2026-${String(400+db.adjustments.length).padStart(4,'0')}`,
      branchId:b.branchId,date:TODAY,medId:b.medId,brand:b.med.brand,batchId:b.id,batchNo:b.batchNo,
      qty:-Math.abs(Number(qty)),reason:mode==='return'?'Expired':'Expired',
      note:note||(mode==='return'?`Returned to ${sup?sup.name:'supplier'} — expired batch`:'Written off — expired batch'),
      by:user.empId||user.id,status:'Approved',approvedBy:user.empId||user.id,
      value:round2(Number(qty)*b.purchasePrice)};
    dispatch({type:'stock.adjust',adj});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,
      action:mode==='return'?'Returned to supplier':'Stock written off',entity:'Batch',
      detail:`${b.med.brand} ${b.batchNo} · ${qty} pcs · ${money(Number(qty)*b.purchasePrice)}`,branchId:b.branchId}});
    toast({tone:'ok',title:mode==='return'?'Return claim raised':'Stock written off',
      body:`${b.med.brand} ${b.batchNo} · ${qty} pcs removed from ${db.branches.find(x=>x.id===b.branchId).name}.`});
    onClose();
  };
  return <Modal open onClose={onClose} icon={mode==='return'?'Undo2':'Trash2'} tone={mode==='return'?'primary':'danger'}
    title={mode==='return'?'Return to supplier':'Write off batch'}
    sub={`${b.med.brand} ${b.med.strength} · ${b.batchNo} · expires ${fDate(b.expiry)}`}
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant={mode==='return'?'primary':'danger'} icon="Check" onClick={go}>
        {mode==='return'?'Raise claim':'Write off'}</Btn></Fragment>}>
    <div className="grid gap-3">
      {mode==='return'&&sup&&<div className="panel p-3">
        <div className="t-lbl mb-1">Supplier</div>
        <div className="text-[13px] font-semibold">{sup.name}</div>
        <div className="t-micro">{sup.contact} · {fPhone(sup.phone)}</div>
      </div>}
      <Field label={t('Quantity')} hint={`${num_(b.qty)} pieces in this batch`}>
        <Input className="ta-right" value={qty} onChange={e=>setQty(clamp(parseInt(e.target.value.replace(/\D/g,''))||0,0,b.qty))}/></Field>
      <Field label={t('Note')}><Textarea value={note} onChange={e=>setNote(e.target.value)}
        placeholder={mode==='return'?'Claim reference, collection date…':'Reason for write-off'}/></Field>
      <div className="panel p-3 flex items-center justify-between">
        <span className="t-meta">Cost value removed</span>
        <span className="num font-semibold" style={{color:'var(--danger)'}}>{money(Number(qty)*b.purchasePrice)}</span>
      </div>
    </div>
  </Modal>;
}

/* ---- stock adjustments ---- */
function Adjustments(){
  const {db,dispatch,branchIds,toast,user,crumbs}=useApp();
  const [form,setForm]=useState(null);
  const rows=db.adjustments.filter(a=>branchIds.includes(a.branchId));
  const cols=[
    {k:'no',h:'Ref',sort:a=>a.no,cell:a=><span className="mono">{a.no}</span>},
    {k:'date',h:t('Date'),sort:a=>a.date,cell:a=><span className="num">{d_(a.date)}</span>},
    {k:'brand',h:t('Medicines'),sort:a=>a.brand,cell:a=><div><div className="font-semibold">{a.brand}</div>
      <div className="t-micro mono">{a.batchNo}</div></div>},
    {k:'branch',h:t('Branch'),cell:a=><span className="t-meta">{db.branches.find(b=>b.id===a.branchId).name}</span>},
    {k:'qty',h:t('Qty'),cls:'r',sort:a=>a.qty,cell:a=><span className="num font-semibold"
      style={{color:a.qty<0?'var(--danger)':'var(--success)'}}>{a.qty>0?'+':''}{num_(a.qty)}</span>},
    {k:'reason',h:t('Reason'),sort:a=>a.reason,cell:a=><div><Badge tone={a.reason==='Correction'?'info':'warn'}>{a.reason}</Badge>
      <div className="t-micro mt-0.5 clip" style={{maxWidth:220}}>{a.note}</div></div>},
    {k:'value',h:'Value',cls:'r',sort:a=>a.value,cell:a=><span className="num">{money(a.value,{bn:LANG==='bn'})}</span>},
    {k:'by',h:'By',cell:a=><span className="t-meta">{(db.employees.find(e=>e.id===a.by)||{}).name||a.by}</span>},
    {k:'status',h:t('Status'),sort:a=>a.status,cell:a=><StatusBadge v={a.status}/>},
    {k:'act',h:'',cls:'r',cell:a=>a.status==='Pending'&&can(user.role,'stock.adjust')?<div className="row-act">
      <Btn size="xs" variant="soft" icon="Check" onClick={()=>{
        dispatch({type:'patch',coll:'adjustments',id:a.id,data:{status:'Approved',approvedBy:user.empId||user.id}});
        dispatch({type:'stock.adjust',adj:{...a,id:uid('ADJX'),qty:0}});
        toast({tone:'ok',title:'Adjustment approved',body:`${a.brand} · ${a.qty} pcs · ${a.reason}`});
      }}>{t('Approve')}</Btn></div>:null},
  ];
  return <div className="grid gap-4">
    <PageHeader title={t('Stock Adjustments')} icon="SlidersHorizontal" crumbs={crumbs}
      sub={`${num_(rows.filter(a=>a.status==='Pending').length)} awaiting approval · every change is logged`}
      actions={<Btn variant="primary" icon="Plus" onClick={()=>setForm({})}>New adjustment</Btn>}/>
    <div className="grid-kpi">
      <KPI label="Adjustments" value={rows.length} icon="SlidersHorizontal" sub="Last 60 days"/>
      <KPI label={t('Pending')} value={rows.filter(a=>a.status==='Pending').length} icon="Clock" tone="warning"/>
      <KPI label="Damage & loss value" value={Math.abs(sum(rows.filter(a=>a.qty<0),a=>a.value))}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="TrendingDown" tone="danger"/>
      <KPI label="Corrections" value={rows.filter(a=>a.reason==='Correction').length} icon="Wrench" tone="info"/>
    </div>
    <DataTable rows={rows} cols={cols} pageSize={12} initialSort={{k:'date',dir:'desc'}}
      search={(a,q)=>a.brand.toLowerCase().includes(q)||a.no.toLowerCase().includes(q)||a.reason.toLowerCase().includes(q)}
      searchPlaceholder="Reference, medicine or reason…"
      empty={{icon:'SlidersHorizontal',title:'No adjustments yet'}}/>
    <AdjustForm open={!!form} onClose={()=>setForm(null)}/>
  </div>;
}
function AdjustForm({open,onClose}){
  const {db,dispatch,toast,user,branchIds}=useApp();
  const [medId,setMedId]=useState(''); const [batchId,setBatchId]=useState('');
  const [qty,setQty]=useState(''); const [reason,setReason]=useState('Damage'); const [note,setNote]=useState('');
  const [err,setErr]=useState('');
  useEffect(()=>{ if(open){setMedId('');setBatchId('');setQty('');setReason('Damage');setNote('');setErr('')} },[open]);
  const batches=medId? db.batches.filter(b=>b.medId===medId&&branchIds.includes(b.branchId)) : [];
  const med=db.medicines.find(m=>m.id===medId);
  const batch=db.batches.find(b=>b.id===batchId);
  const save=()=>{
    if(!medId||!batchId){ setErr('Choose the medicine and the batch being adjusted.'); return }
    const n=Number(qty);
    if(!n){ setErr('Enter a quantity — negative to remove stock, positive to add.'); return }
    if(n<0&&Math.abs(n)>batch.qty){ setErr(`Only ${batch.qty} pieces are in this batch.`); return }
    const adj={id:uid('ADJ'),no:`ADJ-2026-${String(400+db.adjustments.length).padStart(4,'0')}`,
      branchId:batch.branchId,date:TODAY,medId,brand:med.brand,batchId,batchNo:batch.batchNo,qty:n,reason,note,
      by:user.empId||user.id,status:can(user.role,'stock.adjust')&&user.role!=='Pharmacist/Cashier'?'Approved':'Pending',
      approvedBy:user.role==='Owner'||user.role==='Branch Manager'?user.empId||user.id:null,
      value:round2(Math.abs(n)*batch.purchasePrice)};
    dispatch({type:'stock.adjust',adj});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Stock adjustment',
      entity:'Batch',detail:`${med.brand} ${batch.batchNo} · ${n>0?'+':''}${n} pcs · ${reason}`,branchId:batch.branchId}});
    toast({tone:'ok',title:'Adjustment recorded',body:`${med.brand} ${n>0?'+':''}${n} pcs · ${reason}`});
    onClose();
  };
  return <Drawer open={open} onClose={onClose} icon="SlidersHorizontal" title="New stock adjustment"
    sub="Damage, expiry, loss or an opening-stock correction"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={save}>{t('Save')}</Btn></Fragment>}>
    <div className="grid gap-3">
      <Field label={t('Medicines')} req>
        <Select value={medId} onChange={e=>{setMedId(e.target.value);setBatchId('');setErr('')}}>
          <option value="">{t('Select')}…</option>
          {sortBy(db.medicines,m=>m.brand).map(m=><option key={m.id} value={m.id}>{m.brand} {m.strength} — {m.company}</option>)}
        </Select></Field>
      <Field label={t('Batch')} req>
        <Select value={batchId} onChange={e=>{setBatchId(e.target.value);setErr('')}} disabled={!medId}>
          <option value="">{medId?t('Select')+'…':'Pick a medicine first'}</option>
          {batches.map(b=><option key={b.id} value={b.id}>
            {b.batchNo} · {db.branches.find(x=>x.id===b.branchId).name} · {b.qty} pcs · exp {fDate(b.expiry)}</option>)}
        </Select></Field>
      <Field label={`${t('Quantity')} (pieces)`} req hint="Negative removes stock, positive adds it">
        <Input className="ta-right" value={qty} onChange={e=>{setQty(e.target.value.replace(/[^\d-]/g,''));setErr('')}}
          placeholder="-20"/></Field>
      <Field label={t('Reason')}>
        <Select value={reason} onChange={e=>setReason(e.target.value)}>
          {['Damage','Expired','Lost','Correction'].map(r=><option key={r}>{r}</option>)}</Select></Field>
      <Field label={t('Note')} req><Textarea value={note} onChange={e=>setNote(e.target.value)}
        placeholder="What happened, and who found it"/></Field>
      {batch&&qty&&<div className="panel p-3 grid gap-1.5">
        <Row label="Current batch stock" value={num_(batch.qty)+' pcs'}/>
        <Row label="After adjustment" value={num_(batch.qty+Number(qty))+' pcs'} strong/>
        <Row label="Cost impact" value={money(Math.abs(Number(qty))*batch.purchasePrice)}
          tone={Number(qty)<0?'danger':'success'}/>
      </div>}
      {err&&<div className="err">{err}</div>}
      {user.role==='Pharmacist/Cashier'&&<div className="panel p-3 t-micro flex items-start gap-2">
        <Icon name="Info" size={13} style={{color:'var(--info)',flex:'none',marginTop:1}}/>
        Adjustments raised by counter staff go to the branch manager for approval before stock moves.</div>}
    </div>
  </Drawer>;
}
</script>

<script type="text/babel" data-presets="react">
/* ---- stock transfer ---- */
const TR_STEPS=['Requested','Approved','In Transit','Received'];
function Transfers(){
  const {db,dispatch,branchIds,toast,user,crumbs}=useApp();
  const [open,setOpen]=useState(null);
  const [form,setForm]=useState(false);
  const rows=db.transfers.filter(tr=>branchIds.includes(tr.fromBranch)||branchIds.includes(tr.toBranch));
  const bn=id=>db.branches.find(b=>b.id===id).name;
  const cols=[
    {k:'no',h:'Ref',sort:tr=>tr.no,cell:tr=><span className="mono">{tr.no}</span>},
    {k:'date',h:t('Date'),sort:tr=>tr.date,cell:tr=><span className="num">{d_(tr.date)}</span>},
    {k:'route',h:'Route',cell:tr=><div className="flex items-center gap-1.5 text-[12.5px]">
      <Badge tone="neutral">{bn(tr.fromBranch)}</Badge><Icon name="ArrowRight" size={12}/>
      <Badge tone="brand">{bn(tr.toBranch)}</Badge></div>},
    {k:'items',h:t('Items'),cls:'r',sort:tr=>tr.items.length,cell:tr=><div className="text-right">
      <div className="num">{num_(tr.items.length)}</div>
      <div className="t-micro">{num_(sum(tr.items,i=>i.qty))} pcs</div></div>},
    {k:'total',h:'Value',cls:'r',sort:tr=>tr.total,cell:tr=><span className="num">{money(tr.total,{bn:LANG==='bn'})}</span>},
    {k:'status',h:t('Status'),sort:tr=>tr.status,cell:tr=><StatusBadge v={tr.status}/>},
    {k:'act',h:'',cls:'r',cell:tr=><div className="row-act"><Btn size="xs" variant="ghost" icon="Eye"
      onClick={e=>{e.stopPropagation();setOpen(tr.id)}}/></div>},
  ];
  return <div className="grid gap-4">
    <PageHeader title={t('Stock Transfer')} icon="ArrowLeftRight" crumbs={crumbs}
      sub="Request, approve, dispatch and receive — partial receive supported"
      actions={<Btn variant="primary" icon="Plus" onClick={()=>setForm(true)}>New transfer</Btn>}/>
    <div className="grid-kpi">
      {TR_STEPS.map((s,i)=><KPI key={s} label={s} value={rows.filter(r=>r.status===s||(s==='Received'&&r.status==='Partially Received')).length}
        icon={['Send','CheckCheck','Truck','PackageCheck'][i]} tone={['info','brand','warning','success'][i]}
        sub={s==='Received'?'includes partial':undefined}/>)}
    </div>
    <DataTable rows={rows} cols={cols} pageSize={10} initialSort={{k:'date',dir:'desc'}}
      search={(tr,q)=>tr.no.toLowerCase().includes(q)||bn(tr.fromBranch).toLowerCase().includes(q)||bn(tr.toBranch).toLowerCase().includes(q)}
      searchPlaceholder="Reference or branch…" onRowClick={tr=>setOpen(tr.id)}
      empty={{icon:'ArrowLeftRight',title:'No transfers yet'}}/>
    <TransferDetail id={open} onClose={()=>setOpen(null)}/>
    <TransferForm open={form} onClose={()=>setForm(false)}/>
  </div>;
}
function TransferDetail({id,onClose}){
  const {db,dispatch,toast,user}=useApp();
  const tr=db.transfers.find(x=>x.id===id);
  const [lines,setLines]=useState([]);
  useEffect(()=>{ if(tr) setLines(tr.items.map(i=>({...i,received:i.received||i.qty}))) },[id]);
  if(!tr) return null;
  const bn=bid=>db.branches.find(b=>b.id===bid).name;
  const stepIdx=tr.status==='Partially Received'?3:TR_STEPS.indexOf(tr.status);
  const canAct=can(user.role,'transfer');
  const advance=(to)=>{
    dispatch({type:'patch',coll:'transfers',id:tr.id,data:{status:to,
      ...(to==='Approved'?{approvedBy:user.empId||user.id}:{}),
      ...(to==='In Transit'?{dispatchedOn:TODAY}:{})}});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Transfer '+to.toLowerCase(),
      entity:'Transfer',detail:`${tr.no} ${bn(tr.fromBranch)} → ${bn(tr.toBranch)}`,branchId:tr.fromBranch}});
    toast({tone:'ok',title:`Transfer ${to.toLowerCase()}`,body:tr.no});
  };
  const receive=()=>{
    dispatch({type:'transfer.receive',id:tr.id,lines});
    const full=lines.every(l=>l.received>=l.qty);
    toast({tone:'ok',title:full?'Transfer received in full':'Partial receive recorded',
      body:`${sum(lines,l=>l.received)} pieces added to ${bn(tr.toBranch)} stock.`});
    onClose();
  };
  return <Drawer open wide onClose={onClose} icon="ArrowLeftRight" title={tr.no}
    sub={`${bn(tr.fromBranch)} → ${bn(tr.toBranch)} · raised ${fDate(tr.date)}`}
    footer={canAct?<Fragment>
      <Btn onClick={onClose}>{t('Close')}</Btn>
      {tr.status==='Requested'&&<Btn variant="primary" icon="Check" onClick={()=>advance('Approved')}>{t('Approve')}</Btn>}
      {tr.status==='Approved'&&<Btn variant="primary" icon="Truck" onClick={()=>advance('In Transit')}>Dispatch</Btn>}
      {tr.status==='In Transit'&&<Btn variant="primary" icon="PackageCheck" onClick={receive}>Receive</Btn>}
      {['Received','Partially Received'].includes(tr.status)&&
        <Btn icon="Printer" onClick={()=>printIt(toast)}>{t('Print')}</Btn>}
    </Fragment>:<Btn onClick={onClose}>{t('Close')}</Btn>}>
    <div className="grid gap-4">
      <Card><div className="p-4"><Stepper steps={TR_STEPS} current={stepIdx}/></div></Card>
      <div className="grid gap-2 sm:grid-cols-3">
        <div className="panel p-3"><div className="t-lbl">Requested by</div>
          <div className="text-[13px] font-semibold mt-1">{(db.employees.find(e=>e.id===tr.requestedBy)||{}).name||'—'}</div>
          <div className="t-micro">{d_(tr.date)}</div></div>
        <div className="panel p-3"><div className="t-lbl">Approved by</div>
          <div className="text-[13px] font-semibold mt-1">{(db.employees.find(e=>e.id===tr.approvedBy)||{}).name||'Pending'}</div>
          <div className="t-micro">{tr.dispatchedOn?`Dispatched ${d_(tr.dispatchedOn)}`:'Not dispatched'}</div></div>
        <div className="panel p-3"><div className="t-lbl">Transfer value</div>
          <div className="t-kpi num mt-1" style={{fontSize:19}}>{money(tr.total,{bn:LANG==='bn'})}</div>
          <div className="t-micro">at purchase cost</div></div>
      </div>
      <Card>
        <CardH title={`${t('Items')} (${tr.items.length})`} icon="Package"
          sub={tr.status==='In Transit'?'Edit received quantities for a partial receive':undefined}/>
        <div className="tw"><table className="dt">
          <thead><tr><th>{t('Medicines')}</th><th>{t('Batch')}</th><th>{t('Expiry')}</th>
            <th className="r">Sent</th><th className="r">Received</th><th className="r">Value</th></tr></thead>
          <tbody>{(tr.status==='In Transit'?lines:tr.items).map((i,n)=><tr key={n}>
            <td><span className="font-semibold">{i.brand}</span> <span className="t-meta">{i.strength}</span></td>
            <td className="mono">{i.batchNo}</td><td className="num">{d_(i.expiry)}</td>
            <td className="r num">{num_(i.qty)}</td>
            <td className="r">{tr.status==='In Transit'
              ? <Input sm className="ta-right" style={{width:78,marginLeft:'auto'}} value={i.received}
                  onChange={e=>setLines(ls=>ls.map((x,j)=>j===n?{...x,received:clamp(parseInt(e.target.value.replace(/\D/g,''))||0,0,x.qty)}:x))}/>
              : <span className="num">{num_(i.received||0)}
                  {i.received<i.qty&&<Badge tone="warn" sq className="ml-1.5">short {num_(i.qty-i.received)}</Badge>}</span>}</td>
            <td className="r num">{money(i.value,{bn:LANG==='bn'})}</td></tr>)}
          </tbody></table></div>
      </Card>
      {tr.note&&<div className="panel p-3 t-meta"><b>{t('Note')}:</b> {tr.note}</div>}
    </div>

}
function TransferForm({open,onClose}){
  const {db,dispatch,toast,user,branchIds}=useApp();
  const [from,setFrom]=useState('BR1'); const [to,setTo]=useState('BR2');
  const [picked,setPicked]=useState([]); const [q,setQ]=useState(''); const [err,setErr]=useState('');
  useEffect(()=>{ if(open){setPicked([]);setQ('');setErr('')} },[open]);
  const below=useMemo(()=>SEL.lowStockList(db,[to]).map(x=>x.med.id),[db,to]);
  const options=useMemo(()=>{
    const qq=q.trim().toLowerCase();
    return db.medicines.filter(m=>!qq||m.brand.toLowerCase().includes(qq)||m.generic.toLowerCase().includes(qq))
      .map(m=>({m,stock:SEL.stockOf(db,m.id,[from]),suggest:below.includes(m.id)}))
      .filter(x=>x.stock>0).sort((a,b)=>(b.suggest-a.suggest)||(b.stock-a.stock)).slice(0,qq?20:12);
  },[q,db,from,below]);
  const add=m=>{
    const b=SEL.fefo(db,m.id,from)[0];
    if(!b) return;
    setPicked(p=>p.some(x=>x.medId===m.id)?p:[...p,{medId:m.id,brand:m.brand,strength:m.strength,
      batchId:b.id,batchNo:b.batchNo,expiry:b.expiry,qty:m.perStrip*5,max:b.qty,price:b.purchasePrice}]);
  };
  const save=()=>{
    if(from===to){ setErr('Source and destination branches must differ.'); return }
    if(!picked.length){ setErr('Add at least one medicine.'); return }
    const items=picked.map(p=>({medId:p.medId,brand:p.brand,strength:p.strength,batchId:p.batchId,
      batchNo:p.batchNo,expiry:p.expiry,qty:Number(p.qty),received:0,value:round2(p.price*Number(p.qty))}));
    const tr={id:uid('TR'),no:`TRF-2026-${String(210+db.transfers.length).padStart(4,'0')}`,
      fromBranch:from,toBranch:to,date:TODAY,status:'Requested',items,total:round2(sum(items,i=>i.value)),
      requestedBy:user.empId||user.id,approvedBy:null,dispatchedOn:null,receivedOn:null,note:''};
    dispatch({type:'upsert',coll:'transfers',item:tr});
    toast({tone:'ok',title:'Transfer requested',body:`${tr.no} · ${items.length} items awaiting approval.`});
    onClose();
  };
  return <Drawer open={open} wide onClose={onClose} icon="ArrowLeftRight" title="New stock transfer"
    sub="Items below minimum at the destination branch are suggested first"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Send" onClick={save}>Raise request</Btn></Fragment>}>
    <div className="grid gap-3">
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label="From branch"><Select value={from} onChange={e=>{setFrom(e.target.value);setPicked([])}}>
          {db.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select></Field>
        <Field label="To branch"><Select value={to} onChange={e=>setTo(e.target.value)}>
          {db.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select></Field>
      </div>
      <Searchbox value={q} onChange={setQ} placeholder="Search medicine to add…"/>
      <div className="grid gap-1.5" style={{maxHeight:220,overflowY:'auto'}}>
        {options.map(o=><button key={o.m.id} onClick={()=>add(o.m)}
          className="text-left p-2 rounded-lg flex items-center gap-2.5 hover:bg-[var(--surface-hover)]"
          style={{border:'1px solid var(--border)'}}>
          <span className="min-w-0 flex-1"><span className="block text-[12.5px] font-semibold clip">{o.m.brand} {o.m.strength}</span>
            <span className="block t-micro">{o.m.company} · {num_(o.stock)} pcs available</span></span>
          {o.suggest&&<Badge tone="warn" sq icon="TrendingDown">Below min there</Badge>}
          <Icon name="Plus" size={14} style={{color:'var(--primary)'}}/>
        </button>)}
      </div>
      {picked.length>0&&<Card>
        <CardH title={`Transfer list (${picked.length})`} icon="Package"/>
        <div className="tw"><table className="dt compact">
          <thead><tr><th>{t('Medicines')}</th><th>{t('Batch')}</th><th className="r">{t('Qty')}</th><th className="r">Value</th><th/></tr></thead>
          <tbody>{picked.map((p,i)=><tr key={p.medId}>
            <td className="font-semibold">{p.brand}</td><td className="mono t-meta">{p.batchNo}</td>
            <td className="r"><Input sm className="ta-right" style={{width:76,marginLeft:'auto'}} value={p.qty}
              onChange={e=>setPicked(ls=>ls.map((x,j)=>j===i?{...x,qty:clamp(parseInt(e.target.value.replace(/\D/g,''))||0,0,x.max)}:x))}/></td>
            <td className="r num">{money(p.price*p.qty)}</td>
            <td className="r"><Btn size="xs" variant="ghost" icon="X" onClick={()=>setPicked(ls=>ls.filter(x=>x.medId!==p.medId))}/></td>
          </tr>)}</tbody></table></div>
      </Card>}
      {err&&<div className="err">{err}</div>}
    </div>
  </Drawer>;
}

/* ---- fridge temperature log ---- */
function FridgeLog(){
  const {db,dispatch,branchIds,toast,user,crumbs}=useApp();
  const c=useThemeColors();
  const [add,setAdd]=useState(false);
  const [temp,setTemp]=useState('4.0'); const [slot,setSlot]=useState('Morning');
  const [br,setBr]=useState(branchIds[0]);
  const rows=db.fridgeLogs.filter(f=>branchIds.includes(f.branchId));
  const chart=useMemo(()=>{
    const days=uniq(rows.map(r=>r.date)).sort().slice(-21);
    return days.map(d=>{
      const m=rows.find(r=>r.date===d&&r.slot==='Morning');
      const e=rows.find(r=>r.date===d&&r.slot==='Evening');
      return {x:fDateS(d),morning:m?m.tempC:null,evening:e?e.tempC:null};
    });
  },[rows]);
  const breaches=rows.filter(r=>!r.ok);
  const fridgeItems=db.medicines.filter(m=>m.fridge);
  const save=()=>{
    const v=Number(temp);
    const row={id:uid('FL'),branchId:br,date:TODAY,slot,tempC:v,by:user.empId||user.id,
      ok:v>=2&&v<=8,action:v>=2&&v<=8?'':'Out of range — escalate to branch manager'};
    dispatch({type:'upsert',coll:'fridgeLogs',item:row});
    toast({tone:row.ok?'ok':'warn',title:row.ok?'Temperature logged':'Out-of-range temperature logged',
      body:`${v}°C · ${slot} · ${db.branches.find(b=>b.id===br).name}${row.ok?'':' — safe range is 2–8°C'}`});
    setAdd(false);
  };
  return <div className="grid gap-4">
    <PageHeader title={t('Fridge Log')} icon="Thermometer" crumbs={crumbs}
      sub={`Cold-chain register for ${fridgeItems.length} items · safe range 2–8°C · morning and evening readings`}
      actions={<Btn variant="primary" icon="Plus" onClick={()=>setAdd(true)}>Log reading</Btn>}/>
    <div className="grid-kpi">
      <KPI label="Readings logged" value={rows.length} icon="Thermometer" sub="Last 30 days"/>
      <KPI label="Out of range" value={breaches.length} icon="TriangleAlert" tone="danger"
        sub={breaches.length?'Investigated and documented':'All within 2–8°C'}/>
      <KPI label="Cold-chain items" value={fridgeItems.length} icon="Snowflake" tone="info"
        sub={fridgeItems.map(m=>m.brand).join(', ')}/>
      <KPI label="Cold stock value" value={sum(db.batches.filter(b=>branchIds.includes(b.branchId)&&
        fridgeItems.some(m=>m.id===b.medId)),b=>b.qty*b.purchasePrice)} fmt={v=>money(v,{bn:LANG==='bn'})}
        icon="Boxes" tone="purple"/>
    </div>
    <Card>
      <CardH title="Temperature trend" sub="Last 21 days · morning and evening" icon="ChartNoAxesCombined"/>
      <div className="p-3"><ChartBox h={240}>
        <RC.LineChart data={chart} margin={{top:6,right:8,left:-20,bottom:0}}>
          <RC.CartesianGrid stroke={c.grid} vertical={false}/>
          <RC.XAxis dataKey="x" tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false} interval={2}/>
          <RC.YAxis domain={[0,12]} tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false}
            tickFormatter={v=>v+'°'}/>
          <RC.ReferenceArea y1={2} y2={8} fill={c.success} fillOpacity={0.08}/>
          <RC.ReferenceLine y={8} stroke={c.danger} strokeDasharray="4 3"/>
          <RC.ReferenceLine y={2} stroke={c.info} strokeDasharray="4 3"/>
          <RC.Tooltip content={<ChartTip c={c} fmt={v=>v+'°C'}/>}/>
          <RC.Line type="monotone" dataKey="morning" name="Morning" stroke={c.primary} strokeWidth={1.9} dot={{r:2}}/>
          <RC.Line type="monotone" dataKey="evening" name="Evening" stroke={c.warning} strokeWidth={1.9} dot={{r:2}}/>
        </RC.LineChart></ChartBox></div>
    </Card>
    <DataTable rows={sortBy(rows,r=>r.date+r.slot,'desc')} pageSize={12}
      cols={[
        {k:'date',h:t('Date'),sort:r=>r.date,cell:r=><span className="num">{d_(r.date)}</span>},
        {k:'slot',h:'Reading',cell:r=><Badge tone={r.slot==='Morning'?'info':'purple'} icon={r.slot==='Morning'?'Sunrise':'Sunset'}>{r.slot}</Badge>},
        {k:'branch',h:t('Branch'),cell:r=><span className="t-meta">{db.branches.find(b=>b.id===r.branchId).name}</span>},
        {k:'temp',h:'Temperature',cls:'r',sort:r=>r.tempC,cell:r=><span className="num font-semibold"
          style={{color:r.ok?'var(--success)':'var(--danger)'}}>{LANG==='bn'?toBn(r.tempC.toFixed(1)):r.tempC.toFixed(1)}°C</span>},
        {k:'ok',h:t('Status'),cell:r=><Badge tone={r.ok?'ok':'bad'} icon={r.ok?'Check':'TriangleAlert'}>
          {r.ok?'Within range':'Out of range'}</Badge>},
        {k:'by',h:'Logged by',cell:r=><span className="t-meta">{(db.employees.find(e=>e.id===r.by)||{}).name||'—'}</span>},
        {k:'action',h:'Action taken',cell:r=><span className="t-micro clip" style={{maxWidth:260}}>{r.action||'—'}</span>},
      ]}
      rowCls={r=>!r.ok?'':''} empty={{icon:'Thermometer',title:'No readings yet'}}/>
    <Modal open={add} onClose={()=>setAdd(false)} icon="Thermometer" title="Log fridge temperature"
      sub="Recorded twice daily for DGDA cold-chain compliance"
      footer={<Fragment><Btn onClick={()=>setAdd(false)}>{t('Cancel')}</Btn>
        <Btn variant="primary" icon="Check" onClick={save}>{t('Save')}</Btn></Fragment>}>
      <div className="grid gap-3">
        <Field label={t('Branch')}><Select value={br} onChange={e=>setBr(e.target.value)}>
          {db.branches.filter(b=>branchIds.includes(b.id)).map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select></Field>
        <Field label="Reading"><Seg options={[{v:'Morning',l:'Morning'},{v:'Evening',l:'Evening'}]} value={slot} onChange={setSlot}/></Field>
        <Field label="Temperature (°C)" hint="Safe range 2–8°C">
          <Input className="ta-right" value={temp} onChange={e=>setTemp(e.target.value.replace(/[^\d.]/g,''))}
            inputMode="decimal" style={{fontSize:18,height:44,fontWeight:600}}/></Field>
        <div className="flex gap-1.5 flex-wrap">{['2.5','4.0','5.5','7.0','9.5'].map(v=>
          <button key={v} className="chip" onClick={()=>setTemp(v)}>{v}°C</button>)}</div>
        {(Number(temp)<2||Number(temp)>8)&&<div className="p-3 rounded-[10px] flex items-start gap-2"
          style={{background:'var(--danger-soft)',border:'1px solid var(--danger-line)'}}>
          <Icon name="TriangleAlert" size={14} style={{color:'var(--danger)',flex:'none',marginTop:1}}/>
          <span className="text-[12.5px]" style={{color:'var(--danger)'}}>
            Out of range. Move insulin and other cold-chain stock to the backup fridge and raise a
            maintenance call — this reading is flagged to the branch manager.</span></div>}
      </div>
    </Modal>
  </div>;
}

function BarcodeLabels(){

  return <div className="grid gap-4">
    <PageHeader title={t('Barcode Labels')} icon="Barcode" crumbs={crumbs}

        <div className="p-4">
          <div className="flex items-center gap-2 mb-3">
            <span className="t-lbl">Copies</span>
            <Input sm className="ta-right" style={{width:70}} value={copies}
              onChange={e=>setCopies(clamp(parseInt(e.target.value.replace(/\D/g,''))||1,1,50))}/>
            <Btn size="sm" variant="ghost" icon="Trash2" onClick={()=>setSel([])} disabled={!sel.length}>{t('Clear')}</Btn>
          </div>
          {chosen.length===0
            ? <Empty icon="Barcode" title="No labels selected" desc="Tick medicines on the left to build a print run."/>
            : <div className="grid gap-2 print-sheet" style={{gridTemplateColumns:'repeat(auto-fill,minmax(168px,1fr))'}}>
                {chosen.flatMap(m=>Array.from({length:copies},(_,k)=>
                  <div key={m.id+k} style={{background:'#fff',color:'#000',border:'1px solid #000',
                    borderRadius:3,padding:'6px 7px',fontFamily:'var(--font-en)'}}>
                    <div style={{fontSize:11,fontWeight:800,lineHeight:1.2}}>{m.brand} {m.strength}</div>
                    <div style={{fontSize:8,marginTop:1}}>{m.generic.slice(0,26)} · {m.company}</div>
                    <div style={{display:'flex',gap:1,height:22,alignItems:'flex-end',margin:'4px 0 2px'}}>
                      {bars(m.barcode).map((w,i)=><span key={i} style={{width:w,height:'100%',
                        background:i%2?'#fff':'#000',display:'block'}}/>)}
                    </div>
                    <div style={{fontSize:7.5,letterSpacing:'.08em',fontFamily:'var(--mono)'}}>{m.barcode}</div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:2}}>
                      <span style={{fontSize:7.5}}>Rack {m.rack}</span>
                      <span style={{fontSize:12,fontWeight:800}}>৳{money(m.mrp,{sym:false,dec:2})}</span>
                    </div>
                  </div>))}
              </div>}
        </div>
      </Card>
    </div>
  </div>;
}

function POForm({open,onClose}){
  const {db,dispatch,toast,user,branchIds}=useApp();
  const [br,setBr]=useState(branchIds[0]);
  const [sup,setSup]=useState('SP1');
  const [picked,setPicked]=useState([]);
  const suggest=useMemo(()=>{
    const s=db.suppliers.find(x=>x.id===sup);
    return SEL.lowStockList(db,[br]).filter(x=>s.company==='Mixed'||x.med.company===s.company)
      .map(x=>({med:x.med,st:x.st,boxes:Math.max(1,Math.ceil((x.med.minStock*1.5-x.st.qty)/(x.med.perStrip*x.med.stripsPerBox)))}));
  },[db,br,sup]);
  useEffect(()=>{ if(open) setPicked(suggest.slice(0,8).map(s=>({medId:s.med.id,boxes:s.boxes}))) },[open,sup,br]);
  const lines=picked.map(p=>{
    const m=db.medicines.find(x=>x.id===p.medId);
    const pieces=Number(p.boxes)*m.perStrip*m.stripsPerBox;
    return {medId:m.id,brand:m.brand,strength:m.strength,unit:'Box',qty:Number(p.boxes),pieces,bonusQty:0,
      batchNo:'—',expiry:addDays(TODAY,600),rate:round2(m.purchasePrice*m.perStrip*m.stripsPerBox),
      amount:round2(m.purchasePrice*pieces)};
  });
  const sub=round2(sum(lines,l=>l.amount));
  const save=()=>{
    if(!lines.length){ toast({tone:'warn',title:'Add at least one item'}); return }
    const s=db.suppliers.find(x=>x.id===sup);
    const po={id:uid('PO'),no:`PO-${db.branches.find(b=>b.id===br).code}-2026-${String(200+db.purchaseOrders.length).padStart(4,'0')}`,
      branchId:br,supplierId:sup,date:TODAY,expected:addDays(TODAY,3),status:'Pending',items:lines,
      sub,tradeDisc:0,total:Math.round(sub),createdBy:user.empId||user.id,note:''};
    dispatch({type:'upsert',coll:'purchaseOrders',item:po});
    toast({tone:'ok',title:'Purchase order created',body:`${po.no} · ${s.name} · ${money(po.total)}`});
    onClose();
  };
  return <Drawer open={open} wide onClose={onClose} icon="ClipboardList" title="New purchase order"
    sub="Everything below minimum stock for this branch is pre-filled"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={save}>Create order · {money(sub)}</Btn></Fragment>}>
    <div className="grid gap-3">
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label={t('Branch')}><Select value={br} onChange={e=>setBr(e.target.value)}>
          {db.branches.filter(b=>branchIds.includes(b.id)).map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select></Field>
        <Field label={t('Suppliers')}><Select value={sup} onChange={e=>setSup(e.target.value)}>
          {db.suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</Select></Field>
      </div>
      {suggest.length===0&&<div className="panel p-3 t-meta">Nothing from this supplier is below minimum at {db.branches.find(b=>b.id===br).name}.</div>}
      <div className="grid gap-1.5">
        {suggest.map(s=>{
          const on=picked.find(p=>p.medId===s.med.id);
          return <div key={s.med.id} className="flex items-center gap-2.5 p-2 rounded-lg"
            style={{border:'1px solid '+(on?'var(--primary)':'var(--border)'),background:on?'var(--primary-soft)':'transparent'}}>
            <Check checked={!!on} onChange={v=>setPicked(p=>v?[...p,{medId:s.med.id,boxes:s.boxes}]:p.filter(x=>x.medId!==s.med.id))}/>
            <span className="min-w-0 flex-1">
              <span className="block text-[12.5px] font-semibold clip">{s.med.brand} {s.med.strength}</span>
              <span className="block t-micro">{num_(s.st.qty)} in stock · min {num_(s.med.minStock)} · {s.med.perStrip*s.med.stripsPerBox} pcs/box</span>
            </span>
            <Badge tone={s.st.tone}>{t(s.st.label)}</Badge>
            {on&&<Input sm className="ta-right" style={{width:64}} value={on.boxes}
              onChange={e=>setPicked(p=>p.map(x=>x.medId===s.med.id?{...x,boxes:parseInt(e.target.value.replace(/\D/g,''))||1}:x))}/>}
          </div>;
        })}
      </div>
      {lines.length>0&&<div className="panel p-3 flex items-center justify-between">
        <span className="t-meta">{num_(lines.length)} items · {num_(sum(lines,l=>l.pieces))} pieces</span>
        <span className="t-kpi num" style={{fontSize:19}}>{money(sub,{bn:LANG==='bn'})}</span></div>}
    </div>
  </Drawer>;
}

function GoodsReceiving(){
  const {db,dispatch,branchIds,toast,user,crumbs}=useApp();
  const pending=db.purchaseOrders.filter(p=>branchIds.includes(p.branchId)&&p.status==='Approved');
  const [open,setOpen]=useState(null);
  const [lines,setLines]=useState([]);
  const po=db.purchaseOrders.find(p=>p.id===open);
  useEffect(()=>{ if(po) setLines(po.items.map(i=>({...i,recv:i.qty,batchNo:i.batchNo==='—'?'B'+ri(1000,9999):i.batchNo,
    expiry:i.expiry,bonusQty:i.bonusQty||0,rate:i.rate}))) },[open]);
  const receive=()=>{
    const med=id=>db.medicines.find(m=>m.id===id);
    lines.forEach(l=>{
      const m=med(l.medId);
      const pieces=Number(l.recv)*m.perStrip*m.stripsPerBox+Number(l.bonusQty||0);
      dispatch({type:'upsert',coll:'batches',item:{id:uid('B'),medId:l.medId,branchId:po.branchId,
        batchNo:l.batchNo,expiry:l.expiry,qty:pieces,received:TODAY,
        purchasePrice:round2(Number(l.rate)/(m.perStrip*m.stripsPerBox)),mrp:m.mrp,supplierId:po.supplierId}});
    });
    dispatch({type:'patch',coll:'purchaseOrders',id:po.id,data:{status:'Received'}});
    const total=Math.round(sum(lines,l=>Number(l.recv)*Number(l.rate)));
    const sup=db.suppliers.find(s=>s.id===po.supplierId);
    dispatch({type:'upsert',coll:'purchaseInvoices',item:{id:uid('PI'),
      no:`${sup.company.slice(0,3).toUpperCase()}/INV/2026/${ri(4200,4999)}`,poId:po.id,poNo:po.no,
      branchId:po.branchId,supplierId:po.supplierId,date:TODAY,dueDate:addDays(TODAY,sup.terms),
      items:lines,sub:total,tradeDisc:0,total,paid:0,due:total,status:'Unpaid',receivedBy:user.empId||user.id}});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Goods received',
      entity:'Purchase',detail:`${po.no} · ${lines.length} items · ${money(total)}`,branchId:po.branchId}});
    toast({tone:'ok',title:'Goods received',body:`${lines.length} batches added to stock · invoice raised for ${money(total)}.`});
    setOpen(null);
  };
  return <div className="grid gap-4">
    <PageHeader title={t('Goods Receiving')} icon="PackageCheck" crumbs={crumbs}
      sub="Record batch, expiry, bonus quantity and purchase price as stock arrives"/>
    {pending.length===0
      ? <Card><Empty icon="PackageCheck" title="Nothing awaiting receipt"
          desc="Approved purchase orders appear here when the delivery arrives."/></Card>
      : <div className="grid gap-3">
          {pending.map(p=>{ const s=db.suppliers.find(x=>x.id===p.supplierId);
            return <Card key={p.id} lift>
              <div className="p-4 flex items-center gap-3 flex-wrap">
                <span className="grid place-items-center w-10 h-10 rounded-[11px] shrink-0"
                  style={{background:'var(--primary-soft)',color:'var(--primary)'}}><Icon name="Truck" size={18}/></span>
                <div className="min-w-0 flex-1">
                  <div className="text-[13.5px] font-semibold">{p.no} · {s.name}</div>
                  <div className="t-micro">{db.branches.find(b=>b.id===p.branchId).name} · ordered {d_(p.date)} ·
                    expected {d_(p.expected)} · {num_(p.items.length)} items</div>
                </div>
                <span className="num font-semibold">{money(p.total,{bn:LANG==='bn'})}</span>
                <Btn variant="primary" icon="PackageCheck" onClick={()=>setOpen(p.id)}>{t('Receive')}</Btn>
              </div>
            </Card>;
          })}
        </div>}
    {po&&<Drawer open wide onClose={()=>setOpen(null)} icon="PackageCheck" title={`Receive ${po.no}`}
      sub={`${(db.suppliers.find(s=>s.id===po.supplierId)||{}).name} · enter batch and expiry for each line`}
      footer={<Fragment><Btn onClick={()=>setOpen(null)}>{t('Cancel')}</Btn>
        <Btn variant="primary" icon="Check" onClick={receive}>Receive & raise invoice</Btn></Fragment>}>
      <div className="grid gap-2.5">
        {lines.map((l,i)=><Card key={i}><div className="p-3 grid gap-2.5">
          <div className="flex items-center justify-between gap-2">
            <span className="text-[13px] font-semibold">{l.brand} <span className="t-meta">{l.strength}</span></span>
            <span className="num t-meta">{money(Number(l.recv)*Number(l.rate),{bn:LANG==='bn'})}</span>
          </div>
          <div className="grid gap-2 sm:grid-cols-4">
            <Field label="Boxes"><Input sm className="ta-right" value={l.recv}
              onChange={e=>setLines(ls=>ls.map((x,j)=>j===i?{...x,recv:parseInt(e.target.value.replace(/\D/g,''))||0}:x))}/></Field>
            <Field label="Bonus pcs"><Input sm className="ta-right" value={l.bonusQty}
              onChange={e=>setLines(ls=>ls.map((x,j)=>j===i?{...x,bonusQty:parseInt(e.target.value.replace(/\D/g,''))||0}:x))}/></Field>
            <Field label={t('Batch')}><Input sm className="mono" value={l.batchNo}
              onChange={e=>setLines(ls=>ls.map((x,j)=>j===i?{...x,batchNo:e.target.value.toUpperCase()}:x))}/></Field>
            <Field label={t('Expiry')}><Input sm type="date" value={l.expiry}
              onChange={e=>setLines(ls=>ls.map((x,j)=>j===i?{...x,expiry:e.target.value}:x))}/></Field>
          </div>
        </div></Card>)}
        <div className="panel p-3 flex items-center justify-between">
          <span className="t-meta">Invoice value</span>
          <span className="t-kpi num" style={{fontSize:20}}>{money(sum(lines,l=>Number(l.recv)*Number(l.rate)),{bn:LANG==='bn'})}</span>
        </div>
      </div>
    </Drawer>}
  </div>;
}

function PayForm({state,onClose}){
  const {db,dispatch,toast,user,branchIds}=useApp();
  const [inv,setInv]=useState(''); const [amt,setAmt]=useState(''); const [method,setMethod]=useState('Bank');
  const [ref,setRef]=useState(''); const [err,setErr]=useState('');
  useEffect(()=>{ if(state){ const id=state.invoiceId||''; setInv(id);
    const p=db.purchaseInvoices.find(x=>x.id===id); setAmt(p?String(p.due):''); setRef('');setErr('') } },[state]);
  if(!state) return null;
  const p=db.purchaseInvoices.find(x=>x.id===inv);
  const unpaid=db.purchaseInvoices.filter(x=>x.due>0&&branchIds.includes(x.branchId));
  const save=()=>{
    if(!p){ setErr('Choose an invoice.'); return }
    const n=Number(amt);
    if(!(n>0)){ setErr('Enter an amount.'); return }
    if(n>p.due+0.5){ setErr(`Amount is more than the ${money(p.due)} balance.`); return }
    dispatch({type:'supplier.pay',invoiceId:p.id,supplierId:p.supplierId,branchId:p.branchId,
      amount:round2(n),method,ref:ref||'—',note:`Against ${p.no}`});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Supplier payment',
      entity:'Purchase',detail:`${money(n)} to ${(db.suppliers.find(s=>s.id===p.supplierId)||{}).name} via ${method}`,
      branchId:p.branchId}});
    toast({tone:'ok',title:'Payment recorded',body:`${money(n)} against ${p.no} via ${method}.`});
    onClose();
  };
  return <Drawer open onClose={onClose} icon="HandCoins" title="Record supplier payment"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={save}>{t('Save')}</Btn></Fragment>}>
    <div className="grid gap-3">
      <Field label={t('Invoice')} req><Select value={inv} onChange={e=>{setInv(e.target.value);
        const x=db.purchaseInvoices.find(y=>y.id===e.target.value); setAmt(x?String(x.due):'');setErr('')}}>
        <option value="">{t('Select')}…</option>
        {sortBy(unpaid,x=>x.dueDate).map(x=><option key={x.id} value={x.id}>
          {x.no} · {(db.suppliers.find(s=>s.id===x.supplierId)||{}).name} · {money(x.due)} due</option>)}
      </Select></Field>
      {p&&<div className="panel p-3 grid gap-1">
        <Row label={t('Total')} value={money(p.total)}/><Row label={t('Paid')} value={money(p.paid)}/>
        <Row label={t('Balance')} value={money(p.due)} strong tone="danger"/>
        <Row label="Due date" value={d_(p.dueDate)}/></div>}
      <Field label={t('Amount')} req><Input className="ta-right" value={amt}
        onChange={e=>{setAmt(e.target.value.replace(/[^\d.]/g,''));setErr('')}} inputMode="decimal"
        style={{fontSize:17,height:44,fontWeight:600}}/></Field>
      <Field label="Payment method"><Select value={method} onChange={e=>setMethod(e.target.value)}>
        {['Bank','Cheque','Cash','bKash','Nagad'].map(m=><option key={m}>{m}</option>)}</Select></Field>
      <Field label="Reference" hint="Cheque number, TXN ID or bank reference">
        <Input className="mono" value={ref} onChange={e=>setRef(e.target.value.toUpperCase())}/></Field>
      {err&&<div className="err">{err}</div>}
    </div>
  </Drawer>;
}

function Cheques(){
  const {db,dispatch,branchIds,toast,user,crumbs}=useApp();
  const [type,setType]=useState('all');
  const rows=db.cheques.filter(c=>branchIds.includes(c.branchId)&&(type==='all'||c.type===type));
  const due7=db.cheques.filter(c=>c.status==='pending'&&dayDiff(TODAY,c.dueDate)<=7&&dayDiff(TODAY,c.dueDate)>=0);
  const setStatus=(c,s)=>{
    dispatch({type:'patch',coll:'cheques',id:c.id,data:{status:s}});
    toast({tone:s==='cleared'?'ok':'warn',title:`Cheque ${c.no} marked ${s}`,
      body:`${c.partyName} · ${money(c.amount)}${s==='bounced'?' — follow up for a replacement cheque.':''}`});
  };
  return <div className="grid gap-4">
    <PageHeader title={t('Cheques')} icon="ScrollText" crumbs={crumbs}
      sub="Issued and received cheques with due-date alerts and bounce tracking"
      actions={<Btn variant="primary" icon="Plus" onClick={()=>toast({tone:'info',title:'New cheque entry',
        body:'Records bank, cheque number, party, amount and due date against an invoice.'})}>Add cheque</Btn>}/>
    <div className="grid-kpi">
      <KPI label="Issued — pending" value={sum(db.cheques.filter(c=>c.type==='issued'&&c.status==='pending'),c=>c.amount)}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="ArrowUpFromLine" tone="danger"
        sub={`${db.cheques.filter(c=>c.type==='issued'&&c.status==='pending').length} cheques`}/>
      <KPI label="Received — pending" value={sum(db.cheques.filter(c=>c.type==='received'&&c.status==='pending'),c=>c.amount)}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="ArrowDownToLine" tone="info"/>
      <KPI label="Due within 7 days" value={due7.length} icon="AlarmClock" tone="warning"
        sub={money(sum(due7,c=>c.amount))}/>
      <KPI label="Bounced" value={db.cheques.filter(c=>c.status==='bounced').length} icon="Ban" tone="danger"
        sub={money(sum(db.cheques.filter(c=>c.status==='bounced'),c=>c.amount))}/>
    </div>
    <DataTable rows={rows} pageSize={12} initialSort={{k:'dueDate',dir:'asc'}}
      search={(c,q)=>c.no.includes(q)||c.partyName.toLowerCase().includes(q)||c.bank.toLowerCase().includes(q)}
      searchPlaceholder="Cheque number, party or bank…"
      filters={<Seg options={[{v:'all',l:'All'},{v:'issued',l:'Issued'},{v:'received',l:'Received'}]} value={type} onChange={setType}/>}
      cols={[
        {k:'no',h:'Cheque no',sort:c=>c.no,cell:c=><span className="mono">{c.no}</span>},
        {k:'type',h:t('Type'),sort:c=>c.type,cell:c=><Badge tone={c.type==='issued'?'warn':'info'}
          icon={c.type==='issued'?'ArrowUpFromLine':'ArrowDownToLine'}>{c.type}</Badge>},
        {k:'party',h:'Party',sort:c=>c.partyName,cell:c=><span className="clip">{c.partyName}</span>},
        {k:'bank',h:'Bank',cell:c=><span className="t-meta clip" style={{maxWidth:180}}>{c.bank}</span>},
        {k:'dueDate',h:'Due date',sort:c=>c.dueDate,cell:c=>{
          const d=dayDiff(TODAY,c.dueDate);
          return <div><div className="num">{d_(c.dueDate)}</div>
            {c.status==='pending'&&<div className="t-micro" style={{color:d<0?'var(--danger)':d<=7?'var(--warning)':'var(--fg-subtle)'}}>
              {d<0?`${Math.abs(d)} days overdue`:`in ${num_(d)} days`}</div>}</div>}},
        {k:'amount',h:t('Amount'),cls:'r',sort:c=>c.amount,cell:c=><span className="num font-semibold">{money(c.amount,{bn:LANG==='bn'})}</span>},
        {k:'status',h:t('Status'),sort:c=>c.status,cell:c=><StatusBadge v={c.status}/>},
        {k:'act',h:'',cls:'r',cell:c=>c.status==='pending'?<div className="row-act">
          <Btn size="xs" variant="soft" icon="Check" onClick={()=>setStatus(c,'cleared')}>Cleared</Btn>
          <Btn size="xs" variant="ghost" icon="Ban" onClick={()=>setStatus(c,'bounced')}>Bounced</Btn></div>:null},
      ]}
      rowCls={c=>c.status==='bounced'?'':''}/>
  </div>;
}

function EmpAction({emp,mode,onClose}){
  const {db,dispatch,toast,user}=useApp();
  const [branch,setBranch]=useState(emp.branchId);
  const [pctV,setPct]=useState(8);
  const [desig,setDesig]=useState(emp.desig);
  const [date,setDate]=useState(TODAY);
  const [note,setNote]=useState('');
  const sal=emp.salary;
  const newGross=Math.round(sal.gross*(1+Number(pctV)/100)/10)*10;
  const settlement=useMemo(()=>{
    const days=dayDiff(monKey(TODAY)+'-01',TODAY)+1;
    const earned=Math.round(sal.gross/26*Math.min(days,26));
    const leaveEnc=Math.round(sal.basic/26*Math.min(emp.leaveBalance.Annual,15));
    const adv=sum(db.advances.filter(a=>a.empId===emp.id&&a.status==='Approved'),a=>a.remaining);
    const years=Math.max(0,Math.floor(dayDiff(emp.join,TODAY)/365));
    const gratuity=years>=5? sal.basic*years : 0;
    return {earned,leaveEnc,adv,gratuity,net:earned+leaveEnc+gratuity-adv,years};
  },[emp,db]);
  const go=()=>{
    if(mode==='transfer'){
      dispatch({type:'patch',coll:'employees',id:emp.id,data:{branchId:branch,
        history:[...emp.history,{date,type:'Transfer',note:`Transferred to ${db.branches.find(b=>b.id===branch).name}${note?' — '+note:''}`}]}});
      toast({tone:'ok',title:'Employee transferred',body:`${emp.name} now reports to ${db.branches.find(b=>b.id===branch).name}.`});
    } else if(mode==='increment'){
      dispatch({type:'patch',coll:'employees',id:emp.id,data:{salary:salaryStructure(newGross),desig,
        history:[...emp.history,{date,type:desig!==emp.desig?'Promotion':'Increment',
          note:`${desig!==emp.desig?`Promoted to ${desig}. `:''}Gross ${money(sal.gross)} → ${money(newGross)} (+${pctV}%)`}]}});
      dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Salary change',
        entity:'Employee',detail:`${emp.name} gross ${money(sal.gross)} → ${money(newGross)}`,branchId:emp.branchId}});
      toast({tone:'ok',title:'Increment applied',body:`${emp.name} · new gross ${money(newGross)} per month.`});
    } else {
      dispatch({type:'patch',coll:'employees',id:emp.id,data:{status:'Resigned',
        history:[...emp.history,{date,type:'Resigned',note:`Final settlement ${money(settlement.net)}${note?' — '+note:''}`}]}});
      toast({tone:'ok',title:'Final settlement recorded',body:`${emp.name} · ${money(settlement.net)} payable.`});
    }
    onClose();
  };
  return <Modal open onClose={onClose} tone={mode==='resign'?'danger':'primary'}
    icon={mode==='transfer'?'ArrowLeftRight':mode==='increment'?'TrendingUp':'UserMinus'}
    title={mode==='transfer'?'Transfer branch':mode==='increment'?'Increment / promotion':'Resignation & final settlement'}
    sub={`${emp.name} · ${emp.desig}`}
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant={mode==='resign'?'danger':'primary'} icon="Check" onClick={go}>{t('Confirm')}</Btn></Fragment>}>
    <div className="grid gap-3">
      <Field label="Effective date"><Input type="date" value={date} onChange={e=>setDate(e.target.value)}/></Field>
      {mode==='transfer'&&<Field label="New branch">
        <Select value={branch} onChange={e=>setBranch(e.target.value)}>
          {db.branches.map(b=><option key={b.id} value={b.id}>{b.name} — {b.city}</option>)}</Select></Field>}
      {mode==='increment'&&<Fragment>
        <Field label={t('Designation')}><Select value={desig} onChange={e=>setDesig(e.target.value)}>
          {Object.keys(DESIG).map(d=><option key={d}>{d}</option>)}</Select></Field>
        <Field label="Increment %"><Input className="ta-right" value={pctV}
          onChange={e=>setPct(e.target.value.replace(/[^\d.]/g,''))}/></Field>
        <div className="flex gap-1.5">{[5,8,10,15,20].map(v=><button key={v} className="chip" onClick={()=>setPct(v)}>+{v}%</button>)}</div>
        <div className="panel p-3 grid gap-1">
          <Row label="Current gross" value={money(sal.gross,{bn:LANG==='bn'})}/>
          <Row label="New gross" value={money(newGross,{bn:LANG==='bn'})} strong tone="success"/>
          <Row label="New basic (60%)" value={money(salaryStructure(newGross).basic,{bn:LANG==='bn'})}/>
          <Row label="Annual cost increase" value={money((newGross-sal.gross)*12,{bn:LANG==='bn'})}/>
        </div>
      </Fragment>}
      {mode==='resign'&&<div className="panel p-3 grid gap-1">
        <div className="t-lbl mb-1">Final settlement</div>
        <Row label={`Earned salary (${monLabel(monKey(TODAY),LANG==='bn')})`} value={money(settlement.earned,{bn:LANG==='bn'})}/>
        <Row label={`Leave encashment (${emp.leaveBalance.Annual} days)`} value={money(settlement.leaveEnc,{bn:LANG==='bn'})}/>
        {settlement.gratuity>0&&<Row label={`Gratuity (${settlement.years} years)`} value={money(settlement.gratuity,{bn:LANG==='bn'})}/>}
        <Row label="Advance recovery" value={'−'+money(settlement.adv,{bn:LANG==='bn'})} tone="danger"/>
        <div className="hr my-1.5"/>
        <Row label="Net payable" value={money(settlement.net,{bn:LANG==='bn'})} strong/>
      </div>}
      <Field label={t('Note')}><Textarea value={note} onChange={e=>setNote(e.target.value)}/></Field>
    </div>
  </Modal>;
}

function EmployeeForm({emp,onClose}){
  const {db,dispatch,toast,user,branchIds}=useApp();
  const [f,setF]=useState({});
  const [err,setErr]=useState({});
  useEffect(()=>{ if(emp) setF({name:'',desig:'Cashier',branchId:branchIds[0],join:TODAY,empType:'Probation',
    shift:'Morning',blood:'O+',dob:'1998-01-01',nid:'',phone:'',emergency:'',address:'',payMode:'bkash',payAcc:'',
    pcReg:'',pcExp:'',...emp}) },[emp]);

    const e={};

    setErr(e); if(Object.keys(e).length){ toast({tone:'err',title:'Check the highlighted fields'}); return }
    const id=emp.id||('E'+String(db.employees.length+1).padStart(2,'0'));
    const item={id,...f,phone:String(f.phone).replace(/\D/g,''),dept:d.dept,salary:salaryStructure(d.gross),
      otRate:d.ot,commRate:d.comm,status:'Active',grade:f.pcReg?f.pcReg[0]:null,
      leaveBalance:{Casual:10,Sick:14,Annual:15,Maternity:0,Unpaid:0},pf:false,tds:d.gross>=40000,
      managerId:db.branches.find(b=>b.id===f.branchId).managerId,
      history:emp.history||[{date:f.join,type:'Joined',note:`Appointed as ${f.desig}`}],
      docs:emp.docs||[{name:'National ID (NID)',no:f.nid,exp:null,status:'Verified'},
        ...(f.pcReg?[{name:'Pharmacy Council Registration',no:f.pcReg,exp:f.pcExp,status:'Valid'}]:[])]};
    dispatch({type:'upsert',coll:'employees',item});

      action:emp.id?'Employee updated':'Employee added',entity:'Employee',
      detail:`${item.name} · ${item.desig} · ${db.branches.find(b=>b.id===item.branchId).name}`,branchId:item.branchId}});
    toast({tone:'ok',title:emp.id?'Employee updated':'Employee added',

    onClose();
  };
  return <Drawer open wide onClose={onClose} icon="UserPlus" title={emp.id?`${t('Edit')} ${emp.name}`:t('Add Employee')}

        <Field label="NID number" req error={err.nid}><Input className="mono" value={f.nid||''} onChange={e=>set('nid',e.target.value)}/></Field>
        <Field label="Date of birth"><Input type="date" value={f.dob} onChange={e=>set('dob',e.target.value)}/></Field>
        <Field label="Blood group"><Select value={f.blood} onChange={e=>set('blood',e.target.value)}>
          {['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(b=><option key={b}>{b}</option>)}</Select></Field>
        <Field label="Emergency contact"><Input value={f.emergency||''} onChange={e=>set('emergency',e.target.value)}
          placeholder="Name (Relation) 01XXXXXXXXX"/></Field>
      </div>
      <Field label={t('Address')}><Input value={f.address||''} onChange={e=>set('address',e.target.value)}/></Field>
      <div className="hr"/><div className="t-lbl">Job</div>
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label={t('Designation')}><Select value={f.desig} onChange={e=>set('desig',e.target.value)}>
          {Object.keys(DESIG).map(x=><option key={x}>{x}</option>)}</Select></Field>
        <Field label={t('Branch')}><Select value={f.branchId} onChange={e=>set('branchId',e.target.value)}>
          {db.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select></Field>
        <Field label="Join date"><Input type="date" value={f.join} onChange={e=>set('join',e.target.value)}/></Field>
        <Field label="Employment type"><Select value={f.empType} onChange={e=>set('empType',e.target.value)}>
          {['Permanent','Probation','Part-time'].map(x=><option key={x}>{x}</option>)}</Select></Field>
        <Field label="Shift"><Select value={f.shift} onChange={e=>set('shift',e.target.value)}>
          {Object.keys(SHIFTS).map(x=><option key={x}>{SHIFTS[x].label}</option>)}</Select></Field>
        <Field label="Pharmacy Council reg." hint="Leave blank for non-pharmacist roles">
          <Input className="mono" value={f.pcReg||''} onChange={e=>set('pcReg',e.target.value.toUpperCase())} placeholder="B-1234-2024"/></Field>
      </div>
      <div className="panel p-3 grid gap-1">

      </div>
    </div>

}

<script type="text/babel" data-presets="react">
const ATT_META={P:{l:'Present',tone:'ok',icon:'Check'},L:{l:'Late',tone:'warn',icon:'Clock'},
  A:{l:'Absent',tone:'bad',icon:'X'},HD:{l:'Half Day',tone:'warn',icon:'CircleDashed'},
  LV:{l:'On Leave',tone:'info',icon:'Plane'},H:{l:'Holiday',tone:'purple',icon:'PartyPopper'},
  OFF:{l:'Weekly Off',tone:'neutral',icon:'Moon'}};

function Attendance(){
  const {db,dispatch,branchIds,branchId,user,toast,crumbs}=useApp();
  const [date,setDate]=useState(TODAY);
  const [tab,setTab]=useState('board');
  const [emp,setEmp]=useState(null);
  const [mk,setMk]=useState(monKey(TODAY));
  const rows=db.attendance.filter(a=>a.date===date&&branchIds.includes(a.branchId));
  const counts=Object.keys(ATT_META).reduce((m,k)=>({...m,[k]:rows.filter(r=>r.status===k).length}),{});
  const hol=db.holidays.find(h=>h.date===date);
  const mark=(row,status)=>{
    const sh=SHIFTS[row.shift];
    dispatch({type:'attendance.mark',row:{...row,status,
      inT:['P','L','HD'].includes(status)?(row.inT||sh.s):null,
      outT:['P','L','HD'].includes(status)?(row.outT||sh.e):null,
      lateMin:status==='L'?(row.lateMin||22):0}});

      body:`${(db.employees.find(e=>e.id===row.empId)||{}).name} · ${fDate(date)}`});

  const monthRows=db.attendance.filter(a=>monKey(a.date)===mk&&branchIds.includes(a.branchId));
  const summary=db.employees.filter(e=>branchIds.includes(e.branchId)).map(e=>{

        <Input type="date" value={date} max={TODAY} onChange={e=>setDate(e.target.value)} style={{width:160}}/>
