/* ---- notifications derived from live data ---- */
function buildNotifs(db,branchIds){
  const out=[];
  const push=(id,tone,icon,title,body,page,date)=>out.push({id,tone,icon,title,body,page,date:date||TODAY});
  const low=SEL.lowStockList(db,branchIds);
  const oos=low.filter(x=>x.st.key==='oos');
  if(low.length) push('n-low','warn','PackageX',`${low.length} items at or below minimum stock`,
    low.slice(0,3).map(x=>x.med.brand).join(', ')+(low.length>3?` +${low.length-3} more`:''),'meds');
  if(oos.length) push('n-oos','bad','CircleOff',`${oos.length} items out of stock`,
    oos.slice(0,3).map(x=>x.med.brand).join(', '),'meds');
  const exp=SEL.expiryList(db,branchIds,90);
  const expired=exp.filter(x=>x.tone.key==='expired');
  const e30=exp.filter(x=>x.tone.key==='e30');
  if(expired.length) push('n-expired','bad','CalendarX',`${expired.length} expired batches still on shelf`,
    'Write off or return to supplier — value '+money(sum(expired,x=>x.qty*x.purchasePrice)),'expiry');
  if(e30.length) push('n-e30','warn','CalendarClock',`${e30.length} batches expire within 30 days`,
    'Plan supplier returns or push with offers','expiry');
  db.transfers.filter(tr=>['Requested','In Transit'].includes(tr.status)&&
      (branchIds.includes(tr.fromBranch)||branchIds.includes(tr.toBranch)))
    .forEach(tr=>push('n-tr-'+tr.id,'info','ArrowLeftRight',`Transfer ${tr.no} — ${tr.status}`,
      `${db.branches.find(b=>b.id===tr.fromBranch).name} → ${db.branches.find(b=>b.id===tr.toBranch).name} · ${tr.items.length} items`,'transfer',tr.date));
  const ovd=db.purchaseInvoices.filter(p=>p.due>0&&p.dueDate<TODAY&&branchIds.includes(p.branchId));
  if(ovd.length) push('n-ovd','bad','AlarmClock',`${ovd.length} supplier invoices overdue`,
    'Total due '+money(sum(ovd,p=>p.due)),'payable');
  db.cheques.filter(c=>c.status==='pending'&&dayDiff(TODAY,c.dueDate)<=7&&branchIds.includes(c.branchId))
    .forEach(c=>push('n-chq-'+c.id,'warn','ScrollText',`Cheque ${c.no} due ${fDate(c.dueDate)}`,
      `${c.type==='issued'?'Issued to':'Received from'} ${c.partyName} · ${money(c.amount)}`,'cheques',c.date));
  db.cheques.filter(c=>c.status==='bounced').forEach(c=>push('n-chqb-'+c.id,'bad','Ban',
    `Cheque ${c.no} bounced`,`${c.partyName} · ${money(c.amount)}`,'cheques',c.date));
  db.branches.filter(b=>branchIds.includes(b.id)&&dayDiff(TODAY,b.licExp)<=75).forEach(b=>
    push('n-lic-'+b.id,'warn','FileBadge',`${b.name} drug licence expires ${fDate(b.licExp)}`,
      `${dayDiff(TODAY,b.licExp)} days left · ${b.drugLic}`,'compliance'));
  db.employees.filter(e=>e.pcExp&&branchIds.includes(e.branchId)&&dayDiff(TODAY,e.pcExp)<=75).forEach(e=>
    push('n-pc-'+e.id,'warn','BadgeAlert',`${e.name} — Pharmacy Council registration expiring`,
      `${e.pcReg} expires ${fDate(e.pcExp)}`,'compliance'));
  const pend=db.leaves.filter(l=>l.status==='Pending'&&branchIds.includes(l.branchId));
  if(pend.length) push('n-leave','info','Plane',`${pend.length} leave requests awaiting approval`,
    pend.slice(0,3).map(l=>(db.employees.find(e=>e.id===l.empId)||{}).name).join(', '),'leave');
  const advP=db.advances.filter(a=>a.status==='Pending');
  if(advP.length) push('n-adv','info','PiggyBank',`${advP.length} salary advance requests pending`,
    advP.map(a=>(db.employees.find(e=>e.id===a.empId)||{}).name).join(', '),'advance');
  const curM=monKey(TODAY);
  if(!db.payrollRuns.some(r=>r.month===curM&&!r.type))
    push('n-payroll','info','Banknote',`${monLabel(curM)} payroll not processed`,
      `Pay day is the ${db.settings.payroll.salaryPayDay}th — ${18} employees`,'payroll');
  db.shifts.filter(s=>s.deductFromSalary&&branchIds.includes(s.branchId)).forEach(s=>
    push('n-sh-'+s.id,'bad','Wallet',`Cash shortage ${money(Math.abs(s.diff))} — ${db.branches.find(b=>b.id===s.branchId).name}`,
      `${(db.employees.find(e=>e.id===s.cashierId)||{}).name} · ${fDate(s.date)} shift`,'shift',s.date));
  db.adjustments.filter(a=>a.status==='Pending'&&branchIds.includes(a.branchId)).forEach(a=>
    push('n-adj-'+a.id,'warn','SlidersHorizontal',`Stock adjustment ${a.no} awaiting approval`,
      `${a.brand} · ${a.qty} pcs · ${a.reason}`,'adjust',a.date));
  db.audit.filter(a=>a.action==='Discount override').slice(0,2).forEach(a=>
    push('n-disc-'+a.id,'warn','BadgePercent','Large discount approved',a.detail,'audit',a.date));
  const bigBaki=db.customers.filter(c=>branchIds.includes(c.branchId)&&c.baki>6000);
  if(bigBaki.length) push('n-baki','warn','Users',`${bigBaki.length} customers over ৳6,000 Baki`,
    'Send collection reminders — total '+money(sum(bigBaki,c=>c.baki)),'receivable');
  const fr=db.fridgeLogs.filter(f=>!f.ok&&branchIds.includes(f.branchId));
  fr.slice(0,2).forEach(f=>push('n-fr-'+f.id,'bad','Thermometer',
    `Fridge out of range — ${db.branches.find(b=>b.id===f.branchId).name}`,
    `${f.tempC}°C on ${fDate(f.date)} (${f.slot}) · safe range 2–8°C`,'fridge',f.date));
  return out;
}

function CommandPalette({open,onClose,db,go,branchIds,toast}){
  const [q,setQ]=useState(''); const [act,setAct]=useState(0);
  const inRef=useRef(null);
  useEffect(()=>{ if(open){setQ('');setAct(0); setTimeout(()=>inRef.current&&inRef.current.focus(),30)} },[open]);
  const results=useMemo(()=>{
    const qq=q.trim().toLowerCase();
    const out=[];
    const pages=NAV.flatMap(g=>g.items.map(i=>({...i,grp:g.g})))
      .filter(i=>!qq||i.l.toLowerCase().includes(qq)||i.grp.toLowerCase().includes(qq));
    pages.slice(0,qq?6:9).forEach(p=>out.push({g:'Pages',icon:p.i,title:t(p.l),sub:t(p.grp),run:()=>go(p.k)}));
    if(qq.length>=2){
      db.medicines.filter(m=>m.brand.toLowerCase().includes(qq)||m.generic.toLowerCase().includes(qq)||m.barcode.includes(qq))
        .slice(0,5).forEach(m=>out.push({g:'Medicines',icon:'Pill',title:`${m.brand} ${m.strength}`,
          sub:`${m.generic} · ${m.company} · ${num_(SEL.stockOf(db,m.id,branchIds))} pcs`,run:()=>go('meds',{medId:m.id})}));
      db.customers.filter(c=>c.name.toLowerCase().includes(qq)||c.phone.includes(qq))
        .slice(0,4).forEach(c=>out.push({g:'Customers',icon:'User',title:c.name,
          sub:`${fPhone(c.phone)}${c.baki>0?' · Baki '+money(c.baki):''}`,run:()=>go('customers',{custId:c.id})}));
      db.employees.filter(e=>e.name.toLowerCase().includes(qq)||e.desig.toLowerCase().includes(qq)||e.id.toLowerCase().includes(qq))
        .slice(0,4).forEach(e=>out.push({g:'Employees',icon:'IdCard',title:e.name,
          sub:`${e.id} · ${e.desig}`,run:()=>go('employees',{empId:e.id})}));
      db.sales.filter(s=>s.no.toLowerCase().includes(qq)).slice(0,4)
        .forEach(s=>out.push({g:'Invoices',icon:'ReceiptText',title:s.no,
          sub:`${d_(s.date)} · ${money(s.total)} · ${s.custName}`,run:()=>go('sales',{invId:s.id})}));
      db.doctors.filter(x=>x.name.toLowerCase().includes(qq)).slice(0,3)
        .forEach(x=>out.push({g:'Doctors',icon:'Stethoscope',title:x.name,sub:x.spec,run:()=>go('doctors')}));
    }
    if(qq) [['Reset demo data','RotateCcw',()=>go('settings')],['Toggle Bangla','Languages',()=>toast({tone:'info',title:'Use Ctrl + /',body:'Or the language switch in the top bar.'})]]
      .filter(([l])=>l.toLowerCase().includes(qq)).forEach(([l,i,r])=>out.push({g:'Actions',icon:i,title:l,run:r}));
    return out;
  },[q,db,branchIds]);
  useEffect(()=>{setAct(0)},[q]);
  if(!open) return null;
  const run=i=>{ const r=results[i]; if(!r)return; r.run(); onClose() };
  let lastG=null;
  return <Fragment>
    <div className="ovl no-print" onClick={onClose}/>
    <div className="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
      <div className="flex items-center gap-2 px-3" style={{borderBottom:'1px solid var(--border)'}}>
        <Icon name="Search" size={16} style={{color:'var(--fg-subtle)',flex:'none'}}/>
        <input ref={inRef} className="cmdk-in" style={{borderBottom:0}} value={q} onChange={e=>setQ(e.target.value)}
          placeholder="Jump to a page, medicine, customer, employee or invoice…"
          onKeyDown={e=>{
            if(e.key==='ArrowDown'){e.preventDefault();setAct(a=>Math.min(results.length-1,a+1))}
            if(e.key==='ArrowUp'){e.preventDefault();setAct(a=>Math.max(0,a-1))}
            if(e.key==='Enter'){e.preventDefault();run(act)}
          }}/>
        <span className="kbd">Esc</span>
      </div>
      <div className="cmdk-l scroll">
        {results.length===0 && <div className="p-7 text-center t-meta">No matches for “{q}”.</div>}
        {results.map((r,i)=>{
          const head = r.g!==lastG ? (lastG=r.g) : null;
          return <Fragment key={i}>
            {head&&<div className="cmdk-g">{head}</div>}
            <div className="cmdk-i" data-a={i===act?1:0} onMouseEnter={()=>setAct(i)} onClick={()=>run(i)}>
              <span className="grid place-items-center w-7 h-7 rounded-[7px] shrink-0"
                style={{background:'var(--surface-3)',color:'var(--fg-muted)'}}><Icon name={r.icon} size={14}/></span>
              <span className="min-w-0 flex-1">
                <span className="block cmdk-t clip">{r.title}</span>
                {r.sub&&<span className="block t-micro clip">{r.sub}</span>}</span>
              {i===act&&<span className="kbd">↵</span>}
            </div>
          </Fragment>;
        })}
      </div>
      <div className="flex items-center gap-3 px-3 py-2 t-micro" style={{borderTop:'1px solid var(--border)',background:'var(--surface-2)'}}>
        <span className="flex items-center gap-1"><span className="kbd">↑</span><span className="kbd">↓</span> navigate</span>
        <span className="flex items-center gap-1"><span className="kbd">↵</span> open</span>
        <span className="ml-auto">{num_(results.length)} results</span>
      </div>
    </div>
  </Fragment>;
}

/* ---- guided tour ---- */
const TOUR=[
  {sel:'[data-tour="kpi"]',title:'Your day at a glance',
   body:'Live KPIs for the selected branch — today’s sales, month-to-date against target, stock value, Baki receivable and staff present. Every card reacts to the branch switcher.',place:'bottom'},
  {sel:'[data-tour="branch"]',title:'Branch switcher',

  {sel:'[data-tour="nav-pos"]',title:'POS Billing',
   body:'The counter screen. Search by brand, generic or barcode, FEFO batch auto-picked, offers applied automatically, checkout in three keystrokes.',place:'right'},
  {sel:'[data-tour="alerts"]',title:'Actionable alerts',
   body:'Low stock, expiring batches, pending transfers, overdue supplier bills, bouncing cheques, licence renewals and leave requests — each with a one-click action.',place:'left'},
  {sel:'[data-tour="nav-meds"]',title:'Inventory & expiry',
   body:'Batch-wise stock across branches, 30/60/90-day expiry tiers, bulk MRP updates, transfers with partial receive and cold-chain logs.',place:'right'},
  {sel:'[data-tour="nav-payroll"]',title:'HR & Payroll',
   body:'Attendance with overtime and late penalty, leave balances, the monthly payroll wizard, Eid festival bonus runs and printable payslips in Bangla.',place:'right'},
  {sel:'[data-tour="nav-reports"]',title:'Reports',
   body:'Thirty report types — sales by cashier, profit per medicine, VAT, Baki aging, controlled drugs register and staff cost per branch, on the July–June fiscal year.',place:'right'},
  {sel:'[data-tour="search"]',title:'Command palette',
   body:'Press Ctrl + K anywhere to jump to a page, medicine, customer, employee or invoice. Press ? for the full shortcut list.',place:'bottom'},
];
function Tour({step,setStep,onDone}){
  const [box,setBox]=useState(null);
  const s=TOUR[step];
  useEffect(()=>{
    if(!s) return;
    const find=()=>{
      const el=document.querySelector(s.sel);
      if(!el){setBox(null);return}
      const r=el.getBoundingClientRect();
      setBox({top:r.top-6,left:r.left-6,width:r.width+12,height:r.height+12});
    };
    find();
    const tm=setTimeout(find,160);
    window.addEventListener('resize',find); window.addEventListener('scroll',find,true);
    return ()=>{clearTimeout(tm);window.removeEventListener('resize',find);window.removeEventListener('scroll',find,true)};
  },[step,s]);
  if(!s) return null;
  const vw=window.innerWidth, vh=window.innerHeight;
  let st={top:'50%',left:'50%',transform:'translate(-50%,-50%)'};
  if(box){
    const w=Math.min(330,vw-24);
    if(s.place==='right'&&box.left+box.width+w+16<vw) st={top:clamp(box.top,12,vh-240),left:box.left+box.width+12,transform:'none'};
    else if(s.place==='left'&&box.left-w-16>0) st={top:clamp(box.top,12,vh-240),left:box.left-w-12,transform:'none'};
    else if(box.top+box.height+230<vh) st={top:box.top+box.height+12,left:clamp(box.left,12,vw-w-12),transform:'none'};
    else st={top:clamp(box.top-236,12,vh-240),left:clamp(box.left,12,vw-w-12),transform:'none'};
  }
  return <Fragment>
    {box? <div className="spotlight" style={box}/> : <div className="ovl no-print" style={{zIndex:94}}/>}
    <div className="tour no-print" style={st} role="dialog" aria-label={s.title}>
      <div className="flex items-start justify-between gap-3 mb-2">
        <div className="flex items-center gap-2">
          <span className="grid place-items-center w-6 h-6 rounded-md"
            style={{background:'var(--primary)',color:'var(--primary-fg)',fontSize:11,fontWeight:700}}>{step+1}</span>
          <div className="t-sec" style={{fontSize:14}}>{s.title}</div>
        </div>
        <button className="btn btn-ghost btn-xs btn-icon" onClick={onDone} aria-label="End tour"><Icon name="X" size={13}/></button>
      </div>
      <p className="t-meta leading-relaxed mb-3.5">{s.body}</p>
      <div className="flex items-center justify-between gap-3">
        <div className="tour-dots">{TOUR.map((_,i)=><i key={i} className={i===step?'on':''}/>)}</div>
        <div className="flex gap-1.5">
          {step>0&&<Btn size="sm" variant="ghost" onClick={()=>setStep(step-1)}>{t('Back')}</Btn>}
          <Btn size="sm" variant="primary" iconRight={step===TOUR.length-1?undefined:'ArrowRight'}
            onClick={()=>step===TOUR.length-1?onDone():setStep(step+1)}>
            {step===TOUR.length-1?'Finish':t('Next')}</Btn>
        </div>
      </div>
    </div>
  </Fragment>;
}

/* ---- notifications panel ---- */
function NotifPanel({open,onClose,notifs,read,onRead,go}){
  const unread=notifs.filter(n=>!read.includes(n.id));
  return <Drawer open={open} onClose={onClose} icon="Bell" title={t('Notifications')}
    sub={`${num_(unread.length)} unread of ${num_(notifs.length)}`}
    footer={<Fragment>
      <Btn onClick={onClose}>{t('Close')}</Btn>
      <Btn variant="primary" icon="CheckCheck" disabled={!unread.length}
        onClick={()=>onRead(notifs.map(n=>n.id))}>Mark all read</Btn>
    </Fragment>}>
    {notifs.length===0 && <Empty icon="BellOff" title="All clear" desc="No alerts for the selected branch right now."/>}
    <div className="grid gap-2">
      {sortBy(notifs,n=>read.includes(n.id)?1:0).map(n=>{
        const isRead=read.includes(n.id);
        return <button key={n.id} onClick={()=>{onRead(n.id);go(n.page);onClose()}}
          className="text-left p-3 rounded-[10px] flex gap-3 transition-all"
          style={{border:'1px solid var(--border)',background:isRead?'var(--surface-2)':'var(--surface)',
            opacity:isRead?.68:1,boxShadow:isRead?'none':'var(--shadow-xs)'}}>
          <span className="grid place-items-center w-8 h-8 rounded-[9px] shrink-0"
            style={{background:`var(--${n.tone==='bad'?'danger':n.tone==='warn'?'warning':'info'}-soft)`,
              color:`var(--${n.tone==='bad'?'danger':n.tone==='warn'?'warning':'info'})`}}>
            <Icon name={n.icon} size={15}/></span>
          <span className="min-w-0 flex-1">
            <span className="flex items-center gap-2">
              <span className="text-[13px] font-semibold leading-snug">{n.title}</span>
              {!isRead&&<i className="dot" style={{background:'var(--primary)'}}/>}
            </span>
            <span className="block t-meta mt-0.5 leading-snug">{n.body}</span>
            <span className="block t-micro mt-1">{d_(n.date)} · {t(PAGE_TITLES[n.page]||'')}</span>
          </span>
          <Icon name="ChevronRight" size={14} style={{color:'var(--fg-faint)',flex:'none',marginTop:8}}/>
        </button>;
      })}
    </div>
  </Drawer>;
}
</script>

<script type="text/babel" data-presets="react">
/* ===================== 7.1 DASHBOARD ===================== */
function Dashboard(){
  const {db,go,branchIds,branchId,user,theme,toast,notifs,markRead}=useApp();
  const c=useThemeColors(theme);
  const [trendMode,setTrendMode]=useState('day');
  const [topMetric,setTopMetric]=useState('value');

  const K = useMemo(()=>{
    const todaySales=SEL.salesIn(db,branchIds,TODAY,TODAY);
    const ySales=SEL.salesIn(db,branchIds,addDays(TODAY,-1),addDays(TODAY,-1));
    const mk=monKey(TODAY);
    const mSales=SEL.salesIn(db,branchIds,mk+'-01',TODAY);
    const lmk=monKey(addMon(TODAY,-1));
    const lmSales=SEL.salesIn(db,branchIds,lmk+'-01',lmk+'-'+monDays(lmk));
    const lmSameDay=SEL.salesIn(db,branchIds,lmk+'-01',lmk+'-'+String(D(TODAY).getDate()).padStart(2,'0'));
    const target=sum(db.branches.filter(b=>branchIds.includes(b.id)),b=>b.target);
    const tTot=sum(todaySales,s=>s.total), mTot=sum(mSales,s=>s.total);
    const gp=sum(mSales,s=>s.profit);
    const low=SEL.lowStockList(db,branchIds);
    const exp=SEL.expiryList(db,branchIds,90);
    const mobile=sum(mSales,s=>sum(s.payments.filter(p=>['bKash','Nagad','Rocket'].includes(p.method)),p=>p.amount));
    const att=SEL.presentToday(db,branchIds);
    return {tTot,yTot:sum(ySales,s=>s.total),tCount:todaySales.length,
      mTot,mCount:mSales.length,lmTot:sum(lmSales,s=>s.total),lmSameDay:sum(lmSameDay,s=>s.total),
      target,gp,gpPct:mTot?pct(gp,mTot):0,
      stockValue:SEL.stockValue(db,branchIds),stockUnits:sum(db.batches.filter(b=>branchIds.includes(b.branchId)),b=>b.qty),
      low:low.filter(x=>x.st.key!=='oos').length,oos:low.filter(x=>x.st.key==='oos').length,
      near:exp.filter(x=>['e30','e60','e90'].includes(x.tone.key)).length,
      nearValue:sum(exp.filter(x=>['e30','e60','e90'].includes(x.tone.key)),x=>x.qty*x.purchasePrice),
      expired:exp.filter(x=>x.tone.key==='expired').length,
      expiredValue:sum(exp.filter(x=>x.tone.key==='expired'),x=>x.qty*x.purchasePrice),
      baki:SEL.bakiTotal(db,branchIds),bakiCount:db.customers.filter(x=>branchIds.includes(x.branchId)&&x.baki>0).length,
      payable:SEL.payableTotal(db,branchIds),
      mobile,att,payroll:SEL.payrollCost(db,branchIds),
      avgBill: todaySales.length? tTot/todaySales.length : 0};
  },[db,branchIds]);

  const trend = useMemo(()=>{
    if(trendMode==='day'){
      return Array.from({length:30},(_,i)=>{
        const d=addDays(TODAY,-29+i);
        const ss=SEL.salesIn(db,branchIds,d,d);
        return {x:fDateS(d),sales:round2(sum(ss,s=>s.total)),profit:round2(sum(ss,s=>s.profit)),bills:ss.length};
      });
    }
    if(trendMode==='week'){
      return Array.from({length:12},(_,i)=>{
        const to=addDays(TODAY,-7*(11-i)), from=addDays(to,-6);
        const ss=SEL.salesIn(db,branchIds,from,to);
        return {x:fDateS(from),sales:round2(sum(ss,s=>s.total)),profit:round2(sum(ss,s=>s.profit)),bills:ss.length};
      });
    }
    return Array.from({length:4},(_,i)=>{
      const mkey=monKey(addMon(TODAY,-3+i));
      const ss=SEL.salesIn(db,branchIds,mkey+'-01',mkey+'-'+monDays(mkey));
      return {x:monLabel(mkey),sales:round2(sum(ss,s=>s.total)),profit:round2(sum(ss,s=>s.profit)),bills:ss.length};
    });
  },[db,branchIds,trendMode]);

  const agg = useMemo(()=>{
    const mk=monKey(TODAY);
    const ss=SEL.salesIn(db,branchIds,mk+'-01',TODAY);
    const items=ss.flatMap(s=>s.items);
    const byMed={}, byCo={}, byCat={}, byPay={}, byHour={}, byBranch={};
    items.forEach(i=>{
      const v=i.amount, q=i.pieces;
      (byMed[i.brand]=byMed[i.brand]||{name:i.brand,value:0,qty:0,profit:0});
      byMed[i.brand].value+=v; byMed[i.brand].qty+=q; byMed[i.brand].profit+=(v-i.cost);
      byCo[i.company]=(byCo[i.company]||0)+v;
      byCat[i.category]=(byCat[i.category]||0)+v;
    });
    ss.forEach(s=>{
      s.payments.forEach(p=>{byPay[p.method]=(byPay[p.method]||0)+p.amount});
      byHour[s.hour]=(byHour[s.hour]||0)+s.total;
      byBranch[s.branchId]=(byBranch[s.branchId]||0)+s.total;
    });
    return {
      top: sortBy(Object.values(byMed),x=>topMetric==='value'?x.value:topMetric==='qty'?x.qty:x.profit,'desc').slice(0,10),
      co: sortBy(Object.entries(byCo).map(([name,value])=>({name,value:round2(value)})),x=>x.value,'desc').slice(0,8),
      cat: sortBy(Object.entries(byCat).map(([name,value])=>({name,value:round2(value)})),x=>x.value,'desc').slice(0,7),
      pay: sortBy(Object.entries(byPay).map(([name,value])=>({name,value:round2(value)})),x=>x.value,'desc'),
      hours: Array.from({length:15},(_,i)=>({h:i+8,v:round2(byHour[i+8]||0)})),
      branch: db.branches.map(b=>({name:b.name,sales:round2(byBranch[b.id]||0),target:b.target,
        pct:pct(byBranch[b.id]||0,b.target)})),
    };
  },[db,branchIds,topMetric]);

  const hourMax=Math.max(1,...agg.hours.map(h=>h.v));
  const dayPart = NOW_H<12?'Good morning':NOW_H<17?'Good afternoon':'Good evening';
  const alerts = notifs.slice(0,8);
  const recent = useMemo(()=>sortBy(db.sales.filter(s=>branchIds.includes(s.branchId)),s=>s.date+s.time,'desc').slice(0,8),[db,branchIds]);
  const S=CHART_SERIES(c);

  return <div className="grid gap-5">
    <div className="ph">
      <div>
        <h1 className="t-page">{t(dayPart)}, {user.name.split(' ')[0]}</h1>
        <div className="t-meta mt-1 flex items-center gap-2 flex-wrap">
          <Icon name="Calendar" size={13}/>{fDateLong(TODAY,LANG==='bn')} · {fDow(TODAY,LANG==='bn')}
          <span className="subtle">·</span>
          <span>{branchId==='ALL'?t('All Branches'):db.branches.find(b=>b.id===branchId).name}</span>
          <span className="subtle">·</span>
          <span>{fyLabel(fyOf(TODAY))}</span>
        </div>
      </div>
      <div className="flex gap-2 flex-wrap">
        {can(user.role,'pos')&&<Btn variant="primary" icon="ScanBarcode" onClick={()=>go('pos')}>{t('New Sale')}</Btn>}
        <Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'Export queued',
          body:'In the live build this downloads an XLSX of every dashboard figure for the selected branch and period.'})}>{t('Export')}</Btn>
      </div>
    </div>

    {/* KPIs */}
    <div className="grid-kpi" data-tour="kpi">
      <KPI label={t("Today's Sales")} value={K.tTot} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Banknote"
        trend={K.yTot?Math.round((K.tTot-K.yTot)/K.yTot*1000)/10:0}
        sub={`${num_(K.tCount)} bills · avg ${money(K.avgBill,{bn:LANG==='bn'})}`} onClick={()=>go('sales')}/>
      <KPI label={t('Monthly Sales')} value={K.mTot} fmt={v=>moneyK(v,LANG==='bn')} icon="Target" tone="info"
        trend={K.lmSameDay?Math.round((K.mTot-K.lmSameDay)/K.lmSameDay*1000)/10:0}
        sub={`${pct(K.mTot,K.target)}% ${t('of target')} ${moneyK(K.target,LANG==='bn')}`} onClick={()=>go('reports')}/>
      <KPI label={t('Gross Profit')} value={K.gp} fmt={v=>moneyK(v,LANG==='bn')} icon="TrendingUp" tone="success"
        sub={`${K.gpPct}% margin this month`} onClick={()=>go('pl')}/>
      <KPI label={t('Stock Value')} value={K.stockValue} fmt={v=>moneyK(v,LANG==='bn')} icon="Boxes" tone="purple"
        sub={`${num_(K.stockUnits)} pieces at cost`} onClick={()=>go('meds')}/>
      <KPI label={t('Low Stock')} value={K.low} icon="PackageX" tone="warning"
        sub={`${num_(K.oos)} out of stock`} onClick={()=>go('meds',{filter:'low'})}/>
      <KPI label={t('Near Expiry')} value={K.near} icon="CalendarClock" tone="warning"
        sub={`${moneyK(K.nearValue,LANG==='bn')} within 90 days`} onClick={()=>go('expiry')}/>
      <KPI label={t('Expired')} value={K.expired} icon="CalendarX" tone="danger"
        sub={`${moneyK(K.expiredValue,LANG==='bn')} to write off`} onClick={()=>go('expiry',{tier:'expired'})}/>
      <KPI label={t('Baki Receivable')} value={K.baki} fmt={v=>moneyK(v,LANG==='bn')} icon="ArrowDownToLine" tone="warning"
        sub={`${num_(K.bakiCount)} customers`} onClick={()=>go('receivable')}/>
      <KPI label={t('Supplier Payable')} value={K.payable} fmt={v=>moneyK(v,LANG==='bn')} icon="ArrowUpFromLine" tone="danger"
        sub="Unpaid purchase invoices" onClick={()=>go('payable')}/>
      <KPI label="bKash / Nagad" value={K.mobile} fmt={v=>moneyK(v,LANG==='bn')} icon="Smartphone" tone="info"
        sub="Mobile collections this month" onClick={()=>go('cash')}/>
      <KPI label={t('Staff Present')} value={K.att.present} icon="UserCheck" tone="success"
        sub={`of ${num_(K.att.total)} · ${num_(K.att.late)} late · ${num_(K.att.leave)} on leave`} onClick={()=>go('attendance')}/>
      <KPI label={t('Payroll Cost')} value={K.payroll} fmt={v=>moneyK(v,LANG==='bn')} icon="Banknote" tone="purple"
        sub={`${monLabel(monKey(addMon(TODAY,-1)),LANG==='bn')} net paid`} onClick={()=>go('payroll')}/>
    </div>

    {/* trend + alerts */}
    <div className="cols2" style={{'--c2':'minmax(0,1.62fr) minmax(0,1fr)'}}>
      <Card className="min-w-0">
        <CardH title={t('Sales Trend')} sub={`${trendMode==='day'?'Last 30 days':trendMode==='week'?'Last 12 weeks':'Last 4 months'} · sales vs gross profit`}
          icon="ChartNoAxesCombined"
          right={<Seg options={[{v:'day',l:'Day'},{v:'week',l:'Week'},{v:'month',l:'Month'}]} value={trendMode} onChange={setTrendMode}/>}/>
        <div className="p-3 pr-4">
          <ChartBox h={268}>
            <RC.ComposedChart data={trend} margin={{top:6,right:6,left:-14,bottom:0}}>
              <defs>
                <linearGradient id="gSales" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={c.primary} stopOpacity={.34}/>
                  <stop offset="100%" stopColor={c.primary} stopOpacity={.02}/>
                </linearGradient>
              </defs>
              <RC.CartesianGrid stroke={c.grid} vertical={false}/>
              <RC.XAxis dataKey="x" tick={{fontSize:10.5,fill:c.subtle}} axisLine={false} tickLine={false}
                interval={trendMode==='day'?4:0} minTickGap={6}/>
              <RC.YAxis tick={{fontSize:10.5,fill:c.subtle}} axisLine={false} tickLine={false}
                tickFormatter={mkAxisFmt(Math.max(...trend.map(x=>x.sales)))}/>
              <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>}/>
              <RC.Area type="monotone" dataKey="sales" name="Sales" stroke={c.primary} strokeWidth={2}
                fill="url(#gSales)" dot={false} activeDot={{r:4,strokeWidth:2,stroke:c.surface}}/>
              <RC.Line type="monotone" dataKey="profit" name="Gross profit" stroke={c.success} strokeWidth={1.8}
                strokeDasharray="4 3" dot={false}/>
            </RC.ComposedChart>
          </ChartBox>
        </div>
      </Card>
      <Card className="min-w-0 flex flex-col" data-tour="alerts">
        <CardH title={t('Alerts')} sub={`${num_(notifs.length)} need attention`} icon="TriangleAlert"
          right={<Btn size="sm" variant="ghost" icon="ArrowRight" onClick={()=>go('notifications')} aria-label="All alerts"/>}/>
        <div className="p-2 grid gap-1.5 overflow-auto scroll" style={{maxHeight:300}}>
          {alerts.length===0&&<Empty icon="ShieldCheck" title="Nothing urgent" desc="Stock, expiry, payments and HR are all within limits."/>}
          {alerts.map(n=><button key={n.id} onClick={()=>{markRead(n.id);go(n.page)}}
            className="flex items-start gap-2.5 p-2.5 rounded-[9px] text-left transition-colors hover:bg-[var(--surface-hover)]">
            <span className="grid place-items-center w-7 h-7 rounded-lg shrink-0"
              style={{background:`var(--${n.tone==='bad'?'danger':n.tone==='warn'?'warning':'info'}-soft)`,
                color:`var(--${n.tone==='bad'?'danger':n.tone==='warn'?'warning':'info'})`}}>
              <Icon name={n.icon} size={14}/></span>
            <span className="min-w-0 flex-1">
              <span className="block text-[12.5px] font-semibold leading-snug">{n.title}</span>
              <span className="block t-micro mt-0.5 leading-snug clip">{n.body}</span>
            </span>
            <Icon name="ChevronRight" size={13} style={{color:'var(--fg-faint)',flex:'none',marginTop:6}}/>
          </button>)}
        </div>
      </Card>
    </div>

    {/* branch targets + top meds */}
    <div className="cols2" style={{'--c2':'minmax(0,1fr) minmax(0,1.3fr)'}}>
      <Card className="min-w-0">
        <CardH title={t('Branch Comparison')} sub={`${monLabel(monKey(TODAY),LANG==='bn')} · achievement vs monthly target`} icon="Building2"/>
        <div className="p-4 grid gap-4">
          {agg.branch.map(b=>{
            const tone=b.pct>=95?'success':b.pct>=75?'primary':b.pct>=55?'warning':'danger';
            return <div key={b.name}>
              <div className="flex items-baseline justify-between gap-3 mb-1.5">
                <span className="text-[13px] font-semibold">{b.name}</span>
                <span className="t-meta num">{money(b.sales,{bn:LANG==='bn'})} <span className="subtle">/ {moneyK(b.target,LANG==='bn')}</span></span>
              </div>
              <div className="flex items-center gap-2.5">
                <div className="flex-1"><Bar value={b.pct} tone={tone} h={7}/></div>
                <span className="text-[12px] font-bold num" style={{color:`var(--${tone})`,minWidth:42,textAlign:'right'}}>
                  {LANG==='bn'?toBn(b.pct):b.pct}%</span>
              </div>
            </div>;
          })}
          <div className="panel p-3 mt-1">
            <div className="flex items-center justify-between text-[12.5px]">
              <span className="muted">Combined month-to-date</span>
              <span className="num font-semibold">{money(sum(agg.branch,b=>b.sales),{bn:LANG==='bn'})}</span>
            </div>
            <div className="flex items-center justify-between t-micro mt-1">
              <span>Pace to close the month</span>
              <span className="num">{moneyK(sum(agg.branch,b=>b.sales)/D(TODAY).getDate()*monDays(monKey(TODAY)),LANG==='bn')}</span>
            </div>
          </div>
        </div>
      </Card>
      <Card className="min-w-0">
        <CardH title={t('Top Medicines')} sub={`${monLabel(monKey(TODAY),LANG==='bn')} · top 10`} icon="Pill"
          right={<Seg options={[{v:'value',l:'৳'},{v:'qty',l:'Qty'},{v:'profit',l:'Profit'}]} value={topMetric} onChange={setTopMetric}/>}/>
        <div className="p-3">
          <ChartBox h={286}>
            <RC.BarChart data={agg.top} layout="vertical" margin={{top:2,right:44,left:4,bottom:2}}>
              <RC.CartesianGrid stroke={c.grid} horizontal={false}/>
              <RC.XAxis type="number" hide/>
              <RC.YAxis type="category" dataKey="name" width={96} tick={{fontSize:11,fill:c.muted}}
                axisLine={false} tickLine={false}/>
              <RC.Tooltip content={<ChartTip c={c} fmt={v=>topMetric==='qty'?num_(v)+' pcs':money(v)}/>} cursor={{fill:c.grid,opacity:.4}}/>
              <RC.Bar dataKey={topMetric==='qty'?'qty':topMetric==='profit'?'profit':'value'}
                name={topMetric==='qty'?'Pieces':topMetric==='profit'?'Gross profit':'Sales'}
                fill={c.primary} radius={[0,5,5,0]} barSize={15}>
                <RC.LabelList dataKey={topMetric==='qty'?'qty':topMetric==='profit'?'profit':'value'} position="right"
                  formatter={v=>topMetric==='qty'?num_(v):moneyK(v)} style={{fontSize:10.5,fill:c.subtle,fontWeight:600}}/>
              </RC.Bar>
            </RC.BarChart>
          </ChartBox>
        </div>
      </Card>
    </div>

    {/* company / category / payment */}
    <div className="grid gap-4 lg:grid-cols-3">
      <Card className="min-w-0">
        <CardH title="Sales by Company" sub="Month to date" icon="Factory"/>
        <div className="p-3">
          <ChartBox h={220}>
            <RC.BarChart data={agg.co} margin={{top:4,right:4,left:-18,bottom:0}}>
              <RC.CartesianGrid stroke={c.grid} vertical={false}/>
              <RC.XAxis dataKey="name" tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false} interval={0} angle={-28} textAnchor="end" height={46}/>
              <RC.YAxis tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false} tickFormatter={mkAxisFmt(Math.max(...agg.co.map(x=>x.value)))}/>
              <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>} cursor={{fill:c.grid,opacity:.4}}/>
              <RC.Bar dataKey="value" name="Sales" fill={c.info} radius={[5,5,0,0]} maxBarSize={30}/>
            </RC.BarChart>
          </ChartBox>
        </div>
      </Card>
      <Card className="min-w-0">
        <CardH title="Sales by Category" sub="Month to date" icon="Tags"/>
        <div className="p-3">
          <ChartBox h={220}>
            <RC.PieChart>
              <RC.Pie data={agg.cat} dataKey="value" nameKey="name" innerRadius={48} outerRadius={78}
                paddingAngle={2} strokeWidth={0}>
                {agg.cat.map((e,i)=><RC.Cell key={i} fill={S[i%S.length]}/>)}
              </RC.Pie>
              <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>}/>
              <RC.Legend verticalAlign="bottom" height={46} iconSize={8} iconType="circle"
                formatter={v=><span style={{fontSize:10.5,color:c.muted}}>{v}</span>}/>
            </RC.PieChart>
          </ChartBox>
        </div>
      </Card>
      <Card className="min-w-0">
        <CardH title={t('Payment Mix')} sub="Month to date" icon="CreditCard"/>
        <div className="p-4 grid gap-2.5">
          {agg.pay.map((p,i)=>{
            const total=sum(agg.pay,x=>x.value);
            return <div key={p.name}>
              <div className="flex items-center justify-between gap-2 mb-1">
                <span className="text-[12.5px] font-medium flex items-center gap-1.5">
                  <i className="dot" style={{background:S[i%S.length],width:7,height:7}}/>{t(p.name)}</span>
                <span className="t-meta num">{money(p.value,{bn:LANG==='bn'})} · {LANG==='bn'?toBn(pct(p.value,total)):pct(p.value,total)}%</span>
              </div>
              <div className="bar" style={{height:5}}><i style={{width:pct(p.value,total)+'%',background:S[i%S.length]}}/></div>
            </div>;
          })}
        </div>
      </Card>
    </div>

    {/* hourly + recent */}
    <div className="cols2" style={{'--c2':'minmax(0,1fr) minmax(0,1.25fr)'}}>
      <Card className="min-w-0">

                <td className="clip" style={{maxWidth:140}}>{s.custName}</td>
