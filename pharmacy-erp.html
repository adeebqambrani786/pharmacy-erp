function OfferForm({offer,onClose}){
  const {db,dispatch,toast}=useApp();
  const [f,setF]=useState({name:'',nameBn:'',type:'company',target:'Square',value:5,buyQty:10,getQty:1,
    from:TODAY,to:addDays(TODAY,30),branches:db.branches.map(b=>b.id),active:true,minBill:0,note:'',...offer});
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const targets=f.type==='company'?uniq(db.medicines.map(m=>m.company)).sort()
    :f.type==='category'?CATEGORIES:f.type==='item'||f.type==='bxgy'?db.medicines.map(m=>m.brand):['—'];
  const save=()=>{
    if(!f.name.trim()){ toast({tone:'err',title:'Give the offer a name'}); return }
    dispatch({type:'upsert',coll:'offers',item:{id:offer.id||uid('OF'),...f,
      value:Number(f.value),minBill:Number(f.minBill),buyQty:Number(f.buyQty),getQty:Number(f.getQty)}});
    toast({tone:'ok',title:offer.id?'Offer updated':'Offer created',
      body:`${f.name} · ${d_(f.from)} → ${d_(f.to)} · applies automatically at the counter.`});
    onClose();
  };
  return <Drawer open onClose={onClose} icon="BadgePercent" title={offer.id?'Edit offer':'New offer'}
    sub="Offers apply automatically on matching lines at POS"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={save}>{t('Save')}</Btn></Fragment>}>
    <div className="grid gap-3">
      <Field label="Offer name" req><Input value={f.name} onChange={e=>set('name',e.target.value)}
        placeholder="e.g. Square Pharma — 3% off"/></Field>
      <Field label="Bangla name"><Input className="bn" value={f.nameBn} onChange={e=>set('nameBn',e.target.value)}/></Field>
      <Field label="Offer type"><Select value={f.type} onChange={e=>{set('type',e.target.value);set('target','')}}>
        <option value="company">Percentage off — by company</option>
        <option value="category">Percentage off — by category</option>
        <option value="item">Percentage off — single item</option>
        <option value="bxgy">Buy X get Y free</option>
        <option value="minbill">Minimum bill discount</option></Select></Field>
      {f.type!=='minbill'&&<Field label="Applies to"><Select value={f.target} onChange={e=>set('target',e.target.value)}>
        <option value="">{t('Select')}…</option>
        {targets.map(x=><option key={x}>{x}</option>)}</Select></Field>}
      {f.type==='bxgy'
        ? <div className="grid gap-3 sm:grid-cols-2">
            <Field label="Buy quantity"><Input className="ta-right" value={f.buyQty} onChange={e=>set('buyQty',e.target.value.replace(/\D/g,''))}/></Field>
            <Field label="Free quantity"><Input className="ta-right" value={f.getQty} onChange={e=>set('getQty',e.target.value.replace(/\D/g,''))}/></Field>
          </div>
        : <Field label="Discount %"><Input className="ta-right" value={f.value} onChange={e=>set('value',e.target.value.replace(/[^\d.]/g,''))}/></Field>}
      {f.type==='minbill'&&<Field label="Minimum bill value">
        <Input className="ta-right" value={f.minBill} onChange={e=>set('minBill',e.target.value.replace(/\D/g,''))}/></Field>}
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label={t('From')}><Input type="date" value={f.from} onChange={e=>set('from',e.target.value)}/></Field>
        <Field label={t('To')}><Input type="date" value={f.to} onChange={e=>set('to',e.target.value)}/></Field>
      </div>
      <Field label="Branches">
        <div className="flex gap-1.5 flex-wrap">{db.branches.map(b=>
          <button key={b.id} className="chip" aria-pressed={f.branches.includes(b.id)}
            onClick={()=>set('branches',f.branches.includes(b.id)?f.branches.filter(x=>x!==b.id):[...f.branches,b.id])}>
            {b.name}</button>)}</div></Field>
      <Switch checked={f.active} onChange={v=>set('active',v)} label="Active"/>
      <Field label={t('Note')}><Input value={f.note} onChange={e=>set('note',e.target.value)}/></Field>
    </div>
  </Drawer>;
}
</script>

<script type="text/babel" data-presets="react">
/* ===================== 7.10 FINANCE ===================== */
function DailyClosing(){
  const {db,branchIds,toast,crumbs}=useApp();
  const [date,setDate]=useState(TODAY);
  const rows=db.branches.filter(b=>branchIds.includes(b.id)).map(b=>{
    const s=db.sales.filter(x=>x.branchId===b.id&&x.date===date&&x.status==='completed');
    const r=db.returns.filter(x=>x.branchId===b.id&&x.date===date);
    const e=db.expenses.filter(x=>x.branchId===b.id&&x.date===date);
    const byMethod={};
    s.forEach(x=>x.payments.forEach(p=>{byMethod[p.method]=round2((byMethod[p.method]||0)+p.amount)}));
    return {branch:b,bills:s.length,sales:round2(sum(s,x=>x.total)),profit:round2(sum(s,x=>x.profit)),
      returns:round2(sum(r,x=>x.total)),expenses:round2(sum(e,x=>x.amount)),byMethod,
      cash:byMethod.Cash||0,baki:round2(sum(s,x=>x.bakiAdded)),
      net:round2(sum(s,x=>x.total)-sum(r,x=>x.total)-sum(e,x=>x.amount))};
  });
  const tot=k=>round2(sum(rows,r=>r[k]));
  const methods=uniq(rows.flatMap(r=>Object.keys(r.byMethod)));
  return <div className="grid gap-4">
    <PageHeader title={t('Daily Closing')} icon="CalendarClock" crumbs={crumbs}
      sub={`${fDateLong(date,LANG==='bn')} · branch-wise collection, returns and expenses`}
      actions={<Fragment>
        <Input type="date" value={date} max={TODAY} onChange={e=>setDate(e.target.value)} style={{width:160}}/>
        <Btn icon="Printer" onClick={()=>printIt(toast)}>{t('Print')}</Btn>
      </Fragment>}/>
    <div className="grid-kpi">
      <KPI label={t('Sales')} value={tot('sales')} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Banknote"
        sub={`${num_(tot('bills'))} bills`}/>
      <KPI label="Cash in drawer" value={tot('cash')} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Wallet" tone="success"/>
      <KPI label="Returns" value={tot('returns')} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Undo2" tone="warning"/>
      <KPI label={t('Expenses')} value={tot('expenses')} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Receipt" tone="danger"/>
      <KPI label={t('Baki')} value={tot('baki')} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Clock" tone="warning"/>
      <KPI label="Net position" value={tot('net')} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Scale" tone="brand"/>
    </div>
    <Card className="print-sheet">
      <CardH title={`Daily closing — ${fDate(date)}`} icon="CalendarClock" sub={db.settings.pharmacy.name}/>
      <div className="tw"><table className="dt">
        <thead><tr><th>{t('Branch')}</th><th className="r">Bills</th><th className="r">{t('Sales')}</th>
          {methods.map(m=><th key={m} className="r">{t(m)}</th>)}
          <th className="r">Returns</th><th className="r">{t('Expenses')}</th><th className="r">Net</th></tr></thead>
        <tbody>{rows.map(r=><tr key={r.branch.id}>
          <td><div className="font-semibold">{r.branch.name}</div><div className="t-micro">{r.branch.city}</div></td>
          <td className="r num">{num_(r.bills)}</td>
          <td className="r num font-semibold">{money(r.sales,{bn:LANG==='bn'})}</td>
          {methods.map(m=><td key={m} className="r num">{r.byMethod[m]?money(r.byMethod[m],{sym:false}):'—'}</td>)}
          <td className="r num" style={{color:r.returns?'var(--warning)':undefined}}>{r.returns?money(r.returns,{sym:false}):'—'}</td>
          <td className="r num" style={{color:r.expenses?'var(--danger)':undefined}}>{r.expenses?money(r.expenses,{sym:false}):'—'}</td>
          <td className="r num font-semibold">{money(r.net,{bn:LANG==='bn'})}</td></tr>)}
        </tbody>
        <tfoot><tr style={{background:'var(--surface-2)'}}>
          <td className="font-semibold">Total</td><td className="r num font-semibold">{num_(tot('bills'))}</td>
          <td className="r num font-bold">{money(tot('sales'),{bn:LANG==='bn'})}</td>
          {methods.map(m=><td key={m} className="r num font-semibold">{money(sum(rows,r=>r.byMethod[m]||0),{sym:false})}</td>)}
          <td className="r num">{money(tot('returns'),{sym:false})}</td>
          <td className="r num">{money(tot('expenses'),{sym:false})}</td>
          <td className="r num font-bold">{money(tot('net'),{bn:LANG==='bn'})}</td></tr></tfoot>
      </table></div>
      <div className="card-f flex justify-between flex-wrap gap-4 t-micro">
        <span>Gross profit on the day: <b className="num">{money(tot('profit'))}</b></span>
        <span>Prepared by the accountant · checked by the branch manager</span>
      </div>
    </Card>
  </div>;
}

function Expenses(){
  const {db,dispatch,branchIds,user,toast,crumbs}=useApp();
  const [range,setRange]=useRange('mtd');
  const [cat,setCat]=useState('');
  const [form,setForm]=useState(null);
  const c=useThemeColors();
  const rows=db.expenses.filter(e=>branchIds.includes(e.branchId)&&e.date>=range.from&&e.date<=range.to&&(!cat||e.category===cat));
  const byCat=sortBy(Object.entries(groupBy(rows,e=>e.category)).map(([name,v])=>({name,value:round2(sum(v,x=>x.amount))})),x=>x.value,'desc');
  return <div className="grid gap-4">
    <PageHeader title={t('Expenses')} icon="Receipt" crumbs={crumbs}
      sub={`${money(sum(rows,r=>r.amount))} across ${num_(rows.length)} entries · ${d_(range.from)} → ${d_(range.to)}`}
      actions={<Fragment>
        <DateRange value={range} onChange={setRange}/>
        <Btn variant="primary" icon="Plus" onClick={()=>setForm({})}>Add expense</Btn>
      </Fragment>}/>
    <div className="cols2" style={{'--c2':'minmax(0,1fr) minmax(0,1.5fr)'}}>
      <Card className="min-w-0">
        <CardH title="By category" icon="ChartPie"/>
        <div className="p-3"><ChartBox h={230}>
          <RC.PieChart>
            <RC.Pie data={byCat} dataKey="value" nameKey="name" innerRadius={46} outerRadius={76} paddingAngle={2} strokeWidth={0}>
              {byCat.map((e,i)=><RC.Cell key={i} fill={CHART_SERIES(c)[i%8]}/>)}</RC.Pie>
            <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>}/>
            <RC.Legend verticalAlign="bottom" height={40} iconSize={8} iconType="circle"
              formatter={v=><span style={{fontSize:10.5,color:c.muted}}>{v}</span>}/>
          </RC.PieChart></ChartBox></div>
      </Card>
      <Card className="min-w-0">
        <CardH title="Category breakdown" icon="Tags" sub="Share of total spend"/>
        <div className="p-4 grid gap-2.5">
          {byCat.map((x,i)=><div key={x.name}>
            <div className="flex items-center justify-between gap-2 mb-1">
              <span className="text-[12.5px] font-medium flex items-center gap-1.5">
                <i className="dot" style={{background:CHART_SERIES(c)[i%8],width:7,height:7}}/>{x.name}</span>

        {k:'branch',h:t('Branch'),cell:e=><span className="t-meta">{db.branches.find(b=>b.id===e.branchId).name}</span>},
        {k:'method',h:'Paid by',cell:e=><Badge tone="neutral" sq>{t(e.method)}</Badge>},

function ExpenseForm({onClose}){
  const {db,dispatch,user,toast,branchIds}=useApp();
  const [f,setF]=useState({branchId:branchIds[0],date:TODAY,category:'Misc',amount:'',note:'',method:'Cash',vendor:''});
  const [err,setErr]=useState('');
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const save=()=>{
    if(!(Number(f.amount)>0)){ setErr('Enter an amount.'); return }
    if(!f.note.trim()){ setErr('Describe what the expense was for.'); return }
    dispatch({type:'upsert',coll:'expenses',item:{id:uid('EX'),...f,amount:Number(f.amount),
      vendor:f.vendor||'—',attachment:null,enteredBy:user.empId||user.id,approved:true}});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Expense recorded',
      entity:'Expense',detail:`${f.category} · ${money(Number(f.amount))} · ${f.note}`,branchId:f.branchId}});
    toast({tone:'ok',title:'Expense recorded',body:`${f.category} · ${money(Number(f.amount))} — reflected in P&L and budgets.`});
    onClose();
  };
  return <Drawer open onClose={onClose} icon="Receipt" title="Add expense"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={save}>{t('Save')}</Btn></Fragment>}>
    <div className="grid gap-3">
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label={t('Branch')}><Select value={f.branchId} onChange={e=>set('branchId',e.target.value)}>
          {db.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select></Field>
        <Field label={t('Date')}><Input type="date" value={f.date} max={TODAY} onChange={e=>set('date',e.target.value)}/></Field>
      </div>
      <Field label={t('Category')}><Select value={f.category} onChange={e=>set('category',e.target.value)}>
        {EXP_CATS.map(x=><option key={x}>{x}</option>)}</Select></Field>
      <Field label={t('Amount')} req><Input className="ta-right" value={f.amount}
        onChange={e=>{set('amount',e.target.value.replace(/[^\d.]/g,''));setErr('')}}
        style={{fontSize:18,height:44,fontWeight:600}}/></Field>
      <Field label="Paid by"><Select value={f.method} onChange={e=>set('method',e.target.value)}>
        {['Cash','Bank','bKash','Nagad','Cheque'].map(m=><option key={m}>{m}</option>)}</Select></Field>
      <Field label="Vendor / payee"><Input value={f.vendor} onChange={e=>set('vendor',e.target.value)}/></Field>
      <Field label="Details" req><Textarea value={f.note} onChange={e=>{set('note',e.target.value);setErr('')}}/></Field>
      <Btn icon="Paperclip" onClick={()=>toast({tone:'info',title:'Attach receipt',
        body:'The live build stores a photo of the voucher against this entry.'})}>Attach receipt photo</Btn>
      {err&&<div className="err">{err}</div>}
    </div>
  </Drawer>;
}

        {k:'oldest',h:'Oldest credit',sort:c=>c.oldest,cell:c=><div><div className="num">{d_(c.oldest)}</div>
          <div className="t-micro">{num_(c.age)} days</div></div>},

function ProfitLoss(){
  const {db,branchIds,branchId,theme,toast,crumbs}=useApp();
  const c=useThemeColors(theme);
  const [mode,setMode]=useState('fy');
  const [range,setRange]=useRange('mtd');
  const fy=fyOf(TODAY);
  const period = mode==='fy'? {from:fyRange(fy).from,to:TODAY} : range;
  const P=useMemo(()=>{
    const sales=SEL.salesIn(db,branchIds,period.from,period.to);
    const rets=db.returns.filter(r=>branchIds.includes(r.branchId)&&r.date>=period.from&&r.date<=period.to);
    const exps=db.expenses.filter(e=>branchIds.includes(e.branchId)&&e.date>=period.from&&e.date<=period.to);
    const revenue=round2(sum(sales,s=>s.total)-sum(sales,s=>s.vat));
    const returns=round2(sum(rets,r=>r.total));
    const cogs=round2(sum(sales,s=>s.cost));
    const gross=round2(revenue-returns-cogs);
    const byCat=Object.entries(groupBy(exps,e=>e.category)).map(([k,v])=>({name:k,value:round2(sum(v,x=>x.amount))}));
    const opex=round2(sum(exps,e=>e.amount));
    return {revenue,returns,cogs,gross,byCat:sortBy(byCat,x=>x.value,'desc'),opex,net:round2(gross-opex),
      bills:sales.length,vat:round2(sum(sales,s=>s.vat))};
  },[db,branchIds,period.from,period.to]);
  const monthly=useMemo(()=>{
    const out=[];
    for(let i=0;i<12;i++){
      const mkey=monKey(addMon(fyRange(fy).from,i));
      if(mkey>monKey(TODAY)) break;
      const s=SEL.salesIn(db,branchIds,mkey+'-01',mkey+'-'+monDays(mkey));
      const e=db.expenses.filter(x=>branchIds.includes(x.branchId)&&monKey(x.date)===mkey);
      const rev=round2(sum(s,x=>x.total)-sum(s,x=>x.vat));
      const gp=round2(rev-sum(s,x=>x.cost));
      out.push({x:monLabel(mkey).split(' ')[0],revenue:rev,gross:gp,opex:round2(sum(e,x=>x.amount)),
        net:round2(gp-sum(e,x=>x.amount))});
    }
    return out;
  },[db,branchIds,fy]);
  const L=({label,value,bold,indent,tone,note})=>
    <div className="flex items-baseline justify-between gap-4 py-2"
      style={{borderBottom:'1px solid var(--border)',paddingLeft:indent?20:0}}>
      <span className={bold?'text-[13.5px] font-semibold':'text-[13px] muted'}>{label}
        {note&&<span className="t-micro ml-2">{note}</span>}</span>
      <span className={cls('num',bold?'text-[15px] font-bold':'text-[13.5px]')}
        style={tone?{color:`var(--${tone})`}:undefined}>{money(value,{bn:LANG==='bn'})}</span>
    </div>;
  return <div className="grid gap-4">
    <PageHeader title={t('Profit & Loss')} icon="ChartNoAxesCombined" crumbs={crumbs}
      sub={`${mode==='fy'?fyLabel(fy)+' (July–June)':`${d_(period.from)} → ${d_(period.to)}`} · ${branchId==='ALL'?t('All Branches'):db.branches.find(b=>b.id===branchId).name}`}
      actions={<Fragment>
        <Seg options={[{v:'fy',l:'Fiscal year'},{v:'custom',l:'Custom'}]} value={mode} onChange={setMode}/>
        {mode==='custom'&&<DateRange value={range} onChange={setRange}/>}
        <Btn icon="Printer" onClick={()=>printIt(toast)}>{t('Print')}</Btn>
      </Fragment>}/>
    <div className="grid-kpi">
      <KPI label={t('Revenue')} value={P.revenue} fmt={v=>moneyK(v,LANG==='bn')} icon="Banknote" sub={`${num_(P.bills)} invoices, net of VAT`}/>
      <KPI label="Cost of goods sold" value={P.cogs} fmt={v=>moneyK(v,LANG==='bn')} icon="Package" tone="warning"/>
      <KPI label={t('Gross Profit')} value={P.gross} fmt={v=>moneyK(v,LANG==='bn')} icon="TrendingUp" tone="success"
        sub={`${pct(P.gross,P.revenue)}% margin`}/>
      <KPI label="Operating expenses" value={P.opex} fmt={v=>moneyK(v,LANG==='bn')} icon="Receipt" tone="danger"/>
      <KPI label="Net profit" value={P.net} fmt={v=>moneyK(v,LANG==='bn')} icon="Scale" tone="brand"
        sub={`${pct(P.net,P.revenue)}% of revenue`}/>
      <KPI label="VAT collected" value={P.vat} fmt={v=>moneyK(v,LANG==='bn')} icon="Landmark" tone="purple" sub="Payable to NBR"/>
    </div>
    <div className="cols2" style={{'--c2':'minmax(0,1fr) minmax(0,1.3fr)'}}>
      <Card className="min-w-0 print-sheet">
        <CardH title="Profit & loss statement" icon="FileSpreadsheet"
          sub={mode==='fy'?`${fyLabel(fy)} to date`:`${d_(period.from)} → ${d_(period.to)}`}/>
        <div className="p-4">
          <L label="Revenue (net of VAT)" value={P.revenue} bold/>
          <L label="Less: sales returns" value={-P.returns} indent tone="warning"/>
          <L label="Less: cost of goods sold" value={-P.cogs} indent tone="warning"/>
          <L label="Gross profit" value={P.gross} bold tone="success" note={`${pct(P.gross,P.revenue)}%`}/>
          <div className="t-lbl mt-4 mb-1">Operating expenses</div>
          {P.byCat.map(x=><L key={x.name} label={x.name} value={-x.value} indent/>)}
          <L label="Total operating expenses" value={-P.opex} bold tone="danger"/>
          <div className="mt-4 p-3 rounded-[10px] flex items-baseline justify-between"
            style={{background:P.net>=0?'var(--success-soft)':'var(--danger-soft)',
              border:'1px solid '+(P.net>=0?'var(--success-line)':'var(--danger-line)')}}>
            <span className="t-sec" style={{fontSize:14}}>Net profit</span>
            <span className="t-kpi num" style={{color:P.net>=0?'var(--success)':'var(--danger)'}}>
              {money(P.net,{bn:LANG==='bn'})}</span>
          </div>
          <div className="t-micro mt-3">Fiscal year runs 1 July → 30 June, per Bangladesh practice.
            VAT collected is shown separately and excluded from revenue.</div>
        </div>
      </Card>
      <Card className="min-w-0">
        <CardH title="Monthly trend" icon="ChartColumn" sub={`${fyLabel(fy)} · revenue, gross profit and net`}/>
        <div className="p-3"><ChartBox h={300}>
          <RC.ComposedChart data={monthly} margin={{top:8,right:8,left:-14,bottom:0}}>
            <RC.CartesianGrid stroke={c.grid} vertical={false}/>
            <RC.XAxis dataKey="x" tick={{fontSize:10.5,fill:c.subtle}} axisLine={false} tickLine={false}/>
            <RC.YAxis tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false}
              tickFormatter={mkAxisFmt(Math.max(...monthly.map(m=>m.revenue),1))}/>
            <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>} cursor={{fill:c.grid,opacity:.3}}/>
            <RC.Legend iconSize={8} iconType="circle" formatter={v=><span style={{fontSize:11,color:c.muted}}>{v}</span>}/>
            <RC.Bar dataKey="revenue" name="Revenue" fill={c.primary} radius={[4,4,0,0]} maxBarSize={28}/>
            <RC.Bar dataKey="gross" name="Gross profit" fill={c.success} radius={[4,4,0,0]} maxBarSize={28}/>
            <RC.Line type="monotone" dataKey="net" name="Net profit" stroke={c.warning} strokeWidth={2} dot={{r:3}}/>
          </RC.ComposedChart></ChartBox></div>
      </Card>
    </div>
    {branchId==='ALL'&&<Card>
      <CardH title="Branch contribution" icon="Building2" sub="Same period, per branch"/>
      <div className="tw"><table className="dt">
        <thead><tr><th>{t('Branch')}</th><th className="r">{t('Revenue')}</th><th className="r">COGS</th>
          <th className="r">{t('Gross Profit')}</th><th className="r">Margin</th><th className="r">{t('Expenses')}</th>
          <th className="r">Net</th></tr></thead>
        <tbody>{db.branches.map(b=>{
          const s=SEL.salesIn(db,[b.id],period.from,period.to);
          const e=db.expenses.filter(x=>x.branchId===b.id&&x.date>=period.from&&x.date<=period.to);
          const rev=round2(sum(s,x=>x.total)-sum(s,x=>x.vat));
          const cogs=round2(sum(s,x=>x.cost));
          const gp=round2(rev-cogs), op=round2(sum(e,x=>x.amount));
          return <tr key={b.id}>
            <td><div className="font-semibold">{b.name}</div><div className="t-micro">{b.city}</div></td>
            <td className="r num">{money(rev,{bn:LANG==='bn'})}</td>
            <td className="r num">{money(cogs,{bn:LANG==='bn'})}</td>
            <td className="r num" style={{color:'var(--success)'}}>{money(gp,{bn:LANG==='bn'})}</td>
            <td className="r num">{LANG==='bn'?toBn(pct(gp,rev)):pct(gp,rev)}%</td>
            <td className="r num" style={{color:'var(--danger)'}}>{money(op,{bn:LANG==='bn'})}</td>
            <td className="r num font-semibold">{money(gp-op,{bn:LANG==='bn'})}</td></tr>;
        })}</tbody></table></div>
    </Card>}
  </div>;
}

function CashBank(){
  const {db,dispatch,branchIds,toast,crumbs}=useApp();
  const [xfer,setXfer]=useState(false);
  const accounts=db.cashAccounts.filter(a=>!a.branchId||branchIds.includes(a.branchId));
  const total=sum(accounts,a=>a.balance);
  const icon=t=>t==='cash'?'Wallet':t==='bank'?'Landmark':'Smartphone';
  const tone=t=>t==='cash'?'success':t==='bank'?'info':t==='bkash'?'purple':'warning';
  return <div className="grid gap-4">
    <PageHeader title={t('Cash & Bank')} icon="Landmark" crumbs={crumbs}
      sub={`${money(total)} across ${accounts.length} accounts`}
      actions={<Btn variant="primary" icon="ArrowLeftRight" onClick={()=>setXfer(true)}>Transfer between accounts</Btn>}/>
    <div className="grid-kpi">
      <KPI label="Total balance" value={total} fmt={v=>moneyK(v,LANG==='bn')} icon="Landmark" tone="brand"/>
      <KPI label="Cash in drawers" value={sum(accounts.filter(a=>a.type==='cash'),a=>a.balance)}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="Wallet" tone="success"/>
      <KPI label="Bank balances" value={sum(accounts.filter(a=>a.type==='bank'),a=>a.balance)}
        fmt={v=>moneyK(v,LANG==='bn')} icon="Building" tone="info"/>
      <KPI label="Mobile wallets" value={sum(accounts.filter(a=>['bkash','nagad'].includes(a.type)),a=>a.balance)}
        fmt={v=>moneyK(v,LANG==='bn')} icon="Smartphone" tone="purple"/>
    </div>
    <div className="grid-3">
      {accounts.map(a=><Card key={a.id} lift>
        <div className="p-4">
          <div className="flex items-start justify-between gap-2 mb-3">
            <span className="grid place-items-center w-9 h-9 rounded-[10px]"
              style={{background:`var(--${tone(a.type)}-soft)`,color:`var(--${tone(a.type)})`}}>
              <Icon name={icon(a.type)} size={17}/></span>
            <Badge tone="neutral">{a.type==='bkash'?'bKash':a.type==='nagad'?'Nagad':a.type}</Badge>
          </div>
          <div className="t-lbl clip">{a.name}</div>
          <div className="t-kpi num mt-1">{money(a.balance,{bn:LANG==='bn'})}</div>
          <div className="t-micro mt-1.5">{a.branchId?db.branches.find(b=>b.id===a.branchId).name:'Head office'}</div>
        </div>
      </Card>)}
    </div>
    <Card>
      <CardH title="Collections by method" icon="CreditCard" sub="This month across the selected branches"/>
      <div className="p-4 grid gap-2.5">
        {(()=>{
          const s=SEL.salesIn(db,branchIds,monKey(TODAY)+'-01',TODAY);
          const by={}; s.forEach(x=>x.payments.forEach(p=>{by[p.method]=round2((by[p.method]||0)+p.amount)}));
          const rows=sortBy(Object.entries(by).map(([k,v])=>({k,v})),x=>x.v,'desc');
          const max=rows.length?rows[0].v:1;
          return rows.map(r=><div key={r.k}>
            <div className="flex items-center justify-between gap-2 mb-1">
              <span className="text-[12.5px] font-medium">{t(r.k)}</span>
              <span className="t-meta num">{money(r.v,{bn:LANG==='bn'})}</span></div>
            <Bar value={pct(r.v,max)} tone={r.k==='Cash'?'success':r.k==='Baki'?'warning':'primary'}/>
          </div>);
        })()}
      </div>
    </Card>
    <Modal open={xfer} onClose={()=>setXfer(false)} icon="ArrowLeftRight" title="Transfer between accounts"
      sub="Deposit cash to bank, settle a mobile wallet or move a float"
      footer={<Fragment><Btn onClick={()=>setXfer(false)}>{t('Cancel')}</Btn>
        <Btn variant="primary" icon="Check" onClick={()=>{toast({tone:'ok',title:'Transfer recorded',
          body:'Both account balances updated and posted to the cash book.'});setXfer(false)}}>{t('Confirm')}</Btn></Fragment>}>
      <div className="grid gap-3">
        <Field label="From account"><Select>{accounts.map(a=><option key={a.id}>{a.name} — {money(a.balance)}</option>)}</Select></Field>
        <Field label="To account"><Select defaultValue={accounts[3]&&accounts[3].name}>{accounts.map(a=><option key={a.id}>{a.name}</option>)}</Select></Field>
        <Field label={t('Amount')}><Input className="ta-right" placeholder="0" style={{fontSize:18,height:44,fontWeight:600}}/></Field>
        <Field label={t('Note')}><Input placeholder="e.g. Daily cash deposit — Dhanmondi"/></Field>
      </div>
    </Modal>
  </div>;
}

function Budgets(){
  const {db,branchIds,theme,toast,crumbs}=useApp();
  const c=useThemeColors(theme);
  const rows=db.budgets.filter(b=>branchIds.includes(b.branchId)).map(b=>({...b,
    pct:pct(b.actual,b.budget),variance:round2(b.budget-b.actual)}));
  const byBranch=groupBy(rows,r=>r.branchId);
  return <div className="grid gap-4">
    <PageHeader title={t('Budgets')} icon="Target" crumbs={crumbs}
      sub={`${monLabel(monKey(TODAY),LANG==='bn')} · branch budgets against actual spend`}
      actions={<Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'Budget report exported'})}>{t('Export')}</Btn>}/>
    <div className="grid-kpi">
      <KPI label="Budgeted" value={sum(rows,r=>r.budget)} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Target"/>
      <KPI label="Actual spend" value={sum(rows,r=>r.actual)} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Receipt" tone="warning"/>
      <KPI label="Variance" value={sum(rows,r=>r.variance)} fmt={v=>money(v,{bn:LANG==='bn',sign:true})} icon="Scale"
        tone={sum(rows,r=>r.variance)>=0?'success':'danger'}/>
      <KPI label="Over budget lines" value={rows.filter(r=>r.actual>r.budget).length} icon="TriangleAlert" tone="danger"/>
    </div>
    <div className="grid gap-4 lg:grid-cols-3">
      {Object.entries(byBranch).map(([bid,list])=>{
        const b=db.branches.find(x=>x.id===bid);
        const tb=sum(list,x=>x.budget), ta=sum(list,x=>x.actual);
        return <Card key={bid} className="min-w-0">
          <CardH title={b.name} sub={`${money(ta)} of ${money(tb)} · ${pct(ta,tb)}%`} icon="Building2"
            right={<Badge tone={ta>tb?'bad':ta>tb*0.9?'warn':'ok'}>{ta>tb?'Over':'On track'}</Badge>}/>
          <div className="p-4 grid gap-3">
            {list.map(r=><div key={r.category}>
              <div className="flex items-center justify-between gap-2 mb-1">
                <span className="text-[12.5px] font-medium">{r.category}</span>
                <span className="t-meta num">{money(r.actual,{sym:false})} / {money(r.budget,{sym:false})}</span></div>
              <Bar value={Math.min(100,r.pct)} tone={r.pct>100?'danger':r.pct>90?'warning':'primary'} h={6}/>
              <div className="t-micro mt-1" style={{color:r.variance<0?'var(--danger)':'var(--fg-subtle)'}}>
                {r.variance<0?`${money(-r.variance)} over budget`:`${money(r.variance)} left`}</div>
            </div>)}
          </div>
        </Card>;
      })}
    </div>
  </div>;
}
</script>

<script type="text/babel" data-presets="react">
/* ===================== 7.11 REPORTS ===================== */
const REPORTS=[

  {k:'vat',g:'Compliance',l:'VAT report',icon:'Landmark',d:'NBR-style output VAT by rate and branch'},
  {k:'baki',g:'Compliance',l:'Baki aging',icon:'Clock',d:'Customer credit by age bucket'},
  {k:'controlled',g:'Compliance',l:'Controlled drugs register',icon:'Lock',d:'DGDA narcotics register with doctor and patient'},
  {k:'shift',g:'Compliance',l:'Shift / cash closing',icon:'Wallet',d:'Expected vs counted cash with variance'},
  {k:'cheque',g:'Compliance',l:'Cheque register',icon:'ScrollText',d:'Issued and received cheques by status'},
  {k:'hr-attendance',g:'HR',l:'Attendance summary',icon:'CalendarCheck',d:'Present, absent, late and leave per employee'},
  {k:'hr-late',g:'HR',l:'Late report',icon:'AlarmClock',d:'Late arrivals, minutes and penalty'},
  {k:'hr-leave',g:'HR',l:'Leave report',icon:'Plane',d:'Leave taken by type with balances'},
  {k:'hr-ot',g:'HR',l:'Overtime report',icon:'Timer',d:'Overtime hours and payable amount'},
  {k:'hr-salary',g:'HR',l:'Salary sheet',icon:'FileSpreadsheet',d:'Full payroll sheet for any processed month'},
  {k:'hr-payroll',g:'HR',l:'Payroll summary',icon:'Banknote',d:'Gross, deductions and net by branch'},
  {k:'hr-commission',g:'HR',l:'Commission report',icon:'BadgePercent',d:'Sales commission earned per staff member'},
  {k:'hr-cost',g:'HR',l:'Staff cost per branch',icon:'Building2',d:'Payroll as a share of branch revenue'},
];

function Reports(){
  const {db,branchIds,branchId,user,toast,crumbs,go}=useApp();
  const [active,setActive]=useState(null);
  const [range,setRange]=useRange('30d');
  const [q,setQ]=useState('');
  const groups=['Sales','Purchase','Stock','Compliance','HR'];
  const visible=REPORTS.filter(r=>(user.role!=='HR Manager'||r.g==='HR'||r.g==='Sales')&&
    (!q||r.l.toLowerCase().includes(q.toLowerCase())||r.d.toLowerCase().includes(q.toLowerCase())));
  if(active) return <ReportView rep={REPORTS.find(r=>r.k===active)} range={range} setRange={setRange}
    onBack={()=>setActive(null)}/>;
  return <div className="grid gap-4">
    <PageHeader title={t('Reports')} icon="ChartPie" crumbs={crumbs}
      sub={`${REPORTS.length} reports · date range and branch filters · print and export on every one`}
      actions={<Fragment>
        <DateRange value={range} onChange={setRange}/>
        <Searchbox sm value={q} onChange={setQ} placeholder="Find a report…" className="w-48"/>
      </Fragment>}/>
    {groups.map(g=>{
      const list=visible.filter(r=>r.g===g);
      if(!list.length) return null;
      return <div key={g}>
        <div className="t-lbl mb-2.5">{g}</div>
        <div className="grid-3">
          {list.map(r=><Card key={r.k} lift className="cursor-pointer" onClick={()=>setActive(r.k)}
            role="button" tabIndex={0} onKeyDown={e=>{if(e.key==='Enter')setActive(r.k)}}>
            <div className="p-4 flex items-start gap-3">
              <span className="grid place-items-center w-9 h-9 rounded-[10px] shrink-0"
                style={{background:'var(--primary-soft)',color:'var(--primary)'}}><Icon name={r.icon} size={17}/></span>
              <div className="min-w-0">
                <div className="text-[13.5px] font-semibold clip">{r.l}</div>
                <div className="t-micro mt-0.5 leading-snug">{r.d}</div>
              </div>
              <Icon name="ArrowRight" size={14} style={{color:'var(--fg-faint)',flex:'none',marginTop:4}}/>
            </div>
          </Card>)}
        </div>
      </div>;
    })}
    {visible.length===0&&<Card><Empty icon="Search" title="No report matches" desc={`Nothing found for “${q}”.`}/></Card>}
  </div>;
}

function ReportView({rep,range,setRange,onBack}){
  const {db,branchIds,branchId,toast,crumbs}=useApp();
  const c=useThemeColors();
  const {from,to}=range;
  const sales=useMemo(()=>SEL.salesIn(db,branchIds,from,to),[db,branchIds,from,to]);
  const items=useMemo(()=>sales.flatMap(s=>s.items.map(i=>({...i,date:s.date,branchId:s.branchId,
    cashierId:s.cashierId,hour:s.hour,no:s.no,custName:s.custName,doctorId:s.doctorId}))),[sales]);
  const bn=id=>(db.branches.find(b=>b.id===id)||{}).name;
  const en=id=>(db.employees.find(e=>e.id===id)||{}).name||id;

  const R=useMemo(()=>{
    switch(rep.k){
      case 'sales-daily': {
        const days=uniq(sales.map(s=>s.date)).sort();
        return {cols:[{k:'date',h:t('Date'),cell:r=><span className="num">{d_(r.date)}</span>,sort:r=>r.date},
          {k:'dow',h:'Day',cell:r=><span className="t-meta">{fDow(r.date,LANG==='bn')}</span>},
          {k:'bills',h:'Bills',cls:'r',sort:r=>r.bills,cell:r=><span className="num">{num_(r.bills)}</span>},
          {k:'sales',h:t('Sales'),cls:'r',sort:r=>r.sales,cell:r=><span className="num font-semibold">{money(r.sales,{bn:LANG==='bn'})}</span>},
          {k:'disc',h:t('Discount'),cls:'r',sort:r=>r.disc,cell:r=><span className="num">{money(r.disc,{bn:LANG==='bn'})}</span>},
          {k:'vat',h:t('VAT'),cls:'r',cell:r=><span className="num">{money(r.vat,{bn:LANG==='bn'})}</span>},
          {k:'profit',h:t('Profit'),cls:'r',sort:r=>r.profit,cell:r=><span className="num" style={{color:'var(--success)'}}>{money(r.profit,{bn:LANG==='bn'})}</span>},
          {k:'cash',h:t('Cash'),cls:'r',cell:r=><span className="num">{money(r.cash,{bn:LANG==='bn'})}</span>},
          {k:'baki',h:t('Baki'),cls:'r',cell:r=><span className="num">{money(r.baki,{bn:LANG==='bn'})}</span>}],
          rows:days.map(dd=>{const s=sales.filter(x=>x.date===dd);
            return {id:dd,date:dd,bills:s.length,sales:round2(sum(s,x=>x.total)),disc:round2(sum(s,x=>x.itemDisc+x.billDisc)),
              vat:round2(sum(s,x=>x.vat)),profit:round2(sum(s,x=>x.profit)),
              cash:round2(sum(s,x=>sum(x.payments.filter(p=>p.method==='Cash'),p=>p.amount))),
              baki:round2(sum(s,x=>x.bakiAdded))}}),
          chart:{type:'area',data:days.map(dd=>({x:fDateS(dd),v:round2(sum(sales.filter(x=>x.date===dd),x=>x.total))})),label:'Sales'}};
      }
      case 'sales-item': case 'profit-item': {
        const g=groupBy(items,i=>i.medId);
        const rows=Object.entries(g).map(([mid,list])=>{
          const m=db.medicines.find(x=>x.id===mid)||{};
          const value=round2(sum(list,i=>i.amount)), cost=round2(sum(list,i=>i.cost));
          return {id:mid,brand:m.brand,strength:m.strength,company:m.company,category:m.category,
            qty:sum(list,i=>i.pieces),bills:list.length,value,cost,profit:round2(value-cost),
            margin:value?pct(value-cost,value):0};
        });
        return {cols:[{k:'brand',h:t('Medicines'),sort:r=>r.brand,cell:r=><div>
            <div className="font-semibold">{r.brand} <span className="t-meta">{r.strength}</span></div>
            <div className="t-micro">{r.company} · {r.category}</div></div>},
          {k:'bills',h:'Lines',cls:'r',sort:r=>r.bills,cell:r=><span className="num">{num_(r.bills)}</span>},
          {k:'qty',h:'Pieces',cls:'r',sort:r=>r.qty,cell:r=><span className="num">{num_(r.qty)}</span>},
          {k:'value',h:t('Sales'),cls:'r',sort:r=>r.value,cell:r=><span className="num font-semibold">{money(r.value,{bn:LANG==='bn'})}</span>},
          {k:'cost',h:'Cost',cls:'r',sort:r=>r.cost,cell:r=><span className="num">{money(r.cost,{bn:LANG==='bn'})}</span>},
          {k:'profit',h:t('Profit'),cls:'r',sort:r=>r.profit,cell:r=><span className="num" style={{color:'var(--success)'}}>{money(r.profit,{bn:LANG==='bn'})}</span>},
          {k:'margin',h:'Margin',cls:'r',sort:r=>r.margin,cell:r=><span className="num">{LANG==='bn'?toBn(r.margin):r.margin}%</span>}],
          rows, sort:{k:rep.k==='profit-item'?'profit':'value',dir:'desc'},
          chart:{type:'bar',data:sortBy(rows,r=>rep.k==='profit-item'?r.profit:r.value,'desc').slice(0,10)
            .map(r=>({x:r.brand,v:rep.k==='profit-item'?r.profit:r.value})),label:rep.k==='profit-item'?'Gross profit':'Sales'}};
      }
      case 'sales-company': case 'sales-category': {
        const key=rep.k==='sales-company'?'company':'category';
        const g=groupBy(items,i=>i[key]);
        const rows=Object.entries(g).map(([name,list])=>{
          const value=round2(sum(list,i=>i.amount)), cost=round2(sum(list,i=>i.cost));
          return {id:name,name,items:uniq(list.map(i=>i.medId)).length,qty:sum(list,i=>i.pieces),
            value,profit:round2(value-cost),margin:value?pct(value-cost,value):0};
        });
        const tot=sum(rows,r=>r.value);
        return {cols:[{k:'name',h:rep.k==='sales-company'?t('Company'):t('Category'),sort:r=>r.name,
            cell:r=><span className="font-semibold">{r.name}</span>},
          {k:'items',h:'Items',cls:'r',sort:r=>r.items,cell:r=><span className="num">{num_(r.items)}</span>},
          {k:'qty',h:'Pieces',cls:'r',sort:r=>r.qty,cell:r=><span className="num">{num_(r.qty)}</span>},
          {k:'value',h:t('Sales'),cls:'r',sort:r=>r.value,cell:r=><span className="num font-semibold">{money(r.value,{bn:LANG==='bn'})}</span>},
          {k:'share',h:'Share',cls:'r',sort:r=>r.value,cell:r=><div className="flex items-center gap-2 justify-end">
            <div style={{width:52}}><Bar value={pct(r.value,tot)} h={5}/></div>
            <span className="num" style={{minWidth:36}}>{LANG==='bn'?toBn(pct(r.value,tot)):pct(r.value,tot)}%</span></div>},
          {k:'profit',h:t('Profit'),cls:'r',sort:r=>r.profit,cell:r=><span className="num" style={{color:'var(--success)'}}>{money(r.profit,{bn:LANG==='bn'})}</span>},
          {k:'margin',h:'Margin',cls:'r',cell:r=><span className="num">{LANG==='bn'?toBn(r.margin):r.margin}%</span>}],
          rows,sort:{k:'value',dir:'desc'},
          chart:{type:'bar',data:sortBy(rows,r=>r.value,'desc').slice(0,10).map(r=>({x:r.name,v:r.value})),label:'Sales'}};
      }
      case 'sales-cashier': {
        const g=groupBy(sales,s=>s.cashierId);
        const rows=Object.entries(g).map(([cid,list])=>{
          const e=db.employees.find(x=>x.id===cid)||{};
          const value=round2(sum(list,s=>s.total));
          return {id:cid,name:en(cid),desig:e.desig,branch:bn(e.branchId),bills:list.length,value,
            disc:round2(sum(list,s=>s.itemDisc+s.billDisc)),profit:round2(sum(list,s=>s.profit)),
            avg:list.length?round2(value/list.length):0,commission:e.commRate?Math.round(value*e.commRate/100):0};
        });
        return {cols:[{k:'name',h:t('Cashier'),sort:r=>r.name,cell:r=><div>
            <div className="font-semibold">{r.name}</div><div className="t-micro">{r.desig} · {r.branch}</div></div>},
          {k:'bills',h:'Bills',cls:'r',sort:r=>r.bills,cell:r=><span className="num">{num_(r.bills)}</span>},
          {k:'value',h:t('Sales'),cls:'r',sort:r=>r.value,cell:r=><span className="num font-semibold">{money(r.value,{bn:LANG==='bn'})}</span>},
          {k:'avg',h:'Avg bill',cls:'r',sort:r=>r.avg,cell:r=><span className="num">{money(r.avg,{bn:LANG==='bn'})}</span>},
          {k:'disc',h:t('Discount'),cls:'r',sort:r=>r.disc,cell:r=><span className="num">{money(r.disc,{bn:LANG==='bn'})}</span>},
          {k:'profit',h:t('Profit'),cls:'r',sort:r=>r.profit,cell:r=><span className="num" style={{color:'var(--success)'}}>{money(r.profit,{bn:LANG==='bn'})}</span>},
          {k:'commission',h:t('Commission'),cls:'r',sort:r=>r.commission,cell:r=><span className="num">{money(r.commission,{bn:LANG==='bn'})}</span>}],
          rows,sort:{k:'value',dir:'desc'},
          chart:{type:'bar',data:sortBy(rows,r=>r.value,'desc').map(r=>({x:r.name.split(' ')[0],v:r.value})),label:'Sales'}};
      }
      case 'sales-payment': {
        const by={};
        sales.forEach(s=>s.payments.forEach(p=>{
          by[p.method]=by[p.method]||{id:p.method,name:p.method,count:0,value:0};
          by[p.method].count++; by[p.method].value=round2(by[p.method].value+p.amount)}));
        const rows=Object.values(by); const tot=sum(rows,r=>r.value);
        return {cols:[{k:'name',h:t('Payment Method'),sort:r=>r.name,cell:r=><Badge tone={r.name==='Baki'?'warn':'neutral'}>{t(r.name)}</Badge>},
          {k:'count',h:'Transactions',cls:'r',sort:r=>r.count,cell:r=><span className="num">{num_(r.count)}</span>},
          {k:'value',h:t('Amount'),cls:'r',sort:r=>r.value,cell:r=><span className="num font-semibold">{money(r.value,{bn:LANG==='bn'})}</span>},
          {k:'share',h:'Share',cls:'r',sort:r=>r.value,cell:r=><div className="flex items-center gap-2 justify-end">
            <div style={{width:60}}><Bar value={pct(r.value,tot)} h={5}/></div>
            <span className="num" style={{minWidth:38}}>{LANG==='bn'?toBn(pct(r.value,tot)):pct(r.value,tot)}%</span></div>},
          {k:'avg',h:'Average',cls:'r',cell:r=><span className="num">{money(r.value/Math.max(1,r.count),{bn:LANG==='bn'})}</span>}],
          rows,sort:{k:'value',dir:'desc'},
          chart:{type:'pie',data:rows.map(r=>({x:r.name,v:r.value})),label:'Collection'}};
      }
      case 'sales-hourly': {
        const rows=Array.from({length:15},(_,i)=>{
          const h=i+8; const s=sales.filter(x=>x.hour===h);
          return {id:h,hour:h,bills:s.length,value:round2(sum(s,x=>x.total)),
            avg:s.length?round2(sum(s,x=>x.total)/s.length):0};

        const cols= rep.k==='hr-late'
          ? [...base,{k:'late',h:'Late days',cls:'r',sort:r=>r.late,cell:r=><span className="num font-semibold"
              style={{color:r.late>3?'var(--warning)':undefined}}>{num_(r.late)}</span>},
            {k:'lateMin',h:'Total minutes',cls:'r',sort:r=>r.lateMin,cell:r=><span className="num">{num_(r.lateMin)}</span>},
            {k:'avg',h:'Avg per late day',cls:'r',cell:r=><span className="num">{r.late?Math.round(r.lateMin/r.late):0} min</span>},
            {k:'penalty',h:'Penalty',cls:'r',sort:r=>r.penalty,cell:r=><span className="num" style={{color:r.penalty?'var(--danger)':undefined}}>{r.penalty?money(r.penalty,{bn:LANG==='bn'}):'—'}</span>}]
          : rep.k==='hr-ot'
          ? [...base,{k:'ot',h:'Overtime hours',cls:'r',sort:r=>r.ot,cell:r=><span className="num font-semibold">{LANG==='bn'?toBn(r.ot):r.ot}</span>},
            {k:'rate',h:'Rate',cls:'r',cell:r=><span className="num t-meta">{money((db.employees.find(e=>e.id===r.id)||{}).otRate||0)}/hr</span>},
            {k:'otAmt',h:'Payable',cls:'r',sort:r=>r.otAmt,cell:r=><span className="num font-semibold">{money(r.otAmt,{bn:LANG==='bn'})}</span>}]
          : [...base,{k:'present',h:t('Present'),cls:'r',sort:r=>r.present,cell:r=><span className="num">{num_(r.present)}</span>},
            {k:'late',h:t('Late'),cls:'r',sort:r=>r.late,cell:r=><span className="num">{num_(r.late)}</span>},
            {k:'absent',h:t('Absent'),cls:'r',sort:r=>r.absent,cell:r=><span className="num" style={{color:r.absent?'var(--danger)':undefined}}>{num_(r.absent)}</span>},
            {k:'leave',h:t('Leave'),cls:'r',sort:r=>r.leave,cell:r=><span className="num">{num_(r.leave)}</span>},
            {k:'half',h:t('Half Day'),cls:'r',cell:r=><span className="num">{num_(r.half)}</span>},
            {k:'ot',h:'OT hrs',cls:'r',sort:r=>r.ot,cell:r=><span className="num">{LANG==='bn'?toBn(r.ot):r.ot}</span>}];
        return {cols,rows,sort:{k:rep.k==='hr-late'?'late':rep.k==='hr-ot'?'ot':'present',dir:'desc'},
          note:`Month: ${monLabel(mk)} · grace ${db.settings.payroll.graceMinutes} minutes · ${db.settings.payroll.lateAllowanceDays} late days allowed free`};
      }
      case 'hr-leave': {
        const rows=db.leaves.filter(l=>branchIds.includes(l.branchId)).map(l=>({...l,
          name:en(l.empId),branch:bn(l.branchId)}));
        return {cols:[{k:'name',h:t('Employee'),sort:r=>r.name,cell:r=><div>
            <div className="font-semibold">{r.name}</div><div className="t-micro">{r.branch}</div></div>},
          {k:'type',h:t('Type'),sort:r=>r.type,cell:r=><Badge tone={r.type==='Sick'?'warn':'info'}>{r.type}</Badge>},
          {k:'from',h:'Period',sort:r=>r.from,cell:r=><span className="num">{d_(r.from)} → {d_(r.to)}</span>},
          {k:'days',h:t('Days'),cls:'r',sort:r=>r.days,cell:r=><span className="num font-semibold">{num_(r.days)}</span>},
          {k:'reason',h:t('Reason'),cell:r=><span className="t-meta clip" style={{maxWidth:220}}>{r.reason}</span>},
          {k:'status',h:t('Status'),sort:r=>r.status,cell:r=><StatusBadge v={r.status}/>}],
          rows,sort:{k:'from',dir:'desc'}};
      }
      case 'hr-salary': case 'hr-payroll': {
        const run=sortBy(db.payrollRuns.filter(r=>!r.type),r=>r.month,'desc')[0];
        if(!run) return {cols:[],rows:[],note:'No payroll has been processed yet.'};
        if(rep.k==='hr-payroll'){
          const rows=db.branches.filter(b=>branchIds.includes(b.id)).map(b=>{
            const l=run.lines.filter(x=>x.branchId===b.id);
            return {id:b.id,branch:b.name,staff:l.length,gross:round2(sum(l,x=>x.gross)),
              deduct:round2(sum(l,x=>x.totalDeduct)),net:round2(sum(l,x=>x.net)),
              ot:round2(sum(l,x=>x.otAmt)),comm:round2(sum(l,x=>x.commission))};
          });
          return {cols:[{k:'branch',h:t('Branch'),cell:r=><span className="font-semibold">{r.branch}</span>},
            {k:'staff',h:'Staff',cls:'r',cell:r=><span className="num">{num_(r.staff)}</span>},
            {k:'gross',h:t('Gross'),cls:'r',sort:r=>r.gross,cell:r=><span className="num">{money(r.gross,{bn:LANG==='bn'})}</span>},
            {k:'ot',h:'Overtime',cls:'r',cell:r=><span className="num">{money(r.ot,{bn:LANG==='bn'})}</span>},
            {k:'comm',h:t('Commission'),cls:'r',cell:r=><span className="num">{money(r.comm,{bn:LANG==='bn'})}</span>},
            {k:'deduct',h:t('Deductions'),cls:'r',cell:r=><span className="num" style={{color:'var(--danger)'}}>{money(r.deduct,{bn:LANG==='bn'})}</span>},
            {k:'net',h:t('Net Pay'),cls:'r',sort:r=>r.net,cell:r=><span className="num font-semibold">{money(r.net,{bn:LANG==='bn'})}</span>}],
            rows,note:`Payroll month: ${monLabel(run.month)} · status ${run.status}`};
        }
        const rows=run.lines.filter(l=>branchIds.includes(l.branchId)).map(l=>({id:l.empId,...l,branch:bn(l.branchId)}));
        return {cols:[{k:'name',h:t('Employee'),sort:r=>r.name,cell:r=><div>
            <div className="font-semibold">{r.name}</div><div className="t-micro">{r.desig} · {r.branch}</div></div>},
          {k:'basic',h:t('Basic'),cls:'r',sort:r=>r.basic,cell:r=><span className="num">{money(r.basic,{sym:false})}</span>},
          {k:'allow',h:'Allowances',cls:'r',cell:r=><span className="num">{money(r.house+r.medical+r.conveyance+r.mobile,{sym:false})}</span>},
          {k:'otAmt',h:'OT',cls:'r',cell:r=><span className="num">{money(r.otAmt,{sym:false})}</span>},
          {k:'commission',h:'Comm.',cls:'r',cell:r=><span className="num">{money(r.commission,{sym:false})}</span>},
          {k:'gross',h:t('Gross'),cls:'r',sort:r=>r.gross,cell:r=><span className="num font-semibold">{money(r.gross,{sym:false})}</span>},
          {k:'totalDeduct',h:t('Deductions'),cls:'r',cell:r=><span className="num" style={{color:'var(--danger)'}}>{money(r.totalDeduct,{sym:false})}</span>},
          {k:'net',h:t('Net Pay'),cls:'r',sort:r=>r.net,cell:r=><span className="num font-semibold">{money(r.net,{bn:LANG==='bn'})}</span>}],
          rows,note:`Payroll month: ${monLabel(run.month)} · paid ${run.paidDate?fDate(run.paidDate):'—'} · ${run.payMode}`};
      }
      case 'hr-commission': {
        const mk=monKey(to);
        const rows=db.employees.filter(e=>branchIds.includes(e.branchId)&&e.commRate>0).map(e=>{
          const s=empSales(db,e.id,mk+'-01',mk+'-'+monDays(mk));
          return {id:e.id,name:e.name,desig:e.desig,branch:bn(e.branchId),rate:e.commRate,sales:s,
            commission:Math.round(s*e.commRate/100),
            bills:db.sales.filter(x=>x.cashierId===e.id&&monKey(x.date)===mk&&x.status==='completed').length};
        });
        return {cols:[{k:'name',h:t('Employee'),sort:r=>r.name,cell:r=><div>
            <div className="font-semibold">{r.name}</div><div className="t-micro">{r.desig} · {r.branch}</div></div>},
          {k:'bills',h:'Bills',cls:'r',sort:r=>r.bills,cell:r=><span className="num">{num_(r.bills)}</span>},
          {k:'sales',h:t('Sales'),cls:'r',sort:r=>r.sales,cell:r=><span className="num font-semibold">{money(r.sales,{bn:LANG==='bn'})}</span>},
          {k:'rate',h:'Rate',cls:'r',cell:r=><span className="num">{r.rate}%</span>},
          {k:'commission',h:t('Commission'),cls:'r',sort:r=>r.commission,cell:r=><span className="num font-semibold" style={{color:'var(--success)'}}>{money(r.commission,{bn:LANG==='bn'})}</span>}],
          rows,sort:{k:'commission',dir:'desc'},note:`Month: ${monLabel(mk)} · commission rate is set per designation`};
      }
      case 'hr-cost': {
        const run=sortBy(db.payrollRuns.filter(r=>!r.type),r=>r.month,'desc')[0];
        const mk=run?run.month:monKey(addMon(TODAY,-1));
        const rows=db.branches.filter(b=>branchIds.includes(b.id)).map(b=>{
          const staffCost=run? round2(sum(run.lines.filter(l=>l.branchId===b.id),l=>l.net)) : 0;
          const s=SEL.salesIn(db,[b.id],mk+'-01',mk+'-'+monDays(mk));
          const rev=round2(sum(s,x=>x.total));
          const gp=round2(sum(s,x=>x.profit));
          return {id:b.id,branch:b.name,staff:db.employees.filter(e=>e.branchId===b.id&&e.status==='Active').length,
            staffCost,revenue:rev,gross:gp,ratio:rev?pct(staffCost,rev):0,gpRatio:gp?pct(staffCost,gp):0};
        });
        return {cols:[{k:'branch',h:t('Branch'),cell:r=><span className="font-semibold">{r.branch}</span>},
          {k:'staff',h:'Headcount',cls:'r',cell:r=><span className="num">{num_(r.staff)}</span>},
          {k:'staffCost',h:'Staff cost',cls:'r',sort:r=>r.staffCost,cell:r=><span className="num font-semibold">{money(r.staffCost,{bn:LANG==='bn'})}</span>},
          {k:'revenue',h:t('Revenue'),cls:'r',sort:r=>r.revenue,cell:r=><span className="num">{money(r.revenue,{bn:LANG==='bn'})}</span>},
          {k:'ratio',h:'% of revenue',cls:'r',sort:r=>r.ratio,cell:r=><div className="flex items-center gap-2 justify-end">
            <div style={{width:52}}><Bar value={Math.min(100,r.ratio*4)} tone={r.ratio>12?'danger':r.ratio>8?'warning':'success'} h={5}/></div>
            <span className="num" style={{minWidth:38}}>{LANG==='bn'?toBn(r.ratio):r.ratio}%</span></div>},
          {k:'gpRatio',h:'% of gross profit',cls:'r',sort:r=>r.gpRatio,cell:r=><span className="num">{LANG==='bn'?toBn(r.gpRatio):r.gpRatio}%</span>}],
          rows,note:`Payroll month: ${monLabel(mk)}`};
      }
      default: return {cols:[],rows:[]};
    }
  },[rep.k,db,branchIds,from,to,sales,items]);

  const S=CHART_SERIES(c);
  return <div className="grid gap-4">
    <PageHeader title={rep.l} icon={rep.icon}
      crumbs={[...crumbs.slice(0,2),{label:t('Reports'),onClick:onBack},{label:rep.l}]}
      sub={`${rep.d} · ${d_(from)} → ${d_(to)} · ${branchId==='ALL'?t('All Branches'):bn(branchId)}`}
      actions={<Fragment>
        <Btn icon="ChevronLeft" onClick={onBack}>{t('Back')}</Btn>
        <DateRange value={range} onChange={setRange}/>
        <Btn icon="Printer" onClick={()=>printIt(toast)}>{t('Print')}</Btn>
        <Btn icon="FileDown" onClick={()=>toast({tone:'info',title:`${rep.l} exported`,
          body:`${R.rows.length} rows queued as XLSX with the current filters applied.`})}>{t('Export')}</Btn>
      </Fragment>}/>
    {R.chart&&R.chart.data.length>0&&<Card>
      <CardH title={R.chart.label} icon="ChartColumn" sub={`${d_(from)} → ${d_(to)}`}/>
      <div className="p-3"><ChartBox h={240}>
        {R.chart.type==='pie'
          ? <RC.PieChart>
              <RC.Pie data={R.chart.data} dataKey="v" nameKey="x" innerRadius={52} outerRadius={84} paddingAngle={2} strokeWidth={0}>
                {R.chart.data.map((e,i)=><RC.Cell key={i} fill={S[i%S.length]}/>)}</RC.Pie>
              <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>}/>
              <RC.Legend verticalAlign="bottom" height={36} iconSize={8} iconType="circle"
                formatter={v=><span style={{fontSize:11,color:c.muted}}>{t(v)}</span>}/>
            </RC.PieChart>
          : R.chart.type==='area'
          ? <RC.AreaChart data={R.chart.data} margin={{top:6,right:8,left:-16,bottom:0}}>
              <defs><linearGradient id="gRep" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={c.primary} stopOpacity={.32}/>
                <stop offset="100%" stopColor={c.primary} stopOpacity={.02}/></linearGradient></defs>
              <RC.CartesianGrid stroke={c.grid} vertical={false}/>
              <RC.XAxis dataKey="x" tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false} interval={Math.ceil(R.chart.data.length/10)}/>
              <RC.YAxis tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false}
                tickFormatter={mkAxisFmt(Math.max(...R.chart.data.map(d=>d.v),1))}/>
              <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>}/>
              <RC.Area type="monotone" dataKey="v" name={R.chart.label} stroke={c.primary} strokeWidth={2} fill="url(#gRep)" dot={false}/>
            </RC.AreaChart>
          : <RC.BarChart data={R.chart.data} margin={{top:6,right:8,left:-16,bottom:0}}>
              <RC.CartesianGrid stroke={c.grid} vertical={false}/>
              <RC.XAxis dataKey="x" tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false}
                interval={0} angle={R.chart.data.length>6?-24:0} textAnchor={R.chart.data.length>6?'end':'middle'}
                height={R.chart.data.length>6?52:30}/>
              <RC.YAxis tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false}
                tickFormatter={mkAxisFmt(Math.max(...R.chart.data.map(d=>d.v),1))}/>
              <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>} cursor={{fill:c.grid,opacity:.35}}/>
              <RC.Bar dataKey="v" name={R.chart.label} fill={c.primary} radius={[5,5,0,0]} maxBarSize={34}/>
            </RC.BarChart>}
      </ChartBox></div>
    </Card>}
    {R.note&&<div className="card p-3 flex items-start gap-2.5" style={{background:'var(--info-soft)',borderColor:'var(--info-line)'}}>
      <Icon name="Info" size={14} style={{color:'var(--info)',flex:'none',marginTop:1}}/>
      <span className="text-[12.5px]">{R.note}</span></div>}
    {R.rows.length===0
      ? <Card><Empty icon={rep.icon} title="No data for this period"
          desc="Widen the date range or switch branch to see rows in this report."/></Card>
      : <DataTable rows={R.rows} cols={R.cols} pageSize={15} initialSort={R.sort}
          search={(r,q)=>JSON.stringify(Object.values(r).filter(v=>typeof v!=='object')).toLowerCase().includes(q)}
          searchPlaceholder="Search within this report…"
          footNote={`${num_(R.rows.length)} rows`}/>}
  </div>;
}
</script>

<script type="text/babel" data-presets="react">
/* ===================== 7.12–7.19 ADMIN ===================== */
function Branches(){
  const {db,dispatch,theme,toast,crumbs,go}=useApp();
  const c=useThemeColors(theme);
  const [open,setOpen]=useState(null);
  const mk=monKey(TODAY);
  const rows=db.branches.map(b=>{
    const s=SEL.salesIn(db,[b.id],mk+'-01',TODAY);
    const mgr=db.employees.find(e=>e.id===b.managerId)||{};
    return {...b,sales:round2(sum(s,x=>x.total)),bills:s.length,profit:round2(sum(s,x=>x.profit)),
      achieve:pct(sum(s,x=>x.total),b.target),staff:db.employees.filter(e=>e.branchId===b.id&&e.status==='Active').length,
      stock:SEL.stockValue(db,[b.id]),manager:mgr.name,licDays:dayDiff(TODAY,b.licExp)};
  });
  return <div className="grid gap-4">
    <PageHeader title={t('Branches')} icon="Building2" crumbs={crumbs}
      sub={`${rows.length} branches · ${money(sum(rows,r=>r.sales))} month-to-date against ${money(sum(rows,r=>r.target))} target`}
      actions={<Btn variant="primary" icon="Plus" onClick={()=>toast({tone:'info',title:'Add branch',
        body:'Captures address, licences, manager, counters and the monthly sales target.'})}>Add branch</Btn>}/>
    <div className="grid-3">
      {rows.map(b=><Card key={b.id} lift className="cursor-pointer" onClick={()=>setOpen(b.id)}>
        <div className="p-4">
          <div className="flex items-start justify-between gap-2 mb-3">
            <div className="min-w-0">
              <div className="t-sec clip">{b.name}</div>
              <div className="t-micro clip">{b.city} · {b.counters} counters{b.is24h?' · 24 hours':''}</div>
            </div>
            <Badge tone={b.achieve>=95?'ok':b.achieve>=75?'brand':'warn'}>{LANG==='bn'?toBn(b.achieve):b.achieve}%</Badge>
          </div>
          <div className="mb-3"><Bar value={b.achieve} tone={b.achieve>=95?'success':b.achieve>=75?'primary':'warning'} h={7}/></div>
          <div className="grid grid-cols-2 gap-3">
            <div><div className="t-lbl">Month to date</div><div className="num text-[14px] font-semibold">{money(b.sales,{bn:LANG==='bn'})}</div></div>
            <div><div className="t-lbl">{t('Target')}</div><div className="num text-[14px]">{moneyK(b.target,LANG==='bn')}</div></div>
            <div><div className="t-lbl">{t('Stock Value')}</div><div className="num text-[14px]">{moneyK(b.stock,LANG==='bn')}</div></div>
            <div><div className="t-lbl">Staff</div><div className="num text-[14px]">{num_(b.staff)}</div></div>
          </div>
          <div className="mt-3 pt-3 flex items-center gap-2" style={{borderTop:'1px solid var(--border)'}}>
            <span className="avatar avatar-sm">{initials(b.manager)}</span>
            <div className="min-w-0"><div className="text-[12px] font-semibold clip">{b.manager}</div>
              <div className="t-micro">Branch Manager</div></div>
            {b.licDays<75&&<Badge tone="warn" sq className="ml-auto" icon="FileBadge">Licence</Badge>}
          </div>
        </div>
      </Card>)}
    </div>
    <Card>
      <CardH title="Branch performance" sub={`${monLabel(mk,LANG==='bn')} month to date`} icon="ChartColumn"/>
      <div className="p-3"><ChartBox h={250}>
        <RC.BarChart data={rows.map(r=>({x:r.name,Sales:r.sales,Target:r.target,Profit:r.profit}))}
          margin={{top:8,right:8,left:-12,bottom:0}}>
          <RC.CartesianGrid stroke={c.grid} vertical={false}/>
          <RC.XAxis dataKey="x" tick={{fontSize:11,fill:c.subtle}} axisLine={false} tickLine={false}/>
          <RC.YAxis tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false}
            tickFormatter={mkAxisFmt(Math.max(...rows.map(r=>r.target)))}/>
          <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>} cursor={{fill:c.grid,opacity:.3}}/>
          <RC.Legend iconSize={8} iconType="circle" formatter={v=><span style={{fontSize:11,color:c.muted}}>{v}</span>}/>
          <RC.Bar dataKey="Target" fill={c.grid} radius={[5,5,0,0]} maxBarSize={38}/>
          <RC.Bar dataKey="Sales" fill={c.primary} radius={[5,5,0,0]} maxBarSize={38}/>
          <RC.Bar dataKey="Profit" fill={c.success} radius={[5,5,0,0]} maxBarSize={38}/>
        </RC.BarChart></ChartBox></div>
    </Card>
    {open&&(()=>{const b=rows.find(x=>x.id===open);
      return <Drawer open wide onClose={()=>setOpen(null)} icon="Building2" title={b.name} sub={`${b.city} · opened ${fDate(b.opened)}`}
        footer={<Fragment><Btn onClick={()=>setOpen(null)}>{t('Close')}</Btn>
          <Btn variant="primary" icon="ChartPie" onClick={()=>{go('reports');setOpen(null)}}>Branch reports</Btn></Fragment>}>
        <div className="grid gap-4">
          <div className="grid gap-2 sm:grid-cols-4">
            <div className="panel p-3"><div className="t-lbl">MTD sales</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{moneyK(b.sales,LANG==='bn')}</div></div>
            <div className="panel p-3"><div className="t-lbl">{t('Target')}</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{moneyK(b.target,LANG==='bn')}</div></div>
            <div className="panel p-3"><div className="t-lbl">{t('Gross Profit')}</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{moneyK(b.profit,LANG==='bn')}</div></div>
            <div className="panel p-3"><div className="t-lbl">Bills</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{num_(b.bills)}</div></div>
          </div>
          <Card><CardH title="Branch details" icon="Info"/>
            <div className="p-4 grid gap-1">
              <Row label={t('Address')} value={b.address}/><Row label={t('Phone')} value={fPhone(b.phone)}/>
              <Row label="Branch code" value={b.code} mono/><Row label="Counters" value={num_(b.counters)}/>
              <Row label="Opening hours" value={b.is24h?'24 hours':'8:00 AM – 11:00 PM'}/>
              <Row label="Manager" value={b.manager}/>
              <Row label="Monthly target" value={money(b.target,{bn:LANG==='bn'})}/>
            </div></Card>
          <Card><CardH title="Licences" icon="FileBadge"
            right={<Badge tone={b.licDays<60?'warn':'ok'}>{num_(b.licDays)} days to renewal</Badge>}/>
            <div className="p-4 grid gap-1">
              <Row label="Drug Licence No" value={b.drugLic} mono/>
              <Row label="DGDA Registration" value={b.dgda} mono/>
              <Row label="Trade Licence" value={b.trade} mono/>
              <Row label="Licence expiry" value={d_(b.licExp)}/>
              <Row label="BIN (VAT)" value={db.settings.pharmacy.bin} mono/>
            </div></Card>
          <Card><CardH title="Staff" icon="Users" sub={`${b.staff} active`}/>
            <div className="tw"><table className="dt compact">
              <thead><tr><th>{t('Employee')}</th><th>{t('Designation')}</th><th>Shift</th><th className="r">{t('Salary')}</th></tr></thead>
              <tbody>{db.employees.filter(e=>e.branchId===b.id&&e.status==='Active').map(e=><tr key={e.id}>
                <td><div className="flex items-center gap-2"><span className="avatar avatar-sm">{initials(e.name)}</span>
                  <span className="font-semibold">{e.name}</span></div></td>
                <td className="t-meta">{e.desig}</td><td><Badge tone="neutral">{e.shift}</Badge></td>
                <td className="r num">{money(e.salary.gross,{bn:LANG==='bn'})}</td></tr>)}</tbody></table></div>
          </Card>
        </div>
      </Drawer>;
    })()}
  </div>;
}

const PERM_MATRIX=[
  ['POS billing','pos'],['Sales history','sales'],['Cancel an invoice','sales.cancel'],['Sales return','sales.return'],
  ['Stock view','stock'],['Edit medicines','stock.edit'],['Stock adjustment','stock.adjust'],['Branch transfer','transfer'],
  ['Purchases & suppliers','purchase'],['Customers','customer'],['Offers','offer'],

function Compliance(){
  const {db,toast,crumbs}=useApp();
  const items=[
    ...db.branches.flatMap(b=>[
      {id:b.id+'-dl',type:'Drug Licence',holder:b.name,no:b.drugLic,exp:b.licExp,authority:'Directorate General of Drug Administration',icon:'FileBadge'},
      {id:b.id+'-dgda',type:'DGDA Registration',holder:b.name,no:b.dgda,exp:addDays(b.licExp,180),authority:'DGDA',icon:'BadgeCheck'},
      {id:b.id+'-tl',type:'Trade Licence',holder:b.name,no:b.trade,exp:addDays(b.licExp,90),authority:b.city==='Dhaka'?'Dhaka North City Corporation':'Chattogram City Corporation',icon:'Building2'}]),
    {id:'bin',type:'VAT Registration (BIN)',holder:db.settings.pharmacy.name,no:db.settings.pharmacy.bin,
      exp:null,authority:'National Board of Revenue',icon:'Landmark'},
    {id:'tin',type:'Tax Identification (TIN)',holder:db.settings.pharmacy.name,no:db.settings.pharmacy.tin,
      exp:null,authority:'National Board of Revenue',icon:'Receipt'},
    ...db.employees.filter(e=>e.pcReg).map(e=>({id:e.id+'-pc',type:'Pharmacy Council Registration',holder:e.name,
      no:e.pcReg,exp:e.pcExp,authority:`Bangladesh Pharmacy Council · Grade ${e.grade}`,icon:'UserCheck'})),
  ].map(x=>({...x,days:x.exp?dayDiff(TODAY,x.exp):null,
    status:!x.exp?'Permanent':dayDiff(TODAY,x.exp)<0?'Expired':dayDiff(TODAY,x.exp)<60?'Renewal Due':'Valid'}));
  const due=items.filter(i=>['Renewal Due','Expired'].includes(i.status));
  return <div className="grid gap-4">
    <PageHeader title={t('Compliance')} icon="FileBadge" crumbs={crumbs}
      sub="Licences, registrations and pharmacist credentials with renewal tracking"
      actions={<Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'Compliance pack exported',
        body:'All licence numbers and expiry dates in one PDF for inspection.'})}>{t('Export')}</Btn>}/>
    {due.length>0&&<div className="card p-3.5 flex items-center gap-3 flex-wrap"
      style={{background:'var(--warning-soft)',borderColor:'var(--warning-line)'}}>
      <Icon name="TriangleAlert" size={17} style={{color:'var(--warning)'}}/>
      <div className="min-w-0 flex-1">
        <div className="text-[13px] font-semibold">{due.length} document{due.length>1?'s':''} need renewal within 60 days</div>
        <div className="t-micro">{due.map(d=>`${d.type} — ${d.holder}`).join(' · ')}</div>
      </div>
    </div>}
    <div className="grid-kpi">
      <KPI label="Documents tracked" value={items.length} icon="FileBadge"/>
      <KPI label="Valid" value={items.filter(i=>i.status==='Valid'||i.status==='Permanent').length} icon="CircleCheck" tone="success"/>
      <KPI label="Renewal due" value={items.filter(i=>i.status==='Renewal Due').length} icon="AlarmClock" tone="warning"/>
      <KPI label="Expired" value={items.filter(i=>i.status==='Expired').length} icon="CircleX" tone="danger"/>
    </div>
    <DataTable rows={items} pageSize={15} initialSort={{k:'days',dir:'asc'}}
      search={(i,q)=>i.type.toLowerCase().includes(q)||i.holder.toLowerCase().includes(q)||i.no.toLowerCase().includes(q)}
      cols={[
        {k:'type',h:'Document',sort:i=>i.type,cell:i=><div className="flex items-center gap-2.5">
          <span className="grid place-items-center w-8 h-8 rounded-lg shrink-0"
            style={{background:'var(--primary-soft)',color:'var(--primary)'}}><Icon name={i.icon} size={15}/></span>
          <div><div className="font-semibold">{i.type}</div><div className="t-micro">{i.authority}</div></div></div>},
        {k:'holder',h:'Held by',sort:i=>i.holder,cell:i=><span>{i.holder}</span>},
        {k:'no',h:'Number',cell:i=><span className="mono t-meta">{i.no}</span>},
        {k:'exp',h:t('Expiry'),sort:i=>i.exp||'9999',cell:i=>i.exp
          ? <div><div className="num">{d_(i.exp)}</div>
              <div className="t-micro" style={{color:i.days<0?'var(--danger)':i.days<60?'var(--warning)':'var(--fg-subtle)'}}>
                {i.days<0?`${Math.abs(i.days)} days ago`:`${num_(i.days)} days left`}</div></div>
          : <span className="subtle">No expiry</span>},
        {k:'status',h:t('Status'),sort:i=>i.status,cell:i=><StatusBadge v={i.status}/>},
        {k:'act',h:'',cls:'r',cell:i=>['Renewal Due','Expired'].includes(i.status)?<div className="row-act">
          <Btn size="xs" variant="soft" icon="CalendarPlus" onClick={()=>toast({tone:'ok',
            title:'Renewal reminder set',body:`${i.type} for ${i.holder} — reminder 30 days before expiry.`})}>Remind</Btn></div>:null},
      ]}/>
  </div>;
}

function NotificationsPage(){
  const {db,notifs,markRead,go,crumbs,toast}=useApp();
  const [filter,setFilter]=useState('all');
  const read=db.notifRead;
  const rows=notifs.filter(n=>filter==='all'||(filter==='unread'?!read.includes(n.id):read.includes(n.id)));
  return <div className="grid gap-4">
    <PageHeader title={t('Notifications')} icon="Bell" crumbs={crumbs}
      sub={`${num_(notifs.filter(n=>!read.includes(n.id)).length)} unread of ${num_(notifs.length)}`}
      actions={<Fragment>
        <Seg options={[{v:'all',l:'All'},{v:'unread',l:'Unread'},{v:'read',l:'Read'}]} value={filter} onChange={setFilter}/>
        <Btn icon="CheckCheck" onClick={()=>{markRead(notifs.map(n=>n.id));toast({tone:'ok',title:'All marked read'})}}>
          Mark all read</Btn>
      </Fragment>}/>
    <div className="grid gap-2">
      {rows.length===0&&<Card><Empty icon="BellOff" title="Nothing here"
        desc={filter==='unread'?'Every alert has been read.':'No notifications for this branch.'}/></Card>}
      {rows.map(n=>{
        const isRead=read.includes(n.id);
        const tone=n.tone==='bad'?'danger':n.tone==='warn'?'warning':'info';
        return <Card key={n.id} lift className="cursor-pointer relative overflow-hidden"
          onClick={()=>{markRead(n.id);go(n.page)}} role="button" tabIndex={0}
          onKeyDown={e=>{if(e.key==='Enter'){markRead(n.id);go(n.page)}}}
          style={{opacity:isRead?.7:1}}>
          <span className="stripe" style={{background:`var(--${tone})`}}/>
          <div className="p-4 pl-5 flex items-start gap-3">
            <span className="grid place-items-center w-9 h-9 rounded-[10px] shrink-0"
              style={{background:`var(--${tone}-soft)`,color:`var(--${tone})`}}><Icon name={n.icon} size={17}/></span>
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-[13.5px] font-semibold">{n.title}</span>
                {!isRead&&<Badge tone="brand" sq>New</Badge>}
              </div>
              <div className="t-meta mt-0.5">{n.body}</div>
              <div className="t-micro mt-1.5 flex items-center gap-2">
                <Icon name="Calendar" size={10}/>{d_(n.date)}
                <span className="subtle">·</span>
                <span>Go to {t(PAGE_TITLES[n.page]||n.page)}</span>
              </div>
            </div>
            <Icon name="ChevronRight" size={16} style={{color:'var(--fg-faint)',flex:'none',marginTop:6}}/>
          </div>
        </Card>;
      })}
    </div>
  </div>;
}

function AuditLog(){
  const {db,branchIds,crumbs,toast}=useApp();
  const [action,setAction]=useState(''); const [uid_,setUid]=useState('');
  const rows=db.audit.filter(a=>(a.branchId==='ALL'||branchIds.includes(a.branchId))
    &&(!action||a.action===action)&&(!uid_||a.userId===uid_));
  const actions=uniq(db.audit.map(a=>a.action)).sort();
  return <div className="grid gap-4">
    <PageHeader title={t('Activity Log')} icon="History" crumbs={crumbs}
      sub="Every edit, deletion, discount override, refund, price change and salary change"
      actions={<Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'Audit trail exported',
        body:`${rows.length} entries queued as CSV.`})}>{t('Export')}</Btn>}/>
    <div className="grid-kpi">
      <KPI label="Entries" value={rows.length} icon="History"/>
      <KPI label="Today" value={rows.filter(a=>a.date===TODAY).length} icon="Calendar" tone="info"/>
      <KPI label="Price & salary changes" value={rows.filter(a=>/price|salary/i.test(a.action)).length}
        icon="TrendingUp" tone="warning"/>
      <KPI label="Cancellations & refunds" value={rows.filter(a=>/cancel|refund|return/i.test(a.action)).length}
        icon="Undo2" tone="danger"/>
    </div>
    <DataTable rows={rows} pageSize={20} initialSort={{k:'date',dir:'desc'}}
      search={(a,q)=>a.detail.toLowerCase().includes(q)||a.userName.toLowerCase().includes(q)||a.action.toLowerCase().includes(q)}
      searchPlaceholder="Action, user or detail…"
      filters={<Fragment>
        <Select sm value={action} onChange={e=>setAction(e.target.value)} style={{width:180}}>
          <option value="">Action — all</option>{actions.map(a=><option key={a}>{a}</option>)}</Select>
        <Select sm value={uid_} onChange={e=>setUid(e.target.value)} style={{width:160}}>
          <option value="">User — all</option>
          {uniq(db.audit.map(a=>a.userId)).map(u=><option key={u} value={u}>
            {(db.users.find(x=>x.id===u)||{}).name||u}</option>)}</Select>
      </Fragment>}
      cols={[
        {k:'date',h:'When',sort:a=>a.date+a.time,cell:a=><div><div className="num">{d_(a.date)}</div>
          <div className="t-micro num">{f12(a.time,LANG==='bn')}</div></div>},
        {k:'user',h:'Who',sort:a=>a.userName,cell:a=><div className="flex items-center gap-2 min-w-0">
          <span className="avatar avatar-sm">{initials(a.userName)}</span>
          <span className="clip">{a.userName}</span></div>},
        {k:'action',h:'Action',sort:a=>a.action,cell:a=><Badge tone={/cancel|delete|bounce/i.test(a.action)?'bad'
          :/approve|paid|received/i.test(a.action)?'ok':/discount|price|salary|shortage/i.test(a.action)?'warn':'neutral'}>
          {a.action}</Badge>},
        {k:'entity',h:'Entity',cell:a=><span className="t-meta">{a.entity}</span>},
        {k:'detail',h:'Detail',cell:a=><span className="clip" style={{maxWidth:420}}>{a.detail}</span>},
        {k:'branch',h:t('Branch'),cell:a=><span className="t-meta">{a.branchId==='ALL'?'All':(db.branches.find(b=>b.id===a.branchId)||{}).name||'—'}</span>},
        {k:'ip',h:'Source',cell:a=><span className="mono t-micro">{a.ip}</span>},
      ]}/>
  </div>;
}
</script>
