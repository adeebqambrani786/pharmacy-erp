/* ---- salary advance ---- */
function Advances(){
  const {db,dispatch,user,toast,crumbs,branchIds}=useApp();
  const [form,setForm]=useState(false);
  const rows=db.advances.filter(a=>{const e=db.employees.find(x=>x.id===a.empId);return e&&branchIds.includes(e.branchId)});
  const decide=(a,status)=>{
    dispatch({type:'patch',coll:'advances',id:a.id,data:{status,approvedBy:user.empId||user.id}});
    toast({tone:status==='Approved'?'ok':'warn',title:`Advance ${status.toLowerCase()}`,
      body:`${(db.employees.find(e=>e.id===a.empId)||{}).name} · ${money(a.amount)}${status==='Approved'?` · ${a.installments} instalments of ${money(a.perInstall)}`:''}`});
  };
  return <div className="grid gap-4">
    <PageHeader title={t('Salary Advance')} icon="PiggyBank" crumbs={crumbs}
      sub="Advances and loans recovered through monthly payroll instalments"
      actions={<Btn variant="primary" icon="Plus" onClick={()=>setForm(true)}>New request</Btn>}/>
    <div className="grid-kpi">
      <KPI label="Outstanding" value={sum(rows.filter(a=>a.status==='Approved'),a=>a.remaining)}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="PiggyBank" tone="warning"/>
      <KPI label={t('Pending')} value={rows.filter(a=>a.status==='Pending').length} icon="Clock" tone="info"/>
      <KPI label="Recovered" value={sum(rows,a=>a.paid)} fmt={v=>money(v,{bn:LANG==='bn'})} icon="CircleCheck" tone="success"/>
      <KPI label="Monthly recovery" value={sum(rows.filter(a=>a.status==='Approved'&&a.remaining>0),a=>a.perInstall)}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="CalendarSync" tone="purple" sub="Deducted in next payroll"/>
    </div>
    <DataTable rows={rows} pageSize={10} initialSort={{k:'date',dir:'desc'}}
      search={(a,q)=>((db.employees.find(e=>e.id===a.empId)||{}).name||'').toLowerCase().includes(q)||a.reason.toLowerCase().includes(q)}
      cols={[
        {k:'emp',h:t('Employee'),sort:a=>a.empId,cell:a=>{const e=db.employees.find(x=>x.id===a.empId)||{};
          return <div className="flex items-center gap-2.5"><span className="avatar avatar-sm">{initials(e.name)}</span>
            <div><div className="font-semibold">{e.name}</div><div className="t-micro">{e.desig}</div></div></div>}},
        {k:'date',h:t('Date'),sort:a=>a.date,cell:a=><span className="num">{d_(a.date)}</span>},
        {k:'reason',h:t('Reason'),cell:a=><span className="t-meta clip" style={{maxWidth:220}}>{a.reason}</span>},
        {k:'amount',h:t('Amount'),cls:'r',sort:a=>a.amount,cell:a=><span className="num font-semibold">{money(a.amount,{bn:LANG==='bn'})}</span>},
        {k:'inst',h:'Instalments',cls:'r',cell:a=><div className="text-right"><div className="num">{num_(a.installments)} × {money(a.perInstall,{sym:false})}</div>
          <div className="t-micro">{num_(Math.round(a.paid/Math.max(1,a.perInstall)))} paid</div></div>},
        {k:'remaining',h:t('Remaining'),cls:'r',sort:a=>a.remaining,cell:a=><div className="flex items-center gap-2 justify-end">
          <div style={{width:54}}><Bar value={pct(a.paid,a.amount)} tone="success" h={5}/></div>
          <span className="num font-semibold" style={{minWidth:62,textAlign:'right'}}>{money(a.remaining,{bn:LANG==='bn'})}</span></div>},
        {k:'status',h:t('Status'),sort:a=>a.status,cell:a=><StatusBadge v={a.status}/>},
        {k:'act',h:'',cls:'r',cell:a=>a.status==='Pending'&&can(user.role,'payroll.process')?<div className="row-act">
          <Btn size="xs" variant="soft" icon="Check" onClick={()=>decide(a,'Approved')}>{t('Approve')}</Btn>
          <Btn size="xs" variant="ghost" icon="X" onClick={()=>decide(a,'Rejected')}/></div>:null},
      ]}/>
    <AdvanceForm open={form} onClose={()=>setForm(false)}/>
  </div>;
}
function AdvanceForm({open,onClose,fixedEmp}){
  const {db,dispatch,toast,user,branchIds}=useApp();
  const [empId,setEmpId]=useState(fixedEmp||user.empId||'E06');
  const [amount,setAmount]=useState('10000');
  const [inst,setInst]=useState(5);
  const [reason,setReason]=useState('');
  const [err,setErr]=useState('');
  const e=db.employees.find(x=>x.id===empId);
  const maxAdv=e?e.salary.gross*2:0;
  const per=Math.ceil(Number(amount)/Math.max(1,Number(inst))/100)*100;
  const save=()=>{
    if(!reason.trim()){ setErr('Give a reason for the advance.'); return }
    if(Number(amount)>maxAdv){ setErr(`Maximum advance is two months’ gross — ${money(maxAdv)}.`); return }
    dispatch({type:'upsert',coll:'advances',item:{id:uid('ADV'),empId,amount:Number(amount),date:TODAY,reason,
      installments:Number(inst),perInstall:per,paid:0,remaining:Number(amount),status:'Pending',approvedBy:null}});
    toast({tone:'ok',title:'Advance request submitted',
      body:`${money(Number(amount))} · ${inst} instalments of ${money(per)} · awaiting HR approval.`});
    onClose();
  };
  return <Drawer open={open} onClose={onClose} icon="PiggyBank" title="Salary advance request"
    sub="Recovered automatically through payroll"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Send" onClick={save}>{t('Submit')}</Btn></Fragment>}>
    <div className="grid gap-3">
      {!fixedEmp&&<Field label={t('Employee')}><Select value={empId} onChange={e=>setEmpId(e.target.value)}>
        {db.employees.filter(x=>branchIds.includes(x.branchId)).map(x=><option key={x.id} value={x.id}>{x.name} — {x.desig}</option>)}</Select></Field>}
      <Field label={t('Amount')} req hint={e?`Maximum ${money(maxAdv)} (two months’ gross)`:''}>
        <Input className="ta-right" value={amount} onChange={e=>{setAmount(e.target.value.replace(/\D/g,''));setErr('')}}
          style={{fontSize:17,height:44,fontWeight:600}}/></Field>
      <Field label="Instalments"><Select value={inst} onChange={e=>setInst(e.target.value)}>
        {[2,3,4,5,6,8,10,12].map(n=><option key={n} value={n}>{n} months</option>)}</Select></Field>
      <div className="panel p-3 grid gap-1">
        <Row label="Per instalment" value={money(per,{bn:LANG==='bn'})} strong/>
        <Row label="Deducted from" value={monLabel(monKey(addMon(TODAY,1)),LANG==='bn')+' payroll'}/>
        {e&&<Row label="Net salary after deduction" value={money(e.salary.gross-per,{bn:LANG==='bn'})}/>}
      </div>
      <Field label={t('Reason')} req><Textarea value={reason} onChange={e=>setReason(e.target.value)}/></Field>
      {err&&<div className="err">{err}</div>}
    </div>
  </Drawer>;
}
</script>

<script type="text/babel" data-presets="react">
/* ---- staff performance ---- */
function Performance(){
  const {db,branchIds,branchId,theme,crumbs,toast}=useApp();
  const c=useThemeColors(theme);
  const [mk,setMk]=useState(monKey(TODAY));
  const from=mk+'-01', to=mk+'-'+monDays(mk);
  const rows=useMemo(()=>db.employees.filter(e=>branchIds.includes(e.branchId)&&e.status==='Active')
    .map(e=>{
      const sales=empSales(db,e.id,from,to);
      const bills=db.sales.filter(s=>s.cashierId===e.id&&s.date>=from&&s.date<=to&&s.status==='completed');
      const a=attStats(db,e.id,mk);
      const br=db.branches.find(b=>b.id===e.branchId);
      const target=e.commRate? Math.round(br.target/ (db.employees.filter(x=>x.branchId===e.branchId&&x.commRate>0).length||1)) : 0;
      return {...e,sales,bills:bills.length,avgBill:bills.length?round2(sales/bills.length):0,
        commission:e.commRate?Math.round(sales*e.commRate/100):0,target,
        achieve:target?pct(sales,target):null,
        attScore:Math.round((a.present+a.late*0.8)/Math.max(1,a.present+a.late+a.absent+a.half)*100),
        ot:a.ot,late:a.late,absent:a.absent};
    }),[db,branchIds,mk]);
  const sellers=sortBy(rows.filter(r=>r.sales>0),r=>r.sales,'desc');
  const chart=sellers.slice(0,8).map(r=>({name:r.name.split(' ')[0],sales:r.sales,target:r.target}));
  return <div className="grid gap-4">
    <PageHeader title={t('Performance')} icon="Trophy" crumbs={crumbs}
      sub={`${monLabel(mk,LANG==='bn')} · sales, target achievement, commission and attendance score`}
      actions={<Fragment>
        <Select sm value={mk} onChange={e=>setMk(e.target.value)} style={{width:160}}>
          {[0,-1,-2,-3].map(i=>{const k=monKey(addMon(TODAY,i));return <option key={k} value={k}>{monLabel(k)}</option>})}</Select>
        <Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'Commission report exported'})}>{t('Export')}</Btn>
      </Fragment>}/>
    <div className="grid-kpi">
      <KPI label="Staff selling" value={sellers.length} icon="Users" sub={`of ${rows.length} on payroll`}/>
      <KPI label="Sales by staff" value={sum(sellers,r=>r.sales)} fmt={v=>moneyK(v,LANG==='bn')} icon="Banknote" tone="info"/>
      <KPI label="Commission earned" value={sum(rows,r=>r.commission)} fmt={v=>money(v,{bn:LANG==='bn'})} icon="BadgePercent" tone="success"/>
      <KPI label="Top performer" value={sellers.length?sellers[0].sales:0} fmt={v=>moneyK(v,LANG==='bn')} icon="Trophy" tone="warning"
        sub={sellers.length?sellers[0].name:'—'}/>
    </div>
    <div className="cols2" style={{'--c2':'minmax(0,1.3fr) minmax(0,1fr)'}}>
      <Card className="min-w-0">
        <CardH title="Sales vs target by staff" icon="ChartColumn" sub={monLabel(mk,LANG==='bn')}/>
        <div className="p-3"><ChartBox h={260}>
          <RC.BarChart data={chart} margin={{top:6,right:6,left:-16,bottom:0}}>
            <RC.CartesianGrid stroke={c.grid} vertical={false}/>
            <RC.XAxis dataKey="name" tick={{fontSize:10.5,fill:c.subtle}} axisLine={false} tickLine={false}/>
            <RC.YAxis tick={{fontSize:10,fill:c.subtle}} axisLine={false} tickLine={false}
              tickFormatter={mkAxisFmt(Math.max(...chart.map(x=>Math.max(x.sales,x.target||0)),1))}/>
            <RC.Tooltip content={<ChartTip c={c} fmt={v=>money(v)}/>} cursor={{fill:c.grid,opacity:.35}}/>
            <RC.Legend iconSize={8} iconType="circle" formatter={v=><span style={{fontSize:11,color:c.muted}}>{v}</span>}/>
            <RC.Bar dataKey="target" name="Target" fill={c.grid} radius={[5,5,0,0]} maxBarSize={26}/>
            <RC.Bar dataKey="sales" name="Sales" fill={c.primary} radius={[5,5,0,0]} maxBarSize={26}/>
          </RC.BarChart></ChartBox></div>
      </Card>
      <Card className="min-w-0">
        <CardH title="Leaderboard" icon="Medal" sub="By sales value this month"/>
        <div className="p-3 grid gap-2">
          {sellers.slice(0,6).map((r,i)=><div key={r.id} className="flex items-center gap-3 p-2.5 rounded-[10px]"
            style={{background:i===0?'var(--warning-soft)':'var(--surface-2)',
              border:'1px solid '+(i===0?'var(--warning-line)':'var(--border)')}}>
            <span className="grid place-items-center w-7 h-7 rounded-full shrink-0 text-[12px] font-bold"
              style={{background:i===0?'var(--warning)':i===1?'var(--fg-faint)':i===2?'#b4713a':'var(--surface-3)',
                color:i<3?'#fff':'var(--fg-muted)'}}>{i+1}</span>
            <span className="avatar avatar-sm">{initials(r.name)}</span>
            <div className="min-w-0 flex-1"><div className="text-[12.5px] font-semibold clip">{r.name}</div>
              <div className="t-micro clip">{r.desig} · {db.branches.find(b=>b.id===r.branchId).name}</div></div>
            <div className="text-right"><div className="num text-[12.5px] font-semibold">{moneyK(r.sales,LANG==='bn')}</div>
              <div className="t-micro">{num_(r.bills)} bills</div></div>
          </div>)}
          {sellers.length===0&&<Empty icon="Trophy" title="No sales recorded this month"/>}
        </div>
      </Card>
    </div>
    <DataTable rows={rows} pageSize={20} initialSort={{k:'sales',dir:'desc'}}
      search={(r,q)=>r.name.toLowerCase().includes(q)}
      cols={[
        {k:'name',h:t('Employee'),sort:r=>r.name,cell:r=><div className="flex items-center gap-2.5">
          <span className="avatar avatar-sm">{initials(r.name)}</span>
          <div><div className="font-semibold">{r.name}</div><div className="t-micro">{r.desig}</div></div></div>},
        {k:'branch',h:t('Branch'),cell:r=><span className="t-meta">{db.branches.find(b=>b.id===r.branchId).name}</span>},
        {k:'bills',h:'Bills',cls:'r',sort:r=>r.bills,cell:r=><span className="num">{num_(r.bills)}</span>},
        {k:'sales',h:t('Sales'),cls:'r',sort:r=>r.sales,cell:r=><span className="num font-semibold">{money(r.sales,{bn:LANG==='bn'})}</span>},
        {k:'avgBill',h:'Avg bill',cls:'r',sort:r=>r.avgBill,cell:r=><span className="num">{money(r.avgBill,{bn:LANG==='bn'})}</span>},
        {k:'achieve',h:t('Achievement'),cls:'r',sort:r=>r.achieve||0,cell:r=>r.achieve===null?<span className="subtle">—</span>
          :<div className="flex items-center gap-2 justify-end"><div style={{width:56}}>
            <Bar value={r.achieve} tone={r.achieve>=100?'success':r.achieve>=75?'primary':'warning'} h={5}/></div>
            <span className="num font-semibold" style={{minWidth:38}}>{LANG==='bn'?toBn(r.achieve):r.achieve}%</span></div>},
        {k:'commission',h:t('Commission'),cls:'r',sort:r=>r.commission,cell:r=><span className="num"
          style={{color:r.commission?'var(--success)':undefined}}>{r.commission?money(r.commission,{bn:LANG==='bn'}):'—'}</span>},
        {k:'attScore',h:'Attendance',cls:'r',sort:r=>r.attScore,cell:r=><div className="text-right">
          <span className="num font-semibold" style={{color:r.attScore>=95?'var(--success)':r.attScore>=85?undefined:'var(--warning)'}}>
            {LANG==='bn'?toBn(r.attScore):r.attScore}%</span>
          <div className="t-micro">{num_(r.late)} late · {num_(r.absent)} absent</div></div>},
        {k:'ot',h:'OT hours',cls:'r',sort:r=>r.ot,cell:r=><span className="num">{LANG==='bn'?toBn(r.ot):r.ot}</span>},
      ]}/>
  </div>;
}

/* ---- employee self-service ---- */
function MyWorkspace(){
  const {db,dispatch,user,toast,go,crumbs}=useApp();
  const [leaveOpen,setLeaveOpen]=useState(false);
  const [advOpen,setAdvOpen]=useState(false);
  const [slip,setSlip]=useState(null);
  const e=db.employees.find(x=>x.id===user.empId);
  const mk=monKey(TODAY);
  if(!e) return <div className="grid gap-4">
    <PageHeader title={t('My Workspace')} icon="UserRound" crumbs={crumbs}/>
    <Card><div className="p-5 flex items-start gap-3">
      <span className="avatar avatar-lg">{initials(user.name)}</span>
      <div><div className="t-sec">{user.name}</div>
        <div className="t-meta mt-0.5">{user.desig} · {t(user.role)}</div>
        <div className="t-meta mt-2">This account is not linked to an employee record, so attendance,
          payslips and leave are not applicable. Owner and head-office accounts see the full dashboards instead.</div>
        <Btn className="mt-3" variant="primary" icon="LayoutDashboard" onClick={()=>go('dashboard')}>{t('Dashboard')}</Btn>
      </div></div></Card>
  </div>;
  const today=db.attendance.find(a=>a.empId===e.id&&a.date===TODAY);
  const st=attStats(db,e.id,mk);
  const myLeaves=sortBy(db.leaves.filter(l=>l.empId===e.id),l=>l.from,'desc');
  const myAdv=db.advances.filter(a=>a.empId===e.id);
  const slips=db.payrollRuns.filter(r=>r.lines.some(l=>l.empId===e.id));
  const mySales=empSales(db,e.id,mk+'-01',TODAY);
  const myBills=db.sales.filter(s=>s.cashierId===e.id&&monKey(s.date)===mk&&s.status==='completed').length;
  const sh=SHIFTS[e.shift];
  const checkIn=()=>{
    const now=String(NOW_H).padStart(2,'0')+':'+String(ri(0,59)).padStart(2,'0');
    const late=Math.max(0,hm(now)-hm(sh.s)-db.settings.payroll.graceMinutes);
    dispatch({type:'attendance.mark',row:{id:`AT-${e.id}-${TODAY}`,empId:e.id,branchId:e.branchId,date:TODAY,
      status:late>0?'L':'P',inT:now,outT:null,otHrs:0,lateMin:late,shift:e.shift,note:''}});
    toast({tone:late>0?'warn':'ok',title:late>0?`Checked in ${late} minutes late`:'Checked in',
      body:`${f12(now)} · ${sh.label}${late>0?' — late minutes count toward the monthly penalty.':''}`});
  };
  const checkOut=()=>{
    const now=String(NOW_H).padStart(2,'0')+':'+String(ri(0,59)).padStart(2,'0');
    const worked=hm(now)-hm(today.inT);
    const ot=Math.max(0,round2((worked-480)/60));
    dispatch({type:'attendance.mark',row:{...today,outT:now,otHrs:ot}});
    toast({tone:'ok',title:'Checked out',body:`${f12(today.inT)} → ${f12(now)}${ot?` · ${ot} hours overtime`:''}`});
  };
  return <div className="grid gap-4">
    <PageHeader title={t('My Workspace')} icon="UserRound" crumbs={crumbs}
      sub={`${e.name} · ${e.desig} · ${db.branches.find(b=>b.id===e.branchId).name}`}
      actions={<Fragment>
        <Btn icon="Plane" onClick={()=>setLeaveOpen(true)}>{t('Apply Leave')}</Btn>
        <Btn icon="PiggyBank" onClick={()=>setAdvOpen(true)}>Request advance</Btn>
      </Fragment>}/>
    <div className="cols2" style={{'--c2':'minmax(0,1fr) minmax(0,1.6fr)'}}>
      <Card>
        <CardH title="Today" icon="Clock" sub={`${fDateLong(TODAY,LANG==='bn')} · ${sh.label}`}/>
        <div className="p-4 grid gap-3">
          <div className="grid grid-cols-2 gap-2">
            <div className="panel p-3"><div className="t-lbl">{t('Check In')}</div>
              <div className="t-kpi num mt-1" style={{fontSize:19}}>{today&&today.inT?f12(today.inT,LANG==='bn'):'—'}</div>
              {today&&today.lateMin>0&&<Badge tone="warn" className="mt-1">{num_(today.lateMin)} min late</Badge>}</div>
            <div className="panel p-3"><div className="t-lbl">{t('Check Out')}</div>
              <div className="t-kpi num mt-1" style={{fontSize:19}}>{today&&today.outT?f12(today.outT,LANG==='bn'):'—'}</div>
              {today&&today.otHrs>0&&<Badge tone="info" className="mt-1">{LANG==='bn'?toBn(today.otHrs):today.otHrs}h OT</Badge>}</div>
          </div>
          {!today||!today.inT
            ? <Btn variant="primary" size="lg" block icon="LogIn" onClick={checkIn}>{t('Check In')}</Btn>
            : !today.outT
              ? <Btn variant="primary" size="lg" block icon="LogOut" onClick={checkOut}>{t('Check Out')}</Btn>
              : <div className="panel p-3 flex items-center gap-2 justify-center">
                  <Icon name="CircleCheck" size={15} style={{color:'var(--success)'}}/>
                  <span className="text-[13px] font-semibold">Shift complete</span></div>}
          <div className="hr"/>
          <div className="grid gap-1">
            <Row label={`${t('Present')} (${monLabel(mk,LANG==='bn')})`} value={num_(st.present+st.late)+' days'}/>
            <Row label={t('Late')} value={num_(st.late)+' days'} tone={st.late>3?'warning':undefined}/>
            <Row label={t('Absent')} value={num_(st.absent)+' days'} tone={st.absent?'danger':undefined}/>
            <Row label={t('Overtime')} value={(LANG==='bn'?toBn(st.ot):st.ot)+' hours'}/>
          </div>
        </div>
      </Card>
      <div className="grid gap-4 min-w-0">
        <div className="grid-kpi">
          <KPI label="My sales this month" value={mySales} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Banknote" tone="brand"
            sub={`${num_(myBills)} bills`}/>
          <KPI label="Commission earned" value={e.commRate?Math.round(mySales*e.commRate/100):0}
            fmt={v=>money(v,{bn:LANG==='bn'})} icon="BadgePercent" tone="success"
            sub={e.commRate?`${e.commRate}% of own sales`:'Not commission-based'}/>
          <KPI label="Advance balance" value={sum(myAdv.filter(a=>a.status==='Approved'),a=>a.remaining)}
            fmt={v=>money(v,{bn:LANG==='bn'})} icon="PiggyBank" tone="warning"/>
          <KPI label="Leave left (Casual)" value={Math.max(0,e.leaveBalance.Casual-
            sum(myLeaves.filter(l=>l.type==='Casual'&&l.status==='Approved'),l=>l.days))} icon="Plane" tone="info"
            sub={`of ${e.leaveBalance.Casual} days`}/>
        </div>
        <Card>
          <CardH title="My payslips" icon="ReceiptText" sub="Printable in Bangla or English"/>
          <div className="p-3 grid gap-2">
            {slips.length===0&&<Empty icon="ReceiptText" title="No payslips yet"/>}
            {sortBy(slips,r=>r.month,'desc').map(r=>{const l=r.lines.find(x=>x.empId===e.id);
              return <div key={r.id} className="panel p-3 flex items-center gap-3">
                <span className="grid place-items-center w-9 h-9 rounded-[9px] shrink-0"
                  style={{background:'var(--primary-soft)',color:'var(--primary)'}}><Icon name="ReceiptText" size={16}/></span>
                <div className="min-w-0 flex-1"><div className="text-[13px] font-semibold">
                  {monLabel(r.month,LANG==='bn')}{r.type?` · ${r.type}`:''}</div>
                  <div className="t-micro">{t('Net Pay')} {money(l.net)} · {r.payMode}</div></div>
                <Btn size="sm" icon="Eye" onClick={()=>setSlip({run:r,line:l})}>{t('View')}</Btn>
              </div>;})}
          </div>
        </Card>
      </div>
    </div>
    <div className="grid gap-4 lg:grid-cols-2">
      <Card>
        <CardH title="My leave" icon="Plane" sub="Requests and balances"
          right={<Btn size="sm" variant="soft" icon="Plus" onClick={()=>setLeaveOpen(true)}>{t('Apply Leave')}</Btn>}/>
        <div className="p-4 grid gap-3">
          <div className="grid gap-2" style={{gridTemplateColumns:'repeat(auto-fit,minmax(90px,1fr))'}}>
            {LEAVE_TYPES.filter(ty=>e.leaveBalance[ty]>0).map(ty=>{
              const taken=sum(myLeaves.filter(l=>l.type===ty&&l.status==='Approved'),l=>l.days);
              const left=Math.max(0,e.leaveBalance[ty]-taken);
              return <div key={ty} className="panel p-2.5 text-center">
                <div className="t-lbl">{ty}</div>
                <div className="t-kpi num mt-1" style={{fontSize:18}}>{num_(left)}</div>
                <div className="t-micro">of {num_(e.leaveBalance[ty])}</div></div>;
            })}
          </div>
          <div className="grid gap-1.5">
            {myLeaves.slice(0,5).map(l=><div key={l.id} className="flex items-center gap-2.5 py-1.5">
              <Badge tone={l.type==='Sick'?'warn':'info'}>{l.type}</Badge>
              <span className="t-meta num flex-1">{d_(l.from)} → {d_(l.to)} · {num_(l.days)}d</span>
              <StatusBadge v={l.status}/></div>)}
            {myLeaves.length===0&&<div className="t-meta">No leave taken yet.</div>}
          </div>
        </div>
      </Card>
      <Card>
        <CardH title="My advance" icon="PiggyBank" sub="Instalments recovered through payroll"
          right={<Btn size="sm" variant="soft" icon="Plus" onClick={()=>setAdvOpen(true)}>Request</Btn>}/>
        <div className="p-4 grid gap-2.5">
          {myAdv.length===0&&<Empty icon="PiggyBank" title="No advance taken"
            desc="Request an advance of up to two months’ gross salary."/>}
          {myAdv.map(a=><div key={a.id} className="panel p-3">
            <div className="flex items-center justify-between gap-2 mb-1.5">
              <span className="text-[13px] font-semibold">{money(a.amount,{bn:LANG==='bn'})}</span>
              <StatusBadge v={a.status}/></div>
            <div className="t-micro mb-2">{a.reason} · {d_(a.date)}</div>
            <Bar value={pct(a.paid,a.amount)} tone="success"/>
            <div className="flex justify-between t-micro mt-1.5">
              <span>Repaid {money(a.paid)}</span><span>{t('Remaining')} {money(a.remaining)}</span></div>
          </div>)}
        </div>
      </Card>
    </div>
    <LeaveApply open={leaveOpen} onClose={()=>setLeaveOpen(false)} fixedEmp={e.id}/>
    <AdvanceForm open={advOpen} onClose={()=>setAdvOpen(false)} fixedEmp={e.id}/>
    {slip&&<PayslipModal run={slip.run} line={slip.line} onClose={()=>setSlip(null)}/>}
  </div>;
}

/* ---- cash drawer / shift ---- */
function CashDrawer(){
  const {db,dispatch,branchIds,branchId,user,toast,crumbs}=useApp();
  const [close,setClose]=useState(null);
  const [open,setOpen]=useState(false);
  const [counted,setCounted]=useState('');
  const rows=sortBy(db.shifts.filter(s=>branchIds.includes(s.branchId)),s=>s.date+s.openTime,'desc');
  const openShifts=rows.filter(s=>s.status==='Open');
  const doClose=()=>{
    const s=close; const cnt=Number(counted)||0;
    const diff=round2(cnt-s.expected);
    dispatch({type:'patch',coll:'shifts',id:s.id,data:{status:'Closed',closeTime:String(NOW_H)+':30',
      counted:cnt,diff,deductFromSalary:diff<=-300,
      note:diff<=-300?'Shortage flagged for salary deduction':diff!==0?'Variance noted':''}});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Shift closed',
      entity:'Shift',detail:`${db.branches.find(b=>b.id===s.branchId).name} · counted ${money(cnt)} · ${diff===0?'balanced':money(diff,{sign:true})}`,
      branchId:s.branchId}});
    toast({tone:diff===0?'ok':Math.abs(diff)<100?'warn':'err',
      title:diff===0?'Shift closed and balanced':`Shift closed — ${money(Math.abs(diff))} ${diff<0?'short':'over'}`,
      body:diff<=-300?'Shortage flagged for salary deduction in the next payroll.':undefined});
    setClose(null); setCounted('');
  };
  return <div className="grid gap-4">
    <PageHeader title={t('Cash Drawer')} icon="Wallet" crumbs={crumbs}
      sub="Open with counted cash, close against expected — shortages can flow into payroll"
      actions={<Btn variant="primary" icon="Play" onClick={()=>setOpen(true)}>Open shift</Btn>}/>
    {openShifts.length>0&&<div className="grid gap-3">
      {openShifts.map(s=><Card key={s.id} style={{borderColor:'var(--primary-line)'}}>
        <div className="p-4 flex items-center gap-3 flex-wrap">
          <span className="grid place-items-center w-10 h-10 rounded-[11px] shrink-0"
            style={{background:'var(--primary-soft)',color:'var(--primary)'}}><Icon name="Wallet" size={18}/></span>
          <div className="min-w-0 flex-1">
            <div className="text-[13.5px] font-semibold">Shift open — {db.branches.find(b=>b.id===s.branchId).name}</div>
            <div className="t-micro">{(db.employees.find(e=>e.id===s.cashierId)||{}).name} · opened {f12(s.openTime,LANG==='bn')} ·
              {' '}{num_(s.salesCount)} bills · {money(s.salesTotal)} taken</div>
          </div>
          <Btn variant="primary" icon="Lock" onClick={()=>{setClose(s);setCounted(String(s.expected))}}>Close shift</Btn>
        </div>
      </Card>)}
    </div>}
    <div className="grid-kpi">
      <KPI label="Shifts (7 days)" value={rows.length} icon="Wallet"/>
      <KPI label="Cash collected" value={sum(rows,s=>s.byMethod.Cash||0)} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Banknote" tone="success"/>
      <KPI label="Variances" value={rows.filter(s=>s.diff).length} icon="Scale" tone="warning"
        sub={money(sum(rows.filter(s=>s.diff),s=>Math.abs(s.diff)))+' total'}/>
      <KPI label="Flagged for deduction" value={rows.filter(s=>s.deductFromSalary).length} icon="TriangleAlert" tone="danger"/>
    </div>
    <DataTable rows={rows} pageSize={12}
      cols={[
        {k:'date',h:t('Date'),sort:s=>s.date,cell:s=><span className="num">{d_(s.date)}</span>},
        {k:'branch',h:t('Branch'),cell:s=><Badge tone="neutral">{db.branches.find(b=>b.id===s.branchId).name}</Badge>},
        {k:'cashier',h:t('Cashier'),cell:s=><span>{(db.employees.find(e=>e.id===s.cashierId)||{}).name}</span>},
        {k:'time',h:'Shift',cell:s=><span className="num t-meta">{f12(s.openTime)} → {s.closeTime?f12(s.closeTime):'open'}</span>},
        {k:'bills',h:'Bills',cls:'r',sort:s=>s.salesCount,cell:s=><span className="num">{num_(s.salesCount)}</span>},
        {k:'sales',h:t('Sales'),cls:'r',sort:s=>s.salesTotal,cell:s=><span className="num">{money(s.salesTotal,{bn:LANG==='bn'})}</span>},
        {k:'expected',h:'Expected cash',cls:'r',sort:s=>s.expected,cell:s=><span className="num">{money(s.expected,{bn:LANG==='bn'})}</span>},
        {k:'counted',h:'Counted',cls:'r',cell:s=><span className="num">{s.counted==null?'—':money(s.counted,{bn:LANG==='bn'})}</span>},
        {k:'diff',h:'Difference',cls:'r',sort:s=>s.diff||0,cell:s=>s.diff==null?<span className="subtle">—</span>
          :<Badge tone={s.diff===0?'ok':Math.abs(s.diff)<100?'warn':'bad'}>
            {s.diff===0?'Balanced':money(s.diff,{sign:true,bn:LANG==='bn'})}</Badge>},
        {k:'status',h:t('Status'),cell:s=><div><StatusBadge v={s.status}/>
          {s.deductFromSalary&&<Badge tone="bad" sq className="ml-1">Payroll</Badge>}</div>},
      ]}
      onRowClick={s=>s.status==='Closed'?null:setClose(s)}/>
    {close&&<Modal open onClose={()=>setClose(null)} icon="Lock" title="Close shift"
      sub={`${db.branches.find(b=>b.id===close.branchId).name} · ${(db.employees.find(e=>e.id===close.cashierId)||{}).name}`}
      footer={<Fragment><Btn onClick={()=>setClose(null)}>{t('Cancel')}</Btn>
        <Btn variant="primary" icon="Check" onClick={doClose}>Close shift</Btn></Fragment>}>
      <div className="grid gap-3">
        <div className="panel p-3 grid gap-1">
          <div className="t-lbl mb-1">Collection by method</div>
          {Object.entries(close.byMethod).map(([m,v])=><Row key={m} label={t(m)} value={money(v,{bn:LANG==='bn'})}/>)}
          <div className="hr my-1.5"/>
          <Row label="Opening cash" value={money(close.openingCash,{bn:LANG==='bn'})}/>
          <Row label="Cash sales" value={money(close.byMethod.Cash||0,{bn:LANG==='bn'})}/>
          <Row label="Returns refunded" value={'−'+money(close.returnsTotal,{bn:LANG==='bn'})}/>
          <Row label="Expected in drawer" value={money(close.expected,{bn:LANG==='bn'})} strong/>
        </div>
        <Field label="Counted cash" req hint="Count the drawer before saving">
          <Input className="ta-right" value={counted} onChange={e=>setCounted(e.target.value.replace(/[^\d.]/g,''))}
            style={{fontSize:19,height:46,fontWeight:650}}/></Field>
        {counted!==''&&<div className="p-3 rounded-[10px] flex items-center justify-between"
          style={{background:Number(counted)-close.expected===0?'var(--success-soft)':'var(--warning-soft)',
            border:'1px solid '+(Number(counted)-close.expected===0?'var(--success-line)':'var(--warning-line)')}}>
          <span className="t-sec" style={{fontSize:14}}>Difference</span>
          <span className="t-kpi num" style={{fontSize:20,
            color:Number(counted)-close.expected===0?'var(--success)':'var(--warning)'}}>
            {money(Number(counted)-close.expected,{sign:true,bn:LANG==='bn'})}</span>
        </div>}
        {Number(counted)-close.expected<=-300&&<div className="t-micro flex items-start gap-2 p-2.5 rounded-lg"
          style={{background:'var(--danger-soft)',color:'var(--danger)'}}>
          <Icon name="TriangleAlert" size={13} style={{flex:'none',marginTop:1}}/>
          A shortage of ৳300 or more is flagged for salary deduction in the next payroll run.</div>}
      </div>
    </Modal>}
    <Modal open={open} onClose={()=>setOpen(false)} icon="Play" title="Open shift"
      sub="Record the float in the drawer before billing starts"
      footer={<Fragment><Btn onClick={()=>setOpen(false)}>{t('Cancel')}</Btn>
        <Btn variant="primary" icon="Check" onClick={()=>{
          const brId=branchIds[0];
          dispatch({type:'upsert',coll:'shifts',item:{id:uid('SH'),branchId:brId,cashierId:user.empId||'E06',
            date:TODAY,openTime:String(NOW_H)+':00',closeTime:null,openingCash:3000,byMethod:{},salesCount:0,
            salesTotal:0,returnsTotal:0,expected:3000,counted:null,diff:null,status:'Open',deductFromSalary:false,note:''}});
          toast({tone:'ok',title:'Shift opened',body:`Opening float ৳3,000 · ${db.branches.find(b=>b.id===brId).name}`});
          setOpen(false)}}>Open shift</Btn></Fragment>}>
      <div className="grid gap-3">
        <Field label="Opening cash float"><Input className="ta-right" defaultValue="3000"
          style={{fontSize:18,height:44,fontWeight:600}}/></Field>
        <div className="t-micro">The float is added to expected cash at closing time.</div>
      </div>
    </Modal>
  </div>;
}
</script>

<script type="text/babel" data-presets="react">
/* ===================== 7.4 SALES HISTORY & RETURNS ===================== */
function SalesHistory(){
  const {db,dispatch,branchIds,user,toast,params,crumbs,go}=useApp();
  const [range,setRange]=useRange('30d');
  const [open,setOpen]=useState(params.invId||null);
  const [cashier,setCashier]=useState(''); const [pay,setPay]=useState(''); const [st,setSt]=useState('');
  const [cancel,setCancel]=useState(null);
  useEffect(()=>{ if(params.invId){setOpen(params.invId); setRange({preset:'90d',from:addDays(TODAY,-89),to:TODAY})} },[params.invId]);
  const rows=useMemo(()=>db.sales.filter(s=>branchIds.includes(s.branchId)&&s.date>=range.from&&s.date<=range.to
    &&(!cashier||s.cashierId===cashier)&&(!pay||s.payments.some(p=>p.method===pay))&&(!st||s.status===st)),
    [db,branchIds,range,cashier,pay,st]);
  const done=rows.filter(s=>s.status!=='cancelled');
  const cashiers=uniq(db.sales.filter(s=>branchIds.includes(s.branchId)).map(s=>s.cashierId));
  return <div className="grid gap-4">
    <PageHeader title={t('Sales History')} icon="ReceiptText" crumbs={crumbs}
      sub={`${num_(rows.length)} invoices · ${d_(range.from)} → ${d_(range.to)}`}
      actions={<Fragment>
        <DateRange value={range} onChange={setRange}/>
        <Btn icon="FileDown" onClick={()=>toast({tone:'info',title:'Sales register exported',
          body:`${rows.length} invoices queued as XLSX with item detail.`})}>{t('Export')}</Btn>
      </Fragment>}/>
    <div className="grid-kpi">
      <KPI label={t('Sales')} value={sum(done,s=>s.total)} fmt={v=>moneyK(v,LANG==='bn')} icon="Banknote"
        sub={`${num_(done.length)} invoices`}/>
      <KPI label={t('Gross Profit')} value={sum(done,s=>s.profit)} fmt={v=>moneyK(v,LANG==='bn')} icon="TrendingUp" tone="success"
        sub={`${pct(sum(done,s=>s.profit),sum(done,s=>s.total))}% margin`}/>
      <KPI label="Average bill" value={done.length?sum(done,s=>s.total)/done.length:0}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="Calculator" tone="info"/>
      <KPI label="Discount given" value={sum(done,s=>s.itemDisc+s.billDisc)} fmt={v=>moneyK(v,LANG==='bn')}
        icon="BadgePercent" tone="warning"/>
      <KPI label={t('Baki')} value={sum(done,s=>s.bakiAdded)} fmt={v=>moneyK(v,LANG==='bn')} icon="Clock" tone="danger"/>
      <KPI label={t('Cancelled')} value={rows.filter(s=>s.status==='cancelled').length} icon="CircleX" tone="neutral"/>
    </div>
    <DataTable rows={rows} pageSize={15} initialSort={{k:'date',dir:'desc'}} onRowClick={s=>setOpen(s.id)}
      search={(s,q)=>s.no.toLowerCase().includes(q)||s.custName.toLowerCase().includes(q)||s.custPhone.includes(q)
        ||s.items.some(i=>i.brand.toLowerCase().includes(q))}
      searchPlaceholder="Invoice, customer, phone or medicine…"
      filters={<Fragment>
        <Select sm value={cashier} onChange={e=>setCashier(e.target.value)} style={{width:150}}>
          <option value="">{t('Cashier')} — all</option>
          {cashiers.map(c=><option key={c} value={c}>{(db.employees.find(e=>e.id===c)||{}).name||c}</option>)}</Select>
        <Select sm value={pay} onChange={e=>setPay(e.target.value)} style={{width:130}}>
          <option value="">{t('Payment')} — all</option>
          {['Cash','bKash','Nagad','Rocket','Card','Bank','Cheque','Baki'].map(m=><option key={m}>{m}</option>)}</Select>
        <Select sm value={st} onChange={e=>setSt(e.target.value)} style={{width:130}}>
          <option value="">{t('Status')} — all</option><option value="completed">Completed</option>
          <option value="returned">Returned</option><option value="cancelled">Cancelled</option></Select>
      </Fragment>}
      cols={[
        {k:'no',h:t('Invoice No'),sort:s=>s.no,cell:s=><div><span className="mono font-semibold">{s.no}</span>
          {s.rx&&<Badge tone="info" sq className="ml-1.5">Rx</Badge>}</div>},
        {k:'date',h:t('Date'),sort:s=>s.date+s.time,cell:s=><div><div className="num">{d_(s.date)}</div>
          <div className="t-micro num">{f12(s.time,LANG==='bn')}</div></div>},
        {k:'cust',h:t('Customer'),sort:s=>s.custName,cell:s=><div className="min-w-0">
          <div className="clip">{s.custName}</div>
          {s.custPhone&&<div className="t-micro">{fPhone(s.custPhone)}</div>}</div>},
        {k:'branch',h:t('Branch'),cell:s=><span className="t-meta">{db.branches.find(b=>b.id===s.branchId).name}</span>},
        {k:'cashier',h:t('Cashier'),sort:s=>s.cashierId,cell:s=><span className="t-meta">{((db.employees.find(e=>e.id===s.cashierId)||{}).name||'').split(' ')[0]}</span>},
        {k:'items',h:t('Items'),cls:'r',sort:s=>s.items.length,cell:s=><span className="num">{num_(s.items.length)}</span>},
        {k:'pay',h:t('Payment'),cell:s=><div className="flex gap-1 flex-wrap">{s.payments.map((p,i)=>
          <Badge key={i} tone={p.method==='Baki'?'warn':'neutral'} sq>{t(p.method)}</Badge>)}</div>},
        {k:'total',h:t('Total'),cls:'r',sort:s=>s.total,cell:s=><span className="num font-semibold">{money(s.total,{bn:LANG==='bn'})}</span>},
        {k:'status',h:t('Status'),sort:s=>s.status,cell:s=><StatusBadge v={s.status}/>},
      ]}
      bulkActions={[{label:'Export selection',icon:'FileDown',onClick:ids=>toast({tone:'ok',title:`${ids.length} invoices exported`})}]}
      empty={{icon:'ReceiptText',title:'No invoices in this period',
        desc:'Widen the date range or clear the cashier and payment filters.'}}/>
    {open&&<InvoiceDrawer id={open} onClose={()=>setOpen(null)} onCancel={s=>setCancel(s)}/>}
    {cancel&&<CancelInvoice sale={cancel} onClose={()=>setCancel(null)} onDone={()=>{setCancel(null);setOpen(null)}}/>}
  </div>;
}

function InvoiceDrawer({id,onClose,onCancel}){
  const {db,user,toast,go}=useApp();
  const [rcpt,setRcpt]=useState(false);
  const s=db.sales.find(x=>x.id===id);
  if(!s) return null;
  const br=db.branches.find(b=>b.id===s.branchId);
  const ret=db.returns.find(r=>r.invoiceId===s.id);
  const canCancel=can(user.role,'sales.cancel')&&s.status==='completed';
  return <Fragment>
    <Drawer open wide onClose={onClose} icon="ReceiptText" title={s.no}
      sub={`${br.name} · ${fDate(s.date)} ${f12(s.time)} · ${(db.employees.find(e=>e.id===s.cashierId)||{}).name}`}
      footer={<Fragment>
        <Btn onClick={onClose}>{t('Close')}</Btn>
        {canCancel&&<Btn variant="danger" icon="CircleX" onClick={()=>onCancel(s)}>Cancel invoice</Btn>}
        {s.status==='completed'&&can(user.role,'sales.return')&&
          <Btn icon="Undo2" onClick={()=>{go('returns',{invId:s.id});onClose()}}>{t('Return')}</Btn>}
        <Btn variant="primary" icon="Printer" onClick={()=>setRcpt(true)}>{t('Reprint')}</Btn>
      </Fragment>}>
      <div className="grid gap-4">
        {s.status!=='completed'&&<div className="card p-3 flex items-center gap-2.5"
          style={{background:s.status==='cancelled'?'var(--danger-soft)':'var(--purple-soft)',borderColor:'transparent'}}>
          <Icon name={s.status==='cancelled'?'CircleX':'Undo2'} size={16}
            style={{color:s.status==='cancelled'?'var(--danger)':'var(--purple)'}}/>
          <div className="text-[12.5px]">{s.status==='cancelled'
            ? <span><b>Cancelled.</b> {s.cancelReason}</span>
            : <span><b>Returned.</b> A credit note was issued against this invoice.</span>}</div>
        </div>}
        <div className="grid gap-2 sm:grid-cols-4">
          <div className="panel p-3"><div className="t-lbl">{t('Grand Total')}</div>
            <div className="t-kpi num mt-1" style={{fontSize:19}}>{money(s.total,{bn:LANG==='bn'})}</div></div>
          <div className="panel p-3"><div className="t-lbl">{t('Gross Profit')}</div>
            <div className="t-kpi num mt-1" style={{fontSize:19,color:'var(--success)'}}>{money(s.profit,{bn:LANG==='bn'})}</div>
            <div className="t-micro">{pct(s.profit,s.total)}% margin</div></div>
          <div className="panel p-3"><div className="t-lbl">{t('Payment')}</div>
            <div className="mt-1 flex gap-1 flex-wrap">{s.payments.map((p,i)=><Badge key={i} tone="neutral">{t(p.method)}</Badge>)}</div>
            {s.payments.find(p=>p.txnId)&&<div className="t-micro mono mt-1">{s.payments.find(p=>p.txnId).txnId}</div>}</div>
          <div className="panel p-3"><div className="t-lbl">{t('Customer')}</div>
            <div className="text-[13px] font-semibold mt-1 clip">{s.custName}</div>
            {s.custPhone&&<div className="t-micro">{fPhone(s.custPhone)}</div>}</div>
        </div>
        {s.doctorId&&<div className="panel p-3 flex items-center gap-2.5">
          <Icon name="Stethoscope" size={15} style={{color:'var(--info)'}}/>
          <div><div className="text-[12.5px] font-semibold">{(db.doctors.find(d=>d.id===s.doctorId)||{}).name}</div>
            <div className="t-micro">{(db.doctors.find(d=>d.id===s.doctorId)||{}).spec} ·
              {s.rxPhoto?' prescription photo attached':' no photo on file'}</div></div>
        </div>}
        <Card><CardH title={`${t('Items')} (${s.items.length})`} icon="Package"/>
          <div className="tw"><table className="dt compact">
            <thead><tr><th>{t('Medicines')}</th><th>{t('Batch')}</th><th>{t('Expiry')}</th><th className="r">{t('Qty')}</th>
              <th className="r">{t('MRP')}</th><th className="r">{t('Discount')}</th><th className="r">{t('VAT')}</th>
              <th className="r">{t('Amount')}</th></tr></thead>
            <tbody>{s.items.map((i,n)=><tr key={n}>
              <td><div className="font-semibold">{i.brand} <span className="t-meta">{i.strength}</span></div>
                <div className="t-micro">{i.company}{i.controlled?' · controlled':''}</div></td>
              <td className="mono t-meta">{i.batchNo}</td><td className="num t-meta">{i.expiry?d_(i.expiry):'—'}</td>
              <td className="r num">{num_(i.qty)} {t(i.unit)}</td>
              <td className="r num">{money(i.mrp,{dec:2,sym:false})}</td>
              <td className="r num" style={{color:i.disc?'var(--success)':undefined}}>{i.disc?money(i.disc,{dec:2,sym:false}):'—'}</td>
              <td className="r num">{i.vatAmt?money(i.vatAmt,{dec:2,sym:false}):'—'}</td>
              <td className="r num font-semibold">{money(i.amount,{dec:2,sym:false})}</td></tr>)}</tbody></table></div>
          <div className="card-f grid gap-1">
            <Row label={t('Subtotal')} value={money(s.sub,{dec:2,bn:LANG==='bn'})}/>
            {s.itemDisc>0&&<Row label={`${t('Item')} ${t('Discount')}`} value={'−'+money(s.itemDisc,{dec:2,bn:LANG==='bn'})}/>}
            {s.billDisc>0&&<Row label={`Bill ${t('Discount')}`} value={'−'+money(s.billDisc,{dec:2,bn:LANG==='bn'})}/>}
            {s.vat>0&&<Row label={t('VAT')} value={'+'+money(s.vat,{dec:2,bn:LANG==='bn'})}/>}
            {!!s.rounding&&<Row label="Rounding" value={money(s.rounding,{dec:2,sign:true,bn:LANG==='bn'})}/>}
            <Row label={t('Grand Total')} value={money(s.total,{bn:LANG==='bn'})} strong/>
            {s.bakiAdded>0&&<Row label={t('Baki')} value={money(s.bakiAdded,{bn:LANG==='bn'})} tone="warning"/>}
            {s.pointsEarned>0&&<Row label={t('Loyalty Points')} value={`+${num_(s.pointsEarned)} earned · balance ${num_(s.pointsBalance)}`}/>}
          </div>
        </Card>
        {ret&&<Card><CardH title="Linked return" icon="Undo2" sub={`${ret.no} · ${fDate(ret.date)}`}/>
          <div className="p-4 grid gap-1">
            <Row label="Refund method" value={ret.refundMethod}/>
            <Row label="Disposition" value={ret.disposition}/>
            <Row label={t('Reason')} value={ret.reason}/>
            <Row label={t('Amount')} value={money(ret.total,{bn:LANG==='bn'})} strong/>
          </div></Card>}
      </div>
    </Drawer>
    {rcpt&&<ReceiptModal open onClose={()=>setRcpt(false)} sale={s} db={db} duplicate toast={toast}/>}
  </Fragment>;
}

function CancelInvoice({sale,onClose,onDone}){
  const {db,dispatch,user,toast}=useApp();
  const [reason,setReason]=useState('');
  return <Modal open onClose={onClose} icon="CircleX" tone="danger" title="Cancel invoice"
    sub={`${sale.no} · ${money(sale.total)} · ${fDate(sale.date)}`}
    footer={<Fragment><Btn onClick={onClose}>Keep invoice</Btn>
      <Btn variant="danger" icon="CircleX" disabled={!reason.trim()} onClick={()=>{
        dispatch({type:'patch',coll:'sales',id:sale.id,data:{status:'cancelled',cancelReason:reason}});
        dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:'Sale cancelled',
          entity:'Invoice',detail:`${sale.no} · ${money(sale.total)} · ${reason}`,branchId:sale.branchId}});
        toast({tone:'warn',title:'Invoice cancelled',body:`${sale.no} · reason logged in the activity trail.`});
        onDone();
      }}>Cancel invoice</Btn></Fragment>}>
    <div className="grid gap-3">
      <div className="p-3 rounded-[10px] flex items-start gap-2"
        style={{background:'var(--danger-soft)',border:'1px solid var(--danger-line)'}}>
        <Icon name="TriangleAlert" size={14} style={{color:'var(--danger)',flex:'none',marginTop:1}}/>
        <span className="text-[12.5px]" style={{color:'var(--danger)'}}>
          Cancelling removes this invoice from sales, profit and cashier commission. Stock is not restored
          automatically — raise a sales return instead if the goods came back.</span>
      </div>
      <Field label="Reason for cancellation" req><Textarea value={reason} onChange={e=>setReason(e.target.value)}
        placeholder="e.g. Billed to the wrong customer"/></Field>
    </div>
  </Modal>;
}

/* ---- sales returns ---- */
function SalesReturns(){
  const {db,dispatch,branchIds,user,toast,params,crumbs}=useApp();
  const [form,setForm]=useState(params.invId?{invId:params.invId}:null);
  const [view,setView]=useState(null);
  const rows=sortBy(db.returns.filter(r=>branchIds.includes(r.branchId)),r=>r.date,'desc');
  return <div className="grid gap-4">
    <PageHeader title={t('Sales Returns')} icon="Undo2" crumbs={crumbs}
      sub="Credit notes linked to the original invoice · returnable stock goes back on the shelf"
      actions={<Btn variant="primary" icon="Plus" onClick={()=>setForm({})}>New return</Btn>}/>
    <div className="grid-kpi">
      <KPI label="Returns" value={rows.length} icon="Undo2" sub="Last 60 days"/>
      <KPI label="Refund value" value={sum(rows,r=>r.total)} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Banknote" tone="warning"/>
      <KPI label="Back to stock" value={rows.filter(r=>r.disposition==='Back to Stock').length} icon="PackageCheck" tone="success"/>
      <KPI label="Damaged" value={rows.filter(r=>r.disposition==='Damage').length} icon="PackageX" tone="danger"

    <DataTable rows={rows} pageSize={12} onRowClick={r=>setView(r.id)}
      search={(r,q)=>r.no.toLowerCase().includes(q)||r.invoiceNo.toLowerCase().includes(q)||r.custName.toLowerCase().includes(q)}
      searchPlaceholder="Return or invoice number, customer…"
      cols={[
        {k:'no',h:'Credit note',sort:r=>r.no,cell:r=><span className="mono">{r.no}</span>},
        {k:'invoiceNo',h:'Against invoice',sort:r=>r.invoiceNo,cell:r=><span className="mono t-meta">{r.invoiceNo}</span>},
        {k:'date',h:t('Date'),sort:r=>r.date,cell:r=><span className="num">{d_(r.date)}</span>},
        {k:'cust',h:t('Customer'),cell:r=><span className="clip">{r.custName}</span>},
        {k:'items',h:t('Items'),cell:r=><span className="t-meta clip" style={{maxWidth:200}}>
          {r.items.map(i=>`${i.brand} ×${i.qty}`).join(', ')}</span>},
        {k:'reason',h:t('Reason'),cell:r=><span className="t-meta clip" style={{maxWidth:180}}>{r.reason}</span>},
        {k:'disposition',h:'Stock',cell:r=><Badge tone={r.disposition==='Damage'?'bad':'ok'}>{r.disposition}</Badge>},
        {k:'refund',h:'Refund',cell:r=><Badge tone="neutral">{r.refundMethod}</Badge>},
        {k:'total',h:t('Amount'),cls:'r',sort:r=>r.total,cell:r=><span className="num font-semibold">{money(r.total,{bn:LANG==='bn'})}</span>},
      ]}
      empty={{icon:'Undo2',title:'No returns recorded'}}/>
    {form&&<ReturnForm init={form} onClose={()=>setForm(null)}/>}
    {view&&(()=>{ const r=rows.find(x=>x.id===view);
      const pseudo={...r,no:r.no,items:r.items.map(i=>({...i,mrp:i.price,unit:i.unit,vatAmt:0,disc:0,offerDisc:0})),
        sub:r.total,itemDisc:0,billDisc:0,vat:0,rounding:0,payments:[{method:r.refundMethod,amount:r.total}],
        change:0,bakiAdded:0,prevBaki:0,pointsEarned:0,pointsRedeemed:0,pointsBalance:0,
        custPhone:'',counter:'C1',doctorId:null,customerId:r.customerId};
      return <ReceiptModal open onClose={()=>setView(null)} sale={pseudo} db={db} toast={toast}
        isReturn original={r.invoiceNo}/>;
    })()}
  </div>;
}
function ReturnForm({init,onClose}){
  const {db,dispatch,user,toast,branchIds}=useApp();
  const [invNo,setInvNo]=useState('');
  const [sale,setSale]=useState(init.invId? db.sales.find(s=>s.id===init.invId) : null);
  const [picked,setPicked]=useState([]);
  const [refund,setRefund]=useState('Cash');
  const [disp,setDisp]=useState('Back to Stock');
  const [reason,setReason]=useState('');
  const [err,setErr]=useState('');
  useEffect(()=>{ if(sale) setPicked(sale.items.map(i=>({...i,take:0}))) },[sale]);
  const find=()=>{
    const s=db.sales.find(x=>x.no.toLowerCase()===invNo.trim().toLowerCase()&&branchIds.includes(x.branchId));
    if(!s){ setErr('No invoice with that number at this branch.'); return }
    if(s.status==='cancelled'){ setErr('That invoice is cancelled.'); return }
    setSale(s); setErr('');
  };
  const total=round2(sum(picked,p=>p.take*(p.amount/p.qty)));
  const save=()=>{
    if(!sale){ setErr('Find the original invoice first.'); return }
    if(total<=0){ setErr('Select at least one item and quantity to return.'); return }
    if(!reason.trim()){ setErr('Give a reason for the return.'); return }
    const items=picked.filter(p=>p.take>0).map(p=>({medId:p.medId,brand:p.brand,strength:p.strength,
      batchId:p.batchId,batchNo:p.batchNo,unit:p.unit,qty:p.take,
      pieces:Math.round(p.pieces/p.qty*p.take),price:p.price,
      amount:round2(p.take*(p.amount/p.qty)),restock:disp==='Back to Stock'}));
    const ret={id:uid('R'),no:`RET-${db.branches.find(b=>b.id===sale.branchId).code}-2026-${String(500+db.returns.length).padStart(4,'0')}`,
      invoiceId:sale.id,invoiceNo:sale.no,branchId:sale.branchId,date:TODAY,
      time:String(NOW_H).padStart(2,'0')+':'+String(ri(10,59)).padStart(2,'0'),
      customerId:sale.customerId,custName:sale.custName,cashierId:user.empId||'E06',items,total,
      refundMethod:refund,disposition:disp,reason,approvedBy:user.empId||user.id,status:'completed'};
    dispatch({type:'return.commit',ret,userId:user.id,userName:user.name});
    toast({tone:'ok',title:'Return completed',
      body:`${ret.no} · ${money(total)} refunded via ${refund} · ${disp==='Back to Stock'?'stock restored':'written off as damage'}.`});
    onClose();
  };
  return <Drawer open wide onClose={onClose} icon="Undo2" title="Sales return"
    sub="Scan or type the original invoice number"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Check" onClick={save} disabled={!sale}>Issue credit note · {money(total)}</Btn></Fragment>}>
    <div className="grid gap-3">
      {!sale&&<Fragment>
        <Field label={t('Invoice No')} req error={err}>
          <div className="flex gap-2"><Input className="mono" value={invNo} placeholder="DHN-2026-000123"
            onChange={e=>{setInvNo(e.target.value.toUpperCase());setErr('')}}
            onKeyDown={e=>{if(e.key==='Enter')find()}}/>
            <Btn variant="primary" icon="Search" onClick={find}>Find</Btn></div></Field>
        <div className="t-lbl">Recent invoices</div>
        <div className="grid gap-1.5">
          {sortBy(db.sales.filter(s=>branchIds.includes(s.branchId)&&s.status==='completed'),s=>s.date+s.time,'desc')
            .slice(0,8).map(s=><button key={s.id} className="panel p-2.5 flex items-center gap-2.5 text-left"
              onClick={()=>setSale(s)}>
              <span className="min-w-0 flex-1"><span className="block mono text-[12.5px] font-semibold">{s.no}</span>
                <span className="block t-micro">{s.custName} · {d_(s.date)} · {num_(s.items.length)} items</span></span>
              <span className="num font-semibold">{money(s.total)}</span></button>)}
        </div>
      </Fragment>}
      {sale&&<Fragment>
        <div className="panel p-3 flex items-center gap-2.5">
          <Icon name="ReceiptText" size={16} style={{color:'var(--primary)'}}/>
          <div className="min-w-0 flex-1"><div className="mono text-[13px] font-semibold">{sale.no}</div>
            <div className="t-micro">{sale.custName} · {d_(sale.date)} · {money(sale.total)} · paid by {sale.payments.map(p=>p.method).join(' + ')}</div></div>
          <Btn size="sm" variant="ghost" icon="X" onClick={()=>{setSale(null);setPicked([])}}/>
        </div>
        <div className="t-lbl">Select items to return</div>
        <div className="grid gap-1.5">
          {picked.map((p,i)=><div key={i} className="panel p-2.5 flex items-center gap-2.5 flex-wrap">
            <div className="min-w-0 flex-1">
              <div className="text-[12.5px] font-semibold">{p.brand} <span className="t-meta">{p.strength}</span></div>
              <div className="t-micro">{p.batchNo} · sold {num_(p.qty)} {t(p.unit)} · {money(p.amount/p.qty,{dec:2})} each</div>
            </div>
            <div className="qty">
              <button onClick={()=>setPicked(ls=>ls.map((x,j)=>j===i?{...x,take:Math.max(0,x.take-1)}:x))}>−</button>
              <input value={p.take} readOnly aria-label={`Return quantity for ${p.brand}`}/>
              <button onClick={()=>setPicked(ls=>ls.map((x,j)=>j===i?{...x,take:Math.min(x.qty,x.take+1)}:x))}>+</button>
            </div>
            <span className="num text-[12.5px] font-semibold" style={{minWidth:72,textAlign:'right'}}>
              {money(p.take*(p.amount/p.qty),{dec:2})}</span>
          </div>)}
        </div>
        <div className="grid gap-3 sm:grid-cols-2">
          <Field label="Refund method"><Select value={refund} onChange={e=>setRefund(e.target.value)}>
            {['Cash','bKash','Nagad','Card reversal','Baki Adjustment'].map(m=><option key={m}>{m}</option>)}</Select></Field>
          <Field label="Stock disposition"><Select value={disp} onChange={e=>setDisp(e.target.value)}>
            <option>Back to Stock</option><option>Damage</option></Select></Field>
        </div>
        <Field label={t('Reason')} req><Textarea value={reason} onChange={e=>{setReason(e.target.value);setErr('')}}
          placeholder="Why the customer returned it"/></Field>
        <div className="panel p-3 flex items-center justify-between">
          <span className="t-sec" style={{fontSize:14}}>Refund total</span>
          <span className="t-kpi num" style={{fontSize:21,color:'var(--primary)'}}>{money(total,{bn:LANG==='bn'})}</span>
        </div>
        {disp==='Damage'&&<div className="t-micro flex items-start gap-2 p-2.5 rounded-lg"
          style={{background:'var(--warning-soft)',color:'var(--warning)'}}>
          <Icon name="TriangleAlert" size={13} style={{flex:'none',marginTop:1}}/>
          Damaged returns are refunded but not added back to stock. Fridge items are never returnable.</div>}
        {err&&<div className="err">{err}</div>}
      </Fragment>}
    </div>
  </Drawer>;
}
</script>

<script type="text/babel" data-presets="react">
/* ===================== 7.7 CUSTOMERS & DOCTORS ===================== */
function Customers(){
  const {db,dispatch,branchIds,user,toast,params,crumbs,go}=useApp();
  const [open,setOpen]=useState(params.custId||null);
  const [type,setType]=useState('');
  const [onlyBaki,setOnlyBaki]=useState(false);
  useEffect(()=>{ if(params.custId) setOpen(params.custId) },[params.custId]);
  const rows=useMemo(()=>db.customers.filter(c=>branchIds.includes(c.branchId)&&(!type||c.type===type)&&(!onlyBaki||c.baki>0))
    .map(c=>{
      const inv=db.sales.filter(s=>s.customerId===c.id&&s.status==='completed');
      return {...c,bills:inv.length,spend:round2(sum(inv,s=>s.total)),
        last:inv.length?sortBy(inv,s=>s.date,'desc')[0].date:null};
    }),[db,branchIds,type,onlyBaki]);
  return <div className="grid gap-4">
    <PageHeader title={t('Customers')} icon="Users" crumbs={crumbs}
      sub={`${num_(rows.length)} customers · ${money(sum(rows,r=>r.baki))} Baki outstanding`}
      actions={<Fragment>
        <Btn icon="Bell" onClick={()=>go('receivable')}>Collection reminders</Btn>
        <Btn variant="primary" icon="UserPlus" onClick={()=>go('pos')}>{t('Add Customer')}</Btn>
      </Fragment>}/>
    <div className="grid-kpi">
      <KPI label="Customers" value={rows.length} icon="Users" sub={`${rows.filter(c=>c.type==='wholesale').length} wholesale`}/>
      <KPI label={t('Baki Receivable')} value={sum(rows,r=>r.baki)} fmt={v=>money(v,{bn:LANG==='bn'})} icon="Clock" tone="warning"
        sub={`${rows.filter(c=>c.baki>0).length} with balance`} onClick={()=>setOnlyBaki(true)}/>
      <KPI label="Lifetime spend" value={sum(rows,r=>r.spend)} fmt={v=>moneyK(v,LANG==='bn')} icon="Banknote" tone="info"/>
      <KPI label="Loyalty points" value={sum(rows,r=>r.points)} icon="Gift" tone="purple"
        sub={`worth ${money(sum(rows,r=>r.points)*db.settings.loyalty.pointValue)}`}/>
      <KPI label="Chronic patients" value={rows.filter(c=>c.chronic).length} icon="HeartPulse" tone="danger"
        sub="Refill reminders active"/>
      <KPI label="Members & seniors" value={rows.filter(c=>c.member||c.senior).length} icon="BadgeCheck" tone="success"/>
    </div>
    <DataTable rows={rows} pageSize={12} initialSort={{k:'spend',dir:'desc'}} onRowClick={c=>setOpen(c.id)}
      search={(c,q)=>c.name.toLowerCase().includes(q)||c.phone.includes(q)||(c.chronic||'').toLowerCase().includes(q)}
      searchPlaceholder="Name, mobile or condition…"
      filters={<Fragment>
        <Select sm value={type} onChange={e=>setType(e.target.value)} style={{width:140}}>
          <option value="">{t('Type')} — all</option><option value="retail">{t('Retail')}</option>
          <option value="wholesale">{t('Wholesale')}</option></Select>
        <button className="chip" aria-pressed={onlyBaki} onClick={()=>setOnlyBaki(v=>!v)}>
          <Icon name="Clock" size={11}/>{t('Baki')} only</button>
      </Fragment>}
      cols={[
        {k:'name',h:t('Customer'),sort:c=>c.name,cell:c=><div className="flex items-center gap-2.5 min-w-0">
          <span className="avatar avatar-sm">{initials(c.name)}</span>
          <div className="min-w-0"><div className="font-semibold clip flex items-center gap-1.5">{c.name}
            {c.type==='wholesale'&&<Badge tone="purple" sq>W</Badge>}
            {c.senior&&<Badge tone="info" sq>Senior</Badge>}
            {c.member&&<Badge tone="brand" sq>Member</Badge>}</div>
            <div className="t-micro">{fPhone(c.phone)}</div></div></div>},
        {k:'branch',h:t('Branch'),cell:c=><span className="t-meta">{db.branches.find(b=>b.id===c.branchId).name}</span>},
        {k:'chronic',h:'Condition',cell:c=>c.chronic?<Badge tone="info" icon="HeartPulse">{c.chronic}</Badge>:<span className="subtle">—</span>},
        {k:'bills',h:'Bills',cls:'r',sort:c=>c.bills,cell:c=><span className="num">{num_(c.bills)}</span>},
        {k:'spend',h:'Lifetime spend',cls:'r',sort:c=>c.spend,cell:c=><span className="num">{money(c.spend,{bn:LANG==='bn'})}</span>},
        {k:'baki',h:t('Baki'),cls:'r',sort:c=>c.baki,cell:c=>c.baki>0
          ? <div className="text-right"><span className="num font-semibold" style={{color:'var(--warning)'}}>{money(c.baki,{bn:LANG==='bn'})}</span>
              <div className="t-micro">limit {money(c.creditLimit)}</div></div>
          : <span className="subtle">—</span>},
        {k:'points',h:'Points',cls:'r',sort:c=>c.points,cell:c=><span className="num">{num_(c.points)}</span>},
        {k:'last',h:'Last visit',sort:c=>c.last||'',cell:c=>c.last
          ? <div><div className="num t-meta">{d_(c.last)}</div>
              <div className="t-micro">{num_(dayDiff(c.last,TODAY))} days ago</div></div>
          : <span className="subtle">—</span>},
      ]}/>
    {open&&<CustomerDetail id={open} onClose={()=>setOpen(null)}/>}
  </div>;
}

function CustomerDetail({id,onClose}){
  const {db,dispatch,user,toast,go}=useApp();
  const [tab,setTab]=useState('history');
  const [collect,setCollect]=useState(false);
  const [amt,setAmt]=useState(''); const [method,setMethod]=useState('Cash');
  const c=db.customers.find(x=>x.id===id);
  if(!c) return null;
  const inv=sortBy(db.sales.filter(s=>s.customerId===c.id),s=>s.date+s.time,'desc');
  const done=inv.filter(s=>s.status==='completed');
  const rx=done.filter(s=>s.rx);
  const topMeds=sortBy(Object.values(done.flatMap(s=>s.items).reduce((m,i)=>{
    (m[i.brand]=m[i.brand]||{name:i.brand,qty:0,value:0});m[i.brand].qty+=i.pieces;m[i.brand].value+=i.amount;return m},{})),
    x=>x.value,'desc').slice(0,6);
  const doCollect=()=>{
    const n=Number(amt);
    if(!(n>0)||n>c.baki){ toast({tone:'err',title:'Enter an amount up to '+money(c.baki)}); return }
    dispatch({type:'baki.collect',customerId:c.id,amount:round2(n),method,userId:user.id,userName:user.name,
      time:String(NOW_H)+':15'});
    toast({tone:'ok',title:'Baki collected',body:`${money(n)} from ${c.name} via ${method} · balance ${money(c.baki-n)}`});
    setCollect(false); setAmt('');
  };
  return <Drawer open wide onClose={onClose} icon="User" title={c.name} sub={fPhone(c.phone)}
    footer={<Fragment>
      <Btn onClick={onClose}>{t('Close')}</Btn>
      {c.baki>0&&<Btn icon="HandCoins" onClick={()=>{setCollect(true);setAmt(String(c.baki))}}>{t('Collect')} {money(c.baki)}</Btn>}
      <Btn variant="primary" icon="ScanBarcode" onClick={()=>{go('pos');onClose()}}>New sale</Btn>
    </Fragment>}>
    <div className="grid gap-4">
      <div className="grid gap-2 sm:grid-cols-4">
        <div className="panel p-3"><div className="t-lbl">Lifetime spend</div>
          <div className="t-kpi num mt-1" style={{fontSize:19}}>{money(sum(done,s=>s.total),{bn:LANG==='bn'})}</div>
          <div className="t-micro">{num_(done.length)} bills</div></div>
        <div className="panel p-3"><div className="t-lbl">{t('Baki')}</div>
          <div className="t-kpi num mt-1" style={{fontSize:19,color:c.baki>0?'var(--warning)':undefined}}>{money(c.baki,{bn:LANG==='bn'})}</div>
          <div className="t-micro">limit {money(c.creditLimit)}</div></div>
        <div className="panel p-3"><div className="t-lbl">{t('Loyalty Points')}</div>
          <div className="t-kpi num mt-1" style={{fontSize:19}}>{num_(c.points)}</div>
          <div className="t-micro">worth {money(c.points*db.settings.loyalty.pointValue)}</div></div>
        <div className="panel p-3"><div className="t-lbl">Customer since</div>
          <div className="text-[14px] font-semibold mt-1 num">{d_(c.since)}</div>
          <Badge tone={c.type==='wholesale'?'purple':'neutral'} className="mt-1">{t(c.type==='wholesale'?'Wholesale':'Retail')}</Badge></div>
      </div>
      {c.chronic&&<div className="card p-3 flex items-center gap-2.5" style={{background:'var(--info-soft)',borderColor:'var(--info-line)'}}>
        <Icon name="HeartPulse" size={16} style={{color:'var(--info)'}}/>
        <div><div className="text-[13px] font-semibold">{c.chronic}</div>
          <div className="t-micro">Refill reminder due around {d_(addDays(inv.length?inv[0].date:TODAY,30))}</div></div>
      </div>}
      {c.baki>c.creditLimit*0.8&&c.baki>0&&<div className="card p-3 flex items-center gap-2.5"
        style={{background:'var(--warning-soft)',borderColor:'var(--warning-line)'}}>
        <Icon name="TriangleAlert" size={16} style={{color:'var(--warning)'}}/>
        <div className="text-[12.5px]">Baki is at {pct(c.baki,c.creditLimit)}% of the credit limit — collect before the next credit sale.</div>
      </div>}
      <Tabs value={tab} onChange={setTab} tabs={[
        {k:'history',label:'Purchase history',icon:'ReceiptText',count:done.length},
        {k:'meds',label:'Usual medicines',icon:'Pill'},
        {k:'rx',label:'Prescriptions',icon:'Stethoscope',count:rx.length},
        {k:'profile',label:'Profile',icon:'User'}]}/>
      {tab==='history'&&<div className="tw card" style={{maxHeight:420}}><table className="dt compact">
        <thead><tr><th>{t('Invoice')}</th><th>{t('Date')}</th><th className="r">{t('Items')}</th>
          <th>{t('Payment')}</th><th className="r">{t('Total')}</th><th className="r">{t('Baki')}</th></tr></thead>
        <tbody>{done.slice(0,40).map(s=><tr key={s.id}>
          <td className="mono">{s.no}</td><td className="num">{d_(s.date)}</td>
          <td className="r num">{num_(s.items.length)}</td>
          <td><span className="t-meta">{s.payments.map(p=>t(p.method)).join(' + ')}</span></td>
          <td className="r num font-semibold">{money(s.total,{bn:LANG==='bn'})}</td>
          <td className="r num">{s.bakiAdded>0?money(s.bakiAdded,{bn:LANG==='bn'}):'—'}</td></tr>)}
          {done.length===0&&<tr><td colSpan={6} className="t-meta">No purchases yet</td></tr>}</tbody></table></div>}
      {tab==='meds'&&<Card><CardH title="Most purchased" icon="Pill" sub="Drives refill reminders and stock planning"/>
        <div className="p-4 grid gap-2.5">
          {topMeds.map(m=><div key={m.name}>
            <div className="flex items-center justify-between gap-2 mb-1">
              <span className="text-[12.5px] font-medium">{m.name}</span>
              <span className="t-meta num">{num_(m.qty)} pcs · {money(m.value,{bn:LANG==='bn'})}</span></div>
            <Bar value={pct(m.value,topMeds[0].value)}/>
          </div>)}
          {topMeds.length===0&&<Empty icon="Pill" title="No purchases yet"/>}
        </div></Card>}
      {tab==='rx'&&<div className="grid gap-2">
        {rx.length===0&&<Empty icon="Stethoscope" title="No prescription sales"/>}
        {rx.slice(0,20).map(s=>{const d=db.doctors.find(x=>x.id===s.doctorId);
          return <div key={s.id} className="panel p-3 flex items-center gap-3">
            <span className="grid place-items-center w-9 h-9 rounded-[9px] shrink-0"
              style={{background:'var(--info-soft)',color:'var(--info)'}}><Icon name="Stethoscope" size={16}/></span>
            <div className="min-w-0 flex-1">
              <div className="text-[13px] font-semibold">{d?d.name:'Doctor not recorded'}</div>
              <div className="t-micro">{s.no} · {d_(s.date)} · {s.items.filter(i=>i.rx).map(i=>i.brand).join(', ')}</div></div>
            {s.rxPhoto&&<Badge tone="ok" icon="Camera">Photo</Badge>}
          </div>;})}
      </div>}
      {tab==='profile'&&<Card><div className="p-4 grid gap-1">
        <Row label={t('Name')} value={c.name}/><Row label={t('Phone')} value={fPhone(c.phone)}/>
        <Row label={t('Address')} value={c.address}/><Row label={t('Type')} value={t(c.type==='wholesale'?'Wholesale':'Retail')}/>
        <Row label="Credit limit" value={money(c.creditLimit,{bn:LANG==='bn'})}/>
        <Row label="Chronic condition" value={c.chronic||'—'}/>
        <Row label="Membership" value={[c.member&&'Member',c.senior&&'Senior citizen'].filter(Boolean).join(' · ')||'—'}/>
        <Row label="Branch" value={db.branches.find(b=>b.id===c.branchId).name}/>
      </div></Card>}
    </div>
    <Modal open={collect} onClose={()=>setCollect(false)} icon="HandCoins" title="Collect Baki"
      sub={`${c.name} · outstanding ${money(c.baki)}`}
      footer={<Fragment><Btn onClick={()=>setCollect(false)}>{t('Cancel')}</Btn>
        <Btn variant="primary" icon="Check" onClick={doCollect}>{t('Collect')}</Btn></Fragment>}>
      <div className="grid gap-3">
        <Field label={t('Amount')} req><Input className="ta-right" value={amt}
          onChange={e=>setAmt(e.target.value.replace(/[^\d.]/g,''))} style={{fontSize:18,height:44,fontWeight:600}}/></Field>
        <div className="flex gap-1.5 flex-wrap">{[c.baki,Math.round(c.baki/2),500,1000].filter((v,i,a)=>v>0&&a.indexOf(v)===i)
          .map(v=><button key={v} className="chip" onClick={()=>setAmt(String(v))}>{money(v)}</button>)}</div>
        <Field label="Received via"><Select value={method} onChange={e=>setMethod(e.target.value)}>
          {['Cash','bKash','Nagad','Rocket','Card','Bank'].map(m=><option key={m}>{m}</option>)}</Select></Field>
        <div className="panel p-3 grid gap-1">
          <Row label="Current Baki" value={money(c.baki,{bn:LANG==='bn'})}/>
          <Row label="After collection" value={money(Math.max(0,c.baki-(Number(amt)||0)),{bn:LANG==='bn'})} strong/>
        </div>
      </div>
    </Modal>
  </Drawer>;
}

      <KPI label="Running offers" value={db.offers.filter(o=>statusOf(o)==='Running').length} icon="BadgePercent" tone="success"/>

            <td><span className="t-meta">{o.branches.length===3?t('All Branches'):o.branches.map(b=>db.branches.find(x=>x.id===b).code).join(', ')}</span></td>
            <td><Badge tone={s==='Running'?'ok':s==='Scheduled'?'info':s==='Expired'?'neutral':'warn'}>{s}</Badge></td>
            <td className="r"><div className="row-act">
              <Btn size="xs" variant="ghost" icon={o.active?'Pause':'Play'} onClick={()=>{

              <div className="text-[15px] font-semibold mt-1">{money(sum(db.customers,c=>c.points)*st.pointValue,{bn:LANG==='bn'})}</div></div>

          <Row label="Senior citizens" value={num_(db.customers.filter(c=>c.senior).length)+' customers'}/>
