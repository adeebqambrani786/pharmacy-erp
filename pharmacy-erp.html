          body:`${monLabel(mk)} muster roll queued as XLSX.`})}>{t('Export')}</Btn>
      </Fragment>}/>
    {hol&&<div className="card p-3 flex items-center gap-2.5" style={{background:'var(--purple-soft)',borderColor:'transparent'}}>
      <Icon name="PartyPopper" size={16} style={{color:'var(--purple)'}}/>
      <div><div className="text-[13px] font-semibold">{hol.name}</div>
        <div className="t-micro bn">{hol.nameBn} · {hol.type} holiday</div></div></div>}
    <div className="grid-kpi">
      <KPI label={t('Present')} value={counts.P+counts.L} icon="UserCheck" tone="success"
        sub={`${num_(counts.L)} arrived late`}/>
      <KPI label={t('Absent')} value={counts.A} icon="UserX" tone="danger"/>
      <KPI label={t('On Leave')} value={counts.LV} icon="Plane" tone="info"/>
      <KPI label={t('Half Day')} value={counts.HD} icon="CircleDashed" tone="warning"/>
      <KPI label="Weekly off" value={counts.OFF} icon="Moon" tone="purple"/>
      <KPI label={t('Overtime')} value={round2(sum(rows,r=>r.otHrs))} fmt={v=>(LANG==='bn'?toBn(v.toFixed(1)):v.toFixed(1))+' h'}
        icon="Timer" tone="warning" sub="Logged today"/>
    </div>
    <Tabs value={tab} onChange={setTab} tabs={[
      {k:'board',label:'Daily board',icon:'LayoutGrid'},
      {k:'month',label:'Monthly summary',icon:'CalendarRange'},
      {k:'cal',label:'Employee calendar',icon:'Calendar'}]}/>
    {tab==='board'&&<Card>
      <CardH title={`${fDateLong(date,LANG==='bn')} · ${fDow(date,LANG==='bn')}`} icon="CalendarCheck"
        sub={`${num_(rows.length)} staff on roster`}/>
      <div className="tw"><table className="dt">
        <thead><tr><th>{t('Employee')}</th><th>{t('Branch')}</th><th>Shift</th><th>{t('Check In')}</th>
          <th>{t('Check Out')}</th><th className="r">{t('Late')}</th><th className="r">{t('Overtime')}</th>
          <th>{t('Status')}</th><th className="r">{t('Actions')}</th></tr></thead>
        <tbody>{rows.length===0&&<tr><td colSpan={9}><Empty icon="CalendarX" title="No roster for this date"/></td></tr>}
          {sortBy(rows,r=>(db.employees.find(e=>e.id===r.empId)||{}).name).map(r=>{
            const e=db.employees.find(x=>x.id===r.empId)||{};
            const m=ATT_META[r.status];
            return <tr key={r.id}>
              <td><div className="flex items-center gap-2.5 min-w-0">
                <span className="avatar avatar-sm">{initials(e.name)}</span>
                <div className="min-w-0"><div className="font-semibold clip">{e.name}</div>
                  <div className="t-micro clip">{e.desig}</div></div></div></td>
              <td><span className="t-meta">{db.branches.find(b=>b.id===r.branchId).name}</span></td>
              <td><Badge tone="neutral">{r.shift}</Badge></td>

              <td className="r num" style={{color:r.lateMin?'var(--warning)':undefined}}>{r.lateMin?num_(r.lateMin)+'m':'—'}</td>
              <td className="r num">{r.otHrs?(LANG==='bn'?toBn(r.otHrs):r.otHrs)+'h':'—'}</td>

    {tab==='month'&&<Fragment>
      <div className="flex items-center gap-2 flex-wrap">
        <span className="t-lbl">{t('Month')}</span>
        <Select sm value={mk} onChange={e=>setMk(e.target.value)} style={{width:160}}>

      </div>
      <DataTable rows={summary} pageSize={20} initialSort={{k:'score',dir:'desc'}} onRowClick={e=>setEmp(e.id)}
        search={(e,q)=>e.name.toLowerCase().includes(q)}

          {k:'branch',h:t('Branch'),cell:e=><span className="t-meta">{db.branches.find(b=>b.id===e.branchId).name}</span>},

          {k:'ot',h:t('Overtime'),cls:'r',sort:e=>e.ot,cell:e=><span className="num">{LANG==='bn'?toBn(e.ot):e.ot} h</span>},
          {k:'lateMin',h:'Late minutes',cls:'r',sort:e=>e.lateMin,cell:e=><span className="num">{num_(e.lateMin)}</span>},
          {k:'score',h:'Attendance score',cls:'r',sort:e=>e.score,cell:e=><div className="flex items-center gap-2 justify-end">

}

function AttendanceCalendar({mk,setMk}){
  const {db,branchIds}=useApp();
  const [empId,setEmpId]=useState(db.employees.filter(e=>branchIds.includes(e.branchId))[0].id);
  const emp=db.employees.find(e=>e.id===empId);
  const days=monDays(mk);
  const first=D(mk+'-01').getDay();
  const rows=db.attendance.filter(a=>a.empId===empId&&monKey(a.date)===mk);
  const st=attStats(db,empId,mk);
  return <Card>
    <CardH title={`${emp.name} — ${monLabel(mk,LANG==='bn')}`} icon="Calendar" sub={emp.desig}
      right={<div className="flex gap-2">
        <Select sm value={empId} onChange={e=>setEmpId(e.target.value)} style={{width:180}}>
          {db.employees.filter(e=>branchIds.includes(e.branchId)).map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</Select>
        <Select sm value={mk} onChange={e=>setMk(e.target.value)} style={{width:140}}>
          {[0,-1,-2,-3].map(i=>{const k=monKey(addMon(TODAY,i));return <option key={k} value={k}>{monLabel(k)}</option>})}</Select>
      </div>}/>
    <div className="p-4">
      <div className="cal mb-2">{(LANG==='bn'?DAY_BN:DAY_EN).map(d=>
        <div key={d} className="t-lbl text-center py-1">{d}</div>)}</div>
      <div className="cal">
        {Array.from({length:first}).map((_,i)=><div key={'x'+i}/>)}
        {Array.from({length:days},(_,i)=>{
          const date=`${mk}-${String(i+1).padStart(2,'0')}`;
          const r=rows.find(x=>x.date===date);
          const m=r?ATT_META[r.status]:null;
          const future=date>TODAY;
          const tone=m?m.tone:'neutral';
          return <div key={date} className="cal-c" title={r?`${fDate(date)} — ${m.l}${r.inT?` · in ${f12(r.inT)}`:''}`:fDate(date)}
            style={{background:future?'var(--surface-2)':`var(--${tone==='neutral'?'surface-3':tone==='ok'?'success':tone==='bad'?'danger':tone==='warn'?'warning':tone==='info'?'info':'purple'}-soft)`,
              borderColor:date===TODAY?'var(--primary)':'var(--border)',opacity:future?.45:1}}>
            <span className="num" style={{fontSize:11,fontWeight:600}}>{LANG==='bn'?toBn(i+1):i+1}</span>
            {r&&<span style={{fontSize:9,fontWeight:700,
              color:`var(--${tone==='neutral'?'fg-subtle':tone==='ok'?'success':tone==='bad'?'danger':tone==='warn'?'warning':tone==='info'?'info':'purple'})`}}>
              {r.status}</span>}
          </div>;
        })}
      </div>
      <div className="flex gap-2 flex-wrap mt-4">
        {Object.entries(ATT_META).map(([k,m])=><Badge key={k} tone={m.tone} icon={m.icon}>{k} · {t(m.l)}</Badge>)}
      </div>
      <div className="grid gap-2 sm:grid-cols-5 mt-4">
        <div className="panel p-3"><div className="t-lbl">{t('Present')}</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{num_(st.present+st.late)}</div></div>
        <div className="panel p-3"><div className="t-lbl">{t('Late')}</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{num_(st.late)}</div></div>
        <div className="panel p-3"><div className="t-lbl">{t('Absent')}</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{num_(st.absent)}</div></div>
        <div className="panel p-3"><div className="t-lbl">{t('Leave')}</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{num_(st.leave)}</div></div>
        <div className="panel p-3"><div className="t-lbl">{t('Overtime')}</div><div className="t-kpi num mt-1" style={{fontSize:18}}>{LANG==='bn'?toBn(st.ot):st.ot}h</div></div>
      </div>
    </div>
  </Card>;
}

  if(!e) return null;
  return <Drawer open onClose={onClose} icon="CalendarCheck" title={e.name} sub={`${e.desig} · ${monLabel(mk,LANG==='bn')}`}>
    <div className="grid gap-3">
      <div className="grid gap-2 grid-cols-2">

        <div className="panel p-3"><div className="t-lbl">{t('Overtime')}</div><div className="t-kpi num mt-1" style={{fontSize:20}}>{LANG==='bn'?toBn(st.ot):st.ot} h</div></div>
      </div>
      <div className="tw card" style={{maxHeight:420}}><table className="dt compact">

          <th className="r">OT</th><th>{t('Status')}</th></tr></thead>

}

/* ---- shift roster ---- */
function Roster(){
  const {db,dispatch,branchIds,branchId,toast,crumbs}=useApp();
  const [weekStart,setWeekStart]=useState(addDays(TODAY,-D(TODAY).getDay()));
  const [roster,setRoster]=useState(()=>{
    const r={};
    db.employees.forEach(e=>{ for(let i=0;i<7;i++){ const d=addDays(addDays(TODAY,-D(TODAY).getDay()),i);
      const off=e.shift==='Night'?6:5;
      r[`${e.id}|${d}`]= D(d).getDay()===off? null : e.shift } });
    return r;
  });
  const [drag,setDrag]=useState(null);
  const days=Array.from({length:7},(_,i)=>addDays(weekStart,i));
  const emps=db.employees.filter(e=>branchIds.includes(e.branchId)&&e.status==='Active');
  const setCell=(empId,d,shift)=>setRoster(r=>({...r,[`${empId}|${d}`]:shift}));
  const shiftTone=s=>s==='Morning'?'info':s==='Evening'?'warn':'purple';
  return <div className="grid gap-4">
    <PageHeader title={t('Shift Roster')} icon="CalendarRange" crumbs={crumbs}
      sub="Drag a shift chip onto any cell · Uttara runs a 24-hour night shift"
      actions={<Fragment>
        <Btn size="sm" icon="ChevronLeft" onClick={()=>setWeekStart(addDays(weekStart,-7))} aria-label="Previous week"/>
        <span className="t-meta num self-center">{d_(weekStart)} → {d_(addDays(weekStart,6))}</span>
        <Btn size="sm" icon="ChevronRight" onClick={()=>setWeekStart(addDays(weekStart,7))} aria-label="Next week"/>
        <Btn variant="primary" icon="Save" onClick={()=>toast({tone:'ok',title:'Roster published',
          body:`Week of ${fDate(weekStart)} sent to ${emps.length} staff.`})}>Publish</Btn>
      </Fragment>}/>
    <Card>
      <div className="p-3 flex items-center gap-2 flex-wrap" style={{borderBottom:'1px solid var(--border)'}}>
        <span className="t-lbl">Drag to assign</span>
        {Object.keys(SHIFTS).map(s=><span key={s} className="ros-p" draggable
          onDragStart={()=>setDrag(s)} onDragEnd={()=>setDrag(null)}
          style={{background:`var(--${shiftTone(s)}-soft)`,color:`var(--${shiftTone(s)})`,borderColor:`var(--${shiftTone(s)}-line)`}}>
          {s} · {SHIFTS[s].s}–{SHIFTS[s].e}</span>)}
        <span className="ros-p" draggable onDragStart={()=>setDrag(null)} onDragEnd={()=>setDrag(null)}
          style={{background:'var(--surface-3)',color:'var(--fg-muted)',borderColor:'var(--border)'}}
          onClick={()=>setDrag('OFF')}>Weekly off</span>
      </div>
      <div className="p-3 overflow-x-auto scroll">
        <div className="ros">
          <div/>
          {days.map(d=><div key={d} className="text-center pb-1">
            <div className="t-lbl">{fDow(d,LANG==='bn')}</div>
            <div className="t-micro num">{fDateS(d,LANG==='bn')}</div>
            {HOLIDAY_SET.has(d)&&<Badge tone="purple" sq className="mt-0.5">Holiday</Badge>}
          </div>)}
          {emps.map(e=><Fragment key={e.id}>
            <div className="flex items-center gap-2 pr-2 min-w-0">
              <span className="avatar avatar-sm">{initials(e.name)}</span>
              <div className="min-w-0"><div className="text-[12px] font-semibold clip">{e.name}</div>
                <div className="t-micro clip">{e.desig.replace(' (Grade','(').replace(')',')')}</div></div>
            </div>
            {days.map(d=>{
              const v=roster[`${e.id}|${d}`];
              return <div key={d} className="ros-c"
                onDragOver={ev=>{ev.preventDefault();ev.currentTarget.classList.add('over')}}
                onDragLeave={ev=>ev.currentTarget.classList.remove('over')}
                onDrop={ev=>{ev.preventDefault();ev.currentTarget.classList.remove('over');
                  setCell(e.id,d,drag==='OFF'?null:drag)}}
                onClick={()=>{ if(drag) setCell(e.id,d,drag==='OFF'?null:drag) }}>
                {v? <span className="ros-p" style={{background:`var(--${shiftTone(v)}-soft)`,color:`var(--${shiftTone(v)})`,
                    borderColor:`var(--${shiftTone(v)}-line)`,cursor:'pointer'}}
                    onClick={()=>setCell(e.id,d,null)}>{v[0]}{v==='Morning'?'orning':v==='Evening'?'vening':'ight'}</span>
                  : <span className="t-micro self-center text-center" style={{opacity:.5}}>Off</span>}
              </div>;
            })}
          </Fragment>)}
        </div>
      </div>
      <div className="card-f flex items-center gap-4 flex-wrap">
        {Object.keys(SHIFTS).map(s=><span key={s} className="t-micro flex items-center gap-1.5">
          <i className="dot" style={{background:`var(--${shiftTone(s)})`}}/>{SHIFTS[s].label}</span>)}
        <span className="t-micro ml-auto">Overtime is calculated automatically beyond the 8-hour shift.</span>
      </div>
    </Card>
    <Card>
      <CardH title="Holidays this year" icon="PartyPopper" sub="Government and religious holidays feed the roster and payroll"/>
      <div className="p-4 grid gap-2" style={{gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))'}}>
        {db.holidays.map(h=><div key={h.date} className="panel p-2.5 flex items-center gap-2.5"
          style={{opacity:h.date<TODAY?.6:1}}>
          <span className="grid place-items-center w-8 h-8 rounded-lg shrink-0"
            style={{background:h.type==='National'?'var(--success-soft)':'var(--purple-soft)',
              color:h.type==='National'?'var(--success)':'var(--purple)'}}>
            <Icon name={h.type==='National'?'Flag':'Moon'} size={14}/></span>
          <div className="min-w-0"><div className="text-[12.5px] font-semibold clip">{h.name}</div>
            <div className="t-micro bn clip">{h.nameBn} · {d_(h.date)}</div></div>
        </div>)}
      </div>
    </Card>
  </div>;
}

/* ---- leave management ---- */
function LeaveMgmt(){
  const {db,dispatch,branchIds,user,toast,crumbs}=useApp();
  const [tab,setTab]=useState('requests');
  const [act,setAct]=useState(null);
  const [apply,setApply]=useState(false);
  const rows=db.leaves.filter(l=>branchIds.includes(l.branchId));
  const pending=rows.filter(l=>l.status==='Pending');
  const canApprove=can(user.role,'leave.approve');
  const decide=(l,status,comment)=>{
    dispatch({type:'patch',coll:'leaves',id:l.id,data:{status,approvedBy:user.empId||user.id,comment}});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,action:`Leave ${status.toLowerCase()}`,
      entity:'Leave',detail:`${(db.employees.find(e=>e.id===l.empId)||{}).name} · ${l.type} · ${l.days} days`,branchId:l.branchId}});
    toast({tone:status==='Approved'?'ok':'warn',title:`Leave ${status.toLowerCase()}`,
      body:`${(db.employees.find(e=>e.id===l.empId)||{}).name} · ${l.type} · ${fDate(l.from)} → ${fDate(l.to)}`});
    setAct(null);
  };
  const balances=db.employees.filter(e=>branchIds.includes(e.branchId)).map(e=>{
    const taken=LEAVE_TYPES.reduce((m,ty)=>({...m,[ty]:sum(rows.filter(l=>l.empId===e.id&&l.type===ty&&l.status==='Approved'),l=>l.days)}),{});
    return {...e,taken};
  });
  const upcoming=rows.filter(l=>l.status==='Approved'&&l.to>=TODAY);
  return <div className="grid gap-4">
    <PageHeader title={t('Leave Management')} icon="Plane" crumbs={crumbs}
      sub={`${num_(pending.length)} requests awaiting approval · Casual 10 · Sick 14 · Annual 15 days per year`}
      actions={<Btn variant="primary" icon="Plus" onClick={()=>setApply(true)}>{t('Apply Leave')}</Btn>}/>
    <div className="grid-kpi">
      <KPI label={t('Pending')} value={pending.length} icon="Clock" tone="warning" onClick={()=>setTab('requests')}/>
      <KPI label="Approved this month" value={rows.filter(l=>l.status==='Approved'&&monKey(l.from)===monKey(TODAY)).length}
        icon="CircleCheck" tone="success"/>
      <KPI label="On leave today" value={db.attendance.filter(a=>a.date===TODAY&&a.status==='LV'&&branchIds.includes(a.branchId)).length}
        icon="Plane" tone="info"/>
      <KPI label="Days taken (90 days)" value={sum(rows.filter(l=>l.status==='Approved'),l=>l.days)} icon="CalendarDays" tone="purple"/>
    </div>
    <Tabs value={tab} onChange={setTab} tabs={[
      {k:'requests',label:'Requests',icon:'Inbox',count:rows.length},
      {k:'balance',label:'Balances',icon:'Scale'},
      {k:'calendar',label:'Who is off',icon:'CalendarRange',count:upcoming.length}]}/>
    {tab==='requests'&&<DataTable rows={sortBy(rows,l=>l.status==='Pending'?0:1)} pageSize={12}
      search={(l,q)=>((db.employees.find(e=>e.id===l.empId)||{}).name||'').toLowerCase().includes(q)||l.type.toLowerCase().includes(q)}
      searchPlaceholder="Employee or leave type…"
      cols={[
        {k:'emp',h:t('Employee'),sort:l=>l.empId,cell:l=>{const e=db.employees.find(x=>x.id===l.empId)||{};
          return <div className="flex items-center gap-2.5"><span className="avatar avatar-sm">{initials(e.name)}</span>
            <div><div className="font-semibold">{e.name}</div><div className="t-micro">{e.desig}</div></div></div>}},
        {k:'type',h:t('Type'),sort:l=>l.type,cell:l=><Badge tone={l.type==='Sick'?'warn':l.type==='Unpaid'?'bad':'info'}>{l.type}</Badge>},
        {k:'from',h:'Period',sort:l=>l.from,cell:l=><div><div className="num text-[12.5px]">{d_(l.from)} → {d_(l.to)}</div>
          <div className="t-micro">{num_(l.days)} {t('Days').toLowerCase()}</div></div>},
        {k:'reason',h:t('Reason'),cell:l=><span className="t-meta clip" style={{maxWidth:240}}>{l.reason}</span>},
        {k:'applied',h:'Applied',sort:l=>l.appliedOn,cell:l=><span className="num t-meta">{d_(l.appliedOn)}</span>},
        {k:'status',h:t('Status'),sort:l=>l.status,cell:l=><div><StatusBadge v={l.status}/>

          <Btn size="xs" variant="ghost" icon="X" onClick={()=>setAct({l,status:'Rejected'})}>{t('Reject')}</Btn></div>:null},
      ]}

        <tbody>{balances.map(e=><tr key={e.id}>
          <td><div className="font-semibold">{e.name}</div><div className="t-micro">{e.desig}</div></td>
          {LEAVE_TYPES.map(ty=>{
            const ent=e.leaveBalance[ty]||0, taken=e.taken[ty]||0, left=Math.max(0,ent-taken);
            return <td key={ty} className="c">
              {ent===0? <span className="subtle">—</span>
                : <div><span className="num font-semibold" style={{color:left<=2?'var(--warning)':undefined}}>{num_(left)}</span>
                    <span className="t-micro"> / {num_(ent)}</span></div>}</td>;
          })}
          <td className="c num font-semibold">{num_(sum(LEAVE_TYPES,ty=>e.taken[ty]||0))}</td>
        </tr>)}</tbody></table></div>
    </Card>}
    {tab==='calendar'&&<Card>
      <CardH title="Who is off" icon="CalendarRange" sub="Approved leave from today onward"/>
      <div className="p-4 grid gap-2">
        {upcoming.length===0&&<Empty icon="CalendarCheck" title="Everyone is in" desc="No approved leave from today onward."/>}
        {sortBy(upcoming,l=>l.from).map(l=>{const e=db.employees.find(x=>x.id===l.empId)||{};
          const active=l.from<=TODAY&&l.to>=TODAY;
          return <div key={l.id} className="panel p-3 flex items-center gap-3"
            style={active?{borderColor:'var(--info-line)',background:'var(--info-soft)'}:undefined}>
            <span className="avatar avatar-sm">{initials(e.name)}</span>
            <div className="min-w-0 flex-1"><div className="text-[13px] font-semibold clip">{e.name}</div>
              <div className="t-micro">{e.desig} · {db.branches.find(b=>b.id===l.branchId).name}</div></div>
            <div className="text-right"><div className="num text-[12.5px]">{d_(l.from)} → {d_(l.to)}</div>
              <Badge tone={active?'info':'neutral'} className="mt-0.5">{active?'On leave now':`${l.type} · ${l.days}d`}</Badge></div>
          </div>;})}
      </div>
    </Card>}
    {act&&<LeaveDecision act={act} onClose={()=>setAct(null)} onDecide={decide}/>}
    <LeaveApply open={apply} onClose={()=>setApply(false)}/>
  </div>;
}
function LeaveDecision({act,onClose,onDecide}){
  const {db}=useApp();
  const [comment,setComment]=useState(act.status==='Approved'?'Approved. Shift cover arranged.':'');
  const e=db.employees.find(x=>x.id===act.l.empId)||{};
  return <Modal open onClose={onClose} icon={act.status==='Approved'?'CircleCheck':'CircleX'}
    tone={act.status==='Approved'?'primary':'danger'} title={`${act.status==='Approved'?t('Approve'):t('Reject')} leave`}
    sub={`${e.name} · ${act.l.type} · ${act.l.days} days`}
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant={act.status==='Approved'?'primary':'danger'} icon="Check"
        onClick={()=>onDecide(act.l,act.status,comment)}>{t('Confirm')}</Btn></Fragment>}>
    <div className="grid gap-3">
      <div className="panel p-3 grid gap-1">
        <Row label="Period" value={`${d_(act.l.from)} → ${d_(act.l.to)}`}/>
        <Row label={t('Days')} value={num_(act.l.days)}/>
        <Row label={t('Reason')} value={act.l.reason}/>
        <Row label="Balance after" value={`${Math.max(0,(e.leaveBalance[act.l.type]||0)-act.l.days)} days`}/>
      </div>
      <Field label="Comment to employee"><Textarea value={comment} onChange={e=>setComment(e.target.value)}/></Field>
    </div>
  </Modal>;
}
function LeaveApply({open,onClose,fixedEmp}){
  const {db,dispatch,toast,user,branchIds}=useApp();
  const [empId,setEmpId]=useState(fixedEmp||user.empId||'E06');
  const [type,setType]=useState('Casual');
  const [from,setFrom]=useState(addDays(TODAY,1));
  const [to,setTo]=useState(addDays(TODAY,1));
  const [reason,setReason]=useState('');
  const [err,setErr]=useState('');
  useEffect(()=>{ if(open){setType('Casual');setFrom(addDays(TODAY,1));setTo(addDays(TODAY,1));setReason('');setErr('')} },[open]);
  const e=db.employees.find(x=>x.id===empId);
  const days=Math.max(1,dayDiff(from,to)+1);
  const taken=sum(db.leaves.filter(l=>l.empId===empId&&l.type===type&&l.status==='Approved'),l=>l.days);
  const left=e?Math.max(0,(e.leaveBalance[type]||0)-taken):0;
  const save=()=>{
    if(!reason.trim()){ setErr('Give a reason so the manager can decide.'); return }
    if(to<from){ setErr('End date cannot be before the start date.'); return }
    if(type!=='Unpaid'&&days>left){ setErr(`Only ${left} days of ${type} leave remain. Apply as Unpaid instead.`); return }
    dispatch({type:'upsert',coll:'leaves',item:{id:uid('LV'),empId,branchId:e.branchId,type,from,to,days,reason,
      status:'Pending',appliedOn:TODAY,approvedBy:null,comment:''}});
    toast({tone:'ok',title:'Leave request submitted',
      body:`${type} · ${days} days · waiting for ${(db.employees.find(x=>x.id===e.managerId)||{name:'the branch manager'}).name}.`});
    onClose();
  };
  return <Drawer open={open} onClose={onClose} icon="Plane" title={t('Apply Leave')}
    sub="Goes to the branch manager for approval"
    footer={<Fragment><Btn onClick={onClose}>{t('Cancel')}</Btn>
      <Btn variant="primary" icon="Send" onClick={save}>{t('Submit')}</Btn></Fragment>}>
    <div className="grid gap-3">
      {!fixedEmp&&<Field label={t('Employee')}><Select value={empId} onChange={e=>setEmpId(e.target.value)}>
        {db.employees.filter(x=>branchIds.includes(x.branchId)).map(x=><option key={x.id} value={x.id}>{x.name} — {x.desig}</option>)}</Select></Field>}
      <Field label="Leave type"><Select value={type} onChange={e=>setType(e.target.value)}>
        {LEAVE_TYPES.map(x=><option key={x}>{x}</option>)}</Select></Field>
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label={t('From')}><Input type="date" value={from} onChange={e=>{setFrom(e.target.value);if(to<e.target.value)setTo(e.target.value)}}/></Field>
        <Field label={t('To')}><Input type="date" value={to} min={from} onChange={e=>setTo(e.target.value)}/></Field>
      </div>
      <div className="panel p-3 grid gap-1">
        <Row label="Days applied" value={num_(days)} strong/>
        <Row label={`${type} balance`} value={type==='Unpaid'?'Unlimited (unpaid)':`${num_(left)} days left`}
          tone={type!=='Unpaid'&&days>left?'danger':undefined}/>
        <Row label="Balance after" value={type==='Unpaid'?'—':`${num_(Math.max(0,left-days))} days`}/>
      </div>
      <Field label={t('Reason')} req><Textarea value={reason} onChange={e=>setReason(e.target.value)}
        placeholder="Why the leave is needed, and who will cover the shift"/></Field>
      {err&&<div className="err">{err}</div>}
    </div>
  </Drawer>;
}
</script>

<script type="text/babel" data-presets="react">
/* ---- payroll ---- */
function computePayrollLines(db,month,branchFilter,festival){
  const st=db.settings.payroll;
  const emps=db.employees.filter(e=>e.status==='Active'&&(branchFilter==='ALL'||e.branchId===branchFilter));
  return emps.map(e=>{
    const s=e.salary;
    const a=attStats(db,e.id,month);
    const perDay=round2(s.gross/st.workingDays);
    const absentDeduct=round2(perDay*(a.absent+a.half*0.5));
    const latePenalty = a.late>st.lateAllowanceDays ? (a.late-st.lateAllowanceDays)*st.latePenalty : 0;
    const otAmt=Math.round(a.ot*e.otRate);
    const mSales=empSales(db,e.id,month+'-01',month+'-'+monDays(month));
    const commission=e.commRate? Math.round(mSales*e.commRate/100) : 0;
    const adv=db.advances.find(x=>x.empId===e.id&&x.status==='Approved'&&x.remaining>0);
    const advanceDeduct=adv? Math.min(adv.perInstall,adv.remaining) : 0;
    const shortage=round2(sum(db.shifts.filter(x=>x.cashierId===e.id&&x.deductFromSalary&&monKey(x.date)===month),x=>Math.abs(x.diff)));
    const fest=festival? Math.round(s.basic*st.festivalBonusPct/100) : 0;
    const gross=round2(s.gross+otAmt+commission+fest);
    const tds=e.tds? Math.round(gross*st.tdsPct/100) : 0;
    const pf=(e.pf||st.pfEnabled)? Math.round(s.basic*st.pfPct/100) : 0;
    const totalDeduct=round2(absentDeduct+latePenalty+advanceDeduct+shortage+tds+pf);
    return {empId:e.id,name:e.name,desig:e.desig,branchId:e.branchId,
      basic:s.basic,house:s.house,medical:s.medical,conveyance:s.conveyance,mobile:s.mobile,
      otHrs:a.ot,otAmt,commission,festival:fest,otherBonus:0,mSales,
      presentDays:a.present+a.late,absent:a.absent,half:a.half,lateDays:a.late,
      absentDeduct,latePenalty,advanceDeduct,shortage,tds,pf,
      gross,totalDeduct,net:round2(gross-totalDeduct),payMode:e.payMode,payAcc:e.payAcc};
  });
}

function Payroll(){
  const {db,dispatch,branchIds,branchId,user,toast,crumbs}=useApp();
  const [wizard,setWizard]=useState(null);
  const [open,setOpen]=useState(null);
  const [slip,setSlip]=useState(null);
  const runs=sortBy(db.payrollRuns,r=>r.month+(r.type||''),'desc');
  const curM=monKey(TODAY);
  const done=runs.some(r=>r.month===curM&&!r.type);
  const canProcess=can(user.role,'payroll.process');
  const canPay=can(user.role,'payroll.pay');
  const lastRun=runs.find(r=>!r.type);
  return <div className="grid gap-4">
    <PageHeader title={t('Payroll')} icon="Banknote" crumbs={crumbs}
      sub={`Pay day is the ${db.settings.payroll.salaryPayDay}th · ${db.settings.payroll.workingDays} working days · overtime and commission included`}
      actions={<Fragment>
        {canProcess&&<Btn icon="Gift" onClick={()=>setWizard({month:curM,festival:true})}>Festival bonus run</Btn>}
        {canProcess&&<Btn variant="primary" icon="Play" onClick={()=>setWizard({month:curM,festival:false})}>
          {done?'Re-run payroll':`Run ${monLabel(curM)} payroll`}</Btn>}
      </Fragment>}/>
    {!done&&<div className="card p-3.5 flex items-center gap-3 flex-wrap"
      style={{background:'var(--warning-soft)',borderColor:'var(--warning-line)'}}>
      <Icon name="AlarmClock" size={17} style={{color:'var(--warning)'}}/>
      <div className="min-w-0 flex-1">
        <div className="text-[13px] font-semibold">{monLabel(curM,LANG==='bn')} payroll is not processed yet</div>
        <div className="t-micro">{db.employees.filter(e=>e.status==='Active').length} active staff ·
          estimated net {money(sum(computePayrollLines(db,curM,'ALL',false),l=>l.net))}</div>
      </div>
      {canProcess&&<Btn size="sm" variant="primary" icon="Play" onClick={()=>setWizard({month:curM,festival:false})}>Process now</Btn>}
    </div>}
    <div className="grid-kpi">
      <KPI label="Last payroll net" value={lastRun?lastRun.totals.net:0} fmt={v=>money(v,{bn:LANG==='bn'})}
        icon="Banknote" tone="purple" sub={lastRun?monLabel(lastRun.month,LANG==='bn'):'—'}/>
      <KPI label="Monthly gross cost" value={sum(db.employees.filter(e=>e.status==='Active'),e=>e.salary.gross)}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="Wallet" tone="info"/>
      <KPI label="Runs completed" value={runs.length} icon="CircleCheck" tone="success" sub="Includes festival bonus"/>
      <KPI label="Advance outstanding" value={sum(db.advances.filter(a=>a.status==='Approved'),a=>a.remaining)}
        fmt={v=>money(v,{bn:LANG==='bn'})} icon="PiggyBank" tone="warning"/>
    </div>
    <DataTable rows={runs} pageSize={10} onRowClick={r=>setOpen(r.id)}
      cols={[
        {k:'month',h:t('Month'),sort:r=>r.month,cell:r=><div><div className="font-semibold">{monLabel(r.month,LANG==='bn')}</div>
          {r.type&&<Badge tone="purple" sq className="mt-0.5">{r.type}</Badge>}</div>},
        {k:'emps',h:'Employees',cls:'r',cell:r=><span className="num">{num_(r.lines.length)}</span>},
        {k:'gross',h:t('Gross'),cls:'r',sort:r=>r.totals.gross,cell:r=><span className="num">{money(r.totals.gross,{bn:LANG==='bn'})}</span>},
        {k:'deduct',h:t('Deductions'),cls:'r',sort:r=>r.totals.deduct,cell:r=><span className="num"
          style={{color:'var(--danger)'}}>{money(r.totals.deduct,{bn:LANG==='bn'})}</span>},
        {k:'net',h:t('Net Pay'),cls:'r',sort:r=>r.totals.net,cell:r=><span className="num font-semibold">{money(r.totals.net,{bn:LANG==='bn'})}</span>},
        {k:'mode',h:'Paid via',cell:r=><span className="t-meta">{r.payMode}</span>},
        {k:'paid',h:'Paid on',sort:r=>r.paidDate||'',cell:r=><span className="num t-meta">{r.paidDate?d_(r.paidDate):'—'}</span>},
        {k:'status',h:t('Status'),cell:r=><StatusBadge v={r.status}/>},
      ]}/>
    {open&&<SalarySheet run={runs.find(r=>r.id===open)} onClose={()=>setOpen(null)} onSlip={l=>setSlip({run:runs.find(r=>r.id===open),line:l})}/>}
    {slip&&<PayslipModal run={slip.run} line={slip.line} onClose={()=>setSlip(null)}/>}
    {wizard&&<PayrollWizard init={wizard} onClose={()=>setWizard(null)}/>}
  </div>;
}

function PayrollWizard({init,onClose}){
  const {db,dispatch,user,toast,branchIds}=useApp();
  const [step,setStep]=useState(0);
  const [month,setMonth]=useState(init.month);
  const [br,setBr]=useState('ALL');
  const [lines,setLines]=useState([]);
  const [payMode,setPayMode]=useState('Mixed (Bank / bKash / Cash)');
  const festival=init.festival;
  const STEPS=['Select period','Review sheet','Approve','Mark paid'];
  useEffect(()=>{ setLines(computePayrollLines(db,month,br,festival)) },[month,br,festival]);
  const totals={gross:round2(sum(lines,l=>l.gross)),deduct:round2(sum(lines,l=>l.totalDeduct)),net:round2(sum(lines,l=>l.net))};
  const edit=(empId,k,v)=>setLines(ls=>ls.map(l=>{
    if(l.empId!==empId) return l;
    const n={...l,[k]:Number(v)||0};
    n.gross=round2(n.basic+n.house+n.medical+n.conveyance+n.mobile+n.otAmt+n.commission+n.festival+n.otherBonus);
    n.totalDeduct=round2(n.absentDeduct+n.latePenalty+n.advanceDeduct+n.shortage+n.tds+n.pf);
    n.net=round2(n.gross-n.totalDeduct);
    return n;
  }));
  const runId=(festival?'PRLF':'PRL')+month.replace('-','')+(br==='ALL'?'':br);
  const finish=(status)=>{
    const run={id:runId,month,branchId:br,status,type:festival?'Festival Bonus':undefined,
      runDate:TODAY,paidDate:status==='Paid'?TODAY:null,payMode,lines,
      approvedBy:user.id,processedBy:user.empId||user.id,totals,
      note:festival?'Eid festival bonus run':'Monthly payroll'};
    dispatch({type:'payroll.run',run});
    if(status==='Paid') dispatch({type:'payroll.status',id:runId,status:'Paid',payMode});
    dispatch({type:'audit.add',row:{time:'12:00',userId:user.id,userName:user.name,
      action:status==='Paid'?'Payroll paid':'Payroll approved',entity:'Payroll',
      detail:`${monLabel(month)}${festival?' festival bonus':''} · ${lines.length} staff · net ${money(totals.net)}`,branchId:br}});
    toast({tone:'ok',title:status==='Paid'?'Payroll paid':'Payroll approved',
      body:`${monLabel(month)} · ${lines.length} employees · ${money(totals.net)}${status==='Paid'?' — posted to Finance as a salary expense.':''}`});
    onClose();
  };
  return <Drawer open wide onClose={onClose} icon={festival?'Gift':'Banknote'}
    title={festival?'Festival bonus run':`${monLabel(month,LANG==='bn')} payroll`}
    sub={festival?`${db.settings.payroll.festivalBonusPct}% of basic for every active employee`:'Attendance, overtime, commission and deductions applied automatically'}
    footer={<Fragment>
      {step>0&&<Btn icon="ChevronLeft" onClick={()=>setStep(step-1)}>{t('Back')}</Btn>}
      <Btn onClick={onClose}>{t('Cancel')}</Btn>
      {step<2&&<Btn variant="primary" iconRight="ChevronRight" onClick={()=>setStep(step+1)}>{t('Next')}</Btn>}
      {step===2&&<Btn variant="primary" icon="Check" onClick={()=>setStep(3)}>{t('Approve')}</Btn>}
      {step===3&&<Fragment>
        <Btn onClick={()=>finish('Approved')}>Save as approved</Btn>
        <Btn variant="primary" icon="Banknote" onClick={()=>finish('Paid')}>{t('Mark Paid')}</Btn>
      </Fragment>}
    </Fragment>}>
    <div className="grid gap-4">
      <Card><div className="p-4"><Stepper steps={STEPS} current={step}/></div></Card>
      {step===0&&<div className="grid gap-3">
        <div className="grid gap-3 sm:grid-cols-2">
          <Field label={t('Month')}><Select value={month} onChange={e=>setMonth(e.target.value)}>
            {[0,-1,-2].map(i=>{const k=monKey(addMon(TODAY,i));return <option key={k} value={k}>{monLabel(k)}</option>})}</Select></Field>
          <Field label={t('Branch')}><Select value={br} onChange={e=>setBr(e.target.value)}>
            <option value="ALL">{t('All Branches')}</option>
            {db.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Select></Field>
        </div>
        <div className="panel p-3 grid gap-1">
          <Row label="Employees included" value={num_(lines.length)}/>
          <Row label="Working days" value={num_(db.settings.payroll.workingDays)}/>
          <Row label="Late grace" value={`${db.settings.payroll.graceMinutes} min · ${db.settings.payroll.lateAllowanceDays} days free`}/>
          <Row label="Late penalty" value={money(db.settings.payroll.latePenalty)+' per late day beyond that'}/>
          <Row label="Commission" value={`${db.settings.payroll.commissionPct}% of own sales (cashiers and salesmen)`}/>
          <Row label="Income tax (TDS)" value={`${db.settings.payroll.tdsPct}% for gross ৳40,000+`}/>
          <Row label="Provident fund" value={db.settings.payroll.pfEnabled?`${db.settings.payroll.pfPct}% of basic`:'Disabled'}/>
        </div>
        {db.payrollRuns.some(r=>r.month===month&&!!r.type===festival)&&
          <div className="card p-3 flex items-start gap-2" style={{background:'var(--warning-soft)',borderColor:'var(--warning-line)'}}>
            <Icon name="TriangleAlert" size={14} style={{color:'var(--warning)',marginTop:1,flex:'none'}}/>
            <span className="text-[12.5px]">A run already exists for {monLabel(month)}. Continuing will replace it.</span></div>}
      </div>}
      {step===1&&<Fragment>
        <div className="grid gap-2 sm:grid-cols-3">
          <div className="panel p-3"><div className="t-lbl">{t('Gross')}</div><div className="t-kpi num mt-1" style={{fontSize:19}}>{money(totals.gross,{bn:LANG==='bn'})}</div></div>
          <div className="panel p-3"><div className="t-lbl">{t('Deductions')}</div><div className="t-kpi num mt-1" style={{fontSize:19,color:'var(--danger)'}}>{money(totals.deduct,{bn:LANG==='bn'})}</div></div>
          <div className="panel p-3"><div className="t-lbl">{t('Net Pay')}</div><div className="t-kpi num mt-1" style={{fontSize:19,color:'var(--primary)'}}>{money(totals.net,{bn:LANG==='bn'})}</div></div>
        </div>
        <div className="t-micro">Adjust overtime, commission or other bonus inline — totals update live.</div>
        <div className="tw card" style={{maxHeight:460}}><table className="dt compact">
          <thead><tr><th>{t('Employee')}</th><th className="r">{t('Basic')}</th><th className="r">Allow.</th>
            <th className="r">OT</th><th className="r">Comm.</th>{festival&&<th className="r">Bonus</th>}
            <th className="r">Other</th><th className="r">{t('Gross')}</th><th className="r">Deduct</th>
            <th className="r">{t('Net Pay')}</th></tr></thead>
          <tbody>{lines.map(l=><tr key={l.empId}>
            <td><div className="font-semibold">{l.name}</div>
              <div className="t-micro">{l.desig} · P{l.presentDays} A{l.absent} L{l.lateDays}</div></td>
            <td className="r num">{money(l.basic,{sym:false})}</td>
            <td className="r num">{money(l.house+l.medical+l.conveyance+l.mobile,{sym:false})}</td>
            <td className="r"><Input sm className="ta-right" style={{width:68,marginLeft:'auto'}} value={l.otAmt}
              onChange={e=>edit(l.empId,'otAmt',e.target.value.replace(/\D/g,''))}/></td>
            <td className="r"><Input sm className="ta-right" style={{width:72,marginLeft:'auto'}} value={l.commission}
              onChange={e=>edit(l.empId,'commission',e.target.value.replace(/\D/g,''))}/></td>
            {festival&&<td className="r num">{money(l.festival,{sym:false})}</td>}
            <td className="r"><Input sm className="ta-right" style={{width:64,marginLeft:'auto'}} value={l.otherBonus}

        </table></div>

            {db.branches.filter(b=>br==='ALL'||b.id===br).map(b=>{
              const bl=lines.filter(l=>l.branchId===b.id);
              if(!bl.length) return null;
              return <div key={b.id} className="flex items-center justify-between gap-3">
                <span className="text-[13px]">{b.name} <span className="t-micro">· {bl.length} staff</span></span>
                <span className="num font-semibold">{money(sum(bl,l=>l.net),{bn:LANG==='bn'})}</span></div>;
            })}
          </div></Card>
        <Card><CardH title="Deduction summary" icon="Minus"/>
          <div className="p-4 grid gap-1">

            <Row label="Late penalty" value={money(sum(lines,l=>l.latePenalty),{bn:LANG==='bn'})}/>
            <Row label="Advance / loan instalments" value={money(sum(lines,l=>l.advanceDeduct),{bn:LANG==='bn'})}/>
            <Row label="Cash shortage" value={money(sum(lines,l=>l.shortage),{bn:LANG==='bn'})}/>
            <Row label="Income tax (TDS)" value={money(sum(lines,l=>l.tds),{bn:LANG==='bn'})}/>
            <Row label="Provident fund" value={money(sum(lines,l=>l.pf),{bn:LANG==='bn'})}/>
            <div className="hr my-1.5"/>
            <Row label="Total deductions" value={money(totals.deduct,{bn:LANG==='bn'})} strong tone="danger"/>
          </div></Card>
      </div>}
      {step===3&&<div className="grid gap-3">
        <Field label="Payment mode"><Select value={payMode} onChange={e=>setPayMode(e.target.value)}>
          {['Mixed (Bank / bKash / Cash)','Bank transfer','bKash disbursement','Cash'].map(m=><option key={m}>{m}</option>)}</Select></Field>
        <Card><CardH title="Disbursement list" icon="Send" sub="Grouped by the employee’s chosen method"/>

            <thead><tr><th>{t('Employee')}</th><th>Method</th><th>Account</th><th className="r">{t('Net Pay')}</th></tr></thead>
            <tbody>{sortBy(lines,l=>l.payMode).map(l=><tr key={l.empId}>
              <td className="font-semibold">{l.name}</td>
              <td><Badge tone={l.payMode==='bank'?'info':l.payMode==='bkash'?'purple':'neutral'}>
                {l.payMode==='bank'?'Bank':l.payMode==='bkash'?'bKash':'Cash'}</Badge></td>
              <td className="mono t-meta clip" style={{maxWidth:220}}>{l.payAcc}</td>
              <td className="r num font-semibold">{money(l.net,{bn:LANG==='bn'})}</td></tr>)}</tbody></table></div>
        </Card>
        <div className="panel p-3 flex items-start gap-2 t-micro">
          <Icon name="Info" size={13} style={{color:'var(--info)',flex:'none',marginTop:1}}/>
          Marking paid posts a salary expense per branch into Finance, so the P&L and branch budgets update at once.
        </div>
      </div>}
    </div>
  </Drawer>;
}
